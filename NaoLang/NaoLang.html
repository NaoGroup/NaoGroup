      ${d.tgts.some(t => d.srcs.includes(t)) ? '<p class="muet petit">Une langue à la fois maternelle et apprise ? Pour elle, les traductions viendront de votre autre langue maternelle.</p>' : ''}${nav(d.tgts.length > 0)}`;
  if (e === 3) c = `<h2 class="gros-titre">Votre niveau estimé</h2><p class="muet">Pour chaque langue apprise. Pas sûr·e ? Un petit test vous sera proposé à la fin.</p>
      <div class="pile" style="gap:14px">${d.tgts.map(t => `<div class="format" style="padding:14px"><div class="ligne" style="margin-bottom:10px">${codeL(t)}<b style="color:var(--titre)">${langue(t).nom}</b>
        <span class="muet petit">— ${esc(NIVEAUX.find(n => n.id === (d.niveaux[t] || 'A1')).desc)}</span></div>
        <div class="chips">${NIVEAUX.map(n => `<button class="chip ${(d.niveaux[t] || 'A1') === n.id ? 'on' : ''}" data-act="obNiv" data-t="${t}" data-n="${n.id}">${n.id} · ${n.nom}</button>`).join('')}</div></div>`).join('')}</div>${nav()}`;
  if (e === 4) c = `<h2 class="gros-titre">Votre objectif quotidien</h2><p class="muet">Un petit rendez-vous chaque jour vaut mieux qu'un grand de temps en temps.</p>
      <div class="choix-l">${[[5, 'Tranquille', '🌱'], [10, 'Régulier', '🌿'], [15, 'Motivé', '🌳'], [20, 'Intensif', '🌟']].map(([m, t, em]) => `<button class="opt-l ${d.objectif === m ? 'on' : ''}" data-act="obSet" data-k="objectif" data-val="${m}"><span style="font-size:26px;font-style:normal">${em}</span><span><b>${m} minutes</b><small>${t}</small></span></button>`).join('')}</div>${nav()}`;
  if (e === 5) c = `<h2 class="gros-titre">Ce qui vous intéresse</h2><p class="muet">Nous mettrons ces thèmes en avant dans le parcours, les lectures et les histoires.</p>
      <div class="chips">${THEMES.map(t => `<button class="chip ${d.themes.includes(t.id) ? 'on' : ''}" data-act="obTheme" data-t="${t.id}">${t.em} ${t.nom}</button>`).join('')}</div>${nav(true)}`;
  if (e === 6) c = `<div style="text-align:center"><div style="font-size:54px;font-style:normal">🧭</div><h2 class="gros-titre">Un petit test de niveau ?</h2>
      <p class="muet" style="max-width:52ch;margin:6px auto 18px">Quelques questions qui s'adaptent à vos réponses, deux minutes environ, pour commencer en <b>${langue(d.tgts[0]).nom.toLowerCase()}</b>.
        ${d.tgts.length > 1 ? 'Vous pourrez passer le test des autres langues depuis leur parcours ou les réglages.' : ''} Ou commencez directement au niveau choisi.</p>
      <div class="ligne" style="justify-content:center"><button class="btn grand" data-act="obFin" data-test="0">Commencer en ${d.niveaux[d.tgts[0]] || 'A1'}</button><button class="btn plein grand" data-act="obFin" data-test="1">Passer le test</button></div></div>
      <div class="actions-bas"><button class="btn" data-act="obPrec">← Retour</button><span></span></div>`;
  return `<div class="onboard carte">${bar}${c}</div>`;
}

/* ---------- Accueil ---------- */
function anneau(val, max, taille = 120) {
  const r = taille / 2 - 9, c = 2 * Math.PI * r, p = Math.min(1, val / max);
  return `<div class="anneau" style="width:${taille}px;height:${taille}px"><svg width="${taille}" height="${taille}"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E7BD4"/><stop offset="1" stop-color="#C9B7F5"/></linearGradient></defs>
    <circle cx="${taille / 2}" cy="${taille / 2}" r="${r}" fill="none" stroke="var(--creux)" stroke-width="9"/>
    <circle cx="${taille / 2}" cy="${taille / 2}" r="${r}" fill="none" stroke="url(#ga)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="transition:stroke-dashoffset .8s"/></svg>
    <div class="txt"><div><b>${val}<span style="font-size:13px"> / ${max}</span></b><span>minutes aujourd'hui</span></div></div></div>`;
}
function etoilesTotal() { return Object.values(cours().lecons).reduce((s, l) => s + (l.etoiles || 0), 0) + Object.values(cours().evals).filter(e => e.reussi).length * 3; }
function barresComp(st) {
  return Object.entries(COMPS).map(([k, nom]) => `<div class="comp"><span>${nom}</span><div class="barre-p"><i style="width:${st[k] || 0}%"></i></div><span>${st[k] == null ? '—' : st[k] + ' %'}</span></div>`).join('');
}
function vueAccueil() {
  const p = P(), nx = prochaineEtape(), rev = aReviser(), min = minutesAujourdhui(), s = serie();
  const heure = new Date().getHours(), salut = heure < 5 ? 'Bonne nuit' : heure < 18 ? 'Bonjour' : 'Bonsoir';
  const pool = itemsNiv(niveauActuel()); const pj = pool[(new Date().getDate() * 7) % pool.length];
  let cta = '';
  if (nx) {
    const nom = nx.kind === 'lecon' ? `${LECONS.find(l => l.type === nx.type).em} ${LECONS.find(l => l.type === nx.type).nom} — ${CHAPS[nx.chap].titre}`
      : nx.portee === 'chap' ? `🌟 Évaluation — ${CHAPS[nx.chap].titre}` : nx.portee === 'unit' ? `🌟 Évaluation d'unité — ${UNITS[nx.unit].titre}` : `🌟 Évaluation de passage ${nx.niv}`;
    cta = `<button class="btn plein grand" data-act="etape" data-id="${nx.id}">Continuer : ${esc(nom)} →</button>`;
  } else cta = `<button class="btn plein grand" data-act="aller" data-v="parcours">Voir mon parcours →</button>`;
  const hist = HISTOIRES.filter(h => NIV_IX[h.niv] <= NIV_IX[niveauActuel()] && !(S.histoires[h.id] || {}).ecoutee)
    .sort((a, b) => (b.themes.some(t => p.themes.includes(t)) - a.themes.some(t => p.themes.includes(t))) || NIV_IX[b.niv] - NIV_IX[a.niv])[0];
  const defs = defis();
  return `<div class="pile">
    <div class="bienvenue">
      <div class="carte hero"><div class="ligne" style="align-items:flex-start;gap:20px;flex-wrap:nowrap">
        <div style="flex:1;min-width:0"><h2>${salut}, ${esc(p.prenom || 'à vous')} 🌙</h2>
          <p>${nx ? 'Votre prochaine étape vous attend. Quelques minutes suffisent.' : 'Toutes les étapes ouvertes sont terminées : quel beau parcours !'}</p>
          ${cta}
          ${pj ? `<div class="format" style="margin-top:16px;padding:14px"><div class="consigne" style="margin-bottom:4px">✨ La phrase du jour</div>
            <div class="ligne" style="justify-content:space-between"><span><b style="color:var(--titre);font-size:17px">${esc(T(pj))}</b><br><span class="muet">${esc(SRC(pj))}</span></span>
            <span class="ligne">${mini(T(pj), tgt())}${btnEnreg(pj.id)}</span></div></div>` : ''}</div>
        <div class="ligne" style="flex-direction:column">${anneau(min, p.objectif)}<span class="muet petit">${min >= p.objectif ? 'Objectif atteint 🌟' : `Objectif : ${p.objectif} min`}</span></div></div></div>
      <div class="carte"><h3><span class="ic">🌠</span>En un coup d'œil</h3><div class="stats">
        <div class="stat"><b><span class="flamme">🔥</span> ${s}</b><span>jour(s) de suite</span></div>
        <div class="stat"><b>⭐ ${etoilesTotal()}</b><span>étoiles gagnées</span></div>
        <div class="stat"><b>🔁 ${rev.length}</b><span>à réviser aujourd'hui</span></div>
        <div class="stat"><b>${niveauActuel()}</b><span>niveau · ${progressionNiveau(niveauActuel())} %</span></div></div>
        <div class="barre-p" style="margin-top:14px"><i style="width:${progressionNiveau(niveauActuel())}%"></i></div></div>
    </div>
    <div class="grille g3">
      <div class="carte"><h3><span class="ic">🔁</span>À réviser aujourd'hui</h3>
        ${rev.length ? `<div class="pile" style="gap:4px">${rev.slice(0, 5).map(k => { if (k.startsWith('c:')) { const c = S.cartes.find(x => 'c:' + x.id === k); return `<div>🗂️ ${esc(c.recto)}</div>`; } const it = ITEMS[k.slice(tgt().length + 1)]; return `<div>${it.e} ${esc(T(it))}</div>`; }).join('')}
          ${rev.length > 5 ? `<div class="muet">… et ${rev.length - 5} autre(s)</div>` : ''}</div>
          <button class="btn plein" style="margin-top:12px" data-act="reviser">Réviser maintenant (${Math.min(rev.length, 15)})</button>`
        : '<div class="vide">Rien à réviser aujourd\'hui 🌙<br><span class="petit">Les mots reviendront au bon moment.</span></div>'}</div>
      <div class="carte"><h3><span class="ic">🏆</span>Défis de la semaine</h3>${defs.map(d => `<div class="defi"><span class="em">${d.fait ? '✅' : d.em}</span><div class="corps"><b>${d.t}</b>
        <div class="barre-p" style="margin-top:5px"><i style="width:${Math.round(100 * d.v / d.max)}%"></i></div></div><span class="muet ui">${d.v}/${d.max}</span></div>`).join('')}</div>
      <div class="carte"><h3><span class="ic">📊</span>Mes compétences</h3>${barresComp(statsComp())}</div>
    </div>
    ${p.tgts.length > 1 ? `<div class="carte"><h3><span class="ic">🌍</span>Mes langues</h3><div class="grille g3">${p.tgts.map(t => { const c = S.cours[t], n = c ? niveauDe(t) : (p.niveaux[t] || 'A1');
      return `<div class="format" style="padding:14px;${t === tgt() ? 'box-shadow:var(--lueur)' : ''}"><div class="ligne">${codeL(t)}<span><b style="color:var(--titre)">${langue(t).nom}</b><br><span class="muet petit">Niveau ${n} · ${c ? progressionNiveauDe(t, n) : 0} %</span></span></div>
        <div class="barre-p" style="margin:10px 0"><i style="width:${c ? progressionNiveauDe(t, n) : 0}%"></i></div>
        ${t === tgt() ? '<span class="puce ok">En cours</span>' : `<button class="btn mini" data-act="cible" data-t="${t}">Passer à ${langue(t).nom.toLowerCase()} →</button>`}</div>`; }).join('')}</div></div>` : ''}
    <div class="grille g2">
      <div class="carte"><h3><span class="ic">🌌</span>Ma carte céleste</h3>${carteCeleste(true)}<p class="muet petit" style="margin:8px 0 0">Chaque chapitre validé allume une étoile.</p></div>
      ${hist ? `<div class="carte histoire-c" data-act="ouvrirHistoire" data-id="${hist.id}"><h3><span class="ic">🎧</span>Une histoire pour vous</h3>
        <div class="vign">${hist.em}</div><b style="font-size:17px;color:var(--titre)">${esc(hist.titre[IX[tgt()] - 1])}</b>
        <span class="muet">${esc(hist.titre[IX[src()] - 1])} · ${puceNiv(hist.niv)}</span></div>`
        : `<div class="carte"><h3><span class="ic">🧳</span>Mode Voyage</h3><p class="muet">Les phrases essentielles pour partir : restaurant, chemin, hôtel, urgences.</p><button class="btn" data-act="aller" data-v="voyage">Ouvrir le mode Voyage</button></div>`}
    </div></div>`;
}

/* ---------- Carte céleste ---------- */
const FORMES = [[[20, 60], [44, 30], [70, 48], [88, 20]], [[18, 30], [40, 58], [66, 36], [86, 66]], [[22, 70], [36, 34], [64, 22], [84, 52]],
  [[16, 42], [42, 22], [58, 62], [86, 36]], [[20, 24], [46, 50], [70, 26], [84, 68]], [[18, 58], [40, 26], [62, 56], [88, 28]]];
function carteCeleste(petit) {
  const W = 600, H = petit ? 170 : 240, cw = W / 6;
  let lignes = '', pts = '', txt = '';
  NIVEAUX.forEach((n, i) => {
    const chaps = PARCOURS[n.id].flatMap(u => u.chaps.map(c => c.id));
    const pos = FORMES[i].map(([x, y]) => [i * cw + x / 100 * cw, 12 + y / 100 * (H - 44)]);
    for (let k = 0; k < 3; k++) if (chapitreValide(chaps[k]) && chapitreValide(chaps[k + 1])) lignes += `<line class="lien-c" x1="${pos[k][0]}" y1="${pos[k][1]}" x2="${pos[k + 1][0]}" y2="${pos[k + 1][1]}"/>`;
    chaps.forEach((cid, k) => { const on = chapitreValide(cid), neuve = on && S.nouvelleEtoile === cid;
      pts += `<circle class="${on ? 'et-on' : 'et-off'} ${neuve ? 'et-neuve' : ''}" cx="${pos[k][0]}" cy="${pos[k][1]}" r="${on ? (neuve ? 6 : 4.5) : 2.6}"><title>${esc(CHAPS[cid].titre)}${on ? ' — validé' : ''}</title></circle>`; });
    txt += `<text x="${i * cw + cw / 2}" y="${H - 10}" text-anchor="middle">${n.id}</text>`;
  });
  let fond = ''; for (let i = 0; i < 40; i++) fond += `<circle cx="${(i * 137) % W}" cy="${(i * 71) % (H - 30)}" r=".7" fill="rgba(255,255,255,.35)"/>`;
  return `<svg class="ciel-carte" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte céleste de progression">${fond}${lignes}${pts}${txt}</svg>`;
}

/* ---------- Parcours ---------- */
function vueParcours() {
  const niv = NIV_VU || niveauActuel(), N = NIVEAUX.find(n => n.id === niv), ouvert = niveauOuvert(niv), c = cours();
  const t = P().themes;
  const carteEtape = e => {
    const ok = etapeOuverte(e), fait = etapeFaite(e), nx = prochaineEtape();
    if (e.kind === 'lecon') {
      const L = LECONS.find(l => l.type === e.type), r = c.lecons[e.id];
      return `<button class="lecon ${fait ? 'fait' : ''} ${nx && nx.id === e.id ? 'suivante' : ''}" data-act="etape" data-id="${e.id}" ${ok ? '' : 'disabled'}>
        <span class="k">${L.em} ${L.nom}</span><b>${esc(L.desc)}</b>
        <span class="bas"><span>${ok ? (r ? `${r.note}/100` : `≈ ${dureeEstimee(exosLecon(e).length)} min`) : '🔒'}</span><span class="et">${r ? '★'.repeat(r.etoiles) + '☆'.repeat(3 - r.etoiles) : ''}</span></span></button>`;
    }
    const r = c.evals[e.id];
    return `<button class="lecon eval ${fait ? 'fait' : ''} ${nx && nx.id === e.id ? 'suivante' : ''}" data-act="etape" data-id="${e.id}" ${ok ? '' : 'disabled'}>
      <span class="k">🌟 Évaluation</span><b>${e.portee === 'chap' ? 'Fin de chapitre' : e.portee === 'unit' ? 'Fin d\'unité' : 'Passage de niveau'}</b>
      <span class="bas"><span>${ok ? (r ? `${r.derniere}/100 ${r.reussi ? '✓' : ''}` : `seuil ${SEUILS[e.portee]}`) : '🔒'}</span><span>${r && r.reussi ? '<span class="puce ok">Réussie</span>' : ''}</span></span></button>`;
  };
  return `<div class="titre-vue"><div><h2>🧭 Mon parcours</h2><p>${esc(langue(src()).nom)} → ${esc(langue(tgt()).nom)} · six niveaux, des unités, des chapitres et des leçons courtes.</p></div></div>
    <div class="niveaux">${NIVEAUX.map(n => `<button class="niv-b ${n.id === niv ? 'on' : ''} ${niveauOuvert(n.id) ? '' : 'verrou'}" data-act="voirNiv" data-n="${n.id}">
      <span class="cad">${niveauOuvert(n.id) ? (c.evals[n.id + '-pass'] && c.evals[n.id + '-pass'].reussi ? '🌟' : '') : '🔒'}</span><b>${n.id}</b><small>${n.nom}</small>
      <div class="barre-p"><i style="width:${progressionNiveau(n.id)}%"></i></div></button>`).join('')}</div>
    <div class="carte"><div class="niv-desc"><span class="gros">${N.id}</span><div style="flex:1;min-width:240px"><h3 style="margin:0">${N.nom}</h3><p style="margin:4px 0 0;color:var(--ink-2)">${esc(N.desc)}</p>
      <div class="ligne" style="margin-top:10px"><span class="puce">Progression : ${progressionNiveau(niv)} %</span>
      ${ouvert ? '' : `<span class="puce">🔒 S'ouvre après l'évaluation de passage ${NIVEAUX[NIV_IX[niv] - 1].id}</span>`}
      ${NIV_IX[niv] < NIV_IX[c.depart] ? '<span class="puce">Niveau libre : révisez à votre guise</span>' : ''}</div></div></div>
    ${PARCOURS[niv].map((u, ui) => `<div class="unite"><div class="unite-t"><span class="puce">Unité ${ui + 1}</span><h3>${esc(u.titre)}</h3><span class="muet">· Grammaire : ${esc(u.gram[tgt()][0])}</span></div>
      ${u.chaps.map((ch, ci) => { const th = THEMES.find(x => x.id === ch.theme);
        return `<div class="chap"><div class="chap-t"><span class="puce">Chapitre ${ui * 2 + ci + 1}</span><h4>${esc(ch.titre)}</h4><span class="muet">${th.em} ${th.nom}</span>
          ${t.includes(ch.theme) ? '<span class="pourvous">♥ pour vous</span>' : ''}${chapitreValide(ch.id) ? '<span class="puce ok">⭐ Validé</span>' : ''}</div>
          <div class="lecons">${ORDRE[niv].filter(e => e.chap === ch.id).map(carteEtape).join('')}</div></div>`; }).join('')}
      <div class="lecons" style="grid-template-columns:minmax(170px,280px)">${carteEtape(ETAPES[u.id + '-ev'])}</div></div>`).join('')}
    <div class="unite"><div class="unite-t"><h3>Évaluation de passage ${niv}${NIVEAUX[NIV_IX[niv] + 1] ? ' → ' + NIVEAUX[NIV_IX[niv] + 1].id : ''}</h3></div>
      <div class="lecons" style="grid-template-columns:minmax(170px,280px)">${carteEtape(ETAPES[niv + '-pass'])}</div>
      <p class="muet petit">Toutes les compétences : vocabulaire, grammaire, compréhension écrite et orale, expression écrite et orale. Seuil : ${SEUILS.niv}/100. En cas de réussite après les unités, votre attestation ${niv} est générée.</p></div>
    </div>`;
}

/* ---------- Révisions ---------- */
function vueRevisions() {
  const rev = aReviser(), t = tgt();
  const suivis = Object.entries(S.srs).filter(([k]) => k.startsWith(t + ':') || (k.startsWith('c:') && (S.cartes.find(c => 'c:' + c.id === k) || {}).tgt === t));
  const boites = [0, 0, 0, 0]; suivis.forEach(([, e]) => { boites[e.b <= 1 ? 0 : e.b <= 3 ? 1 : e.b <= 5 ? 2 : 3]++; });
  const err = Object.entries(S.erreurs).filter(([k]) => k.startsWith(t + ':') && ITEMS[k.slice(t.length + 1)]).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const gerr = Object.entries(S.erreurs).filter(([k]) => k.startsWith('g:' + t + ':')).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const types = {}; S.historique.filter(h => h.tgt === t && h.comp).forEach(h => Object.entries(h.comp).forEach(([k, [s, n]]) => { types[k] = types[k] || [0, 0]; types[k][0] += n - s; types[k][1] += n; }));
  return `<div class="titre-vue"><div><h2>🔁 Révisions</h2><p>Les phrases difficiles reviennent plus souvent ; celles que vous maîtrisez reviennent plus tard. Quelques minutes par jour suffisent.</p></div></div>
  <div class="grille g2">
    <div class="carte"><h3><span class="ic">📅</span>À réviser aujourd'hui · ${rev.length}</h3>
      ${rev.length ? `<div class="pile" style="gap:6px;max-height:300px;overflow:auto">${rev.map(k => { if (k.startsWith('c:')) { const c = S.cartes.find(x => 'c:' + x.id === k); return `<div class="ligne" style="justify-content:space-between"><span>🗂️ ${esc(c.recto)}</span><span class="muet">carte perso</span></div>`; }
        const it = ITEMS[k.slice(t.length + 1)], e = S.srs[k]; return `<div class="ligne" style="justify-content:space-between"><span>${it.e} <b>${esc(T(it))}</b> <span class="muet">— ${esc(SRC(it))}</span></span><span class="puce">${e.ko ? '🌱 fragile' : 'à rafraîchir'}</span></div>`; }).join('')}</div>
        <button class="btn plein grand" style="margin-top:14px" data-act="reviser">Commencer la révision (${Math.min(rev.length, 15)} cartes)</button>` : '<div class="vide">Tout est à jour 🌙 Revenez demain, ou continuez le parcours.</div>'}</div>
    <div class="carte"><h3><span class="ic">🧠</span>Ma mémoire</h3><p class="muet">${suivis.length} phrase(s) et carte(s) suivies.</p>
      ${[['🌱 Nouvelles ou fragiles', boites[0]], ['🌿 En cours', boites[1]], ['🌳 Solides', boites[2]], ['🌟 Maîtrisées', boites[3]]].map(([n, v]) => `<div class="comp"><span>${n}</span><div class="barre-p"><i style="width:${suivis.length ? Math.round(100 * v / suivis.length) : 0}%"></i></div><span>${v}</span></div>`).join('')}</div>
  </div>
  <div class="grille g2" style="margin-top:16px">
    <div class="carte"><h3><span class="ic">🎯</span>Mes erreurs les plus fréquentes</h3>
      ${err.length || gerr.length ? `${err.map(([k, n]) => { const it = ITEMS[k.slice(t.length + 1)]; return `<div class="ligne" style="justify-content:space-between;padding:4px 0"><span>${it.e} ${esc(T(it))}</span><span class="muet ui">${n}×</span></div>`; }).join('')}
        ${gerr.map(([k, n]) => { const u = k.split(':')[2]; return UNITS[u] ? `<div class="ligne" style="justify-content:space-between;padding:4px 0"><span>🧩 Règle : ${esc(gramUnit(u)[0])}</span><span class="muet ui">${n}×</span></div>` : ''; }).join('')}
        <button class="btn plein" style="margin-top:12px" data-act="revErreurs">Leçon de révision adaptée</button>` : '<div class="vide">Aucune erreur enregistrée pour l\'instant.</div>'}</div>
    <div class="carte"><h3><span class="ic">📊</span>Où se glissent les erreurs</h3>

  </div>`;
}
</script>
<script>
/* ---------- Lecture ---------- */
const PH = (p, l) => p[IX[l] - 1];
const TITRE = (o, l) => o.titre[IX[l] - 1];
let LECT_TRAD = false, LECT_OUV = new Set(), LECT_VIT = 1;
function surligner(texte, gl) {
  let h = esc(texte);
  gl.map(id => ITEMS[id]).filter(Boolean).forEach(it => {
    const cands = [T(it), ...mots(T(it)).filter(w => w.replace(PONCT, '').length >= 3).map(w => w.replace(PONCT, ''))];
    for (const c of cands) {
      const re = new RegExp('(^|[\\s«“„¡¿(])(' + esc(c).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[\\s.,!?;:»”“)]|$)', 'i');
      if (re.test(h)) { h = h.replace(re, `$1<span class="gl" data-act="glose" data-id="${it.id}">$2</span>`); break; }
    }
  });
  return h;
}
function vueLecture() {

    const phr = r.ph.map((p, k) => `<span class="ph" data-act="phrase" data-k="${k}" data-k2="${k}" id="lp-${k}">${surligner(PH(p, tgt()), r.gl)}</span>${(LECT_TRAD || LECT_OUV.has(k)) ? `<span class="trad">${esc(PH(p, src()))}</span>` : ' '}`);

    else if (r.format === 'menu') corps = `<div class="format menu"><div class="texte">${phr.map((x, k) => `<div style="${k === 0 ? 'font-size:22px;margin-bottom:10px' : ''}">${x}</div>`).join('')}</div></div>`;

    else if (r.format === 'message') corps = `<div class="format" style="max-width:460px;border-radius:22px 22px 22px 6px"><div class="texte">${phr.map(x => `<div>${x}</div>`).join('')}</div></div>`;

        <button class="btn ${LECT_TRAD ? 'plein' : ''}" data-act="tradLect">🌐 Traductions ${LECT_TRAD ? 'affichées' : 'masquées'}</button></div>

      ${corps}

    <div class="chips" style="margin-bottom:14px"><button class="chip ${FILTRE.lect === 'tous' ? 'on' : ''}" data-act="filtre" data-f="lect" data-v="tous">Tous</button>${NIVEAUX.map(n => `<button class="chip ${FILTRE.lect === n.id ? 'on' : ''}" data-act="filtre" data-f="lect" data-v="${n.id}">${n.id}${n.id === niv ? ' · mon niveau' : ''}</button>`).join('')}</div>

      return `<div class="carte histoire-c" data-act="ouvrirLecture" data-id="${r.id}"><div class="vign" style="background:linear-gradient(160deg,#3A2E86,#5F7BD0)">${r.em}</div>

const FORMATS = { menu:'Menu', message:'Message', affiche:'Affiche', mail:'E-mail', avis:'Avis', article:'Article', opinion:'Tribune', debat:'Débat' };

}
let LECTURE_ACTIVE = null;

/* ---------- NaoStories ---------- */
let HIST_TRAD = false, HIST_VIT = null, HIST_FIN = false;
const VIT_DEFAUT = n => ({ A1:.72, A2:.8, B1:.9, B2:.97, C1:1, C2:1.05 })[n];
function scene(type) {
  let h = '';
  for (let i = 0; i < 18; i++) h += `<i class="pt" style="left:${(i * 53) % 100}%;top:${(i * 29) % 55}%;animation-delay:${i * .3}s"></i>`;

  const flots = { marche:['🍎', '🐟', '🧺'], maison:['🌼', '🎂', '🌿'], mer:['⛵', '🐚', '🌴'], musique:['🎸', '🎤', '✨'], mystere:['✉️', '🕯️', '📷'], ville:['🏢', '💼', '☕'], nuit:['🥁', '📚', '🌙'] }[type] || ['✨'];
  flots.forEach((f, i) => { h += `<i class="flot" style="left:${14 + i * 26}%;top:${30 + (i % 2) * 22}%;animation-delay:${i * 1.3}s">${f}</i>`; });
  if (type === 'mer' || type === 'marche') h += '<div class="vague-s"></div>';
  if (type === 'musique' || type === 'nuit') for (let i = 0; i < 5; i++) h += `<i class="note-m" style="left:${20 + i * 14}%;animation-delay:${i * .8}s">${i % 2 ? '♪' : '♫'}</i>`;
  if (['marche', 'maison', 'mer', 'ville'].includes(type)) h += `<i class="perso" style="left:12%">${type === 'ville' ? '🧑‍💼' : '🚶'}</i>`;
  return `<div class="scene" aria-hidden="true">${h}</div>`;
}

        ${h.themes.map(t => { const th = THEMES.find(x => x.id === t); return `<span class="puce">${th.em} ${th.nom}</span>`; }).join('')}
        <button class="coeur" data-act="favori" data-id="${h.id}" title="Favori">${st.fav ? '💜' : '🤍'}</button></div>
      <div class="carte">${scene(h.scene)}
        <h2 style="font-size:25px;margin-top:16px">${h.em} ${esc(TITRE(h, tgt()))}</h2><p class="muet" style="margin:2px 0 0">${esc(TITRE(h, src()))}</p>
        <div class="lecteur"><button class="btn plein grand" data-act="lireHistoire">▶️ Écouter l'histoire</button><button class="btn" data-act="stopVoix">⏸ Pause</button>
          <label class="vitesse">🐢 <input type="range" min=".6" max="1.3" step=".05" value="${HIST_VIT}" data-change="vitHist"> 🐇 <span id="vit-h">${HIST_VIT.toFixed(2)}×</span></label>
          <button class="btn ${HIST_TRAD ? 'plein' : ''}" data-act="tradHist">🌐 Traduction ${HIST_TRAD ? 'activée' : 'désactivée'}</button></div>

        <div class="texte format">${h.ph.map((p, k) => `<span class="ph" id="hp-${k}" data-act="phraseHist" data-k="${k}">${esc(PH(p, tgt()))}</span>${HIST_TRAD ? `<span class="trad">${esc(PH(p, src()))}</span>` : ' '}`).join('')}</div>
        <div class="actions-bas"><span class="muet">${st.ecoutee ? `✓ Histoire terminée · ${st.note}/100` : 'Après l\'écoute : questions et mini-jeu de vocabulaire'}</span>
          <button class="btn ${HIST_FIN || st.ecoutee ? 'plein' : ''} grand" data-act="questionsHistoire">Questions & mini-jeu →</button></div></div>`;
  }
  const niv = niveauActuel(), th = P().themes;

  else if (FILTRE.hist === 'niv') liste = liste.filter(h => h.niv === niv);

  return `<div class="titre-vue"><div><h2>🎧 NaoStories</h2><p>Des histoires audio courtes pour chaque niveau : lentes en A1–A2, de plus en plus naturelles ensuite. Texte synchronisé, traduction à la demande, questions et mini-jeu après l'écoute.</p></div></div>
    <div class="carte" style="margin-bottom:16px"><div class="comp" style="grid-template-columns:170px 1fr 60px"><span>🎧 Histoires écoutées</span><div class="barre-p"><i style="width:${Math.round(100 * ecoutees / HISTOIRES.length)}%"></i></div><span>${ecoutees} / ${HISTOIRES.length}</span></div></div>
    <div class="chips" style="margin-bottom:14px">${[['tous', 'Toutes'], ['niv', 'Mon niveau'], ['pourvous', '♥ Mes thèmes'], ['fav', '💜 Favoris']].map(([v, n]) => `<button class="chip ${FILTRE.hist === v ? 'on' : ''}" data-act="filtre" data-f="hist" data-v="${v}">${n}</button>`).join('')}</div>
    ${liste.length ? `<div class="grille g3">${liste.map(h => { const st = S.histoires[h.id] || {};
      return `<div class="carte histoire-c" data-act="ouvrirHistoire" data-id="${h.id}"><div class="vign">${h.em}</div>
        <div class="ligne">${puceNiv(h.niv)}${st.ecoutee ? '<span class="puce ok">✓ Écoutée</span>' : ''}${st.fav ? '<span>💜</span>' : ''}</div>
        <b style="color:var(--titre);font-size:16px">${esc(TITRE(h, tgt()))}</b><span class="muet">${esc(TITRE(h, src()))} · ${h.ph.length} phrases</span></div>`; }).join('')}</div>`
      : '<div class="vide">Aucune histoire dans ce filtre pour l\'instant.</div>'}`;
}

/* ---------- Mes phrases utiles & cartes ---------- */
function vuePhrases() {

      + (l.length ? `<div class="grille g3">${l.map(c => `<div class="carte" style="box-shadow:none"><b style="color:var(--titre);font-size:17px">${esc(c.recto)}</b><div class="muet" style="margin:4px 0 10px">${esc(c.verso)}</div>

/* ---------- Carnet de notes ---------- */
function vueCarnet() {
  const t = tgt(), c = cours();
  const h = S.historique.filter(x => x.tgt === t);
  const lec = h.filter(x => x.t === 'lecon' || x.t === 'eval').slice().reverse();

  return `<div class="titre-vue"><div><h2>📒 Carnet de notes</h2><p>Toutes vos notes, sans jugement : elles servent à voir le chemin parcouru.</p></div></div>

      <div class="carte"><h3><span class="ic">📈</span>Ma courbe de progression</h3>${graphique(h.filter(x => x.note != null).slice(-30))}</div>
      <div class="carte"><h3><span class="ic">📊</span>Moyenne par compétence</h3>${barresComp(st)}

        ${moyNiv.map(([n, m, k]) => `<div class="comp"><span>${n} <span class="muet">(${k} leçon${k > 1 ? 's' : ''})</span></span><div class="barre-p"><i style="width:${m || 0}%"></i></div><span>${m == null ? '—' : m}</span></div>`).join('')}</div>

          ${lec.map(x => { const e = ETAPES[x.id]; return e ? `<tr><td>${dateCourte(x.d)}</td><td>${e.niv}</td><td>${esc(nomEtape(e))}</td><td><b>${x.note}</b></td><td>${appreciation(x.note)}</td></tr>` : ''; }).join('')}</tbody></table></div>`

        ${Object.keys(S.erreurs).some(k => k.startsWith(t + ':') || k.startsWith('g:' + t + ':')) ? `<div class="actions-bas"><span class="muet petit">Mots et règles fragiles : voir Révisions.</span><button class="btn" data-act="aller" data-v="revisions">Mes erreurs fréquentes →</button></div>` : ''}</div>
    </div>`;
}
function graphique(pts) {
  if (pts.length < 2) return '<div class="vide">La courbe se dessine à partir de deux activités notées.</div>';
  const W = 600, H = 220, g = 34, d = 14, hy = H - 30;
  const x = i => g + i * (W - g - d) / (pts.length - 1), y = v => 10 + (1 - v / 100) * (hy - 10);
  const grid = [0, 50, 70, 100].map(v => `<line x1="${g}" x2="${W - d}" y1="${y(v)}" y2="${y(v)}" stroke="var(--trait)" stroke-width="1" ${v === 70 ? 'stroke-dasharray="4 4"' : ''}/><text x="${g - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--ui)" font-style="normal">${v}</text>`).join('');
  const chemin = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.note).toFixed(1)}`).join(' ');
  const aire = `${chemin} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  window.__GRAPH = { pts, x, y };
  return `<div class="graph" id="graph"><svg id="graph-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des notes">
    <defs><linearGradient id="gaire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9B82E8" stop-opacity=".35"/><stop offset="1" stop-color="#9B82E8" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${aire}" fill="url(#gaire)"/><path d="${chemin}" fill="none" stroke="#9B82E8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.note)}" r="4" fill="#C9B7F5" stroke="var(--fond-uni)" stroke-width="2"/>`).join('')}
    <line id="g-cur" x1="0" x2="0" y1="10" y2="${hy}" stroke="var(--bord-2)" stroke-width="1" visibility="hidden"/>
    <text x="${g}" y="${H - 8}" font-size="11" fill="var(--ink-3)" font-family="var(--ui)" font-style="normal">${dateCourte(pts[0].d)}</text>
    <text x="${W - d}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--ui)" font-style="normal">${dateCourte(pts[pts.length - 1].d)}</text>
  </svg><div class="tip" id="g-tip" hidden></div></div><p class="muet petit" style="margin:6px 0 0">Vos ${pts.length} dernières activités notées · la ligne pointillée marque 70.</p>`;
}
function brancherGraph() {
  const svg = $('#graph-svg'), tip = $('#g-tip'), cur = $('#g-cur'), G = window.__GRAPH;
  const noms = { lecon:'Leçon', eval:'Évaluation', revision:'Révision', histoire:'Histoire', lecture:'Lecture', pratique:'Pratique' };
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * 600;
    let best = 0; G.pts.forEach((p, i) => { if (Math.abs(G.x(i) - vx) < Math.abs(G.x(best) - vx)) best = i; });
    const p = G.pts[best];
    cur.setAttribute('x1', G.x(best)); cur.setAttribute('x2', G.x(best)); cur.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (G.x(best) / 600 * r.width) + 'px'; tip.style.top = (G.y(p.note) / 220 * r.height) + 'px';
    tip.innerHTML = `<b>${p.note}/100</b>${noms[p.t] || ''} · ${dateCourte(p.d)}`;
  });
  svg.addEventListener('mouseleave', () => { tip.hidden = true; cur.setAttribute('visibility', 'hidden'); });
}

/* ---------- Réglages ---------- */
function vueReglages() {
  const p = P(), L = langue(tgt()), v = voixPour(L.voix);
  const coursList = p.tgts.map(t => { const c = S.cours[t], n = c ? niveauDe(t) : (p.niveaux[t] || 'A1');

      <label class="lab">Mes thèmes</label><div class="chips">${THEMES.map(t => `<button class="chip ${p.themes.includes(t.id) ? 'on' : ''}" data-act="rTheme" data-t="${t.id}">${t.em} ${t.nom}</button>`).join('')}</div>

<script>
/* ============================================================
   Les actions (délégation d'événements)
   ============================================================ */
function bulle(el, html) {
  fermerBulle(); if (!el) return;
  const b = document.createElement('div'); b.className = 'bulle-g'; b.id = 'bulle'; b.innerHTML = html; document.body.appendChild(b);
  const r = el.getBoundingClientRect(), w = b.offsetWidth;
  b.style.left = Math.max(10, Math.min(window.innerWidth - w - 10, r.left + r.width / 2 - w / 2)) + 'px';
  b.style.top = (r.bottom + 8 + b.offsetHeight > window.innerHeight ? r.top - b.offsetHeight - 8 : r.bottom + 8) + 'px';
}
function fermerBulle() { const b = $('#bulle'); b && b.remove(); }
function stopVoix() { LECTURE_ACTIVE = null; try { speechSynthesis.cancel(); } catch (e) {} document.querySelectorAll('.ph.lu').forEach(x => x.classList.remove('lu')); }
function aller(v) { stopVoix(); fermerBulle(); if (v === 'histoires') HIST = null; if (v === 'lecture') LECT = null; if (v === 'voyage') VOY = null; if (v === 'parcours') NIV_VU = null;
  if (v === 'voyage' && !S.voyageVu) { S.voyageVu = true; verifierBadges(); sauver(); }
  VUE = v; J = VUE === 'joueur' ? J : null; rendre(); window.scrollTo({ top:0, behavior:'smooth' }); }
function telecharger(nom, contenu, type) {
  const b = new Blob([contenu], { type }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function motsCarte(recto, verso, origine) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  S.cartes.push({ id, tgt:tgt(), recto, verso, d:jour(), origine });
  const e = srsVu('c:' + id); e.due = jour(); sauver(); return id;
}

/* ---------- Fenêtres des profils ---------- */
let IMPORT = null;
const nomProfil = e => (e && e.prenom) || 'Profil sans prénom';
const initiale = e => (nomProfil(e).trim()[0] || '?').toUpperCase();
function remiseAZero() { J = null; VUE = 'accueil'; NIV_VU = null; HIST = null; LECT = null; VOY = null; OB = OB_NEUF(); rendre(); window.scrollTo({ top:0 }); }
function fenetreProfils() {

    return `<div class="profil-l ${on ? 'on' : ''}"><span class="avatar grand">${esc(initiale(e))}</span>
      <div class="corps"><b>${esc(nomProfil(e))}</b><span class="muet petit">${(e.tgts || []).map(t => langue(t) ? langue(t).nom : t).join(', ') || '—'}${e.derniere ? ` · dernière activité : ${dateCourte(e.derniere)}` : ''}</span></div>
      <span class="ligne">${on ? '<span class="puce ok">Ouvert</span>' : `<button class="btn plein mini" data-act="ouvrirProfil" data-id="${e.id}">Ouvrir</button>`}

        <button class="enreg" data-act="supprimerProfil" data-id="${e.id}" title="Supprimer ce profil">✕</button></span></div>`; }).join('');
  fenetre(`<h3>👥 Les profils</h3><p class="muet">Chaque personne a son propre profil : ses langues, sa progression, ses notes, ses attestations et son journal. Rien n'est partagé entre profils.</p>

      <div class="ligne">${S.profil ? '<button class="btn mini" data-act="sauverFichier">💾 Ce profil</button>' : ''}${REG.liste.length ? `<button class="btn mini" data-act="sauvegardeComplete">🗄️ Tous les profils (${REG.liste.length})</button>` : ''}

    <div class="actions-bas">${REG.liste.length ? '<button class="btn mini" data-act="toutEffacer">🧹 Réinitialiser NaoLang…</button>' : '<span></span>'}<button class="btn" data-act="fermer">Fermer</button></div>`);
}
function fenetreImport() {
  const I = IMPORT, n = I.profils.length;
  if (n > 1) {
    const connus = I.profils.filter(p => REG.liste.some(x => x.id === p.id)).length;
    fenetre(`<h3>🗄️ Sauvegarde complète : ${n} profils</h3>

    return;
  }
  const p = I.profils[0], meme = REG.liste.find(x => x.id === p.id), actif = S.profil && REG.liste.find(x => x.id === REG.actif);
  fenetre(`<h3>📂 Profil « ${esc(nomProfil(p))} »</h3>
    <p class="muet">Langues : ${esc((p.donnees.profil.tgts || [p.donnees.profil.tgt]).map(t => langue(t) ? langue(t).nom : t).join(', '))}. Que voulez-vous en faire ?</p>
    <div class="pile" style="gap:8px;margin-top:12px">
      ${meme ? `<button class="btn plein" data-act="importer" data-mode="remplacer" data-id="${meme.id}">↻ Mettre à jour le profil « ${esc(nomProfil(meme))} » avec cette sauvegarde</button>` : ''}
      <button class="btn ${meme ? '' : 'plein'}" data-act="importer" data-mode="ajouter">＋ L'ajouter comme nouveau profil</button>
      ${actif && (!meme || meme.id !== actif.id) ? `<button class="btn" data-act="importer" data-mode="remplacer" data-id="${actif.id}">Remplacer le profil ouvert « ${esc(nomProfil(actif))} »</button>` : ''}
    </div><div class="actions-bas"><span></span><button class="btn" data-act="fermer">Annuler</button></div>`);
}

const ACT = {
  aller:d => aller(d.v),
  etape:d => lancerEtape(d.id),
  dire:d => parler(d.t, d.l, { vitesse:+d.v || 1 }),
  enreg:(d, el) => {
    const i = S.phrases.findIndex(p => p.id === d.id && p.tgt === tgt());
    if (i >= 0) { S.phrases.splice(i, 1); toast('Retirée de Mes phrases utiles'); }
    else { S.phrases.push({ id:d.id, tgt:tgt(), d:jour() }); srsVu(d.id); toast('⭐ Ajoutée à Mes phrases utiles'); }

    if (VUE === 'phrases') rendre(); else if (el) el.outerHTML = btnEnreg(d.id);
  },
  fermerFond:(d, el, ev) => { if (ev.target === el) fermer(); },
  fermer:() => fermer(),
  commencer:() => { J.commence = true; J.tLast = Date.now(); rendre(); const ex = J.exos[0]; if (ex && ex.auto && ex.audio) setTimeout(() => parler(ex.audio, tgt()), 350); },
  quitter:() => {
    if (!J || !J.commence || J.i === 0 || J.i >= J.exos.length) { ACT.quitterOk(); return; }
    fenetre(`<h3>Faire une pause ?</h3><p class="muet">Vous pourrez reprendre cette ${J.kind === 'eval' ? 'évaluation' : 'séance'} quand vous voulez ; les réponses données jusqu'ici ne seront pas notées.</p>

  },
  quitterOk:() => { fermer(); stopVoix(); const r = (J && J.retour) || 'parcours'; J = null; VUE = r; rendre(); },
  opt:d => REP.opt(+d.i), mot:d => REP.mot(+d.k), motRetire:d => REP.motRetire(+d.k), intrus:d => { if (!J.rep) REP.intrus(+d.i); },
  verifier:() => REP.verifier(), paire:d => REP.paire(d.c, +d.i), auto:d => REP.auto(d.s),
  micro:() => micro(),
  sansMicro:(d, el, ev) => { ev.preventDefault(); J.exos[J.i].sansMicro = true; rafraichirExo(); },
  retourner:() => { J.exos[J.i].vu = true; rafraichirExo(); parler(J.exos[J.i].c.recto, tgt()); },
  suivant:() => suivant(),
  refaire:() => { const o = J; if (o.relance) o.relance(); else if (o.kind === 'lecon' || o.kind === 'eval') lancerEtape(o.id); else ACT.fin(); },
  fin:() => { const r = (J && J.retour) || 'parcours'; J = null; VUE = r; rendre(); window.scrollTo({ top:0 }); },
  revisionEval:d => {
    const ev = cours().evals[d.id], e = ETAPES[d.id];
    let cles = (ev && ev.rates || []).map(id => tgt() + ':' + id);
    if (cles.length < 6) {
      const its = e.portee === 'chap' ? itemsChap(e.chap) : e.portee === 'unit' ? UNITS[e.unit].chaps.flatMap(c => itemsChap(c.id)) : itemsNiv(e.niv);
      cles = [...new Set([...cles, ...melange(its).slice(0, 8 - cles.length).map(it => tgt() + ':' + it.id)])];
    }
    const exos = cles.map(exoRevision).filter(Boolean);
    (ev && ev.gkeys || []).forEach(g => { const u = g.split(':')[2]; if (UNITS[u]) gramUnit(u)[2].forEach(x => exos.push(EX.conj(x, u))); });
    lancer({ kind:'revision', id:'rev', titre:'🌱 Parcours de révision avant de repasser l\'évaluation', exos:melange(exos), evalId:d.id, retour:'parcours' });

  reviser:() => lancerRevision(aReviser().slice(0, 15), '🔁 Révision du jour'),
  revErreurs:() => revisionErreurs(),
  reviserPerso:() => { const t = tgt(); lancerRevision(melange([...S.phrases.filter(p => p.tgt === t && ITEMS[p.id]).map(p => t + ':' + p.id), ...S.cartes.filter(c => c.tgt === t).map(c => 'c:' + c.id)]).slice(0, 20), '⭐ Révision de mes phrases utiles'); },
  voirNiv:d => { NIV_VU = d.n; rendre(); },
  filtre:d => { FILTRE[d.f] = d.v; rendre(); },

  /* Lecture */
  ouvrirLecture:d => { LECT = d.id; LECT_OUV = new Set(); VUE = 'lecture'; rendre(); window.scrollTo({ top:0 }); },

  motRevoir:d => {

    motsCarte(d.w, `Dans : « ${PH(p, tgt())} » — ${PH(p, src())}`, 'lecture'); fermerBulle(); toast(`📖 « ${d.w} » ajouté à Mes mots à revoir`);

  stopVoix:() => stopVoix(),

    const go = () => lancer({ kind:'lecture', id:r.id, titre:`📖 ${TITRE(r, tgt())}`, retour:'lecture', relance:go,

  /* NaoStories */
  ouvrirHistoire:d => { HIST = d.id; HIST_VIT = null; HIST_FIN = false; VUE = 'histoires'; rendre(); window.scrollTo({ top:0 }); },
  fermerHistoire:() => { stopVoix(); HIST = null; rendre(); },
  favori:d => { const st = S.histoires[d.id] = S.histoires[d.id] || {}; st.fav = !st.fav; sauver(); toast(st.fav ? '💜 Ajoutée aux favoris' : 'Retirée des favoris'); rendre(); },
  tradHist:() => { HIST_TRAD = !HIST_TRAD; stopVoix(); rendre(); },
  lireHistoire:() => ACT.phraseHist({ k:0 }),
  phraseHist:d => {

  questionsHistoire:() => {
    stopVoix(); const h = HISTOIRES.find(x => x.id === HIST), its = h.mots.map(id => ITEMS[id]).filter(Boolean);

      exos:[...h.vf.map(v => { const e = EX.vf(v, null, false); e.skill = 'ecoute'; e.consigne = 'D\'après l\'histoire : vrai ou faux ?'; return e; }),
        EX.paires(melange(its)), EX.ecoute(hasard(its))] });

  /* Voyage */
  voyage:d => { VOY = d.i === '' ? null : +d.i; if (!S.voyageVu) { S.voyageVu = true; verifierBadges(); sauver(); } rendre(); window.scrollTo({ top:0 }); },
  pratiqueVoyage:d => {
    const s = VOYAGE_SITUATIONS[+d.i], its = s.ids.map(id => ITEMS[id]).filter(Boolean);
    const go = () => lancer({ kind:'pratique', id:'voyage', titre:`🧳 ${s.t}`, retour:'voyage', relance:go,
      exos:melange(its).map((it, k) => [EX.choix, EX.ecoute, EX.choixInv, EX.oral][k % 4](it)) });

  },

  /* Mes phrases & cartes */
  creerCarte:() => {
    const r = ($('#c-recto').value || '').trim(), v = ($('#c-verso').value || '').trim();
    if (!r || !v) { toast('Remplissez le recto et le verso 🙂'); return; }
    motsCarte(r, v, 'perso'); toast('🗂️ Carte créée : elle arrive dans vos révisions'); rendre();
  },
  supprCarte:d => { S.cartes = S.cartes.filter(c => c.id !== d.id); delete S.srs['c:' + d.id]; sauver(); rendre(); },

  /* Journal */
  journal:() => {
    const t = ($('#journal-txt').value || '').trim(); if (!t) { toast('Écrivez un mot ou une phrase 🙂'); return; }
    const e = S.journal.find(j => j.d === jour() && j.tgt === tgt());
    if (e) e.texte = t; else S.journal.push({ d:jour(), tgt:tgt(), texte:t });

    verifierBadges(); sauver(); toast('✍️ Page du jour enregistrée'); rendre();
  },
  supprJournal:d => { S.journal = S.journal.filter(j => !(j.d === d.d && j.tgt === tgt())); sauver(); rendre(); },

  /* Attestations */
  voirAttestation:d => { const a = trouverAttestation(d.num); if (a) ouvrirAttestation(a, false); },
  apercuAttestation:d => ouvrirAttestation(apercuAttestation(d.n), true),
  imprimerAttestation:d => { const a = trouverAttestation(d.num); if (a) imprimerAttestation(a); },
  telechargerAttestation:d => { const a = trouverAttestation(d.num); if (a) telechargerAttestation(a); },

  /* Réglages */
  rSet:d => { P()[d.k] = +d.val; sauver(); rendre(); },
  rTheme:d => { const t = P().themes, i = t.indexOf(d.t); if (i >= 0) t.splice(i, 1); else t.push(d.t); sauver(); rendre(); },
  rPrenom:() => { P().prenom = ($('#r-prenom').value || '').trim(); sauver(); toast('Prénom enregistré'); rendre(); },
  /* Plusieurs langues maternelles / plusieurs langues apprises */
  cible:d => {
    if (d.t === tgt()) return;
    stopVoix(); HIST = null; LECT = null; VOY = null; NIV_VU = null;
    const neuf = !S.cours[d.t];
    choisirCible(d.t); verifierBadges(); sauver();
    if (VUE === 'joueur') { J = null; VUE = 'accueil'; }
    rendre(); toast(`🌍 Vous apprenez maintenant : ${langue(d.t).nom}`);
    if (neuf) fenetre(`<h3>Nouvelle langue : ${langue(d.t).nom} 🌍</h3><p class="muet">Voulez-vous passer le test de niveau pour démarrer au bon endroit, ou commencer au niveau ${cours().depart} ?</p>
      <div class="actions-bas"><button class="btn" data-act="fermer">Commencer en ${cours().depart}</button><button class="btn plein" data-act="repasserTest">🧭 Passer le test</button></div>`);
  },
  rMulti:d => {
    const p = P(), l = p[d.k], i = l.indexOf(d.val);
    if (i >= 0) {
      if (l.length === 1) { toast(d.k === 'srcs' ? 'Gardez au moins une langue maternelle 🙂' : 'Gardez au moins une langue à apprendre 🙂'); return; }
      if (d.k === 'srcs' && p.tgts.some(t => l.filter(s => s !== d.val).every(s => s === t))) { toast('Cette langue sert d\'appui à une langue apprise : ajoutez d\'abord une autre langue maternelle.'); return; }
      l.splice(i, 1);
    } else l.push(d.val);
    if (d.k === 'tgts' && i < 0) { ACT.cible({ t:d.val }); return; }
    if (!p.tgts.includes(p.tgt)) choisirCible(p.tgts[0]); else p.src = appuiPour(p.tgt);
    sauver(); rendre();
  },
  repasserTest:() => { fermer(); lancerTest(); },
  choisirDepart:d => { cours().depart = d.n; P().niveaux[tgt()] = d.n; sauver(); J = null; VUE = 'accueil'; NIV_VU = null; rendre(); toast(`C'est parti en ${d.n} 🌟`); },
  /* ---------- Profils et sauvegardes ---------- */
  profils:() => fenetreProfils(),
  ouvrirProfil:d => { sauver(); stopVoix(); chargerProfil(d.id); migrerProfil(); fermer(); remiseAZero(); toast(`👋 Bonjour ${nomProfil(REG.liste.find(x => x.id === d.id))}`); },
  nouveauProfil:() => { sauver(); stopVoix(); REG.actif = null; ecrireReg(); S = NEUF(); fermer(); remiseAZero(); },
  sauverFichier:() => ACT.exporterProfil({ id:REG.actif }),
  exporterProfil:d => {
    if (d.id === REG.actif) sauver();
    const e = REG.liste.find(x => x.id === d.id); if (!e) { toast('Terminez d\'abord la création du profil 🙂'); return; }
    const nom = nomProfil(e).replace(/[^\p{L}\p{N}-]+/gu, '-');
    telecharger(`naolang-${nom}-${jour()}.json`, JSON.stringify({ type:'naolang-profil', v:1, id:e.id, prenom:e.prenom, date:jour(), donnees:lireDonnees(e.id) }, null, 1), 'application/json');
    toast(`💾 Profil « ${nomProfil(e)} » sauvegardé`);
  },
  sauvegardeComplete:() => {
    sauver();
    const profils = REG.liste.map(e => ({ id:e.id, prenom:e.prenom, donnees:lireDonnees(e.id) }));
    telecharger(`naolang-tous-les-profils-${jour()}.json`, JSON.stringify({ type:'naolang-sauvegarde', v:1, date:jour(), profils }, null, 1), 'application/json');
    toast(`🗄️ Sauvegarde complète : ${profils.length} profil(s)`);
  },
  chargerFichier:() => $('#f-charger').click(),
  supprimerProfil:d => { const e = REG.liste.find(x => x.id === d.id);
    fenetre(`<h3>Supprimer le profil « ${esc(nomProfil(e))} » ?</h3><p class="muet">Sa progression, ses notes, ses attestations, son journal et ses cartes seront effacés de ce navigateur. Pensez à le sauvegarder avant.</p>
      <div class="actions-bas"><button class="btn" data-act="exporterProfil" data-id="${e.id}">💾 Le sauvegarder d'abord</button>
      <span class="ligne"><button class="btn" data-act="profils">Annuler</button><button class="btn plein" data-act="supprimerProfilOk" data-id="${e.id}">Oui, supprimer</button></span></div>`); },
  supprimerProfilOk:d => {
    try { localStorage.removeItem(CLE_P(d.id)); } catch (e) {}
    REG.liste = REG.liste.filter(x => x.id !== d.id);
    if (REG.actif === d.id) { REG.actif = null; S = NEUF(); if (REG.liste[0]) chargerProfil(REG.liste[0].id); migrerProfil(); }
    ecrireReg(); fermer(); remiseAZero(); toast('Profil supprimé');
  },
  reinit:() => ACT.supprimerProfil({ id:REG.actif }),
  toutEffacer:() => fenetre(`<h3>🧹 Réinitialiser NaoLang ?</h3>
    <p class="muet">NaoLang redeviendra vierge, comme au tout premier lancement : l'accueil vous demandera à nouveau votre prénom et vos langues.</p>
    <div class="format" style="padding:14px;margin:12px 0"><div class="consigne" style="margin-bottom:8px">Ce qui sera effacé de ce navigateur</div>
      <div>👥 <b>${REG.liste.length} profil(s)</b>${REG.liste.length ? ` : ${REG.liste.map(e => esc(nomProfil(e))).join(', ')}` : ''}</div>
      <div>🧭 Parcours, notes, carnet et évaluations</div><div>🔁 Révisions, phrases utiles et cartes mémoire</div>
      <div>📜 Attestations, badges, journal et séries de jours</div></div>
    <p class="muet petit">Les fichiers de sauvegarde déjà téléchargés, eux, ne sont pas touchés : ils permettront de tout retrouver.</p>
    <div class="actions-bas">${REG.liste.length ? '<button class="btn" data-act="sauvegardeComplete">🗄️ Tout sauvegarder d\'abord</button>' : '<span></span>'}
      <span class="ligne"><button class="btn" data-act="fermer">Annuler</button><button class="btn plein" data-act="toutEffacerOk">Oui, tout réinitialiser</button></span></div>`),
  toutEffacerOk:() => {
    try { Object.keys(localStorage).filter(k => k.startsWith('naolang')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    REG = { actif:null, liste:[] }; S = NEUF(); IMPORT = null;
    document.documentElement.dataset.theme = 'dark'; appliquerTheme();
    fermer(); stopVoix(); remiseAZero(); toast('🧹 NaoLang est comme neuf');
  },
  importer:d => {
    const I = IMPORT; if (!I) return; sauver();
    const ecrire = (id, donnees) => {
      localStorage.setItem(CLE_P(id), JSON.stringify(donnees));
      let e = REG.liste.find(x => x.id === id); if (!e) { e = { id, cree:jour() }; REG.liste.push(e); }
      resumeProfil(e, donnees);
    };
    try {
      if (d.mode === 'tous') I.profils.forEach(p => ecrire(p.id || nouvelId(), p.donnees));
      else { const p = I.profils[0], id = d.mode === 'remplacer' ? d.id : (p.id && !REG.liste.some(x => x.id === p.id) ? p.id : nouvelId()); ecrire(id, p.donnees); REG.actif = id; }
      const actif = REG.liste.find(x => x.id === REG.actif) || REG.liste[0];
      chargerProfil(actif.id); migrerProfil(); sauver();
    } catch (e) { toast('Le navigateur n\'a pas pu enregistrer ces données (espace plein ?)'); return; }
    IMPORT = null; fermer(); remiseAZero(); toast('📂 Sauvegarde chargée');
  },

  /* Onboarding */
  obSet:d => { OB.d[d.k] = d.k === 'objectif' ? +d.val : d.val; rendre(); },
  obMulti:d => {
    const o = OB.d, l = o[d.k], i = l.indexOf(d.val);
    if (i >= 0) l.splice(i, 1); else l.push(d.val);
    // une langue apprise doit toujours avoir une autre langue maternelle pour les traductions
    o.tgts = o.tgts.filter(t => o.srcs.some(s => s !== t));
    rendre();
  },
  obNiv:d => { OB.d.niveaux[d.t] = d.n; rendre(); },
  obTheme:d => { const t = OB.d.themes, i = t.indexOf(d.t); if (i >= 0) t.splice(i, 1); else t.push(d.t); rendre(); },
  obSuiv:() => { if (OB.etape === 0) OB.d.prenom = ($('#ob-prenom').value || '').trim(); OB.etape++; rendre(); window.scrollTo({ top:0 }); },
  obPrec:() => { if (OB.etape === 0) return; if (OB.etape === 0) OB.d.prenom = ($('#ob-prenom').value || '').trim(); OB.etape--; rendre(); },
  obFin:d => {
    const o = OB.d, niveaux = {};
    o.tgts.forEach(t => { niveaux[t] = o.niveaux[t] || 'A1'; });
    S.profil = { prenom:o.prenom, srcs:o.srcs.slice(), tgts:o.tgts.slice(), niveaux, appui:{}, objectif:o.objectif, themes:o.themes.slice(), cree:jour() };
    o.tgts.slice().reverse().forEach(t => choisirCible(t));   // crée chaque parcours, finit sur la première langue
    sauver();
    if (d.test === '1') lancerTest(); else { VUE = 'accueil'; rendre(); toast(`Bienvenue ${S.profil.prenom || ''} 🌙`); }
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!$('#bulle') || !ev.target.closest('#bulle')) { if (!el || !['glose', 'phrase'].includes(el.dataset.act)) fermerBulle(); }
  if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  f(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.change;
  if (k === 'vitLect') { LECT_VIT = +ev.target.value; $('#vit-l').textContent = LECT_VIT.toFixed(2) + '×'; }
  if (k === 'vitHist') { HIST_VIT = +ev.target.value; $('#vit-h').textContent = HIST_VIT.toFixed(2) + '×'; }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset && ev.target.dataset.change;
  if (k === 'appui' || k === 'appuiDe') {
    const t = k === 'appui' ? tgt() : ev.target.dataset.t;
    P().appui[t] = ev.target.value; if (t === tgt()) P().src = appuiPour(t);
    sauver(); rendre(); toast(`Traductions depuis : ${langue(ev.target.value).nom}`);
  }
});
document.addEventListener('keydown', ev => {
  if ($('#fenetres').innerHTML && ev.key === 'Escape') { fermer(); return; }
  if (VUE !== 'joueur' || !J || !J.commence || J.i >= J.exos.length) return;
  const ex = J.exos[J.i], dansChamp = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (ev.key === 'Enter' && J.rep) { ev.preventDefault(); suivant(); return; }
  if (ev.key === 'Enter' && !J.rep && ex.type === 'saisie' && dansChamp) { ev.preventDefault(); REP.verifier(); return; }
  if (!dansChamp && !J.rep && ex.type === 'choix' && /^[1-4]$/.test(ev.key) && ex.opts[+ev.key - 1]) REP.opt(+ev.key - 1);
});

/* ---------- Thème, sauvegarde, ciel ---------- */
function appliquerTheme() { const t = document.documentElement.dataset.theme; $('#pouce').textContent = t === 'light' ? '☀️' : '🌙'; }
$('#b-theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('naolang.theme', t); } catch (e) {} appliquerTheme();
});
$('#b-sauver').addEventListener('click', () => ACT.sauverFichier());
$('#b-charger').addEventListener('click', () => $('#f-charger').click());
$('#f-charger').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let profils;
    try {
      const d = JSON.parse(r.result);
      if (d && d.type === 'naolang-sauvegarde' && Array.isArray(d.profils)) profils = d.profils;
      else if (d && d.type === 'naolang-profil' && d.donnees) profils = [{ id:d.id, prenom:d.prenom, donnees:d.donnees }];
      else if (d && d.v === 1 && 'cours' in d) profils = [{ id:null, prenom:d.profil && d.profil.prenom, donnees:d }];   // ancien format
      profils = (profils || []).filter(p => p.donnees && p.donnees.v === 1 && p.donnees.profil).map(p => ({ ...p, donnees:Object.assign(NEUF(), p.donnees) }));
      if (!profils.length) throw 0;
    } catch (e) { toast('Ce fichier ne ressemble pas à une sauvegarde NaoLang.'); return; }
    IMPORT = { profils }; fenetreImport();
  };
  r.readAsText(f); ev.target.value = '';
});
(function ciel() {
  let h = '';
  for (let i = 0; i < 70; i++) { const s = Math.random() < .12 ? 2.4 : 1 + Math.random(); h += `<b style="left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${3 + Math.random() * 5}s;animation-delay:${Math.random() * 5}s"></b>`; }
  $('#ciel').innerHTML = h;
})();
/* Les motifs du fond : les signes qui font qu'une langue est elle-même —
   accents des six langues de NaoLang, ponctuations, puis quelques écritures du monde. */
const MOTIFS = ['ñ', 'é', 'è', 'ê', 'ç', 'à', 'ü', 'ö', 'ß', 'ù', 'ò', 'î', '«', '»', '¿', '¡', 'Ñ', 'É', 'Ü', 'Ç',
  '¡Hola!', 'Hello', 'Bonjou', 'Guten Tag', 'ka', 'té', 'ké', 'ə', 'あ', '文', 'ع', 'я', 'α', 'ह', 'ㅅ', 'ש'];
(function motifs() {
  const n = window.innerWidth < 760 ? 10 : 16;
  let h = '', choix = melange(MOTIFS);
  for (let i = 0; i < n; i++) {
    const m = choix[i % choix.length], mot = m.length > 2;
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
    h += `<b style="left:${4 + Math.random() * 90}%;top:${4 + Math.random() * 88}%;font-size:${mot ? 17 + Math.random() * 10 : 22 + Math.random() * 30}px;
      --o:calc(var(--motif-o) * ${((mot ? .75 : 1) * (.7 + Math.random() * .5)).toFixed(2)});--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d - 40).toFixed(0)}px;--r:${(Math.random() * 16 - 8).toFixed(1)}deg;
      opacity:0;animation-duration:${34 + Math.random() * 30}s;animation-delay:-${Math.random() * 40}s">${m}</b>`;
  }
  $('#motifs').innerHTML = h;
})();
appliquerTheme();
migrerProfil();
if (P()) { verifierBadges(); sauver(); }
rendre();

/* L'entrée : quelques secondes de bienvenue, qu'un clic abrège.
   À la sortie, le jeton rejoint le logo de l'en-tête : la bienvenue devient l'outil. */
(function entree() {
  const intro = $('#intro'); if (!intro) return;
  let parti = false;
  const motsIntro = [...intro.querySelectorAll('.mot-i')];
  const k = parseFloat(getComputedStyle(intro).getPropertyValue('--k')) || 1;

  /* Les lettres des six langues arrivent de partout et se fondent dans le jeton. */
  (function lettres() {
    const zone = $('#lettres-i'); if (!zone) return;
    const signes = ['ñ', 'é', 'ü', 'ç', 'à', 'ß', 'è', 'ö', '«', '»', '¿', 'ê', 'ò', 'ù', '¡', 'î'];
    zone.innerHTML = melange(signes).slice(0, 14).map((s, i) => {
      const a = Math.random() * Math.PI * 2, d = 230 + Math.random() * 300;
      return `<span class="lettre" style="--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d * .7).toFixed(0)}px;
        --r:${(Math.random() * 50 - 25).toFixed(0)}deg;--t:${(i * .055).toFixed(2)}s;font-size:${(17 + Math.random() * 22).toFixed(0)}px">${s}</span>`;
    }).join('');
  })();

  /* Les fils de la constellation : un trait du jeton vers chaque langue, puis une étoile. */
  (function fils() {
    const svg = $('#fils-i'); if (!svg) return;
    svg.innerHTML = motsIntro.map(m => {
      const s = m.style, dx = parseFloat(s.getPropertyValue('--dx')) * k, dy = parseFloat(s.getPropertyValue('--dy')) * k;
      const t = parseFloat(s.getPropertyValue('--t')) - .45;
      const x = dx * .78, y = dy * .78, l = Math.round(Math.hypot(x, y));
      return `<line class="fil" style="--l:${l};--t:${t.toFixed(2)}s" x1="0" y1="0" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}"/>
        <circle class="noeud" style="--t:${(t + .5).toFixed(2)}s" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="2.6"/>`;
    }).join('');
  })();

  const finir = () => {                       // quoi qu'il arrive, l'outil reste accessible
    parti = true;
    if (intro.isConnected) intro.remove();
    document.body.classList.remove('entree');
    const s = document.querySelector('.shell'); if (s) s.style.animation = '';
  };
  document.body.classList.add('entree');
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    intro.classList.add('calme');             // animations réduites : la scène s'affiche d'un bloc, sans mouvement
    setTimeout(finir, 1600);
    intro.addEventListener('click', finir);
    return;
  }

  /* Les langues rentrent dans le jeton avant qu'il ne s'en aille. */
  const implosion = () => {
    motsIntro.forEach(m => {
      const fige = getComputedStyle(m).transform;
      m.style.animation = 'none'; m.style.transform = fige; m.style.opacity = getComputedStyle(m).opacity;
    });
    intro.querySelectorAll('.fil').forEach(f => {
      f.style.animation = 'none'; f.style.transition = 'stroke-dashoffset .45s ease-in, stroke-opacity .45s ease';
      f.style.strokeDashoffset = f.style.getPropertyValue('--l'); f.style.strokeOpacity = '0';
    });
    intro.querySelectorAll('.noeud').forEach(n => { n.style.animation = 'none'; n.style.transition = 'opacity .35s ease'; n.style.opacity = '0'; });
    requestAnimationFrame(() => motsIntro.forEach(m => {
      m.style.transition = 'transform .5s cubic-bezier(.5,0,.2,1), opacity .45s ease';
      m.style.transform = 'translate(-50%,-50%) scale(.45)'; m.style.opacity = '0';
    }));
  };

  const sortir = () => {
    if (parti || !intro.isConnected) return;
    parti = true;
    implosion();
    const jeton = $('#jeton-i'), cible = document.querySelector('.marque svg');
    if (jeton && cible) {                     // le jeton quitte la scène et vole jusqu'à sa place dans l'en-tête
      const a = jeton.getBoundingClientRect(), b = cible.getBoundingClientRect();
      jeton.style.animation = 'none';
      jeton.classList.add('vole');
      jeton.style.left = a.left + 'px'; jeton.style.top = a.top + 'px';
      jeton.style.width = a.width + 'px'; jeton.style.height = a.height + 'px';
      intro.appendChild(jeton);               // hors de la scène, qui s'efface plus vite que lui
      setTimeout(() => {                      // le temps que les langues rentrent dans le jeton
        jeton.style.transition = 'transform .95s cubic-bezier(.55,0,.15,1), border-radius .95s ease, opacity .3s .62s ease';
        jeton.style.borderRadius = '17px';
        jeton.style.opacity = '0';            // il se fond dans le logo au moment où il arrive
        jeton.style.transform = `translate(${(b.left + b.width / 2) - (a.left + a.width / 2)}px, ${(b.top + b.height / 2) - (a.top + a.height / 2)}px) scale(${b.width / a.width})`;
      }, 380);
    }
    setTimeout(() => {
      intro.classList.add('part');
      const s = document.querySelector('.shell'); if (s) s.style.animation = 'emerge .9s cubic-bezier(.2,.8,.2,1) both';
    }, 380);
    setTimeout(finir, 1450);
  };

  intro.addEventListener('click', sortir);
  setTimeout(sortir, 4200);                   // le temps de la scène
  setTimeout(finir, 7200);                    // dernier filet
})();
</script>

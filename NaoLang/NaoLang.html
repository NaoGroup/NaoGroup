<style>
/* ============================================================
   NaoLang — charte NaoGroup
   Thème sombre (par défaut) : fond étoilé violet profond / bleu nuit, jamais de noir.
   Thème clair : le lilas pâle de la maison.
   Cartes translucides, lueurs lavande, animations calmes.
   ============================================================ */
:root{
  --sans:Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;

  --fond:radial-gradient(1250px 900px at 50% 12%, #6553B8 0%, #33287A 42%, #12102B 100%);
  --fond-uni:#15122E;
  --grille:rgba(255,255,255,.12);
  --halo-1:#B9A8F0; --halo-2:#6C8FE0; --halo-3:#C79BF2; --ho1:.30; --ho2:.18; --ho3:.16;
  --etoile:#FFFFFF; --ciel-o:1;
  --motif:#FFFFFF; --motif-o:.13;
  --titre:#FFFFFF; --ink:#F3EFFB; --ink-2:rgba(243,239,251,.76); --ink-3:rgba(243,239,251,.52);
  --verre:rgba(255,255,255,.07); --verre-2:rgba(255,255,255,.12);
  --bord:rgba(255,255,255,.15); --bord-2:rgba(255,255,255,.3);
  --lilas:#C9B7F5; --lilas-fort:#B39DF2; --violet:#8E7BD4;
  --creux:rgba(0,0,0,.22); --trait:rgba(255,255,255,.09);
  --surface:rgba(30,24,64,.9); --champ:rgba(0,0,0,.25); --option:#2A2350;
  --fenetre:linear-gradient(160deg, rgba(60,48,128,.98), rgba(28,22,64,.99));
  --voile:rgba(12,9,32,.6);
  --or:#F3D27A; --bon:#7FD6B0; --bon-fond:rgba(127,214,176,.14); --doux:#F5B7A8; --doux-fond:rgba(245,183,168,.13);
  --ombre:0 26px 60px -30px rgba(0,0,0,.85);
  --lueur:0 0 0 1px rgba(201,183,245,.55), 0 0 28px -6px rgba(201,183,245,.7);
  --plein:linear-gradient(135deg,#8E7BD4,#C39BF3); --plein-ink:#1C1636;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fond:radial-gradient(1400px 900px at 50% -8%, #EFE9FE 0%, #E4DDFA 44%, #F5F2FD 100%);
  --fond-uni:#F5F2FD;
  --grille:rgba(114,87,207,.15);
  --halo-1:#C9B7F5; --halo-2:#A9C0F2; --halo-3:#E2BDF6; --ho1:.45; --ho2:.28; --ho3:.24;
  --etoile:#9B82E8; --ciel-o:.5;
  --motif:#7257CF; --motif-o:.16;
  --titre:#221D38; --ink:#2C2644; --ink-2:#5F587A; --ink-3:#928AAE;
  --verre:rgba(255,255,255,.66); --verre-2:rgba(255,255,255,.9);
  --bord:#E1D7F5; --bord-2:#CBBBEE;
  --lilas:#6E52CC; --lilas-fort:#5B40BE; --violet:#7257CF;
  --creux:rgba(114,87,207,.07); --trait:rgba(114,87,207,.13);
  --surface:#FFFFFF; --champ:#FFFFFF; --option:#FFFFFF;
  --fenetre:linear-gradient(160deg, #FFFFFF, #F3EDFD);
  --voile:rgba(60,44,130,.24);
  --or:#C2911F; --bon:#1F8A5C; --bon-fond:rgba(47,143,99,.1); --doux:#B4583F; --doux-fond:rgba(214,120,90,.1);
  --ombre:0 1px 2px rgba(36,31,51,.04), 0 14px 34px -18px rgba(114,87,207,.45);
  --lueur:0 0 0 1.5px #9B82E8, 0 0 24px -6px rgba(114,87,207,.55);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:var(--sans);font-style:italic;font-size:15px;line-height:1.55;
  background:var(--fond-uni);overflow-x:hidden}
input,select,button,textarea{font-family:var(--ui);font-style:normal;color:inherit;font-size:14px}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--titre)}
a{color:var(--lilas)}
.ui{font-family:var(--ui);font-style:normal}

/* ---------- Le fond étoilé ---------- */
.fond{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--fond)}
.fond::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, var(--grille) 1px, transparent 1.7px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 24%, #000 0 30%, transparent 74%);
  mask-image:radial-gradient(circle at 50% 24%, #000 0 30%, transparent 74%)}
.fond>i{position:absolute;border-radius:50%;filter:blur(70px);animation:flotte 16s ease-in-out infinite alternate}
.fond>i:nth-child(1){width:480px;height:480px;background:var(--halo-1);left:4%;top:4%;opacity:var(--ho1)}
.fond>i:nth-child(2){width:420px;height:420px;background:var(--halo-2);right:5%;bottom:4%;opacity:var(--ho2);animation-duration:19s}
.fond>i:nth-child(3){width:360px;height:360px;background:var(--halo-3);right:26%;top:-9%;opacity:var(--ho3);animation-duration:23s}
.ciel{position:absolute;inset:0;opacity:var(--ciel-o)}
.ciel b{position:absolute;border-radius:50%;background:var(--etoile);animation:scintille ease-in-out infinite}
@keyframes flotte{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,-34px) scale(1.18)}}
@keyframes scintille{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1)}}
/* Les motifs du fond : lettres accentuées, guillemets et signes d'autres écritures,
   qui dérivent très lentement — le monde qui s'ouvre, en filigrane. */
.motifs{position:absolute;inset:0;overflow:hidden}
.motifs b{position:absolute;font-family:var(--sans);font-style:italic;font-weight:600;color:var(--motif);opacity:0;
  white-space:nowrap;user-select:none;will-change:transform,opacity;animation:motif linear infinite}
@keyframes motif{
  0%{opacity:0;transform:translate3d(0,18px,0) rotate(-7deg) scale(.92)}
  14%{opacity:var(--o)} 78%{opacity:var(--o)}
  100%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) rotate(var(--r)) scale(1.08)}}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,183,245,.55)}50%{box-shadow:0 0 0 12px rgba(201,183,245,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- L'entrée : le jeton se dessine, les langues s'écartent ---------- */
.intro{--k:1;position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  cursor:pointer;animation:introSort .9s 6.4s cubic-bezier(.6,0,.3,1) forwards}   /* filet de sécurité : le script sort plus tôt */
/* le voile de fond, séparé de la scène : à la sortie, le texte s'efface vite,
   le fond plus lentement, et le jeton reste visible jusqu'à sa place dans l'en-tête */
.intro .voile-i{position:absolute;inset:0;background:var(--fond);background-color:var(--fond-uni)}
.intro.part .scene-i{animation:dispar .35s ease forwards}
.intro.part .voile-i{animation:dispar .8s .1s ease forwards}
@keyframes dispar{to{opacity:0}}
.intro .voile-i::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, var(--grille) 1px, transparent 1.7px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 68%);mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 68%)}
@keyframes introSort{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.intro .scene-i{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:30px}
.intro .jeton-i.vole{position:fixed;margin:0;z-index:5}
.intro .ronde{position:relative;width:540px;height:310px;display:grid;place-items:center}
.intro .halo-j{position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(201,183,245,.45), rgba(142,123,212,.12) 45%, transparent 70%);animation:haloJ 2.4s .55s ease-out both}
@keyframes haloJ{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:.5;transform:scale(1.15)}}
/* les lettres du monde convergent et se fondent dans le jeton */
.intro .lettre{position:absolute;left:50%;top:50%;font-family:var(--sans);font-style:italic;font-weight:600;color:var(--lilas);
  opacity:0;pointer-events:none;will-change:transform,opacity;animation:converge 1.3s var(--t) cubic-bezier(.35,0,.15,1) both}
@keyframes converge{0%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r))}
  22%{opacity:.9}70%{opacity:.55}100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0deg)}}
/* le balayage de lumière sur le jeton */
.intro .brillance{position:absolute;width:132px;height:132px;border-radius:42px;overflow:hidden;pointer-events:none;z-index:2}
.intro .brillance::after{content:'';position:absolute;top:-60%;bottom:-60%;width:42%;left:-60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:rotate(18deg);animation:balaye 1.2s 2.05s cubic-bezier(.4,0,.2,1) both}
@keyframes balaye{to{left:130%}}
/* les fils de la constellation : du jeton vers chaque langue */
.intro .fils{position:absolute;width:540px;height:310px;overflow:visible;pointer-events:none}
.intro .fil{fill:none;stroke:var(--lilas);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);
  animation:trace .6s var(--t) ease-out forwards, filDoux .7s calc(var(--t) + 1.3s) ease forwards}
@keyframes filDoux{from{stroke-opacity:.5}to{stroke-opacity:.26}}
.intro .noeud{fill:#fff;transform-box:fill-box;transform-origin:center;opacity:0;animation:noeud .55s var(--t) cubic-bezier(.2,.9,.3,1.4) both, scintille 3.2s calc(var(--t) + .7s) ease-in-out infinite}
@keyframes noeud{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.25)}100%{opacity:.8;transform:scale(1)}}
/* les ondes : la voix qui porte */
.intro .onde{position:absolute;width:150px;height:150px;border-radius:50%;border:1.5px solid var(--lilas);opacity:0;
  animation:onde 3s var(--t) cubic-bezier(.15,.7,.3,1) both}
@keyframes onde{0%{opacity:0;transform:scale(.74)}16%{opacity:.5}100%{opacity:0;transform:scale(3.2)}}
/* l'orbite : le monde qui tourne doucement */
.intro .orbite{position:absolute;width:312px;height:312px;opacity:0;animation:orbiteNait 1.4s 1.75s ease both}
.intro .orbite svg{width:100%;height:100%;animation:tourne 70s 1.75s linear infinite}
.intro .orbite circle{fill:none;stroke:var(--motif);stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:2 12;stroke-linecap:round}
@keyframes orbiteNait{from{opacity:0}to{opacity:.75}}
@keyframes tourne{to{transform:rotate(360deg)}}
.intro .jeton-i{position:relative;width:132px;height:132px;border-radius:42px;box-shadow:0 26px 60px -22px rgba(20,10,60,.85);
  animation:jetonArrive .95s .35s cubic-bezier(.2,.8,.2,1) both, jetonSouffle 2.2s 2.4s ease-in-out infinite alternate}
@keyframes jetonArrive{from{opacity:0;transform:scale(.45) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes jetonSouffle{to{transform:scale(1.035)}}
.intro .trace{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:trace var(--d) var(--t) cubic-bezier(.6,.05,.3,1) forwards}
@keyframes trace{to{stroke-dashoffset:0}}
/* le tilde, une fois tracé, ondule comme une voix */
.intro .tilde{stroke-dasharray:24;stroke-dashoffset:24;
  animation:trace .75s 1.5s cubic-bezier(.6,.05,.3,1) forwards, ondule 3.4s 2.4s ease-in-out infinite}
@keyframes ondule{0%,100%{transform:translateY(0)}50%{transform:translateY(-.55px)}}
/* chaque langue arrive, puis se pose pour laisser la parole à la suivante */
.intro .mot-i{position:absolute;left:50%;top:50%;text-align:center;opacity:0;white-space:nowrap;
  animation:motDehors 1s var(--t) cubic-bezier(.2,.8,.2,1) both, motCalme .9s calc(var(--t) + 1.15s) ease both}
@keyframes motCalme{to{opacity:.5}}
@keyframes motDehors{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  to{opacity:1;transform:translate(calc(-50% + var(--dx) * var(--k)), calc(-50% + var(--dy) * var(--k))) scale(1)}}
.intro .mot-i b{display:block;font-family:var(--sans);font-style:italic;font-weight:600;font-size:22px;color:#fff;text-shadow:0 2px 18px rgba(30,18,80,.6)}
.intro .mot-i i{display:block;font-family:var(--ui);font-style:normal;font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--lilas);margin-bottom:3px}
:root[data-theme="light"] .intro .mot-i b{color:#2A2150;text-shadow:0 2px 14px rgba(255,255,255,.9)}
.intro .phrase{font-family:var(--sans);font-style:italic;font-size:20px;color:var(--ink);text-align:center;max-width:90vw;animation:monte .9s 3.25s ease both}
.intro .phrase span{color:var(--lilas);background-image:linear-gradient(var(--lilas),var(--lilas));background-repeat:no-repeat;
  background-position:0 1.18em;background-size:0 1.5px;animation:souligne .9s 3.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes souligne{to{background-size:100% 1.5px}}
.intro .passer{position:absolute;bottom:-64px;left:50%;transform:translateX(-50%);font-family:var(--ui);font-style:normal;font-size:11px;
  letter-spacing:.08em;color:var(--ink-3);animation:monte .6s 1.9s ease both}
/* animations réduites : on montre la même image, mais immobile */
.intro.calme .lettre,.intro.calme .onde,.intro.calme .brillance{display:none}
.intro.calme .jeton-i,.intro.calme .phrase,.intro.calme .passer{opacity:1}
.intro.calme .orbite{opacity:.7}
.intro.calme .trace,.intro.calme .tilde{stroke-dashoffset:0}
.intro.calme .fil{stroke-dashoffset:0;stroke-opacity:.26}
.intro.calme .noeud{opacity:.8}
.intro.calme .phrase span{background-size:100% 1.5px}
.intro.calme .mot-i{opacity:1;transform:translate(calc(-50% + var(--dx) * var(--k)), calc(-50% + var(--dy) * var(--k)))}
@media (max-width:760px){.intro{--k:.68}.intro .scene-i{transform:scale(.62)}.intro .ronde{width:420px}.intro .orbite{width:250px;height:250px}}
body.entree .shell{opacity:0}
@keyframes emerge{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Structure ---------- */
.shell{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
.entete{display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:monte .6s ease both}
.marque{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}
.marque svg{width:52px;height:52px;border-radius:17px;flex:none;box-shadow:0 14px 30px -14px rgba(40,20,90,.8), 0 0 30px -8px rgba(185,165,245,.55)}
.marque h1{font-size:27px;letter-spacing:-.02em;line-height:1.1}
.marque h1 span{color:var(--lilas)}
.slogan{font-size:14px;color:var(--ink-2)}
.spacer{flex:1}
.outils-mini{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rond{width:40px;height:40px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);display:grid;place-items:center;
  font-size:16px;transition:.2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-decoration:none;color:inherit}
.rond:hover{background:var(--verre-2);border-color:var(--bord-2);transform:translateY(-1px)}
.theme{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--bord);background:var(--creux);padding:0;transition:.3s}
.theme .pouce{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;
  background:var(--plein);box-shadow:0 4px 12px -4px rgba(114,87,207,.9);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
:root[data-theme="light"] .theme .pouce{transform:translateX(28px);background:linear-gradient(135deg,#F3C969,#F3AEC0)}
.groupe-lien{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--ui);font-style:normal;font-size:12.5px;font-weight:600;
  color:var(--ink-2);background:var(--verre);border:1px solid var(--bord);padding:8px 14px 8px 8px;border-radius:999px;transition:.2s}
.groupe-lien:hover{background:var(--verre-2);color:var(--titre)}
.groupe-lien svg{width:24px;height:24px;border-radius:8px}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-family:var(--ui);font-style:normal;font-weight:800;font-size:12px;
  background:var(--plein);color:var(--plein-ink)}
.avatar.grand{width:44px;height:44px;font-size:17px}
.profil-l{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--trait);background:var(--creux);margin-bottom:8px}
.profil-l.on{border-color:var(--lilas);box-shadow:var(--lueur)}
.profil-l .corps{flex:1;min-width:0}
.profil-l b{display:block;color:var(--titre)}

.cadre{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:20px;align-items:start}
.nav{position:sticky;top:14px;display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:22px;background:var(--verre);
  border:1px solid var(--bord);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--ombre);animation:monte .6s .05s ease both}
.nav .cours{padding:10px 10px 12px;border-bottom:1px solid var(--trait);margin-bottom:6px}
.nav .cours b{display:block;font-size:15px;color:var(--titre)}
.nav .cours span{font-family:var(--ui);font-style:normal;font-size:11.5px;color:var(--ink-3)}
.nav .sep{font-family:var(--ui);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:13px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.18s}
.nav button:hover{background:var(--verre-2);color:var(--titre)}
.nav button.on{background:var(--plein);color:var(--plein-ink);box-shadow:0 8px 20px -10px rgba(142,123,212,.9)}
.nav button .ic{width:22px;text-align:center;font-size:15px}
.nav button .nb{margin-left:auto;font-size:10.5px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;
  background:rgba(201,183,245,.25);color:var(--titre)}
.nav button.on .nb{background:rgba(28,22,54,.18);color:var(--plein-ink)}
.vue{min-width:0;animation:monte .45s ease both}
@media (max-width:900px){
  .cadre{grid-template-columns:1fr}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding:6px;border-radius:18px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .cours,.nav .sep{display:none}
  .nav button{flex:none;white-space:nowrap;padding:8px 12px}
  .slogan{display:none}
}

/* ---------- Composants ---------- */
.titre-vue{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.titre-vue h2{font-size:28px;letter-spacing:-.02em}
.titre-vue p{margin:2px 0 0;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.carte{background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:20px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:var(--ombre);animation:monte .5s ease both}
.carte h3{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.carte h3 .ic{font-style:normal}
.grille{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.pile{display:flex;flex-direction:column;gap:16px}
.ligne{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muet{color:var(--ink-3);font-size:13px}
.petit{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:650;
  border:1px solid var(--bord);background:var(--verre);color:var(--ink);transition:.2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-decoration:none}
.btn:hover{background:var(--verre-2);border-color:var(--bord-2);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.plein{background:var(--plein);border-color:transparent;color:var(--plein-ink);box-shadow:0 10px 24px -12px rgba(142,123,212,.95)}
.btn.plein:hover{filter:brightness(1.07)}
.btn.grand{padding:13px 24px;font-size:14.5px}
.btn.mini{padding:6px 12px;font-size:12px}
.btn.fant{background:transparent}
.puce{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--creux);border:1px solid var(--bord);color:var(--ink-2)}
.puce.niv{background:var(--plein);color:var(--plein-ink);border-color:transparent}
.puce.ok{background:var(--bon-fond);color:var(--bon);border-color:transparent}
.puce.or{color:var(--or)}
.champ{width:100%;border:1px solid var(--bord);background:var(--champ);border-radius:14px;padding:11px 14px;outline:none;transition:.2s}
.champ:focus{border-color:var(--lilas);box-shadow:var(--lueur)}
textarea.champ{min-height:110px;resize:vertical;font-family:var(--sans);font-style:italic;font-size:15px;line-height:1.5}
select.champ option{background:var(--option)}
label.lab{display:block;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;letter-spacing:.02em}
.barre-p{height:9px;border-radius:999px;background:var(--creux);overflow:hidden;border:1px solid var(--trait)}
.barre-p i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8E7BD4,#C9B7F5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vide{padding:26px;text-align:center;color:var(--ink-3);border:1px dashed var(--bord-2);border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bord);background:var(--verre);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-2);transition:.18s}
.chip:hover{border-color:var(--bord-2);color:var(--titre)}
.chip.on{background:var(--plein);color:var(--plein-ink);border-color:transparent}
.choix-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt-l{border:1px solid var(--bord);background:var(--verre);border-radius:16px;padding:14px;text-align:left;transition:.18s;display:flex;gap:10px;align-items:center}
.opt-l:hover{border-color:var(--bord-2);transform:translateY(-2px)}
.opt-l.on{border-color:var(--lilas);box-shadow:var(--lueur);background:var(--verre-2)}
.opt-l:disabled{opacity:.35;cursor:default;transform:none}
.opt-l b{display:block;font-size:14px}
.opt-l small{display:block;font-size:11.5px;color:var(--ink-3)}
.code-l{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--ui);font-style:normal;font-weight:800;font-size:12px;
  background:var(--plein);color:var(--plein-ink);letter-spacing:.04em}
.code-l.mq{background:linear-gradient(135deg,#6FCBB8,#B8A4F6)} .code-l.gp{background:linear-gradient(135deg,#F2C66D,#C39BF3)}
.code-l.en{background:linear-gradient(135deg,#7C9BE8,#C39BF3)} .code-l.es{background:linear-gradient(135deg,#F2A3A0,#C39BF3)}
.code-l.de{background:linear-gradient(135deg,#9D8FE8,#E0B8F5)}

/* ---------- Accueil ---------- */
.bienvenue{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:1000px){.bienvenue{grid-template-columns:1fr}}
.hero{position:relative;overflow:hidden}
.hero h2{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--ink-2);margin:6px 0 16px}
.anneau{position:relative;width:120px;height:120px;flex:none}
.anneau svg{transform:rotate(-90deg)}
.anneau .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--ui);font-style:normal}
.anneau .txt b{display:block;font-size:22px;color:var(--titre)}
.anneau .txt span{font-size:11px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--creux);border:1px solid var(--trait);border-radius:16px;padding:13px}
.stat b{display:block;font-size:24px;color:var(--titre);font-style:normal;font-family:var(--ui);font-weight:750}
.stat span{font-family:var(--ui);font-style:normal;font-size:11.5px;color:var(--ink-3)}
.flamme{font-style:normal}
.defi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--trait)}
.defi:last-child{border-bottom:0}
.defi .em{font-size:22px;font-style:normal;width:34px;text-align:center}
.defi .corps{flex:1}
.defi b{font-size:14px;color:var(--titre)}
.comp{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-family:var(--ui);font-style:normal;font-size:12.5px}
.comp span:last-child{text-align:right;color:var(--ink-2);font-weight:700}

/* ---------- Parcours ---------- */
.niveaux{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
@media (max-width:900px){.niveaux{grid-template-columns:repeat(3,1fr)}}
.niv-b{border:1px solid var(--bord);background:var(--verre);border-radius:18px;padding:14px 12px;text-align:left;transition:.2s;position:relative}
.niv-b:hover{transform:translateY(-2px);border-color:var(--bord-2)}
.niv-b.on{border-color:var(--lilas);box-shadow:var(--lueur);background:var(--verre-2)}
.niv-b.verrou{opacity:.55}
.niv-b b{font-family:var(--ui);font-style:normal;font-size:20px;color:var(--titre);display:block}
.niv-b small{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.niv-b .cad{position:absolute;right:10px;top:10px;font-size:13px;font-style:normal}
.niv-desc{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.niv-desc .gros{font-family:var(--ui);font-style:normal;font-weight:800;font-size:44px;line-height:1;background:var(--plein);-webkit-background-clip:text;background-clip:text;color:transparent}
.unite{margin-top:16px}
.unite-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.unite-t h3{margin:0;font-size:19px}
.chap{border:1px solid var(--trait);background:var(--creux);border-radius:18px;padding:14px;margin-bottom:12px}
.chap-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chap-t h4{font-size:16px}
.lecons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.lecon{border:1px solid var(--bord);background:var(--verre);border-radius:14px;padding:11px 12px;text-align:left;transition:.18s;display:flex;flex-direction:column;gap:3px;min-height:86px}
.lecon:hover:not(:disabled){transform:translateY(-2px);border-color:var(--bord-2);background:var(--verre-2)}
.lecon:disabled{opacity:.45;cursor:default}
.lecon .k{font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lecon b{font-size:13.5px;color:var(--titre);font-family:var(--ui);font-style:normal;font-weight:650}
.lecon .bas{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--ui);font-style:normal;font-size:11.5px;color:var(--ink-3)}
.lecon .et{color:var(--or);letter-spacing:1px}
.lecon.fait{border-color:rgba(127,214,176,.35)}
.lecon.eval{background:linear-gradient(135deg,rgba(142,123,212,.22),rgba(195,155,243,.12))}
.lecon.suivante{box-shadow:var(--lueur);animation:pulse 2.4s ease-in-out infinite}
.pourvous{color:var(--or);font-family:var(--ui);font-style:normal;font-size:11px;font-weight:700}

/* ---------- Lecteur de leçon / exercices ---------- */
.joueur{max-width:760px;margin:0 auto}
.joueur-haut{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.joueur-haut .barre-p{flex:1;height:11px}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.fiche .bloc{background:var(--creux);border:1px solid var(--trait);border-radius:16px;padding:13px}
.fiche .bloc .k{font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.fiche ul{margin:0;padding-left:18px;font-size:14px}
.gram{background:linear-gradient(135deg,rgba(142,123,212,.18),rgba(195,155,243,.08));border:1px solid var(--bord);border-radius:18px;padding:16px;margin:12px 0}
.gram h4{font-size:16px;margin-bottom:6px}
.gram p{margin:0;color:var(--ink-2);font-size:14.5px}
.consigne{font-family:var(--ui);font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.enonce{font-size:23px;color:var(--titre);line-height:1.35;margin:4px 0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.enonce .emo{font-style:normal;font-size:38px}
.options{display:grid;gap:10px}
.options.deux{grid-template-columns:1fr 1fr}
@media (max-width:560px){.options.deux{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--bord);background:var(--verre);border-radius:16px;padding:14px 16px;text-align:left;font-size:15.5px;transition:.16s;display:flex;align-items:center;gap:12px;
  font-family:var(--sans);font-style:italic;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--lilas);transform:translateY(-1px);background:var(--verre-2)}
.opt .n{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:800;background:var(--creux);color:var(--ink-3)}
.opt.emo{font-size:40px;justify-content:center;padding:18px;font-style:normal}
.opt.bon{border-color:var(--bon);background:var(--bon-fond)}
.opt.faux{border-color:var(--doux);background:var(--doux-fond);animation:secoue .35s}
.opt.sel{border-color:var(--lilas);box-shadow:var(--lueur)}
.opt:disabled{cursor:default}
.mots{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:16px;border:1.5px dashed var(--bord-2);margin-bottom:12px}
.mots.banque{border-style:solid;border-color:var(--trait);background:var(--creux)}
.mot{border:1px solid var(--bord);background:var(--verre-2);border-radius:12px;padding:8px 13px;font-size:15.5px;font-family:var(--sans);font-style:italic;color:var(--ink);transition:.15s;animation:pop .2s ease both}
.mot:hover{border-color:var(--lilas)}
.mot.use{opacity:.25;pointer-events:none}
.mot.intrus{border-color:var(--doux);background:var(--doux-fond)}
.mot.juste{border-color:var(--bon);background:var(--bon-fond)}
.paires{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.retour{margin-top:16px;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:pop .25s ease both}
.retour.bon{background:var(--bon-fond);border:1px solid rgba(127,214,176,.4)}
.retour.doux{background:var(--doux-fond);border:1px solid rgba(245,183,168,.4)}
.retour .em{font-size:24px;font-style:normal}
.retour b{display:block;color:var(--titre)}
.retour .sol{font-size:15px;margin-top:3px}
.actions-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.haut-parleur{width:64px;height:64px;border-radius:50%;border:0;background:var(--plein);color:var(--plein-ink);font-size:26px;display:grid;place-items:center;
  box-shadow:0 12px 26px -12px rgba(142,123,212,.95);transition:.2s;flex:none}
.haut-parleur:hover{transform:scale(1.06)}
.haut-parleur.lent{width:46px;height:46px;font-size:18px;background:var(--verre-2);color:var(--ink);border:1px solid var(--bord)}
.micro{width:86px;height:86px;border-radius:50%;border:0;background:var(--plein);color:var(--plein-ink);font-size:34px;display:grid;place-items:center;margin:8px auto;
  box-shadow:0 14px 30px -12px rgba(142,123,212,.95);transition:.2s}
.micro.actif{animation:pulse 1.2s ease-in-out infinite;background:linear-gradient(135deg,#C39BF3,#F3AEC0)}
.ondes{display:flex;gap:4px;justify-content:center;height:28px;align-items:center}
.ondes i{width:4px;border-radius:4px;background:var(--lilas);animation:onde 1s ease-in-out infinite}
.ondes i:nth-child(2){animation-delay:.1s}.ondes i:nth-child(3){animation-delay:.2s}.ondes i:nth-child(4){animation-delay:.3s}.ondes i:nth-child(5){animation-delay:.4s}
@keyframes onde{0%,100%{height:6px}50%{height:26px}}
.saisie{font-family:var(--sans);font-style:italic;font-size:17px}
.enreg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bord);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink-2)}
.enreg:hover{color:var(--titre);border-color:var(--bord-2)}
.enreg.on{color:var(--or);border-color:var(--or)}

/* ---------- Résultats ---------- */
.resultat{text-align:center;position:relative;overflow:hidden;padding:30px 20px}
.note-g{font-family:var(--ui);font-style:normal;font-weight:800;font-size:64px;line-height:1;background:var(--plein);-webkit-background-clip:text;background-clip:text;color:transparent}
.note-g small{font-size:22px}
.apprec{font-size:22px;color:var(--titre);margin:6px 0}
.etoiles{font-size:34px;letter-spacing:6px;color:var(--or);font-style:normal}
.etoiles i{display:inline-block;font-style:normal;animation:etoile-v .6s cubic-bezier(.3,1.5,.5,1) both}
.etoiles i.eteinte{opacity:.22}
@keyframes etoile-v{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
.detail-comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0;text-align:left}
.detail-comp .stat b{font-size:20px}

/* ---------- Animations de réussite ---------- */
.fete{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fete .halo-v{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle, rgba(195,155,243,.55), rgba(142,123,212,.18) 45%, transparent 70%);animation:halo-v 2.2s ease-out both}
@keyframes halo-v{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.fete .part{position:absolute;left:50%;top:42%;font-style:normal;color:#fff;animation:eclat 1.8s cubic-bezier(.15,.7,.3,1) both;text-shadow:0 0 12px rgba(201,183,245,.9)}
@keyframes eclat{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r))}}
.fete .conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:tombe linear both}
@keyframes tombe{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.fete .vague{position:absolute;left:-30%;right:-30%;top:40%;height:160px;background:linear-gradient(90deg,transparent,rgba(201,183,245,.35),transparent);
  filter:blur(20px);animation:vague 1.6s ease-out both}
@keyframes vague{from{transform:translateX(-60%);opacity:0}40%{opacity:1}to{transform:translateX(60%);opacity:0}}
.annonce{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:85;text-align:center;pointer-events:none;animation:annonce 3.2s ease both}
.annonce .etoile-g{font-size:92px;font-style:normal;filter:drop-shadow(0 0 30px rgba(243,210,122,.9));animation:brille 1.6s ease-in-out infinite alternate}
.annonce b{display:block;font-size:26px;color:#fff;text-shadow:0 4px 20px rgba(30,20,70,.8)}
.annonce span{display:block;font-family:var(--ui);font-style:normal;font-size:13px;color:#EDE6FF;margin-top:4px;text-shadow:0 2px 12px rgba(30,20,70,.8)}
:root[data-theme="light"] .annonce b{color:#2A2150;text-shadow:0 2px 16px rgba(255,255,255,.9)}
:root[data-theme="light"] .annonce span{color:#4B4270;text-shadow:none}
@keyframes annonce{0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}
@keyframes brille{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.08) rotate(4deg)}}

/* ---------- Carte céleste ---------- */
.ciel-carte{width:100%;border-radius:18px;background:radial-gradient(900px 500px at 50% 0%, #3A2E86, #1A1540 70%);border:1px solid var(--bord);display:block}
:root[data-theme="light"] .ciel-carte{background:radial-gradient(900px 500px at 50% 0%, #4B3B9E, #221B52 70%)}
.ciel-carte .lien-c{stroke:rgba(201,183,245,.55);stroke-width:1.2}
.ciel-carte .et-off{fill:rgba(255,255,255,.18)}
.ciel-carte .et-on{fill:#fff;filter:drop-shadow(0 0 4px #C9B7F5)}
.ciel-carte .et-neuve{animation:neuve 2.5s ease-in-out infinite}
@keyframes neuve{0%,100%{opacity:1}50%{opacity:.5}}
.ciel-carte text{fill:rgba(237,230,255,.75);font-family:var(--ui);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em}

/* ---------- Lecture & histoires ---------- */
.texte{font-size:18px;line-height:1.8}
.texte .ph{cursor:pointer;border-radius:6px;padding:1px 2px;transition:background .2s}
.texte .ph:hover{background:var(--verre-2)}
.texte .ph.lu{background:linear-gradient(90deg,rgba(142,123,212,.35),rgba(195,155,243,.25));color:var(--titre)}
.texte .gl{border-bottom:2px dotted var(--lilas);cursor:help;font-weight:600}
.trad{display:block;font-size:13.5px;color:var(--ink-3);font-family:var(--ui);font-style:normal;margin:2px 0 8px}
.format{border-radius:18px;padding:20px;background:var(--creux);border:1px solid var(--trait)}
.format.menu{text-align:center;border:2px double var(--bord-2)}
.format.affiche{text-align:center;background:linear-gradient(160deg,rgba(142,123,212,.25),rgba(108,143,224,.15));border:2px solid var(--bord-2)}
.format.mail{font-family:var(--ui);font-style:normal}
.format.mail .entete-m{font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--trait);padding-bottom:8px;margin-bottom:10px}
.bulle-g{position:fixed;z-index:90;max-width:280px;background:var(--fenetre);border:1px solid var(--bord-2);border-radius:14px;padding:11px 13px;box-shadow:var(--ombre);
  font-family:var(--ui);font-style:normal;font-size:13px;animation:pop .15s ease both}
.bulle-g b{display:block;font-size:15px;color:var(--titre);font-family:var(--sans);font-style:italic}
.scene{position:relative;height:190px;border-radius:20px;overflow:hidden;border:1px solid var(--bord);background:linear-gradient(180deg,#2B2270,#5A4AAE 70%,#8C77D6)}
:root[data-theme="light"] .scene{background:linear-gradient(180deg,#8E7BD4,#C3B1F2 70%,#EDE4FF)}
.scene .astre{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#FFF4D0,#F3D27A);top:26px;right:14%;box-shadow:0 0 40px 10px rgba(243,210,122,.45);animation:respire 5s ease-in-out infinite alternate}
.scene .astre.lune{background:radial-gradient(circle at 35% 35%,#FFFFFF,#D9D1F5);box-shadow:0 0 40px 8px rgba(220,210,255,.45)}
@keyframes respire{from{transform:scale(1)}to{transform:scale(1.08)}}
.scene .sol{position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:rgba(28,22,64,.55)}
.scene .vague-s{position:absolute;left:-50%;width:200%;bottom:0;height:46px;background:repeating-radial-gradient(circle at 50% -60%, rgba(255,255,255,.25) 0 2px, transparent 3px 28px);
  animation:mer 9s linear infinite;opacity:.8}
@keyframes mer{from{transform:translateX(0)}to{transform:translateX(25%)}}
.scene .flot{position:absolute;font-style:normal;font-size:28px;animation:derive 7s ease-in-out infinite alternate;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
@keyframes derive{from{transform:translate(0,0) rotate(-5deg)}to{transform:translate(18px,-16px) rotate(6deg)}}
.scene .note-m{position:absolute;bottom:30px;font-style:normal;font-size:22px;color:#fff;animation:note-m 4s ease-in infinite;opacity:0}
@keyframes note-m{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) rotate(20deg)}}
.scene .pt{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:scintille 3s ease-in-out infinite}
.scene .perso{position:absolute;bottom:26px;font-style:normal;font-size:40px;animation:marche 6s ease-in-out infinite alternate}
@keyframes marche{from{transform:translateX(0)}to{transform:translateX(60px)}}
.lecteur{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
.vitesse{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-style:normal;font-size:12.5px;color:var(--ink-2)}
input[type=range]{accent-color:#9B82E8}
.histoire-c{cursor:pointer;transition:.2s;text-align:left;display:flex;flex-direction:column;gap:6px}
.histoire-c:hover{transform:translateY(-3px);background:var(--verre-2)}
.histoire-c .vign{height:86px;border-radius:14px;display:grid;place-items:center;font-size:38px;font-style:normal;background:linear-gradient(160deg,#3A2E86,#7D69CF)}
.coeur{border:0;background:transparent;font-size:20px;padding:4px;font-style:normal}

/* ---------- Tableaux, carnet ---------- */
table.t{width:100%;border-collapse:collapse;font-family:var(--ui);font-style:normal;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--trait)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--trait)}
table.t tr:last-child td{border-bottom:0}
.graph{position:relative}
.graph svg{width:100%;height:auto;display:block;overflow:visible}
.graph .tip{position:absolute;pointer-events:none;background:var(--fenetre);border:1px solid var(--bord-2);border-radius:10px;padding:7px 10px;font-family:var(--ui);font-style:normal;font-size:12px;
  box-shadow:var(--ombre);white-space:nowrap;transform:translate(-50%,-110%)}
.graph .tip b{display:block;font-size:14px;color:var(--titre)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{text-align:center;padding:16px 10px;border-radius:18px;background:var(--creux);border:1px solid var(--trait)}
.badge .med{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-style:normal;
  background:radial-gradient(circle at 35% 30%,#F4ECFF,#B9A5F2 60%,#7F68D2);box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 26px -4px rgba(195,155,243,.8)}
.badge.off .med{background:var(--creux);box-shadow:inset 0 0 0 2px var(--bord);filter:grayscale(1);opacity:.45}
.badge b{display:block;font-size:13.5px;color:var(--titre)}
.badge small{font-family:var(--ui);font-style:normal;font-size:11px;color:var(--ink-3)}

/* ---------- Fenêtres ---------- */
.voile{position:fixed;inset:0;background:var(--voile);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:60;display:grid;place-items:center;padding:16px;animation:pop .2s ease both}
.fenetre{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--fenetre);border:1px solid var(--bord-2);border-radius:24px;padding:22px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.fenetre.large{width:min(960px,100%)}
.fenetre h3{font-size:21px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;background:var(--fenetre);border:1px solid var(--bord-2);border-radius:999px;padding:11px 20px;
  font-family:var(--ui);font-style:normal;font-size:13.5px;box-shadow:var(--ombre);animation:pop .2s ease both}

/* ---------- Accueil initial ---------- */
.onboard{max-width:760px;margin:10px auto}
.etapes{display:flex;gap:6px;margin-bottom:18px}
.etapes i{flex:1;height:5px;border-radius:999px;background:var(--creux)}
.etapes i.on{background:var(--plein)}
.onboard .gros-titre{font-size:30px;letter-spacing:-.02em;margin-bottom:4px}

/* ---------- Attestation ---------- */
.attest{position:relative;background:#FFFDF8;color:#2A2344;border-radius:6px;padding:46px 54px;aspect-ratio:1.414/1;width:100%;max-width:900px;margin:0 auto;
  font-family:Georgia,serif;font-style:normal;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.attest::before{content:'';position:absolute;inset:14px;border:1.5px solid #B9A5F2;border-radius:4px;pointer-events:none}
.attest::after{content:'';position:absolute;inset:20px;border:.5px solid #D8CCF7;border-radius:2px;pointer-events:none}
.attest .fili{position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(185,165,242,.28),transparent 68%)}
.attest .haut{display:flex;justify-content:space-between;align-items:center}
.attest .haut .m{display:flex;align-items:center;gap:10px;font-size:20px;font-style:italic}
.attest .haut svg{width:44px;height:44px;border-radius:14px}
.attest .num{font-family:var(--mono);font-size:11px;color:#6F6690}
.attest h2{color:#2A2344;text-align:center;font-size:34px;letter-spacing:.02em;margin:26px 0 4px;font-weight:400}
.attest .sous{text-align:center;font-family:var(--ui);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7257CF}
.attest .qui{text-align:center;font-size:15px;margin-top:20px;color:#4A4266}
.attest .nom{text-align:center;font-size:40px;font-style:italic;color:#3E2E8F;margin:6px 0}
.attest .quoi{text-align:center;font-size:15px;color:#4A4266;max-width:600px;margin:0 auto}
.attest .quoi b{color:#2A2344}
.attest .bas{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:20px}
.attest .bas .col{font-size:12px;color:#4A4266;font-family:var(--ui)}
.attest .bas .col b{display:block;font-family:Georgia,serif;font-size:15px;color:#2A2344}
.attest .sceau{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--ui);font-weight:800;font-size:22px;line-height:1;
  background:radial-gradient(circle at 35% 30%,#C9B7F5,#7257CF 70%);box-shadow:0 0 0 4px #fff,0 0 0 5.5px #B9A5F2}
.attest .sceau small{display:block;font-size:8px;letter-spacing:.14em;font-weight:700;margin-top:3px}
.attest .mention{position:absolute;left:54px;right:54px;bottom:30px;text-align:center;font-family:var(--ui);font-size:9.5px;color:#7A7295;line-height:1.4}
.attest .apercu{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--ui);font-weight:800;font-size:90px;letter-spacing:.2em;color:rgba(114,87,207,.1);transform:rotate(-18deg)}
.attest .comp-l{font-family:var(--ui);font-size:11px;color:#6F6690;text-align:center;margin-top:8px}
@media (max-width:700px){.attest{padding:26px 22px;aspect-ratio:auto}.attest h2{font-size:24px}.attest .nom{font-size:28px}.attest .mention{position:static;margin-top:14px}}

@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff!important}
  body *{visibility:hidden}
  .fond,.nav,.entete,.toast{display:none!important}
  #impression, #impression *{visibility:visible}
  #impression{position:fixed;inset:0;display:grid!important;place-items:center;background:#fff}
  #impression .attest{box-shadow:none;width:297mm;max-width:none;height:210mm;aspect-ratio:auto;border-radius:0}
}
#impression{display:none}

    ["Sa musique mêlait la douleur de l'histoire et la joie farouche d'être encore debout.","His music blended the pain of history with the fierce joy of still standing.","Su música mezclaba el dolor de la historia con la alegría feroz de seguir en pie.","Seine Musik verband den Schmerz der Geschichte mit der wilden Freude, noch aufrecht zu stehen.","Mizik li té ka mélanjé doulè listwa épi lajwa rèd rété doubout.","Mizik a'y té ka mélanjé doulè listwa èvè lajwa rèd rété doubout."],
    ["Lorsqu'il est tombé malade, beaucoup ont craint que cette tradition ne disparaisse avec lui.","When he fell ill, many feared this tradition would disappear with him.","Cuando enfermó, muchos temieron que esta tradición desapareciera con él.","Als er krank wurde, befürchteten viele, diese Tradition würde mit ihm verschwinden.","Lè i tonbé malad, anlo moun té pè tradisyon tala disparèt épi'y.","Lè i tonbé malad, anpil moun té pè tradisyon tala disparèt èvè'y."],

 { id:'h8', niv:'C2', themes:['culture'], em:'📚', scene:'nuit', titre:['Le traducteur','The translator','El traductor','Der Übersetzer','Tradiktè a','Tradiktè la'],
   ph:[
    ["Pendant quarante ans, Armand avait traduit des romans sans que son nom figure jamais sur la couverture.","For forty years, Armand had translated novels without his name ever appearing on the cover.","Durante cuarenta años, Armand había traducido novelas sin que su nombre figurara nunca en la portada.","Vierzig Jahre lang hatte Armand Romane übersetzt, ohne dass sein Name je auf dem Umschlag stand.","Pannan karant lanné, Armand té ka tradui liv san non'y pa janmen parèt asou kouvèti a.","Pannan karant lanné, Armand té ka tradui liv san non a'y pa janmen parèt asi kouvèti la."],
    ["Il se considérait comme un passeur, un artisan de l'ombre au service de la voix d'un autre.","He saw himself as a go-between, a craftsman in the shadows serving someone else's voice.","Se consideraba un mediador, un artesano en la sombra al servicio de la voz de otro.","Er sah sich als Vermittler, als Handwerker im Schatten, im Dienst der Stimme eines anderen.","I té ka wè kò'y kon an pasè, an travayè lonbraj ki ka sèvi vwa an lòt moun.","I té ka wè kò a'y kon on pasè, on travayè lonbraj ki ka sèvi vwa on dòt moun."],
    ["Un jour, une lectrice lui a écrit qu'un livre l'avait aidée à traverser un deuil.","One day, a reader wrote to tell him that a book had helped her through a bereavement.","Un día, una lectora le escribió que un libro la había ayudado a superar un duelo.","Eines Tages schrieb ihm eine Leserin, ein Buch habe ihr über einen Trauerfall hinweggeholfen.","An jou, an lektris ékri'y pou di'y an liv té édé'y lè i té pèd an moun i té enmé.","On jou, on lektris ékri'y pou di'y on liv té édé'y lè i té pèd on moun i té enmé."],
    ["Elle ignorait qu'il en était le traducteur ; elle remerciait simplement l'auteur.","She had no idea he was its translator; she was simply thanking the author.","Ignoraba que él era el traductor; simplemente daba las gracias al autor.","Sie wusste nicht, dass er der Übersetzer war; sie dankte einfach dem Autor.","I pa té sav sé li ki té tradui'y ; i té ka di otè a mèsi, sèlman.","I pa té sav sé li ki té tradui'y ; i té ka di otè la mèsi, sèlman."],
    ["Armand a relu cette lettre longtemps, partagé entre l'effacement et une fierté inattendue.","Armand reread the letter for a long time, torn between self-effacement and unexpected pride.","Armand releyó esa carta durante mucho tiempo, dividido entre el anonimato y un orgullo inesperado.","Armand las den Brief lange immer wieder, hin- und hergerissen zwischen Zurückhaltung und unerwartetem Stolz.","Armand rili lèt la lontan, fann ant rété an lonbraj é an fièté i pa té ka atann.","Armand rili lèt la lontan, fann ant rété an lonbraj é on fièté i pa té ka atann."],
    ["Il a fini par comprendre que les mots qui consolent n'appartiennent à personne.","He finally understood that words that console belong to no one.","Acabó comprendiendo que las palabras que consuelan no pertenecen a nadie.","Schließlich verstand er, dass tröstende Worte niemandem gehören.","I fini pa konprann ki mo ki ka konsolé pa ta pèsonn.","I fini pa konprann ki mo ki ka konsolé pa ta pèsonn."],
    ["Et, pour la première fois, il a répondu en signant : « Celui qui a porté ces mots jusqu'à vous. »","And, for the first time, he replied, signing: “The one who carried these words to you.”","Y, por primera vez, respondió firmando: «El que llevó estas palabras hasta usted.»","Und zum ersten Mal antwortete er und unterschrieb: „Der, der diese Worte zu Ihnen getragen hat.“","É, pou prémyé fwa, i réponn é i siyé : « Sa ki pòté sé mo tala ba'w. »","É, pou prèmyé fwa, i réponn é i siyé : « Sa ki pòté sé mo tala ba'w. »"]],

const hasard = a => a[Math.floor(Math.random() * a.length)];

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];

/* ---------- Plusieurs profils sur le même ordinateur ----------
   REG (naolang.profils) : la liste des profils et celui qui est ouvert.
   Chaque profil garde toutes ses données dans sa propre case : naolang.p.<id>. */
const CLE_REG = 'naolang.profils', CLE_P = id => 'naolang.p.' + id;

    resumeProfil(REG.liste.find(x => x.id === REG.actif), S); ecrireReg();

}
(function demarrerProfils() {
  try { const r = JSON.parse(localStorage.getItem(CLE_REG)); if (r && Array.isArray(r.liste)) REG = r; } catch (e) {}

  const actif = REG.liste.find(x => x.id === REG.actif) || REG.liste[0];

  const p = S.profil; if (!p) return;
  for (const k of Object.keys(S.cours)) if (k.includes('>')) {           // anciennes clés « fr>en »

/* ---------- Voix : synthèse et micro ---------- */
let VOIX = [];
function chargerVoix() { try { VOIX = speechSynthesis.getVoices() || []; } catch (e) { VOIX = []; } }

function voixPour(code) {
  const pre = code.slice(0, 2).toLowerCase();
  const cands = VOIX.filter(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(pre));
  return cands.find(v => v.lang.replace('_', '-') === code && /natural|neural|online/i.test(v.name))
      || cands.find(v => /natural|neural|online|google/i.test(v.name)) || cands.find(v => v.lang.replace('_', '-') === code) || cands[0];
}
let parleEnCours = null;
function parler(texte, lang, o = {}) {
  if (!('speechSynthesis' in window)) { toast('La lecture à voix haute n\'est pas disponible dans ce navigateur.'); o.fin && o.fin(); return; }
  speechSynthesis.cancel();
  const L = langue(lang);
  const u = new SpeechSynthesisUtterance(String(texte).replace(/[«»“”„]/g, ''));
  u.lang = L.voix; const v = voixPour(L.voix); if (v) u.voice = v;
  u.rate = (o.vitesse || 1) * (L.creole ? .9 : 1);
  u.onend = () => { if (parleEnCours === u) parleEnCours = null; o.fin && o.fin(); };
  u.onerror = () => { o.fin && o.fin(); };

}

    return `<div class="carte joueur" style="text-align:center">
      <div style="font-size:54px;font-style:normal">🌟</div><h2 style="font-size:25px">${esc(J.titre.replace('🌟 ', ''))}</h2>
      <p class="muet">${J.exos.length} questions · vocabulaire, grammaire, compréhension écrite et orale, expression écrite et orale.<br>
      Seuil de réussite : ${SEUILS[e.portee]}/100. Prenez votre temps : il n'y a pas de chronomètre.</p>
      ${prev ? `<p><span class="puce ${prev.reussi ? 'ok' : ''}">Dernière tentative : ${prev.note}/100</span></p>` : ''}
      ${prev && !prev.reussi && !prev.revisionFaite ? `<div class="gram" style="text-align:left"><h4>🌱 Conseil</h4><p>Le parcours de révision préparé après votre dernière tentative vous aidera à aborder l'évaluation plus sereinement.</p>
        <button class="btn mini" style="margin-top:8px" data-act="revisionEval" data-id="${e.id}">Faire le parcours de révision</button></div>` : ''}
      <div class="actions-bas" style="justify-content:center"><button class="btn" data-act="quitter">Plus tard</button><button class="btn plein grand" data-act="commencer">Commencer l'évaluation</button></div></div>`;
  }
  return '';
}

function vueJoueur() {
  if (!J) return '';
  if (!J.commence) return introHTML();
  if (J.i >= J.exos.length) return resultatHTML();
  const ex = J.exos[J.i];
  return `<div class="joueur">
    <div class="joueur-haut"><button class="rond" data-act="quitter" title="Quitter">✕</button>
      <div class="barre-p"><i style="width:${Math.round(100 * J.i / J.exos.length)}%"></i></div>
      <span class="muet ui">${J.i + 1} / ${J.exos.length}</span></div>
    <div class="carte" id="exo">${exHTML(ex)}</div></div>`;
}

function exHTML(ex) {
  const audio = ex.audio ? `<div class="ligne">${hp(ex.audio, tgt())}${hp(ex.audio, tgt(), true)}</div>` : '';
  const texte = ex.texte ? `<div class="format" style="margin-bottom:14px;font-size:15.5px;max-height:220px;overflow:auto">${esc(ex.texte)}</div>` : '';
  let corps = '';
  const titre = `<div class="consigne">${esc(ex.consigne)}</div>${texte}<div class="enonce">${audio}${ex.enonce ? `<span>${ex.enonce}</span>` : ''}</div>${ex.sous && ex.type !== 'choix' ? `<p class="muet" style="margin:-10px 0 14px">${esc(ex.sous)}</p>` : ''}`;
  if (ex.type === 'choix') {
    corps = `${ex.sous && !ex.deux ? `<p class="muet" style="margin:-10px 0 14px">${esc(ex.sous)}</p>` : ''}<div class="options ${ex.emo || ex.deux ? 'deux' : ''}">${ex.opts.map((o, i) => `<button class="opt ${ex.emo ? 'emo' : ''} ${o.cls || ''}" data-act="opt" data-i="${i}" ${J.rep ? 'disabled' : ''}>${ex.emo ? o.t : `<span class="n">${i + 1}</span>${esc(o.t)}`}</button>`).join('')}</div>`;
  } else if (ex.type === 'ordre') {
    corps = `<div class="mots" id="zone">${ex.sel.map((b, k) => `<button class="mot ${ex.cls || ''}" data-act="motRetire" data-k="${k}" ${J.rep ? 'disabled' : ''}>${esc(b.t)}</button>`).join('') || '<span class="muet">Touchez les mots dans l\'ordre…</span>'}</div>
      <div class="mots banque">${ex.banque.map((b, k) => `<button class="mot ${ex.sel.includes(b) ? 'use' : ''}" data-act="mot" data-k="${k}" ${J.rep ? 'disabled' : ''}>${esc(b.t)}</button>`).join('')}</div>
      ${J.rep ? '' : `<div class="actions-bas"><span></span><button class="btn plein" data-act="verifier" ${ex.sel.length === ex.banque.length ? '' : 'disabled'}>Vérifier</button></div>`}`;
  } else if (ex.type === 'corriger') {
    corps = `<div class="mots banque" style="font-size:18px">${ex.mots.map((m, i) => `<button class="mot ${J.rep && i === ex.faux ? 'intrus' : ''} ${J.rep && i === ex.choisi && i !== ex.faux ? 'juste' : ''}" data-act="intrus" data-i="${i}" ${J.rep ? 'disabled' : ''}>${esc(m)}</button>`).join('')}</div>`;
  } else if (ex.type === 'saisie') {
    corps = `<input class="champ saisie" id="saisie" autocomplete="off" spellcheck="false" placeholder="Votre réponse…" ${J.rep ? 'disabled' : ''} value="${esc(ex.val || '')}">
      ${J.rep ? '' : `<div class="actions-bas"><span class="muet petit">Les accents comptent un peu, la ponctuation pas du tout.</span><button class="btn plein" data-act="verifier">Vérifier</button></div>`}`;
  } else if (ex.type === 'oral') {
    const dispo = !!SR;
    corps = `<p class="muet" style="margin:-8px 0 8px">${esc(ex.sous)}</p>
      <div style="text-align:center">
        ${dispo ? `<button class="micro ${ex.ecoute ? 'actif' : ''}" data-act="micro" ${J.rep ? 'disabled' : ''} title="Parler">🎙️</button>
          <div class="muet petit">${ex.ecoute ? 'Je vous écoute… parlez naturellement.' : 'Touchez le micro, puis lisez la phrase.'}</div>
          ${ex.ecoute ? '<div class="ondes"><i></i><i></i><i></i><i></i><i></i></div>' : ''}
          ${ex.entendu ? `<p class="petit" style="margin-top:8px">J'ai entendu : « <b>${esc(ex.entendu)}</b> »</p>` : ''}
          ${!J.rep ? `<p class="muet petit" style="margin-top:10px">Pas de micro sous la main ? <a href="#" data-act="sansMicro">Je l'ai dit à voix haute</a></p>` : ''}`
        : `<p class="muet">La reconnaissance vocale n'est pas disponible dans ce navigateur (elle fonctionne dans Chrome et Edge). Écoutez le modèle, dites la phrase à voix haute, puis évaluez-vous.</p>`}
        ${(!dispo || ex.sansMicro) && !J.rep ? `<div class="ligne" style="justify-content:center;margin-top:12px">
          <button class="btn" data-act="auto" data-s="1">😊 C'était fluide</button><button class="btn" data-act="auto" data-s=".75">🙂 Presque</button><button class="btn" data-act="auto" data-s=".5">🌱 À retravailler</button></div>` : ''}
      </div>`;
  } else if (ex.type === 'paires') {
    const col = (arr, c) => arr.map((x, i) => `<button class="opt ${ex.faits.includes(x.id) ? 'bon' : ''} ${(c === 'g' ? ex.selG : ex.selD) === i ? 'sel' : ''} ${ex.flash && ex.flash[c] === i ? 'faux' : ''}"
      data-act="paire" data-c="${c}" data-i="${i}" ${ex.faits.includes(x.id) || J.rep ? 'disabled' : ''}>${esc(x.t)}</button>`).join('');
    corps = `<div class="paires"><div class="options">${col(ex.g, 'g')}</div><div class="options">${col(ex.d, 'd')}</div></div>`;
  } else if (ex.type === 'redaction') {
    corps = `${ex.motsCles.length ? `<p class="muet">Essayez d'utiliser : ${ex.motsCles.map(m => `<span class="puce">${esc(m)}</span>`).join(' ')}</p>` : ''}
      <textarea class="champ" id="redac" placeholder="Écrivez ici, à votre rythme…" ${J.rep ? 'disabled' : ''}>${esc(ex.val || '')}</textarea>
      <div class="ligne" style="justify-content:space-between;margin-top:8px"><span class="muet petit" id="compte">${mots(ex.val || '').length} mot(s) · objectif : ${ex.min} mots environ</span>
      ${J.rep ? '' : `<button class="btn plein" data-act="verifier">Terminer ma rédaction</button>`}</div>`;
  } else if (ex.type === 'carte') {
    corps = `<div style="text-align:center;padding:10px 0"><div class="enonce" style="justify-content:center">${esc(ex.c.recto)}</div>
      ${ex.vu ? `<div class="format" style="font-size:18px">${esc(ex.c.verso)}</div>` : `<button class="btn plein" data-act="retourner">Retourner la carte</button>`}
      ${ex.vu && !J.rep ? `<div class="ligne" style="justify-content:center;margin-top:14px"><button class="btn" data-act="auto" data-s="1">😊 Je savais</button><button class="btn" data-act="auto" data-s=".6">🤔 Hésitation</button><button class="btn" data-act="auto" data-s="0">🌱 À revoir</button></div>` : ''}</div>`;
  }
  return titre + corps + (J.rep ? retourHTML(ex) : '');
}

const BRAVO = ['Très bien !', 'Parfait ✨', 'Bravo, c\'est juste.', 'Exactement !', 'Joli !', 'C\'est ça !'];
const DOUX = ['Presque ! Voici la bonne réponse :', 'On y est presque. La réponse attendue :', 'Pas tout à fait — retenez plutôt :'];
function retourHTML(ex) {
  const r = J.dernier; const bon = r.score >= .7;
  const sol = ex.sol ? `<div class="sol"><b style="display:inline">${esc(T(ex.sol))}</b> <span class="muet">— ${esc(SRC(ex.sol))}</span></div>${autresMat().length ? `<div>${tradsSup(ex.sol)}</div>` : ''}
    <div class="ligne" style="margin-top:6px">${mini(T(ex.sol), tgt())}${btnEnreg(ex.sol.id)}</div>` : ex.solTxt ? `<div class="sol"><b style="display:inline">${esc(ex.solTxt)}</b></div>` : '';
  return `<div class="retour ${bon ? 'bon' : 'doux'}"><span class="em">${bon ? '🌟' : '🌱'}</span><div style="flex:1">
    <b>${esc(r.msg || (bon ? hasard(BRAVO) : hasard(DOUX)))}</b>${r.detail ? `<div class="petit" style="margin-top:3px">${r.detail}</div>` : ''}
    ${(!bon || ex.type === 'oral' || ex.type === 'saisie' || ex.type === 'ordre' || ex.type === 'corriger') ? sol : ''}
    ${!bon && ex.ids.length ? '<div class="muet petit" style="margin-top:6px">Pas d\'inquiétude : cette phrase reviendra un peu plus souvent dans vos révisions.</div>' : ''}</div></div>
    <div class="actions-bas"><span></span><button class="btn plein grand" data-act="suivant" id="b-suivant">${J.i + 1 >= J.exos.length ? 'Voir mon résultat' : 'Continuer'} →</button></div>`;
}

function repondre(score, msg, detail) {
  const ex = J.exos[J.i];
  J.rep = true; J.dernier = { score, msg, detail };
  const now = Date.now(); ajouterTemps((now - J.tLast) / 1000); J.tLast = now;
  J.res.push({ skill:ex.skill, score, ids:ex.ids, gkey:ex.gkey });
  if (J.kind !== 'test') {
    if (ex.type === 'paires') ex.ids.forEach(id => srsMaj(id, !(ex.rates || []).includes(id)));
    else ex.ids.forEach(id => srsMaj(id, score >= .7));
    if (ex.gkey && score < .7) S.erreurs[ex.gkey] = (S.erreurs[ex.gkey] || 0) + 1;
    if (ex.type === 'oral' && score >= .7) S.compteurs.oral++;
  }
  sauver();
  $('#exo').innerHTML = exHTML(ex);
  if (ex.sol && score < .7 && ex.type !== 'oral') parler(T(ex.sol), tgt());
  else if (ex.direTgt && score >= .7) parler(T(ex.sol), tgt());
  const b = $('#b-suivant'); b && b.focus({ preventScroll:true });
}

function rafraichirExo() { const ex = J.exos[J.i]; $('#exo').innerHTML = exHTML(ex); }

/* Réponses aux différents types */
const REP = {
  opt(i) { const ex = J.exos[J.i]; if (J.rep) return; const o = ex.opts[i];
    ex.opts.forEach(x => { x.cls = x.ok ? 'bon' : ''; }); if (!o.ok) o.cls = 'faux';
    repondre(o.ok ? 1 : 0); },
  mot(k) { const ex = J.exos[J.i]; const b = ex.banque[k]; if (ex.sel.includes(b)) return; ex.sel.push(b); rafraichirExo(); },
  motRetire(k) { const ex = J.exos[J.i]; ex.sel.splice(k, 1); rafraichirExo(); },
  intrus(i) { const ex = J.exos[J.i]; ex.choisi = i; repondre(i === ex.faux ? 1 : 0, i === ex.faux ? 'Bien vu ! C\'était l\'intrus.' : null,
    i === ex.faux ? '' : `L'intrus était « ${esc(ex.mots[ex.faux])} ».`); },
  verifier() {
    const ex = J.exos[J.i];
    if (ex.type === 'ordre') {
      const ok = ex.sel.map(b => b.t).join(' ') === T(ex.sol);
      const presque = !ok && simil(ex.sel.map(b => b.t).join(' '), T(ex.sol)) > .8;
      ex.cls = ok ? 'juste' : '';
      repondre(ok ? 1 : presque ? .5 : 0, ok ? hasard(BRAVO) : presque ? 'Presque : juste un mot à déplacer.' : null);
    } else if (ex.type === 'saisie') {
      const v = ($('#saisie').value || '').trim(); ex.val = v; if (!v) { toast('Écrivez votre réponse, même approximative 🙂'); return; }
      const exact = normAcc(v) === normAcc(ex.attendu), sansAcc = norm(v) === norm(ex.attendu), s = simil(v, ex.attendu);
      if (exact) repondre(1);
      else if (sansAcc) repondre(.9, 'Très bien ! Attention juste aux accents.');
      else if (s >= .85) repondre(.8, 'Presque parfait — une petite coquille.', `Vous avez écrit : « ${esc(v)} »`);
      else if (s >= .6) repondre(.5, 'Bonne base ! Comparez avec la réponse :', `Vous avez écrit : « ${esc(v)} »`);
      else repondre(0, null, `Vous avez écrit : « ${esc(v)} »`);
    } else if (ex.type === 'redaction') {
      const v = ($('#redac').value || '').trim(); ex.val = v; const n = mots(v).length;
      if (n < 2) { toast('Écrivez au moins une petite phrase 🙂'); return; }
      const toks = new Set(mots(norm(v)));
      const utilises = ex.motsCles.filter(m => mots(norm(m)).some(w => w.length >= 3 && toks.has(w)));
      const phrases = v.split(/[.!?]+/).filter(p => p.trim()).length;
      const score = Math.min(1, .4 + .4 * Math.min(1, n / ex.min) + .2 * Math.min(1, (utilises.length + (phrases >= 2 ? 1 : 0)) / 2));
      const pts = [`✍️ ${n} mot(s) écrits${n >= ex.min ? ' — objectif atteint' : ` — objectif : ${ex.min}, vous y êtes presque`}`,
        `🧩 ${phrases} phrase(s)`, ex.motsCles.length ? `📘 Mots de la leçon réutilisés : ${utilises.length ? utilises.map(esc).join(', ') : 'aucun pour cette fois'}` : ''].filter(Boolean);
      repondre(score, score >= .85 ? 'Belle rédaction, bravo !' : score >= .6 ? 'Bon travail, votre texte avance bien.' : 'Merci pour cet essai : chaque phrase écrite compte.',
        pts.join('<br>') + '<br><span class="muet">Astuce : relisez-vous à voix haute, cela aide à repérer les tournures naturelles.</span>');
    }
  },
  paire(c, i) {
    const ex = J.exos[J.i]; ex.flash = null;
    if (c === 'g') ex.selG = i; else ex.selD = i;
    if (ex.selG != null && ex.selD != null) {
      const a = ex.g[ex.selG], b = ex.d[ex.selD];
      if (a.id === b.id) { ex.faits.push(a.id); }
      else { ex.erreurs++; ex.rates = [...(ex.rates || []), a.id]; ex.flash = { g:ex.selG, d:ex.selD }; }
      ex.selG = ex.selD = null;
      if (ex.faits.length === ex.g.length) { repondre(Math.max(.4, 1 - ex.erreurs * .15), ex.erreurs ? 'Toutes les paires sont trouvées 🌟' : 'Sans une seule erreur, bravo !'); return; }
    }
    rafraichirExo();
  },
  auto(s) { const ex = J.exos[J.i]; s = +s;
    if (ex.type === 'carte') { ex.ids.forEach(id => srsMaj(id, s >= .6)); J.res.push({ skill:'voc', score:s, ids:[] }); J.rep = true; J.dernier = { score:s, msg:s >= .6 ? 'Noté !' : 'Pas de souci, cette carte reviendra bientôt.' };
      S.compteurs.revus++; sauver(); rafraichirExo(); return; }
    repondre(s, s >= 1 ? 'Superbe, continuez comme ça !' : s >= .75 ? 'Très bien, c\'est en bonne voie.' : 'Merci d\'avoir osé : c\'est comme ça qu\'on progresse 🌱',
      'Réécoutez le modèle et comparez avec votre voix : l\'oreille progresse autant que la bouche.'); },
};

/* Le micro : retour bienveillant sur la prononciation */
let RECO = null;
function micro() {
  const ex = J.exos[J.i]; if (!SR) return;
  if (ex.ecoute) { try { RECO && RECO.stop(); } catch (e) {} return; }
  speechSynthesis && speechSynthesis.cancel();
  const r = new SR(); RECO = r;
  r.lang = langue(tgt()).voix; r.interimResults = false; r.maxAlternatives = 4;
  ex.ecoute = true; ex.entendu = ''; rafraichirExo();
  r.onresult = e => {
    const alts = [...e.results[0]].map(a => a.transcript);
    let best = 0, dit = alts[0] || '';
    alts.forEach(a => { const s = simil(a, ex.attendu); if (s > best) { best = s; dit = a; } });
    if (langue(tgt()).creole) best = Math.min(1, best / .8);
    ex.entendu = dit; ex.essais++;
    const att = mots(norm(ex.attendu)), eu = new Set(mots(norm(dit)));
    const manque = att.filter(w => !eu.has(w));
    if (best >= .85) repondre(1, 'Superbe prononciation ✨', 'On vous comprend parfaitement.');
    else if (best >= .6) repondre(.8, 'Très bien ! Encore un petit effort sur quelques sons.', manque.length ? `À peaufiner : ${manque.slice(0, 4).map(w => `<b>${esc(w)}</b>`).join(', ')}` : '');
    else if (ex.essais < 3) { ex.ecoute = false; rafraichirExo(); toast(best >= .35 ? 'Bel essai ! Réécoutez le modèle puis réessayez 🌱' : 'Le micro a eu du mal à vous entendre : réessayez tranquillement 🌱'); }
    else repondre(.5, 'Merci d\'avoir persévéré 🌱', 'Réécoutez le modèle lentement (🐢) : la prochaine fois sera plus facile.' + (langue(tgt()).creole ? '<br><span class="muet">La reconnaissance vocale ne connaît pas encore le créole : elle entend du français, ce qui la rend plus sévère qu\'elle ne devrait.</span>' : ''));
  };
  r.onerror = e => {
    ex.ecoute = false;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { ex.sansMicro = true; toast('Le micro n\'est pas autorisé : vous pouvez vous auto-évaluer.'); }
    else if (e.error === 'no-speech') toast('Je n\'ai rien entendu : touchez le micro et parlez 🙂');
    else if (e.error === 'network') { ex.sansMicro = true; toast('La reconnaissance vocale a besoin d\'une connexion Internet : auto-évaluation proposée.'); }
    if (!J.rep) rafraichirExo();
  };
  r.onend = () => { if (ex.ecoute && !J.rep) { ex.ecoute = false; rafraichirExo(); } };
  try { r.start(); } catch (e) { ex.ecoute = false; ex.sansMicro = true; rafraichirExo(); }
}

function suivant() {
  if (!J.rep) return;
  J.rep = false; J.i++;
  if (J.kind === 'test') testAvance();
  if (J.i >= J.exos.length) terminer();
  rendre();
  const ex = J.exos[J.i];
  if (ex && ex.auto && ex.audio) setTimeout(() => parler(ex.audio, tgt()), 350);
  if (ex && ex.type === 'saisie') setTimeout(() => { const s = $('#saisie'); s && s.focus(); }, 60);
}
</script>
<script>
/* ============================================================
   Fin d'une séance : note, appréciation, étoiles, célébration
   ============================================================ */
function detailComp(res) {
  const c = {};
  res.forEach(r => { c[r.skill] = c[r.skill] || [0, 0]; c[r.skill][0] += r.score; c[r.skill][1]++; });
  return c;
}
function terminer() {
  const res = J.res, note = res.length ? Math.round(100 * res.reduce((s, r) => s + r.score, 0) / res.length) : 0;
  const comp = detailComp(res);
  J.note = note; J.comp = comp;
  ajouterTemps((Date.now() - J.tLast) / 1000);
  if (J.kind === 'test') return;
  const base = { d:jour(), tgt:tgt(), src:src(), note, comp, min:Math.round((Date.now() - J.t0) / 60000) };
  const c = cours();
  if (J.kind === 'lecon') {
    const prev = c.lecons[J.id];
    c.lecons[J.id] = { note:Math.max(note, prev ? prev.note : 0), derniere:note, date:jour(), etoiles:Math.max(etoilesDe(note), prev ? prev.etoiles : 0), n:(prev ? prev.n : 0) + 1 };
    S.historique.push({ ...base, t:'lecon', id:J.id, type:J.etape.type, niv:J.etape.niv });
    feter(note >= 50 ? 'lecon' : 'doux');
  } else if (J.kind === 'eval') {
    const e = J.etape, ok = note >= SEUILS[e.portee], prev = c.evals[e.id];
    const rates = [...new Set(res.filter(r => r.score < .7).flatMap(r => r.ids))];
    c.evals[e.id] = { note:Math.max(note, prev && prev.reussi ? prev.note : 0), derniere:note, reussi:ok || !!(prev && prev.reussi), date:jour(), detail:comp,
      essais:(prev ? prev.essais : 0) + 1, rates, revisionFaite:false, gkeys:[...new Set(res.filter(r => r.score < .7 && r.gkey).map(r => r.gkey))] };
    S.historique.push({ ...base, t:'eval', id:e.id, portee:e.portee, niv:e.niv, reussi:ok });
    if (ok) {
      if (e.portee === 'chap') { S.nouvelleEtoile = e.chap; feter('chapitre'); }
      else if (e.portee === 'unit') feter('unite');
      else {
        const nonValidees = PARCOURS[e.niv].filter(u => !(c.evals[u.id + '-ev'] && c.evals[u.id + '-ev'].reussi));
        if (!nonValidees.length && !c.attestations.some(a => a.niv === e.niv)) creerAttestation(e.niv, note, comp);
        feter('niveau');
      }
    } else feter('doux');
  } else if (J.kind === 'revision') {
    S.historique.push({ ...base, t:'revision', n:res.length });
    if (J.evalId && c.evals[J.evalId]) c.evals[J.evalId].revisionFaite = true;
    feter(note >= 50 ? 'lecon' : 'doux');
  } else if (J.kind === 'histoire') {
    S.histoires[J.id] = { ...(S.histoires[J.id] || {}), ecoutee:true, note:Math.max(note, (S.histoires[J.id] || {}).note || 0), date:jour() };
    S.historique.push({ ...base, t:'histoire', id:J.id });
    feter('lecon');
  } else if (J.kind === 'lecture') {
    S.lectures[J.id] = { note:Math.max(note, (S.lectures[J.id] || {}).note || 0), date:jour() };
    S.historique.push({ ...base, t:'lecture', id:J.id });
    feter('lecon');
  } else {
    S.historique.push({ ...base, t:'pratique' });
  }
  verifierBadges(); sauver();
}

function resultatHTML() {

/* ---------- Animations douces ---------- */
function feter(type) {
  const f = document.createElement('div'); f.className = 'fete';
  if (type === 'doux') { f.innerHTML = '<div class="vague"></div>'; }
  else {
    let h = '<div class="halo-v"></div><div class="vague"></div>';
    const n = type === 'lecon' ? 14 : 22;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      h += `<i class="part" style="--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--r:${Math.random() * 180}deg;font-size:${10 + Math.random() * 16}px;animation-delay:${Math.random() * .3}s">${hasard(['✦', '★', '✧', '·', '✦'])}</i>`;
    }
    if (type === 'niveau' || type === 'unite') {
      const cols = ['#C9B7F5', '#FFFFFF', '#8E7BD4', '#F3D27A', '#B8A4F6'];
      for (let i = 0; i < 46; i++) h += `<i class="conf" style="left:${Math.random() * 100}%;background:${hasard(cols)};animation-duration:${2.4 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s;transform:rotate(${Math.random() * 90}deg)"></i>`;
    }
    f.innerHTML = h;
    if (type !== 'lecon') {
      const a = document.createElement('div'); a.className = 'annonce';
      a.innerHTML = type === 'chapitre' ? '<div class="etoile-g">⭐</div><b>Une nouvelle étoile s\'allume</b><span>Votre carte céleste s\'agrandit</span>'
        : type === 'unite' ? '<div class="etoile-g">✨</div><b>Unité validée</b><span>Une constellation prend forme</span>'
        : '<div class="etoile-g">🌟</div><b>Niveau réussi</b><span>Un nouveau ciel s\'ouvre à vous</span>';
      document.body.appendChild(a); setTimeout(() => a.remove(), 3300);
    }
  }
  document.body.appendChild(f); setTimeout(() => f.remove(), 5000);
}

}

function imprimerAttestation(a) {

function telechargerAttestation(a) {
  const css = [...document.styleSheets[0].cssRules].map(r => r.cssText).filter(t => /\.attest|:root|@page/.test(t) && !/@media print/.test(t)).join('\n');
  const defs = document.querySelector('svg defs').outerHTML;
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Attestation NaoLang ${a.niv} — ${esc(a.prenom)}</title>

/* ---------- Révisions ---------- */
function exoRevision(k) {
  if (k.startsWith('c:')) { const c = S.cartes.find(x => 'c:' + x.id === k); return c ? EX.carte(c) : null; }
  const it = ITEMS[k.slice(tgt().length + 1)]; if (!it) return null;
  const e = S.srs[k] || { b:0 };
  const f = e.b <= 1 ? [EX.choix, EX.choixInv, EX.ecoute, EX.image] : e.b <= 3 ? [EX.ecoute, EX.ordre, EX.traduire, EX.trou] : [EX.traduire, EX.dictee, EX.oral, EX.ordre];
  const g = hasard(f); return (g === EX.image && !court(it)) ? EX.choix(it) : g(it);
}
function lancerRevision(cles, titre, evalId) {
  const exos = cles.map(exoRevision).filter(Boolean);
  if (!exos.length) { toast('Rien à réviser pour le moment — bravo 🌙'); return; }
  lancer({ kind:'revision', id:'rev', titre, exos, evalId });
}
function revisionErreurs() {
  const t = tgt();
  const top = Object.entries(S.erreurs).filter(([k]) => k.startsWith(t + ':') && ITEMS[k.slice(t.length + 1)]).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k]) => k);
  const gram = Object.entries(S.erreurs).filter(([k]) => k.startsWith('g:' + t + ':')).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .flatMap(([k]) => { const u = k.split(':')[2]; return UNITS[u] ? gramUnit(u)[2].map(g => EX.conj(g, u)) : []; });
  const exos = [...top.map(exoRevision).filter(Boolean), ...gram];
  if (!exos.length) { toast('Aucune erreur fréquente enregistrée pour l\'instant 🌟'); return; }
  lancer({ kind:'revision', id:'rev', titre:'🎯 Leçon de révision adaptée à vos erreurs', exos:melange(exos) });
}

/* ---------- Test de niveau ---------- */
function lancerTest() {
  J = null;
  lancer({ kind:'test', id:'test', titre:'Test de niveau', exos:[], test:{ niv:0, q:0, bons:0, fin:null } });
  J.exos = testQuestions(0); rendre();
}
function testQuestions(i) {
  const its = melange(itemsNiv(NIVEAUX[i].id));
  return [EX.choix(its[0]), EX.choixInv(its[1])].map(e => (e.consigne = `Test de niveau · question ${NIVEAUX[i].id} — ` + e.consigne, e));
}
function testAvance() {
  const t = J.test; const r = J.res[J.res.length - 1]; t.q++; if (r.score >= .7) t.bons++;
  if (t.q < 2) return;
  if (t.bons === 2 && t.niv < NIVEAUX.length - 1) { t.niv++; t.q = 0; t.bons = 0; J.exos.push(...testQuestions(t.niv)); }
  else t.fin = (t.bons === 2) ? NIVEAUX.length - 1 : t.niv;
}
function testResultatHTML() {
  const niv = NIVEAUX[J.test.fin != null ? J.test.fin : J.test.niv];

}

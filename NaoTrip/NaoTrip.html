<script>
/* ============================================================
   NaoTrip — le monde : les pays, leurs statuts, la carte à plat
   et le globe qui tourne. Les contours viennent de Natural Earth
   (world-atlas 110m), dessinés avec d3-geo — tout est dans le fichier.
   ============================================================ */
'use strict';
const CONTINENTS = { EU: 'Europe', AF: 'Afrique', AS: 'Asie', NA: 'Amérique du Nord', SA: 'Amérique du Sud', OC: 'Océanie', AN: 'Antarctique' };
const STATUTS_PAYS = {
  visite: { e: '✓', l: 'Visité', long: "J'y suis allé·e" },
  avenir: { e: '📍', l: 'À venir', long: 'Voyage prévu' },
  reve:   { e: '♡', l: 'En rêve', long: "J'aimerais y aller" }
};

const PAYS = {};           /* code ISO-2 → { code, num, nom, reg, lat, lng } */
const PAYS_NUM = {};
(function () {
  const brut = JSON.parse(document.getElementById('donnees-pays').textContent);
  const corrections = { AX: 'Îles Åland', XK: 'Kosovo', GB: 'Royaume-Uni', US: 'États-Unis', MK: 'Macédoine du Nord', CZ: 'Tchéquie' };
  brut.forEach(([num, code, nom, reg, lat, lng]) => {
    const p = { code, num, nom: corrections[code] || nom, reg, lat, lng };
    PAYS[code] = p; if (num) PAYS_NUM[num] = p;
  });
})();
const LISTE_PAYS = Object.values(PAYS).filter(p => p.reg !== 'AN').sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
const NOMS_PAYS = LISTE_PAYS.map(p => p.nom);
function paysDeNom(s) {
  const n = sansAccent(s);
  if (!n) return null;
  if (PAYS[s.toUpperCase()]) return PAYS[s.toUpperCase()];
  return LISTE_PAYS.find(p => sansAccent(p.nom) === n) || LISTE_PAYS.find(p => sansAccent(p.nom).startsWith(n)) || null;
}
const codePays = code => `<span class="code-pays">${esc(code)}</span>`;

/* ---------- les formes ---------- */
const TOPO = JSON.parse(document.getElementById('donnees-monde').textContent);
const SANS_ID = { 'Kosovo': 'XK', 'N. Cyprus': 'CY', 'Somaliland': 'SO' };
const FORMES = topojson.feature(TOPO, TOPO.objects.countries).features.map(f => {
  const p = PAYS_NUM[f.id] || PAYS[SANS_ID[f.properties.name]] || null;
  f.code = p ? p.code : null;
  return f;
});
const FRONTIERES = topojson.mesh(TOPO, TOPO.objects.countries, (a, b) => a !== b);
const CODES_AVEC_FORME = new Set(FORMES.map(f => f.code).filter(Boolean));
/* les petits pays sans contour à cette échelle (Malte, Singapour, Maldives…) deviennent des points */
const PETITS_PAYS = LISTE_PAYS.filter(p => !CODES_AVEC_FORME.has(p.code));
const NB_PAYS_MONDE = 195;

/* ---------- les statuts : ce qu'on a coché + ce que disent les voyages ---------- */
const RANG_STATUT = { visite: 3, avenir: 2, reve: 1 };
/* ce que disent les voyages seuls : visité après (ou pendant), à venir avant */
function statutsDesVoyages() {
  const res = {}, via = {};
  S.voyages.forEach(v => {
    const st = statutVoyage(v);
    const s = (st === 'passe' || st === 'encours') ? 'visite' : (st === 'avenir' ? 'avenir' : 'reve');
    (v.pays || []).forEach(c => {
      if (PAYS[c] && (!res[c] || RANG_STATUT[s] > RANG_STATUT[res[c]])) { res[c] = s; via[c] = v.nom; }
    });
  });
  return { res, via };
}
/* le statut le plus avancé l'emporte ; « aucun » coché à la main efface tout */
function statutsPays() {
  const { res, via } = statutsDesVoyages();
  Object.entries(S.monde || {}).forEach(([c, s]) => {
    if (s === 'aucun') { delete res[c]; delete via[c]; }
    else if (STATUTS_PAYS[s] && (!res[c] || RANG_STATUT[s] > RANG_STATUT[res[c]])) { res[c] = s; delete via[c]; }
  });
  return { statut: res, via };
}
function definirStatutPays(code, s) {
  const naturel = statutsDesVoyages().res[code];
  if (!s || s === 'aucun') { if (naturel) S.monde[code] = 'aucun'; else delete S.monde[code]; }
  else if (naturel && RANG_STATUT[naturel] >= RANG_STATUT[s]) delete S.monde[code];
  else S.monde[code] = s;
  sauver();
}
function statsMonde() {
  const { statut } = statutsPays();
  const par = { visite: [], avenir: [], reve: [] };
  Object.entries(statut).forEach(([c, s]) => par[s] && par[s].push(PAYS[c]));
  Object.values(par).forEach(l => l.sort((a, b) => a.nom.localeCompare(b.nom, 'fr')));
  const continents = {};
  Object.keys(CONTINENTS).filter(k => k !== 'AN').forEach(k => continents[k] = { total: LISTE_PAYS.filter(p => p.reg === k).length, vus: par.visite.filter(p => p.reg === k).length });
  return { par, continents, pct: Math.round(par.visite.length / NB_PAYS_MONDE * 1000) / 10 };
}

/* ---------- les marques : la coche ✓ et l'aiguille 📍 ---------- */
function marqueSVG(s, x, y, k = 1, i = 0) {
  const d = `style="animation-delay:${(i % 30) * 0.04}s"`;
  if (s === 'visite') return `<g class="marque tombe" transform="translate(${x},${y}) scale(${k})" ${d}><circle r="5.4" fill="var(--pays-visite)" stroke="#fff" stroke-width="1.3"/><path d="M-2.4 .1L-.7 1.9L2.6 -1.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  if (s === 'avenir') return `<g class="marque tombe" transform="translate(${x},${y}) scale(${k})" ${d}><path d="M0 0L0 -9" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cy="-11" r="3.8" fill="var(--pays-avenir)" stroke="#fff" stroke-width="1.2"/><circle cx="-1" cy="-12" r="1" fill="#fff" opacity=".8"/><ellipse rx="2.2" ry=".8" fill="#000" opacity=".25"/></g>`;
  if (s === 'reve') return `<g class="marque tombe" transform="translate(${x},${y}) scale(${k})" ${d}><path d="M0 3.2C-4.6 0-4.4-3.6-2.2-3.8C-1 -3.9-.3-3.1 0-2.4C.3-3.1 1-3.9 2.2-3.8C4.4-3.6 4.6 0 0 3.2Z" fill="var(--pays-reve)" stroke="#fff" stroke-width=".9"/></g>`;
  return '';
}

/* ---------- la carte à plat (SVG) ---------- */
function carteMondeSVG(o = {}) {
  const W = 960, H = o.hauteur || 470;
  const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [W - 6, H - 6]], { type: 'Sphere' });
  const chemin = d3.geoPath(proj);
  const { statut, via } = statutsPays();
  const formes = FORMES.filter(f => f.id !== '010');
  const pays = formes.map(f => {
    const s = f.code ? statut[f.code] || '' : '';
    const p = PAYS[f.code];
    const titre = p ? `${p.nom}${s ? ' — ' + STATUTS_PAYS[s].l : ''}${via[f.code] ? ' (' + via[f.code] + ')' : ''}` : f.properties.name;
    return `<path class="pays ${s}" d="${chemin(f)}" data-code="${f.code || ''}"><title>${esc(titre)}</title></path>`;
  }).join('');
  const petits = PETITS_PAYS.filter(p => statut[p.code]).map(p => {
    const [x, y] = proj([p.lng, p.lat]) || [];
    return x == null ? '' : `<circle class="pays ${statut[p.code]}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" data-code="${p.code}"><title>${esc(p.nom)}</title></circle>`;
  }).join('');
  let i = 0;
  const ordre = { reve: 0, visite: 1, avenir: 2 };
  const marques = Object.entries(statut).filter(([c]) => PAYS[c]).sort((a, b) => ordre[a[1]] - ordre[b[1]] || PAYS[b[0]].lat - PAYS[a[0]].lat).map(([c, s]) => {
    const [x, y] = proj([PAYS[c].lng, PAYS[c].lat]) || [];
    return x == null ? '' : marqueSVG(s, x.toFixed(1), y.toFixed(1), o.k || 1.25, i++);
  }).join('');
  return `<div class="carte-monde"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte du monde de mes voyages">
    <path class="grat" d="${chemin(d3.geoGraticule10())}"/>
    <g>${pays}${petits}</g>
    <path class="sphere" d="${chemin({ type: 'Sphere' })}"/>
    <g>${marques}</g></svg></div>`;
}

/* ============================================================
   Le globe (canvas) : on le fait tourner du doigt ou de la souris,
   on clique sur un pays pour dire « j'y suis allé·e » ou « c'est prévu ».
   ============================================================ */
const Globe = {
  canvas: null, ctx: null, proj: null, chemin: null, rot: [-10, -28, 0], zoom: 1, taille: 500, dpr: 1,
  auto: true, anim: null, cible: null, derniere: 0, survol: null, couleurs: null, t: 0, surClic: null,

  monter(canvas, surClic) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.surClic = surClic;
    this.proj = d3.geoOrthographic().clipAngle(90).precision(.6);
    this.chemin = d3.geoPath(this.proj, this.ctx);
    this.lireCouleurs(); this.dimensionner();
    if (this.obs) this.obs.disconnect();
    this.obs = new ResizeObserver(() => this.dimensionner());
    this.obs.observe(canvas);
    this.brancher();
    this.auto = !document.documentElement.classList.contains('calme') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    cancelAnimationFrame(this.anim);
    this.derniere = performance.now();
    const boucle = t => {
      if (!this.canvas || !this.canvas.isConnected) { this.anim = null; if (this.obs) this.obs.disconnect(); return; }
      const dt = Math.min(60, t - this.derniere); this.derniere = t; this.t = t;
      if (this.cible) this.avancerVersCible(t);
      else if (this.auto && !this.tire) this.rot[0] += dt * 0.006;
      this.dessiner();
      this.anim = requestAnimationFrame(boucle);
    };
    this.anim = requestAnimationFrame(boucle);
  },
  lireCouleurs() {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    const clair = document.documentElement.dataset.theme === 'light';
    this.couleurs = { o1: v('--ocean-1'), o2: v('--ocean-2'), terre: clair ? '#FFFFFF' : 'rgba(226,216,255,.26)', bord: v('--terre-bord'),
      visite: v('--pays-visite'), avenir: v('--pays-avenir'), reve: v('--pays-reve'), accent: v('--accent'), clair,
      halo: clair ? 'rgba(130,100,220,.28)' : 'rgba(185,168,240,.35)', grat: clair ? 'rgba(96,74,170,.14)' : 'rgba(255,255,255,.09)' };
  },
  dimensionner() {
    if (!this.canvas) return;
    const r = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.taille = Math.max(260, r.width);
    this.canvas.width = this.taille * this.dpr; this.canvas.height = this.taille * this.dpr;
  },
  rayon() { return this.taille * 0.41 * this.zoom; },
  dessiner() {
    const c = this.ctx, T = this.taille, R = this.rayon(), C = this.couleurs, cx = T / 2, cy = T / 2;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, T, T);
    this.proj.scale(R).translate([cx, cy]).rotate(this.rot);
    /* l'atmosphère */
    const h = c.createRadialGradient(cx, cy, R * .92, cx, cy, R * 1.16);
    h.addColorStop(0, C.halo); h.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = h; c.beginPath(); c.arc(cx, cy, R * 1.16, 0, Math.PI * 2); c.fill();
    /* l'océan */
    const o = c.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R);
    o.addColorStop(0, C.o1); o.addColorStop(1, C.o2);
    c.fillStyle = o; c.beginPath(); this.chemin({ type: 'Sphere' }); c.fill();
    c.strokeStyle = C.grat; c.lineWidth = .7; c.beginPath(); this.chemin(d3.geoGraticule10()); c.stroke();
    /* les terres */
    const { statut } = this.statuts || (this.statuts = statutsPays());
    FORMES.forEach(f => {
      const s = f.code && statut[f.code];
      c.beginPath(); this.chemin(f);
      c.fillStyle = s ? C[s] : C.terre;
      if (f === this.survol) c.fillStyle = s ? C[s] : C.accent;
      c.globalAlpha = (f === this.survol && !s) ? .55 : (s === 'reve' ? .8 : 1);
      c.fill();
    });
    c.globalAlpha = 1;
    c.strokeStyle = C.bord; c.lineWidth = .6; c.beginPath(); this.chemin(FRONTIERES); c.stroke();
    if (this.survol) { c.strokeStyle = C.clair ? '#2E2358' : '#fff'; c.lineWidth = 1.4; c.beginPath(); this.chemin(this.survol); c.stroke(); }
    /* la brillance */
    const b = c.createRadialGradient(cx - R * .45, cy - R * .5, 0, cx - R * .3, cy - R * .35, R * 1.1);
    b.addColorStop(0, 'rgba(255,255,255,.22)'); b.addColorStop(.5, 'rgba(255,255,255,0)'); b.addColorStop(1, 'rgba(0,0,0,.18)');
    c.fillStyle = b; c.beginPath(); this.chemin({ type: 'Sphere' }); c.fill();
    /* les marques, seulement sur la face visible */
    const centre = [-this.rot[0], -this.rot[1]];
    const k = Math.max(.8, Math.min(1.6, R / 210));
    const liste = Object.entries(statut).filter(([code]) => PAYS[code]).map(([code, s]) => ({ p: PAYS[code], s }))
      .filter(m => d3.geoDistance([m.p.lng, m.p.lat], centre) < Math.PI / 2 - .08)
      .sort((a, b) => a.p.lat - b.p.lat).reverse();
    liste.forEach(({ p, s }) => {
      const [x, y] = this.proj([p.lng, p.lat]);
      const bord = d3.geoDistance([p.lng, p.lat], centre) / (Math.PI / 2);
      c.globalAlpha = Math.max(.25, 1 - Math.pow(bord, 4));
      this.marque(s, x, y, k);
    });
    c.globalAlpha = 1;
  },
  marque(s, x, y, k) {
    const c = this.ctx, C = this.couleurs;
    c.save(); c.translate(x, y); c.scale(k, k);
    if (s === 'visite') {
      c.fillStyle = C.visite; c.strokeStyle = '#fff'; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, 0, 6.5, 0, Math.PI * 2); c.fill(); c.stroke();
      c.lineWidth = 1.9; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(-2.9, .1); c.lineTo(-.8, 2.3); c.lineTo(3.1, -2.2); c.stroke();
    } else if (s === 'avenir') {
      const bob = Math.sin(this.t / 420 + x) * 1.4;
      c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(0, 0, 3, 1.1, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -11 + bob); c.stroke();
      c.fillStyle = C.avenir; c.beginPath(); c.arc(0, -14 + bob, 4.8, 0, Math.PI * 2); c.fill(); c.lineWidth = 1.4; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(-1.4, -15.4 + bob, 1.3, 0, Math.PI * 2); c.fill();
    } else if (s === 'reve') {
      c.fillStyle = C.reve; c.strokeStyle = '#fff'; c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(0, 4); c.bezierCurveTo(-5.8, 0, -5.5, -4.5, -2.7, -4.7); c.bezierCurveTo(-1.2, -4.8, -.4, -3.9, 0, -3);
      c.bezierCurveTo(.4, -3.9, 1.2, -4.8, 2.7, -4.7); c.bezierCurveTo(5.5, -4.5, 5.8, 0, 0, 4); c.fill(); c.stroke();
    }
    c.restore();
  },
  /* ce qu'il y a sous le pointeur */
  pays(ev) {
    const r = this.canvas.getBoundingClientRect();
    const x = (ev.clientX - r.left) * this.taille / r.width, y = (ev.clientY - r.top) * this.taille / r.height;
    const R = this.rayon(); if (Math.hypot(x - this.taille / 2, y - this.taille / 2) > R) return null;
    const centre = [-this.rot[0], -this.rot[1]];
    /* d'abord les petits pays marqués ou non, visés à quelques pixels près */
    for (const p of PETITS_PAYS) {
      if (d3.geoDistance([p.lng, p.lat], centre) > Math.PI / 2) continue;
      const q = this.proj([p.lng, p.lat]);
      if (q && Math.hypot(q[0] - x, q[1] - y) < 7) return { code: p.code, forme: null };
    }
    const ll = this.proj.invert([x, y]); if (!ll) return null;
    const f = FORMES.find(f => f.code && d3.geoContains(f, ll));
    return f ? { code: f.code, forme: f } : null;
  },
  brancher() {
    const cv = this.canvas;
    let depart = null, bouge = false;
    const bulle = $('#infobulle');
    cv.onpointerdown = e => {
      cv.setPointerCapture(e.pointerId); this.tire = true; bouge = false; this.cible = null;
      depart = { x: e.clientX, y: e.clientY, rot: this.rot.slice() }; cv.classList.add('tire');
    };
    cv.onpointermove = e => {
      if (this.tire && depart) {
        const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) bouge = true;
        const k = 75 / this.rayon();
        this.rot = [depart.rot[0] + dx * k, Math.max(-85, Math.min(85, depart.rot[1] - dy * k)), 0];
        bulle.classList.remove('vis');
        return;
      }
      const t = e.pointerType === 'mouse' ? this.pays(e) : null;
      this.survol = t && t.forme;
      if (t) { bulle.textContent = PAYS[t.code].nom; bulle.style.left = e.clientX + 14 + 'px'; bulle.style.top = e.clientY + 12 + 'px'; bulle.classList.add('vis'); }
      else bulle.classList.remove('vis');
    };
    const fin = e => {
      if (!this.tire) return;
      this.tire = false; cv.classList.remove('tire');
      if (!bouge && e.type === 'pointerup') { const t = this.pays(e); if (t && this.surClic) this.surClic(t.code, e.clientX, e.clientY); }
      depart = null;
    };
    cv.onpointerup = fin; cv.onpointercancel = fin;
    cv.onpointerleave = () => { this.survol = null; bulle.classList.remove('vis'); };
    cv.onwheel = e => { e.preventDefault(); this.zoomer(e.deltaY < 0 ? 1.12 : 1 / 1.12); };
  },
  zoomer(f) { this.zoom = Math.max(.7, Math.min(4.5, this.zoom * f)); },
  tournerVers(code) {
    const p = PAYS[code]; if (!p) return;
    let l0 = this.rot[0], l1 = -p.lng;
    while (l1 - l0 > 180) l1 -= 360; while (l1 - l0 < -180) l1 += 360;
    this.cible = { de: this.rot.slice(), vers: [l1, -p.lat * .85, 0], t0: performance.now(), d: 1100 };
    this.auto = false;
  },
  avancerVersCible(t) {
    const q = Math.min(1, (t - this.cible.t0) / this.cible.d), e = q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
    this.rot = this.cible.de.map((a, i) => a + (this.cible.vers[i] - a) * e);
    if (q >= 1) this.cible = null;
  },
  rafraichir() { this.statuts = null; this.lireCouleurs(); }
};
</script>
<script>
/* ============================================================
   NaoTrip — les écrans. Chaque vue rend du HTML ; les clics passent
   tous par data-act, reçus dans ACT (voir plus bas).
   ============================================================ */
'use strict';
const ACT = {};

/* ---------- petites briques partagées ---------- */
const coche = (on, act, attrs) => `<button type="button" class="coche${on ? ' on' : ''}" data-act="${act}" ${attrs} aria-pressed="${on ? 'true' : 'false'}" aria-label="Cocher"></button>`;
const voyageursHTML = v => v.voyageurs.length
  ? `<div class="voyageurs">${v.voyageurs.map(p => `<span class="v"><i>${esc(initiales(p.nom))}</i>${esc(p.nom)}</span>`).join('')}</div>`
  : '<span class="muet ui" style="font-size:12px">Voyageurs à ajouter</span>';
const paysHTML = v => (v.pays || []).filter(c => PAYS[c]).map(c => `<span class="etiquette">${codePays(c)} ${esc(PAYS[c].nom)}</span>`).join(' ');
function titreVue(titre, sous, actions) {
  return `<div class="titre-vue"><div><h2>${titre}</h2>${sous ? `<p>${sous}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
}
function sansVoyage(quoi) {
  return `<div class="carte bienvenue"><div class="grand">🧳</div><h3>Aucun voyage pour l'instant</h3>
    <p>Créez un voyage pour ${esc(quoi)}. Destination, dates, voyageurs : le reste se range tout seul.</p>
    <div class="actions"><button class="btn plein" data-act="nouveau-voyage"><span class="e">✈️</span> Créer un voyage</button>
    <button class="btn" data-act="exemple"><span class="e">🗺️</span> Voir un exemple</button></div></div>`;
}
function badgeStatut(v) {
  const st = statutVoyage(v);
  if (st === 'avenir') { const j = joursEntre(auj(), v.debut); return `<span class="etiquette or">${j === 1 ? 'Demain' : 'J-' + j}</span>`; }
  if (st === 'encours') return '<span class="etiquette ok">En cours</span>';
  if (st === 'passe') return '<span class="etiquette">Terminé</span>';
  return '<span class="etiquette rose">En projet</span>';
}

/* ---------- les événements datés d'un voyage (réservations + horaires clés) ---------- */
function evenements(v) {
  const ev = [];
  v.reservations.forEach(r => {
    const [, e, nom, fam] = typeResa(r.type);
    const transport = fam === 'transport', heberg = r.type === 'hebergement';
    if (r.debut) ev.push({ quand: r.debut, e, titre: (heberg ? 'Check-in · ' : transport ? 'Départ · ' : '') + (r.titre || nom), sous: r.lieu, r, cle: 'debut' });
    if (r.embarquement && transport) ev.push({ quand: r.embarquement, e: '🛫', titre: 'Embarquement · ' + (r.titre || nom), sous: r.porte || r.lieu, r, cle: 'embarquement' });
    if (r.fin && (transport || heberg)) ev.push({ quand: r.fin, e: heberg ? '🔑' : '🛬', titre: (heberg ? 'Check-out · ' : 'Arrivée · ') + (r.titre || nom), sous: heberg ? r.lieu : r.arrivee, r, cle: 'fin' });
  });
  return ev.sort((a, b) => a.quand.localeCompare(b.quand));
}
function totauxBudget(v) {
  const prevu = somme(CATS_BUDGET, c => nombre(v.budget[c[0]]));
  const depense = somme(v.depenses, d => nombre(d.montant));
  const parCat = {}; CATS_BUDGET.forEach(c => parCat[c[0]] = 0);
  v.depenses.forEach(d => { parCat[d.categorie in parCat ? d.categorie : 'divers'] += nombre(d.montant); });
  return { prevu, depense, reste: prevu - depense, parCat };
}
function progressionPrep(v) {
  const tout = [...v.valise, ...v.documents, ...v.taches];
  return tout.length ? Math.round(tout.filter(x => x.fait).length / tout.length * 100) : 0;
}

/* ============================================================
   ACCUEIL
   ============================================================ */
function vueAccueil() {
  const v = voyage();
  const p = prochainVoyage();
  const hero = `<section class="carte hero">
    <svg class="jeton" viewBox="0 0 40 40" aria-hidden="true"><use href="#l-tr"/></svg>
    <div class="txt"><h2>Nao<span>Trip</span></h2>
      <p class="slogan">« Préparez le départ, profitez du voyage. »</p>
      <p class="mission">Un week-end, une sortie, des vacances en couple, entre amis ou en famille : NaoTrip tient le planning, les réservations,
        la valise, le budget partagé et les papiers — et garde les souvenirs au retour.</p>
      <div class="actions">
        <button class="btn plein" data-act="nouveau-voyage"><span class="e">✈️</span> Créer un voyage</button>
        <button class="btn" data-act="ajout-resa"><span class="e">🎫</span> Ajouter une réservation</button>
        <button class="btn" data-act="vue" data-vue="valise"><span class="e">🧳</span> Préparer ma valise</button>
      </div></div>
    <svg class="horizon" viewBox="0 0 320 160" aria-hidden="true"><path d="M10 140Q120 20 300 60" fill="none" stroke="var(--motif)" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/>
      <circle cx="10" cy="140" r="5" fill="var(--accent)"/><circle cx="300" cy="60" r="5" fill="var(--or)"/></svg>
  </section>`;
  if (!S.voyages.length) return hero + sansVoyage('commencer') + carteMondeAccueil();
  if (!v) return hero + carteMondeAccueil();

  /* 2. Mon prochain voyage */
  const st = statutVoyage(v);
  const depart = departDe(v);
  let bloc = '';
  if (st === 'avenir' && depart) {
    bloc = `<div class="decompte" data-decompte="${depart.getTime()}"><div><b data-u="j">–</b><small>jours</small></div><div><b data-u="h">–</b><small>heures</small></div>
      <div><b data-u="m">–</b><small>minutes</small></div><div><b data-u="s">–</b><small>secondes</small></div></div>`;
  } else if (st === 'encours') {
    const n = joursEntre(v.debut, auj()) + 1, tot = joursEntre(v.debut, v.fin || v.debut) + 1;
    bloc = `<div class="en-route"><span class="gros">🌴</span><div><b class="chiffre" style="font-size:20px">Bon voyage !</b><div class="ui muet" style="font-size:13px">Jour ${n} sur ${tot} — profitez-en.</div></div></div>`;
  } else if (st === 'passe') {
    bloc = `<div class="en-route"><span class="gros">📸</span><div><b class="chiffre" style="font-size:20px">Voyage terminé</b><div class="ui muet" style="font-size:13px">Le carnet souvenir vous attend.</div></div>
      <button class="btn petit" data-act="vue" data-vue="souvenirs" style="margin-left:auto">Ouvrir le carnet</button></div>`;
  } else bloc = `<div class="en-route"><span class="gros">🗓️</span><div class="ui muet" style="font-size:13px">Ajoutez des dates pour lancer le compte à rebours.</div>
      <button class="btn petit" data-act="editer-voyage" data-id="${v.id}" style="margin-left:auto">Choisir les dates</button></div>`;
  let avance = 0;
  if (st === 'avenir' && v.creeLe) { const tot = parseJour(v.debut) - parseJour(v.creeLe), fait = new Date() - parseJour(v.creeLe); avance = tot > 0 ? Math.max(4, Math.min(96, fait / tot * 100)) : 50; }
  else if (st === 'encours' || st === 'passe') avance = 96;
  const [, te, tl] = typeVoyage(v.type);
  const carteProchain = `<article class="carte prochain large-2">
    <div class="coin">${badgeStatut(v)}<button class="mini" data-act="editer-voyage" data-id="${v.id}" title="Modifier le voyage">✎</button></div>
    <h3><span class="e">🧭</span>${p && p.id === v.id ? 'Mon prochain voyage' : 'Mon voyage'}</h3>
    <div class="destination">${esc(v.nom)}</div>
    <div class="quand"><span>${te} ${esc(tl)}</span>·<span>${esc(fmtPeriode(v))}</span>${v.destination ? `·<span>📍 ${esc(v.destination)}</span>` : ''}</div>
    ${bloc}
    <div class="trajet" aria-hidden="true"><i class="a"></i><span class="avion" style="left:${avance}%">✈️</span><i class="b"></i></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">${voyageursHTML(v)}<div>${paysHTML(v)}</div></div>
  </article>`;

  /* 3. Mon budget voyage */
  const b = totauxBudget(v);
  const pctB = b.prevu ? Math.round(b.depense / b.prevu * 100) : 0;
  const carteBudget = `<article class="carte">
    <h3><span class="e">💶</span>Mon budget voyage</h3><p class="chapo">${b.prevu ? `${pctB} % du budget prévu` : 'Aucun budget prévu pour l’instant'}</p>
    <div class="chiffres"><div><small>Prévu</small><b>${argent(b.prevu, v.devise)}</b></div><div><small>Dépensé</small><b>${argent(b.depense, v.devise)}</b></div></div>
    <div class="jauge${pctB > 100 ? ' trop' : ''}"><i style="width:${Math.min(100, pctB)}%"></i></div>
    <p class="ui" style="font-size:12.5px;margin:10px 0 12px;color:${b.reste < 0 ? 'var(--alerte)' : 'var(--ink-2)'}">${b.prevu ? (b.reste >= 0 ? 'Il reste ' + argent(b.reste, v.devise) : 'Dépassement de ' + argent(-b.reste, v.devise)) : ''}${v.voyageurs.length > 1 && b.depense ? ` · ${argent(b.depense / v.voyageurs.length, v.devise)} par personne` : ''}</p>
    <div class="actions"><button class="btn petit" data-act="ajout-depense">＋ Dépense</button><button class="lien" data-act="vue" data-vue="budget">Tout le budget →</button></div>
  </article>`;

  /* 4. Ma valise */
  const nv = v.valise.length, fv = v.valise.filter(x => x.fait).length, pv = nv ? Math.round(fv / nv * 100) : 0;
  const restants = v.valise.filter(x => !x.fait).slice(0, 4);
  const carteValise = `<article class="carte">
    <h3><span class="e">🧳</span>Ma valise</h3><p class="chapo">${nv ? `${fv} sur ${nv} affaires prêtes` : 'Liste vide — on la prépare ?'}</p>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="anneau" style="--p:${pv}"><b>${pv}%</b></div>
      <div class="liste" style="flex:1">${restants.map(x => `<div class="item" style="padding:6px 9px">${coche(false, 'basculer', `data-liste="valise" data-id="${x.id}"`)}<span class="corps"><span>${esc(x.nom)}</span></span></div>`).join('') || (nv ? '<span class="ui muet" style="font-size:13px">Tout est prêt ✨</span>' : '')}</div></div>
    <div class="actions">${nv ? '' : '<button class="btn petit plein" data-act="generer-valise">✨ Liste de base</button>'}<button class="lien" data-act="vue" data-vue="valise">Préparer ma valise →</button></div>
  </article>`;

  /* 5. Mes réservations */
  const maintenant = new Date();
  const evs = evenements(v), aVenir = evs.filter(e => parseDT(e.quand) >= maintenant);
  const montres = (aVenir.length ? aVenir : evs).slice(0, 4);
  const carteResa = `<article class="carte large-2">
    <h3><span class="e">🎫</span>Mes réservations</h3><p class="chapo">${pluriel(v.reservations.length, 'réservation')} · ${aVenir.length} horaire${aVenir.length > 1 ? 's' : ''} à venir</p>
    <div class="liste">${montres.map(e => `<button class="evt resa" data-act="editer-resa" data-id="${e.r.id}"><span>${e.e}</span><span style="flex:1"><b>${esc(e.titre)}</b><br><span class="muet">${esc(fmtDT(e.quand))}</span></span></button>`).join('') || '<div class="vide">Vols, trains, hôtels, billets…</div>'}</div>
    <div class="actions" style="margin-top:12px"><button class="btn petit" data-act="ajout-resa">＋ Réservation</button><button class="lien" data-act="vue" data-vue="reservations">Chronologie →</button></div>
  </article>`;

  /* 6. Planning visuel */
  const jours = listeJours(v.debut, v.fin);
  const planning = `<article class="carte pleine">
    <div class="coin"><button class="lien" data-act="vue" data-vue="planning">Planning détaillé →</button></div>
    <h3><span class="e">🗓️</span>Le planning des journées</h3><p class="chapo">${jours.length ? pluriel(jours.length, 'journée') + ' · touchez une activité pour la modifier' : 'Ajoutez des dates au voyage pour voir les journées'}</p>
    ${jours.length ? `<div class="jours">${jours.map((j, i) => colonneJour(v, j, i)).join('')}</div>` : ''}
  </article>`;

  /* 8. À ne pas oublier */
  const docs = v.documents.filter(d => !d.fait), taches = v.taches.filter(t => !t.fait).sort((a, b) => (b.jMoins || 0) - (a.jMoins || 0));
  const horaires = aVenir.filter(e => e.cle !== 'debut' || typeResa(e.r.type)[3] === 'transport' || e.r.type === 'hebergement').slice(0, 4);
  const oubli = `<article class="carte pleine">
    <h3><span class="e">📌</span>À ne pas oublier avant le départ</h3><p class="chapo">Préparation terminée à ${progressionPrep(v)} % — documents, tâches et horaires importants</p>
    <div class="grille g3">
      <div><div class="groupe-titre">🪪 Documents <span class="n">${v.documents.length - docs.length}/${v.documents.length}</span></div>
        <div class="liste">${docs.slice(0, 5).map(d => ligneCoche(d, 'documents', d.qui)).join('') || '<div class="vide">Tous les papiers sont prêts ✓</div>'}</div></div>
      <div><div class="groupe-titre">✅ Tâches <span class="n">${v.taches.length - taches.length}/${v.taches.length}</span></div>
        <div class="liste">${taches.slice(0, 5).map(t => ligneCoche(t, 'taches', echeanceTache(v, t))).join('') || '<div class="vide">Rien d’urgent ✓</div>'}</div></div>
      <div><div class="groupe-titre">⏰ Horaires importants</div>
        <div class="liste">${horaires.map(e => `<div class="horaire"><span>${e.e}</span><span>${esc(e.titre)}</span><span class="q">${esc(fmtDT(e.quand))}</span></div>`).join('') || '<div class="vide">Départ, embarquement, check-in… apparaîtront ici</div>'}</div></div>
    </div>
    <div class="actions" style="margin-top:12px"><button class="lien" data-act="vue" data-vue="preparation">Toute la préparation →</button></div>
  </article>`;

  return hero + `<div class="grille g4">${carteProchain}${carteBudget}${carteValise}${carteResa}${carteMondeAccueil('large-2')}</div>
    <div class="grille" style="margin-top:16px">${planning}${oubli}</div>`;
}
function carteMondeAccueil(cls) {
  const st = statsMonde();
  return `<article class="carte ${cls || ''}" style="${cls ? '' : 'margin-top:16px'}">
    <div class="coin"><button class="btn petit plein" data-act="vue" data-vue="globe">🌍 Ouvrir mon globe</button></div>
    <h3><span class="e">🗺️</span>Ma carte du monde</h3>
    <p class="chapo">${pluriel(st.par.visite.length, 'pays visité', 'pays visités')} ✓ · ${pluriel(st.par.avenir.length, 'pays à venir', 'pays à venir')} 📍 · ${st.pct} % du monde — cliquez un pays pour le marquer</p>
    <div id="carteAccueil">${carteMondeSVG()}</div>
    <div class="legende"><span><i class="v"></i>✓ Visité</span><span><i class="a"></i>📍 À venir</span><span><i class="r"></i>♡ En rêve</span></div>
  </article>`;
}
function colonneJour(v, j, i) {
  const a = auj();
  const items = elementsDuJour(v, j);
  return `<div class="jour${j === a ? ' auj' : ''}${j < a ? ' passe' : ''}">
    <header><b>J${i + 1}</b><small>${esc(fmtJour(j))}</small><button class="lien" data-act="ajout-plan" data-jour="${j}" title="Ajouter">＋</button></header>
    ${items.map(evtJour).join('') || '<span class="ui muet" style="font-size:12px">Journée libre ☀️</span>'}
  </div>`;
}
function elementsDuJour(v, j) {
  const l = [];
  v.planning.filter(p => p.jour === j).forEach(p => l.push({ h: p.heure || '', e: typePlan(p.type)[1], t: p.titre, sous: p.lieu, fait: p.fait, act: 'editer-plan', id: p.id, cls: '' }));
  v.reservations.forEach(r => {
    if (r.debut && r.debut.slice(0, 10) === j) l.push({ h: fmtHeure(r.debut).replace('h', ':'), e: typeResa(r.type)[1], t: (r.type === 'hebergement' ? 'Check-in · ' : '') + (r.titre || typeResa(r.type)[2]), sous: r.lieu, act: 'editer-resa', id: r.id, cls: 'resa' });
    if (r.fin && r.fin.slice(0, 10) === j && r.type === 'hebergement') l.push({ h: fmtHeure(r.fin).replace('h', ':'), e: '🔑', t: 'Check-out · ' + (r.titre || 'Hébergement'), act: 'editer-resa', id: r.id, cls: 'resa' });
  });
  v.idees.filter(x => x.jour === j).forEach(x => l.push({ h: x.heure || '', e: TYPES_IDEE.find(t => t[0] === x.type)?.[1] || '💡', t: x.nom, sous: x.adresse, fait: x.statut === 'fait', act: 'editer-idee', id: x.id, cls: 'idee' }));
  return l.sort((a, b) => (a.h || '99').localeCompare(b.h || '99'));
}
const evtJour = x => `<button class="evt ${x.cls}${x.fait ? ' fait' : ''}" data-act="${x.act}" data-id="${x.id}">${x.h ? `<span class="h">${esc(x.h.replace(':', 'h'))}</span>` : ''}<span>${x.e}</span><span class="t">${esc(x.t)}</span></button>`;
function ligneCoche(x, liste, sous) {
  return `<div class="item${x.fait ? ' fait' : ''}">${coche(x.fait, 'basculer', `data-liste="${liste}" data-id="${x.id}"`)}
    <span class="corps"><b>${esc(x.nom)}</b>${sous ? `<small>${esc(sous)}</small>` : ''}</span>
    <span class="outils"><button class="mini" data-act="editer-${liste}" data-id="${x.id}" title="Modifier">✎</button><button class="mini" data-act="suppr" data-liste="${liste}" data-id="${x.id}" title="Retirer">✕</button></span></div>`;
}
function echeanceTache(v, t) {
  if (t.jMoins == null || t.jMoins === '' || !v.debut) return t.note || '';
  const d = ajouteJours(v.debut, -t.jMoins);
  const r = joursEntre(auj(), d);
  return `À faire ${t.jMoins > 0 ? 'J-' + t.jMoins : 'le jour J'} · ${fmtJour(d)}${r < 0 ? ' · en retard' : r === 0 ? ' · aujourd’hui' : ''}`;
}

/* ============================================================
   MES VOYAGES
   ============================================================ */
function vueVoyages() {

      <div class="bandeau"><span class="e">${e}</span>${badgeStatut(v)}<h4>${esc(v.nom)}</h4><div class="dest">${esc(v.destination || l)}</div></div>
      <div class="infos"><span>🗓️ ${esc(fmtPeriode(v))}</span><span>👥 ${v.voyageurs.map(p => esc(p.nom)).join(', ') || '—'}</span>
        <span>🎫 ${pluriel(v.reservations.length, 'réservation')} · 💶 ${argent(b.depense, v.devise)}${b.prevu ? ' / ' + argent(b.prevu, v.devise) : ''}</span>

      : sansVoyage('commencer'));

/* ============================================================
   PLANNING
   ============================================================ */

}

/* ============================================================
   RÉSERVATIONS + chronologie
   ============================================================ */
function vueReservations() {
  const v = voyage(); if (!v) return sansVoyage('ranger les réservations');
  const familles = [['transport', '🚆 Transports'], ['hebergement', '🏨 Hébergements'], ['activite', '🎟️ Activités, billets & restaurants']];
  const carte = r => {
    const [, e, nom] = typeResa(r.type);
    const heb = r.type === 'hebergement';
    return `<div class="resa-carte" data-act="editer-resa" data-id="${r.id}" role="button" tabindex="0"><span class="ic">${e}</span>
      <div class="corps"><b>${esc(r.titre || nom)}</b>
        <small>${r.debut ? (heb ? 'Arrivée ' : '') + esc(fmtDT(r.debut)) : 'Date à préciser'}${r.fin ? ' → ' + esc(fmtDT(r.fin)) : ''}</small>
        ${r.lieu || r.arrivee ? `<small>📍 ${esc(r.lieu || '')}${r.arrivee ? ' → ' + esc(r.arrivee) : ''}</small>` : ''}
        ${r.reference ? `<small class="ref">N° ${esc(r.reference)}</small>` : ''}

  const maintenant = new Date();

  const prochain = evs.find(e => parseDT(e.quand) >= maintenant);
  let jourCourant = '';
  const chrono = evs.map(e => {
    const j = e.quand.slice(0, 10), t = j !== jourCourant ? `<div class="jourc">${esc(fmtJour(j, true))}</div>` : '';
    jourCourant = j;
    const passe = parseDT(e.quand) < maintenant;
    return t + `<div class="ev${passe ? ' passe' : ''}${e === prochain ? ' prochain' : ''}" data-act="editer-resa" data-id="${e.r.id}"><span class="h">${esc(fmtHeure(e.quand) || '—')}</span><span class="ic">${e.e}</span>
      <span class="corps"><b>${esc(e.titre)}</b>${e.sous ? `<small>${esc(e.sous)}</small>` : ''}</span>${e === prochain ? '<span class="etiquette or">Prochain</span>' : ''}</div>`;
  }).join('');
  const total = somme(v.reservations, r => nombre(r.prix));
  return titreVue('Mes <span>réservations</span>', `${esc(v.nom)} · ${pluriel(v.reservations.length, 'réservation')}${total ? ' · ' + argent(total, v.devise) : ''}`,

    + `<div class="grille g2"><div class="pile">${familles.map(([f, t]) => {
      const l = v.reservations.filter(r => typeResa(r.type)[3] === f).sort((a, b) => (a.debut || '9').localeCompare(b.debut || '9'));

    }).join('')}</div>
    <article class="carte" style="align-self:start"><h3><span class="e">⏱️</span>Vue chronologique</h3><p class="chapo">Départs, embarquements, check-in et check-out dans l'ordre</p>
      ${evs.length ? `<div class="chrono">${chrono}</div>` : '<div class="vide">Les horaires des réservations s’aligneront ici.</div>'}</article></div>`;
}

/* ============================================================
   VALISE
   ============================================================ */
let filtreValise = 'tous';
function vueValise() {
  const v = voyage(); if (!v) return sansVoyage('préparer la valise');

  const cats = CATS_VALISE.map(c => [c, items.filter(x => (x.cat || 'divers') === c[0])]).filter(c => c[1].length);

/* ============================================================
   BUDGET, dépenses et répartition
   ============================================================ */
function repartition(v) {
  const soldes = {}; v.voyageurs.forEach(p => soldes[p.id] = { paye: 0, part: 0 });
  v.depenses.forEach(d => {
    const m = nombre(d.montant);
    const pour = (d.pour && d.pour.length ? d.pour : v.voyageurs.map(p => p.id)).filter(id => soldes[id]);
    if (soldes[d.payePar]) soldes[d.payePar].paye += m;
    pour.forEach(id => soldes[id].part += m / pour.length);
  });
  /* qui rembourse qui : les plus gros débiteurs vers les plus gros créanciers */
  const l = Object.entries(soldes).map(([id, s]) => ({ id, solde: Math.round((s.paye - s.part) * 100) / 100 }));
  const cred = l.filter(x => x.solde > .01).sort((a, b) => b.solde - a.solde), deb = l.filter(x => x.solde < -.01).sort((a, b) => a.solde - b.solde);
  const virements = [];
  let i = 0, j = 0;
  while (i < deb.length && j < cred.length) {
    const m = Math.min(-deb[i].solde, cred[j].solde);
    virements.push({ de: deb[i].id, a: cred[j].id, m });
    deb[i].solde += m; cred[j].solde -= m;
    if (deb[i].solde > -.01) i++;
    if (cred[j].solde < .01) j++;
  }
  return { soldes, virements };
}
function vueBudget() {
  const v = voyage(); if (!v) return sansVoyage('tenir le budget');
  const b = totauxBudget(v), D = v.devise;
  const nbJ = Math.max(1, listeJours(v.debut, v.fin).length);
  const { soldes, virements } = repartition(v);
  const deps = [...v.depenses].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return titreVue('Mon <span>budget</span>', `${esc(v.nom)} · en ${esc(D)}`,
    '<button class="btn plein" data-act="ajout-depense"><span class="e">＋</span> Ajouter une dépense</button><button class="btn" data-act="budget-prevu">✎ Budget prévisionnel</button>')
    + `<div class="chiffres" style="margin-bottom:16px"><div><small>Budget prévu</small><b>${argent(b.prevu, D)}</b></div><div><small>Dépensé</small><b>${argent(b.depense, D)}</b></div>
      <div><small>${b.reste >= 0 ? 'Reste' : 'Dépassement'}</small><b class="${b.reste >= 0 ? 'ok' : 'alerte'}">${argent(Math.abs(b.reste), D)}</b></div>
      <div><small>Par jour</small><b>${argent(b.depense / nbJ, D)}</b></div>${v.voyageurs.length ? `<div><small>Par personne</small><b>${argent(b.depense / v.voyageurs.length, D)}</b></div>` : ''}</div>
    <div class="grille g2">
      <article class="carte"><h3><span class="e">📊</span>Prévu et dépensé</h3><p class="chapo">Par catégorie</p>
        <div class="cat-lignes">${CATS_BUDGET.map(([id, e, nom]) => { const pr = nombre(v.budget[id]), de = b.parCat[id]; const pc = pr ? de / pr * 100 : (de ? 100 : 0);
          return `<div class="cat-ligne"><span>${e}</span><span>${esc(nom)}</span><span class="m">${argent(de, D)} <span class="muet">/ ${argent(pr, D)}</span></span><div class="jauge${pc > 100 ? ' trop' : ''}"><i style="width:${Math.min(100, pc)}%"></i></div></div>`; }).join('')}</div></article>
      <article class="carte"><h3><span class="e">🤝</span>Répartition entre voyageurs</h3><p class="chapo">Qui a payé quoi, et comment être quittes</p>
        ${v.voyageurs.length < 2 ? '<div class="vide">Ajoutez au moins deux voyageurs au voyage pour partager les dépenses.</div>' : `
        <div class="liste">${v.voyageurs.map(p => { const s = soldes[p.id], d = s.paye - s.part;
          return `<div class="solde"><span class="voyageurs"><span class="v"><i>${esc(initiales(p.nom))}</i>${esc(p.nom)}</span></span><span class="muet">a payé ${argent(s.paye, D)} · part ${argent(s.part, D)}</span><b class="${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '+' : '−'}${argent(Math.abs(d), D)}</b></div>`; }).join('')}</div>
        <div class="groupe-titre" style="margin-top:14px">Pour être quittes</div>
        <div class="liste">${virements.map(x => `<div class="virement"><b>${esc(nomVoyageur(v, x.de))}</b><span class="fl">→</span><b>${esc(nomVoyageur(v, x.a))}</b><span style="margin-left:auto" class="chiffre">${argent(x.m, D)}</span></div>`).join('') || '<div class="vide">Tout le monde est quitte ✓</div>'}</div>`}
      </article>
      <article class="carte pleine"><h3><span class="e">🧾</span>Les dépenses</h3><p class="chapo">${pluriel(deps.length, 'dépense')} · touchez une ligne pour la modifier</p>
        ${deps.length ? `<div class="defile"><table class="tableau"><thead><tr><th>Date</th><th>Dépense</th><th>Catégorie</th>${v.voyageurs.length ? '<th>Payé par</th><th>Pour</th>' : ''}<th style="text-align:right">Montant</th></tr></thead><tbody>
          ${deps.map(d => `<tr data-act="editer-depense" data-id="${d.id}"><td>${esc(d.date ? fmtJour(d.date) : '—')}</td><td><b>${esc(d.libelle)}</b>${d.resaId ? ' <span class="etiquette ciel">🎫 réservation</span>' : ''}</td><td>${catBudget(d.categorie)[1]} ${esc(catBudget(d.categorie)[2])}</td>
            ${v.voyageurs.length ? `<td>${esc(nomVoyageur(v, d.payePar))}</td><td class="muet">${!d.pour || !d.pour.length || d.pour.length === v.voyageurs.length ? 'Tous' : d.pour.map(id => esc(nomVoyageur(v, id))).join(', ')}</td>` : ''}
            <td class="m">${argent(nombre(d.montant), D)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vide">Notez les dépenses au fil du voyage : elles se répartissent toutes seules.</div>'}
      </article></div>`;

          <div class="continents">${Object.entries(st.continents).map(([k, c]) => `<div class="ligne"><span>${CONTINENTS[k]}</span><div class="jauge"><i style="width:${c.total ? c.vus / c.total * 100 : 0}%"></i></div><span class="muet" style="text-align:right">${c.vus}/${c.total}</span></div>`).join('')}</div></article>
      </div></div>`;
}
function ouvrirBullePays(code, x, y) {
  const p = PAYS[code]; if (!p) return;
  const { statut, via } = statutsPays();
  const s = statut[code] || 'aucun';
  const b = $('#bullePays');
  b.innerHTML = `<h5>${codePays(code)} ${esc(p.nom)}</h5><div class="reg">${esc(CONTINENTS[p.reg] || '')}</div>
    <div class="choix">${[['visite', '✓ Visité'], ['avenir', '📍 À venir'], ['reve', '♡ En rêve'], ['aucun', '○ Pas encore']].map(([k, l]) => `<button type="button" class="${s === k ? 'on' : ''}" data-act="statut-pays" data-code="${code}" data-statut="${k}">${l}</button>`).join('')}</div>
    ${via[code] ? `<div class="via">Ajouté par le voyage « ${esc(via[code])} »</div>` : ''}`;
  b.classList.add('ouverte');
  const w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = Math.max(10, Math.min(innerWidth - w - 10, x - w / 2)) + 'px';
  b.style.top = (y + h + 20 > innerHeight ? Math.max(10, y - h - 14) : y + 14) + 'px';
}
const fermerBullePays = () => $('#bullePays').classList.remove('ouverte');

<script>
/* ============================================================
   NaoTrip — l'application : navigation, actions, décor animé.
   ============================================================ */
'use strict';
const VUES = [
  ['accueil', 'Accueil', '🏠', vueAccueil],
  ['voyages', 'Mes voyages', '🧭', vueVoyages],
  ['planning', 'Planning', '🗓️', vuePlanning],
  ['reservations', 'Réservations', '🎫', vueReservations],
  ['valise', 'Valise', '🧳', vueValise],
  ['budget', 'Budget', '💶', vueBudget],
  ['preparation', 'Préparation', '✅', vuePreparation],
  ['idees', 'Idées', '💡', vueIdees],
  ['infos', 'Infos utiles', '📇', vueInfos],
  ['souvenirs', 'Carnet souvenir', '📸', vueSouvenirs],
  ['globe', 'Mon globe', '🌍', vueGlobe]];
let vue = (location.hash || '').slice(1) || lire('naotrip.vue', 'accueil');
if (!VUES.some(x => x[0] === vue)) vue = 'accueil';

function rendre() {
  if (S.actif && !voyage()) S.actif = null;
  if (!S.actif && S.voyages.length) S.actif = (prochainVoyage() || S.voyages[S.voyages.length - 1]).id;
  $('#onglets').innerHTML = VUES.map(([id, nom, e]) => `<button type="button" data-act="vue" data-vue="${id}" class="${id === vue ? 'actif' : ''}"><span class="e">${e}</span>${nom}</button>`).join('');
  const sel = $('#selVoyage');
  $('#choixVoyage').hidden = !S.voyages.length;
  sel.innerHTML = [...S.voyages].sort((a, b) => (a.debut || '9').localeCompare(b.debut || '9'))
    .map(v => `<option value="${v.id}"${v.id === S.actif ? ' selected' : ''}>${typeVoyage(v.type)[1]} ${esc(v.nom)}</option>`).join('');
  const f = VUES.find(x => x[0] === vue)[3];
  $('#contenu').innerHTML = `<div class="vue">${f()}</div>`;
  fermerBullePays();
  if (vue === 'globe' && modeGlobe === 'globe') { Globe.rafraichir(); Globe.monter($('#globe'), ouvrirBullePays); }
  tic();
}
function aller(id) {
  vue = id; ecrire('naotrip.vue', id);
  history.replaceState(null, '', '#' + id);
  rendre();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function modifie(message) { sauver(); rendre(); if (message) toast(message); }

/* ---------- le compte à rebours, rafraîchi chaque seconde ---------- */
function tic() {
  $$('[data-decompte]').forEach(el => {
    let d = Math.max(0, +el.dataset.decompte - Date.now()) / 1000;
    const j = Math.floor(d / 86400); d -= j * 86400;
    const h = Math.floor(d / 3600); d -= h * 3600;
    const m = Math.floor(d / 60), s = Math.floor(d - m * 60);
    const put = (u, v) => { const b = el.querySelector(`[data-u="${u}"]`); if (b && b.textContent !== String(v)) b.textContent = v; };
    put('j', j); put('h', pad(h)); put('m', pad(m)); put('s', pad(s));
  });
}
setInterval(tic, 1000);

/* ============================================================
   LES VOYAGES
   ============================================================ */
function champsVoyage() {
  return [
    { k: 'nom', l: 'Nom du voyage', ph: 'Week-end à Lisbonne', req: true, large: true },
    { k: 'destination', l: 'Destination', ph: 'Lisbonne, Portugal' },
    { k: 'type', l: 'Type de voyage', t: 'select', o: TYPES_VOYAGE.map(([id, e, l]) => [id, e + ' ' + l]) },
    { k: 'debut', l: 'Date de départ', t: 'date' },
    { k: 'fin', l: 'Date de retour', t: 'date' },
    { k: 'heureDepart', l: 'Heure de départ', t: 'time', aide: 'Pour un compte à rebours à la seconde' },
    { k: 'devise', l: 'Monnaie du budget', t: 'select', o: DEVISES },
    { k: 'pays', l: 'Pays visités pendant ce voyage', t: 'puces', liste: NOMS_PAYS, ph: 'Tapez un pays puis Entrée…',
      afficher: c => PAYS[c] ? PAYS[c].nom : c, convertir: s => { const p = paysDeNom(s); return p ? p.code : null; }, aide: 'Ils apparaîtront sur votre globe' },
    { k: 'voyageurs', l: 'Voyageurs', t: 'puces', ph: 'Prénom puis Entrée…', afficher: p => p.nom, convertir: s => ({ id: uid(), nom: s }) },
    { k: 'notes', l: 'Notes', t: 'textarea', ph: 'Envies, contraintes, idées générales…' }];
}
ACT['nouveau-voyage'] = () => formulaire({
  titre: 'Créer un voyage', emoji: '✈️', sous: 'Destination, dates et voyageurs — le reste viendra au fil de la préparation.',
  champs: champsVoyage(), valeurs: { type: 'vacances', devise: 'EUR', voyageurs: [{ id: uid(), nom: 'Moi' }] }, bouton: 'Créer le voyage',
  verifier: x => x.debut && x.fin && x.fin < x.debut ? 'La date de retour est avant le départ.' : null,
  enregistrer: x => {
    const v = normaliserVoyage(Object.assign({}, x, { id: uid(), creeLe: auj() }));
    if (v.debut && !v.fin) v.fin = v.debut;
    v.documents = DOCUMENTS_BASE.map(nom => ({ id: uid(), nom, fait: false }));
    v.taches = TACHES_BASE.map(([nom, j]) => ({ id: uid(), nom, jMoins: j, fait: false }));
    S.voyages.push(v); S.actif = v.id;
    vue = 'accueil';
    modifie('Bon voyage en préparation ! ✈️');
  }
});
ACT['editer-voyage'] = el => {
  const v = trouver(S.voyages, el.dataset.id); if (!v) return;
  formulaire({
    titre: 'Modifier le voyage', emoji: '🧭', champs: champsVoyage(), valeurs: v,
    verifier: x => x.debut && x.fin && x.fin < x.debut ? 'La date de retour est avant le départ.' : null,
    enregistrer: x => {
      /* les voyageurs retirés disparaissent aussi des dépenses et de la valise */
      Object.assign(v, x); if (v.debut && !v.fin) v.fin = v.debut;
      modifie('Voyage mis à jour');
    },
    supprimer: () => ACT['suppr-voyage'](el)
  });
};
ACT['suppr-voyage'] = async el => {
  const v = trouver(S.voyages, el.dataset.id); if (!v) return;
  if (!await confirmer(`Supprimer « ${v.nom} » ?`, 'Planning, réservations, valise, budget et carnet souvenir de ce voyage seront effacés.')) return;
  instantane();
  S.voyages = S.voyages.filter(x => x.id !== v.id);
  if (S.actif === v.id) S.actif = null;
  sauver(); rendre(); toast('Voyage supprimé', { annuler: true });
};
ACT['dupliquer-voyage'] = el => {
  const v = trouver(S.voyages, el.dataset.id); if (!v) return;
  const c = normaliserVoyage(JSON.parse(JSON.stringify(v)));
  Object.assign(c, { id: uid(), nom: v.nom + ' (copie)', debut: '', fin: '', creeLe: auj(), depenses: [], reservations: [], planning: [], souvenirs: [] });
  ['valise', 'documents', 'taches'].forEach(k => c[k].forEach(x => { x.id = uid(); x.fait = false; }));
  c.idees.forEach(x => { x.id = uid(); x.jour = ''; x.statut = 'idee'; });
  S.voyages.push(c); S.actif = c.id; modifie('Voyage dupliqué : valise, papiers et idées sont repris');
};
ACT['ouvrir-voyage'] = el => { S.actif = el.dataset.id; sauver(); aller('accueil'); };

/* ============================================================
   RÉSERVATIONS
   ============================================================ */
const estTransport = x => typeResa(x.type)[3] === 'transport';
ACT['ajout-resa'] = el => formResa(null, el);
ACT['editer-resa'] = el => formResa(trouver((voyage() || {}).reservations, el.dataset.id));
function formResa(r, el) {
  const v = voyage(); if (!v) { toast('Créez d’abord un voyage'); return ACT['nouveau-voyage'](); }
  const vals = r ? Object.assign({}, r) : { type: 'vol', debut: v.debut ? v.debut + 'T09:00' : '', depense: true };
  formulaire({
    titre: r ? 'Modifier la réservation' : 'Ajouter une réservation', emoji: '🎫', sous: v.nom,
    champs: [
      { k: 'type', l: 'Type', t: 'select', o: TYPES_RESA.map(([id, e, l]) => [id, e + ' ' + l]) },
      { k: 'titre', l: 'Intitulé', ph: 'Vol AF1024 Paris → Lisbonne', req: true },
      { k: 'debut', t: 'datetime-local', lab: x => x.type === 'hebergement' ? 'Check-in' : estTransport(x) ? 'Départ' : 'Début' },
      { k: 'fin', t: 'datetime-local', lab: x => x.type === 'hebergement' ? 'Check-out' : estTransport(x) ? 'Arrivée' : 'Fin' },
      { k: 'embarquement', l: 'Embarquement', t: 'datetime-local', si: estTransport },
      { k: 'porte', l: 'Terminal, porte, voie', ph: 'Terminal 2E', si: estTransport },
      { k: 'lieu', lab: x => estTransport(x) ? 'Départ de' : 'Lieu', ph: 'Paris-CDG' },
      { k: 'arrivee', l: 'Arrivée à', ph: 'Lisbonne', si: estTransport },
      { k: 'adresse', l: 'Adresse', ph: 'Rua…', large: true, si: x => !estTransport(x) },
      { k: 'reference', l: 'N° de réservation', ph: 'ABC123' },
      { k: 'telephone', l: 'Téléphone', t: 'tel' },
      { k: 'lien', l: 'Lien de la réservation', t: 'url', ph: 'https://…', large: true },
      { k: 'prix', l: `Prix (${v.devise})`, t: 'number' },
      { k: 'depense', l: 'Compter ce prix dans les dépenses du budget', t: 'case', si: x => nombre(x.prix) > 0 },
      { k: 'notes', l: 'Notes', t: 'textarea' }],
    valeurs: vals,
    enregistrer: x => {
      const cible = r || { id: uid() };
      Object.assign(cible, x);
      if (!r) v.reservations.push(cible);
      /* la dépense liée suit la réservation */
      const liee = v.depenses.find(d => d.resaId === cible.id);
      if (cible.depense && nombre(cible.prix) > 0) {
        const cat = { transport: 'transport', hebergement: 'hebergement' }[typeResa(cible.type)[3]] || (cible.type === 'restaurant' ? 'restauration' : 'activites');
        const d = liee || { id: uid(), resaId: cible.id, payePar: (v.voyageurs[0] || {}).id || '', pour: [] };
        Object.assign(d, { libelle: cible.titre, montant: nombre(cible.prix), categorie: cat, date: d.date || (cible.debut || auj()).slice(0, 10) });
        if (!liee) v.depenses.push(d);
      } else if (liee) v.depenses = v.depenses.filter(d => d !== liee);
      modifie(r ? 'Réservation mise à jour' : 'Réservation ajoutée 🎫');
    },
    supprimer: r ? () => { instantane(); v.reservations = v.reservations.filter(x => x !== r); v.depenses = v.depenses.filter(d => d.resaId !== r.id); sauver(); rendre(); toast('Réservation supprimée', { annuler: true }); } : null
  });
}

/* ============================================================
   PLANNING
   ============================================================ */
function formPlan(p, jour) {
  const v = voyage(); if (!v) return;
  const jours = listeJours(v.debut, v.fin);
  formulaire({
    titre: p ? 'Modifier l’activité' : 'Ajouter au planning', emoji: '🗓️', sous: v.nom,
    champs: [
      { k: 'titre', l: 'Activité', ph: 'Visite du château', req: true, large: true },
      { k: 'type', l: 'Type', t: 'select', o: TYPES_PLAN.map(([id, e, l]) => [id, e + ' ' + l]) },
      jours.length ? { k: 'jour', l: 'Jour', t: 'select', o: jours.map((j, i) => [j, `J${i + 1} · ${fmtJour(j)}`]) } : { k: 'jour', l: 'Jour', t: 'date' },
      { k: 'heure', l: 'Heure', t: 'time' },
      { k: 'lieu', l: 'Lieu', ph: 'Adresse ou quartier' },
      { k: 'notes', l: 'Notes', t: 'textarea' }],
    valeurs: p || { type: 'visite', jour: jour || (jours.includes(auj()) ? auj() : jours[0]) },
    enregistrer: x => { if (p) Object.assign(p, x); else v.planning.push(Object.assign({ id: uid(), fait: false }, x)); modifie(p ? 'Planning mis à jour' : 'Ajouté au planning'); },
    supprimer: p ? () => supprimerDe('planning', p.id) : null
  });
}
ACT['ajout-plan'] = el => formPlan(null, el.dataset.jour);
ACT['editer-plan'] = el => formPlan(trouver(voyage().planning, el.dataset.id));

/* ============================================================
   LISTES À COCHER : valise, documents, tâches
   ============================================================ */
ACT['basculer'] = el => {
  const v = voyage(); const x = trouver(v && v[el.dataset.liste], el.dataset.id); if (!x) return;
  x.fait = !x.fait; sauver();
  if (x.fait && el.dataset.liste === 'valise' && v.valise.every(y => y.fait)) toast('Valise bouclée ! 🎉 Bon voyage.');
  rendre();
};
function supprimerDe(liste, id) {

  v[liste] = v[liste].filter(x => x.id !== id);
  sauver(); rendre(); toast('Retiré', { annuler: true });
}
ACT['suppr'] = el => supprimerDe(el.dataset.liste, el.dataset.id);

function formValise(x, cat) {
  const v = voyage(); if (!v) return;

    titre: x ? 'Modifier' : 'Ajouter à la valise', emoji: '🧳',
    champs: [{ k: 'nom', l: 'Affaire', ph: 'Maillot de bain', req: true, large: true },
      { k: 'cat', l: 'Catégorie', t: 'select', o: CATS_VALISE.map(([id, e, l]) => [id, e + ' ' + l]) },
      { k: 'qte', l: 'Quantité', t: 'number' },
      { k: 'qui', l: 'Pour qui', t: 'select', o: [['', 'Tout le monde'], ...v.voyageurs.map(p => [p.id, p.nom])], si: () => v.voyageurs.length > 1 }],

ACT['ajout-valise'] = el => formValise(null, el.dataset.cat);
ACT['editer-valise'] = el => formValise(trouver(voyage().valise, el.dataset.id));
ACT['filtre-valise'] = el => { filtreValise = el.dataset.qui; rendre(); };
ACT['vider-valise'] = () => { const v = voyage(); instantane(); v.valise.forEach(x => x.fait = false); sauver(); rendre(); toast('Tout est décoché — prêt pour la valise du retour', { annuler: true }); };
ACT['generer-valise'] = () => {
  const v = voyage(); if (!v) return ACT['nouveau-voyage']();

  formulaire({
    titre: 'Générer une liste de base', emoji: '✨', sous: `Pour ${pluriel(nbJ, 'jour')} — vous pourrez tout ajuster ensuite.`,
    champs: [{ k: 'climat', l: 'Climat', t: 'select', o: [['tempere', '🌤️ Tempéré'], ['chaud', '☀️ Chaud'], ['froid', '❄️ Froid']] },
      { k: 'opts', l: 'Au programme', t: 'cases', o: [['plage', '🏖️ Plage / piscine'], ['rando', '🥾 Randonnée'], ['soiree', '🌙 Sorties habillées'], ['enfants', '🧸 Enfants'], ['avion', '✈️ Avion'], ['voiture', '🚗 Voiture']] }],
    valeurs: { climat: 'tempere', opts: [v.type === 'famille' ? 'enfants' : '', v.reservations.some(r => r.type === 'vol') ? 'avion' : '', v.reservations.some(r => r.type === 'voiture') ? 'voiture' : ''].filter(Boolean) },
    bouton: 'Générer',
    enregistrer: x => {
      const o = x.opts || [], j = Math.min(nbJ, 7);
      const l = [['documents', "Pièce d'identité / passeport"], ['documents', 'Carte bancaire et un peu d’espèces'], ['documents', 'Billets et réservations'], ['documents', 'Carte d’assurance'],
        ['vetements', `Sous-vêtements (${nbJ + 1})`], ['vetements', `Chaussettes (${nbJ + 1})`], ['vetements', `Hauts / t-shirts (${j})`], ['vetements', 'Pantalons / jupes'], ['vetements', 'Pyjama'], ['vetements', 'Chaussures confortables'], ['vetements', 'Une petite veste'],
        ['toilette', 'Brosse à dents & dentifrice'], ['toilette', 'Gel douche & shampoing'], ['toilette', 'Déodorant'], ['toilette', 'Brosse / peigne'], ['toilette', 'Produits de maquillage / rasage'],
        ['sante', 'Médicaments habituels'], ['sante', 'Petite trousse de secours'], ['sante', 'Mouchoirs'],
        ['electronique', 'Téléphone & chargeur'], ['electronique', 'Batterie externe'], ['electronique', 'Écouteurs'],
        ['divers', 'Gourde'], ['divers', 'Sac pour le linge sale'], ['divers', 'Lunettes de soleil']];
      if (x.climat === 'chaud') l.push(['vetements', 'Shorts'], ['vetements', 'Chapeau / casquette'], ['plage', 'Crème solaire'], ['vetements', 'Sandales']);
      if (x.climat === 'froid') l.push(['vetements', 'Manteau chaud'], ['vetements', 'Bonnet, écharpe, gants'], ['vetements', 'Pull épais'], ['sante', 'Baume à lèvres']);
      if (o.includes('plage')) l.push(['plage', 'Maillot de bain'], ['plage', 'Serviette de plage'], ['plage', 'Crème solaire'], ['plage', 'Tongs'], ['plage', 'Après-soleil']);
      if (o.includes('rando')) l.push(['vetements', 'Chaussures de marche'], ['divers', 'Petit sac à dos'], ['vetements', 'Coupe-vent'], ['sante', 'Pansements ampoules']);
      if (o.includes('soiree')) l.push(['vetements', 'Tenue habillée'], ['vetements', 'Chaussures de soirée']);
      if (o.includes('enfants')) l.push(['enfants', 'Doudou'], ['enfants', 'Couches / lingettes'], ['enfants', 'Jeux et livres pour le trajet'], ['enfants', 'Goûters'], ['enfants', 'Carnet de santé'], ['enfants', 'Vêtements de rechange']);
      if (o.includes('avion')) l.push(['divers', 'Oreiller de voyage'], ['toilette', 'Pochette liquides (100 ml)'], ['electronique', 'Adaptateur de prise']);
      if (o.includes('voiture')) l.push(['documents', 'Permis de conduire'], ['divers', 'Playlist & câble voiture'], ['divers', 'En-cas pour la route']);
      const deja = new Set(v.valise.map(y => sansAccent(y.nom)));
      let n = 0;
      l.forEach(([cat, nom]) => { if (!deja.has(sansAccent(nom))) { deja.add(sansAccent(nom)); v.valise.push({ id: uid(), cat, nom, fait: false }); n++; } });
      if (vue !== 'accueil') vue = 'valise';
      modifie(`${pluriel(n, 'affaire ajoutée', 'affaires ajoutées')} ✨`);
    }
  });
};

function formDoc(x) {
  const v = voyage(); if (!v) return;
  formulaire({
    titre: x ? 'Modifier le document' : 'Ajouter un document', emoji: '🪪',
    champs: [{ k: 'nom', l: 'Document', ph: 'Visa, carte grise…', req: true, large: true },

  });
}
ACT['ajout-documents'] = () => formDoc(null);
ACT['editer-documents'] = el => formDoc(trouver(voyage().documents, el.dataset.id));
function formTache(x) {

function decor() {
  const svg = $('#motifs'), W = innerWidth, H = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const noms = Object.keys(ICONES);
  let hasard = 7; const alea = () => (hasard = (hasard * 9301 + 49297) % 233280) / 233280;
  const cols = Math.max(3, Math.round(W / 260)), rangs = Math.max(3, Math.round(H / 230));
  let m = '';
  /* une grille jetée au hasard : chaque motif dans sa case, jamais deux collés */
  for (let r = 0; r < rangs; r++) for (let c = 0; c < cols; c++) {
    if (alea() < .38) continue;
    const n = noms[Math.floor(alea() * noms.length)], t = 26 + alea() * 22;
    const x = (c + .15 + alea() * .7) * W / cols, y = (r + .15 + alea() * .7) * H / rangs;
    m += `<g class="m" style="opacity:${(.07 + alea() * .08).toFixed(2)};animation-duration:${(16 + alea() * 16).toFixed(1)}s;animation-delay:-${(alea() * 20).toFixed(1)}s"><g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${(alea() * 40 - 20).toFixed(0)}) scale(${(t / 24).toFixed(2)})">${ICONES[n]}</g></g>`;
  }
  /* le ciel étoilé */
  for (let i = 0; i < 26; i++) {
    const x = alea() * W, y = alea() * H * .75, s = 1.6 + alea() * 2.6;
    m += `<path class="etoile" style="animation-duration:${(2.5 + alea() * 4).toFixed(1)}s;animation-delay:-${(alea() * 5).toFixed(1)}s" d="M${x} ${y - s}Q${x + s * .18} ${y - s * .18} ${x + s} ${y}Q${x + s * .18} ${y + s * .18} ${x} ${y + s}Q${x - s * .18} ${y + s * .18} ${x - s} ${y}Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z"/>`;
  }
  /* les vols : un sillage en pointillés et un petit avion qui le suit */
  const vols = [[-60, H * .28, W * .45, H * .02, W + 60, H * .2, 38, 0], [W + 60, H * .72, W * .5, H * .5, -60, H * .62, 52, 14], [-60, H * .9, W * .35, H * .55, W + 60, H * .45, 64, 30]];
  m += '<g class="vols">' + vols.map(([x1, y1, cx, cy, x2, y2, dur, del], i) => {
    const d = `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`;
    return `<path id="vol${i}" class="sillage" d="${d}"/><g class="avion"><g transform="rotate(90) scale(.95) translate(-12 -12)">${ICONES.avion.replace('class="plein" ', '')}</g>
      <animateMotion dur="${dur}s" begin="-${del}s" repeatCount="indefinite" rotate="auto"><mpath href="#vol${i}"/></animateMotion></g>`;
  }).join('') + '</g>';
  svg.innerHTML = m;
}
let minuteurDecor = null;
window.addEventListener('resize', () => { clearTimeout(minuteurDecor); minuteurDecor = setTimeout(decor, 300); });

decor();
rendre();

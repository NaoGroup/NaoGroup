<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../naogroup-cloud.js" data-outil="naotrip"></script>
<!-- Accès de test (temporaire, à retirer une fois Supabase branché) -->
<script src="../naogroup-local-auth.js" data-outil="naotrip"></script>
<title>NaoTrip — Préparez le départ, profitez du voyage</title>
<meta name="description" content="NaoTrip, l'organisateur de voyages de NaoGroup : compte à rebours, planning jour par jour, réservations, valise, budget partagé, documents, idées, carnet souvenir et globe des pays visités.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235B45CF'/><stop offset='.55' stop-color='%239A86EE'/><stop offset='1' stop-color='%23C9B2F7'/></linearGradient></defs><rect width='40' height='40' rx='13' fill='url(%23g)'/><rect x='8' y='8.4' width='8.4' height='6.4' rx='1.7' fill='%23fff'/><path d='M10.7 8.4V7.2Q10.7 6.1 11.8 6.1H12.6Q13.7 6.1 13.7 7.2V8.4' fill='none' stroke='%23fff' stroke-width='1.3'/><path d='M28.2 4.6L33.6 7.4L28.6 9.9L29.6 7.6Z' fill='%23fff'/><path d='M12 31.5V19L28 31.5V19' fill='none' stroke='%23fff' stroke-width='4.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('naotrip.theme') || 'dark'; if (localStorage.getItem('naotrip.calme') === '1') document.documentElement.classList.add('calme'); } catch (e) {}</script>
<link rel="stylesheet" href="naotrip.css">
</head>
<body>

<!-- Le décor : halos, ciel étoilé, motifs de voyage qui dérivent, avions qui traversent. -->
<div class="halos" aria-hidden="true"><i></i><i></i><i></i></div>
<svg class="motifs" id="motifs" aria-hidden="true"></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- NaoGroup -->
  <linearGradient id="ggr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F55D0"/><stop offset="1" stop-color="#C39BF3"/></linearGradient>
  <symbol id="l-gr" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="13" fill="url(#ggr)"/>
    <path d="M12 27V11L28 25V9.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff" opacity=".6"><circle cx="10.5" cy="31.5" r="1.9"/><circle cx="16.3" cy="33.2" r="1.9"/><circle cx="22.4" cy="33.2" r="1.9"/><circle cx="28.2" cy="31.5" r="1.9"/></g>
  </symbol>
  <!-- NaoTrip : au-dessus du N, une petite valise d'où part un trajet en pointillés
       qui s'envole en avion de papier — l'organisation, puis l'évasion. -->
  <linearGradient id="gtr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B45CF"/><stop offset=".55" stop-color="#9A86EE"/><stop offset="1" stop-color="#C9B2F7"/></linearGradient>
  <radialGradient id="gtr-lueur"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <symbol id="l-tr" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="13" fill="url(#gtr)"/>
    <circle cx="30.6" cy="7.4" r="5.2" fill="url(#gtr-lueur)" opacity=".6"/>
    <rect x="8" y="8.4" width="8.4" height="6.4" rx="1.7" fill="#fff" opacity=".93"/>
    <path d="M10.7 8.4V7.2Q10.7 6.1 11.8 6.1H12.6Q13.7 6.1 13.7 7.2V8.4" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".93"/>
    <path d="M10.6 9.5V13.7M13.8 9.5V13.7" stroke="#7C66DD" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
    <path d="M18.4 11.4Q23.2 4.4 28.2 7.1" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray=".1 2.5" opacity=".8"/>
    <path d="M28.4 4.4L33.8 7.6L28.5 10.2L29.7 7.5Z" fill="#fff" transform="rotate(14 30.6 7.4)"/>
    <path d="M12 31.5V19L28 31.5V19" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</defs></svg>

<div class="page">
  <header class="bar">
    <a class="mark" href="../NaoGroup.html" title="Revenir à NaoGroup" aria-label="NaoTrip — revenir à NaoGroup">
      <svg viewBox="0 0 40 40" role="img" aria-label="NaoTrip"><use href="#l-tr"/></svg>
      <div><h1 class="nom-outil">Nao<span>Trip</span></h1><div class="sub">Préparez le départ, profitez du voyage</div></div>
    </a>
    <div class="outils-haut">
      <label class="pastille choix-voyage" id="choixVoyage" title="Le voyage affiché">
        <span aria-hidden="true">🧭</span><select id="selVoyage" aria-label="Voyage affiché"></select>
      </label>
      <a class="pastille" href="../NaoGroup.html" title="Revenir à NaoGroup"><svg viewBox="0 0 40 40"><use href="#l-gr"/></svg> NaoGroup</a>
      <button class="pastille icone" type="button" data-act="sauvegarder" title="Sauvegarder mes voyages dans un fichier">💾</button>
      <button class="pastille icone" type="button" data-act="recharger" title="Recharger une sauvegarde">📂</button>
      <button class="pastille icone" type="button" data-act="reinitialiser" title="Réinitialiser l'outil (tout effacer)">🧹</button>
      <button class="pastille icone" type="button" data-act="calme" id="btnCalme" title="Mettre les animations en pause">🕊️</button>
      <button class="theme" type="button" data-act="theme" id="btnTheme" aria-label="Basculer thème clair / sombre" title="Thème clair / sombre"><span class="pouce"></span><span class="lune">☾</span><span class="soleil">☀</span></button>
    </div>
  </header>

  <nav class="onglets" id="onglets" aria-label="Sections de NaoTrip"></nav>

  <main id="contenu" tabindex="-1"></main>

  <footer class="pied">
    <svg viewBox="0 0 40 40" aria-hidden="true"><use href="#l-tr"/></svg>
    <div>Un outil de la maison <a href="../NaoGroup.html">NaoGroup</a> · vos voyages restent sur cet ordinateur.</div>
  </footer>
</div>

<div class="voile" id="modale" role="dialog" aria-modal="true" aria-labelledby="modaleTitre"><div class="fen" id="modaleFen"></div></div>
<div class="bulle-pays" id="bullePays" role="dialog" aria-label="Statut du pays"></div>
<div class="infobulle" id="infobulle" aria-hidden="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="fichierSauvegarde" accept="application/json,.json" hidden>
<input type="file" id="fichierPhotos" accept="image/*" multiple hidden>

<script type="application/json" id="donnees-monde">@@MONDE@@</script>
<script type="application/json" id="donnees-pays">@@PAYS@@</script>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="nt-core.js"></script>
<script src="nt-monde.js"></script>
<script src="nt-vues.js"></script>
<script src="nt-app.js"></script>
</body>
</html>

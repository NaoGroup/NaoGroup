<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaoGroup — page introuvable</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#F3EFFB;font-family:Georgia,serif;
  background:radial-gradient(1200px 820px at 50% 34%,#7564C2 0%,#43358A 42%,#1C1636 100%)}
.c{text-align:center;max-width:420px}
svg{width:72px;height:72px;border-radius:22px;box-shadow:0 18px 40px -16px rgba(0,0,0,.8)}
h1{margin:18px 0 8px;font-size:28px;font-style:italic;color:#fff}
p{margin:0 0 20px;color:rgba(243,239,251,.78)}
a{display:inline-block;font:600 14px -apple-system,Segoe UI,Arial,sans-serif;text-decoration:none;color:#1C1636;
  background:linear-gradient(135deg,#C9B7F5,#EBDFFD);border-radius:999px;padding:12px 24px}
</style>
</head>
<body>
<div class="c">
  <svg viewBox="0 0 40 40" role="img" aria-label="NaoGroup">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F55D0"/><stop offset="1" stop-color="#C39BF3"/></linearGradient></defs>
    <rect width="40" height="40" rx="13" fill="url(#g)"/>
    <path d="M12 27V11L28 25V9.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff" opacity=".6"><circle cx="10.5" cy="31.5" r="1.9"/><circle cx="16.3" cy="33.2" r="1.9"/><circle cx="22.4" cy="33.2" r="1.9"/><circle cx="28.2" cy="31.5" r="1.9"/></g>
  </svg>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être ancien, ou mal recopié.</p>
  <a id="accueil" href="NaoGroup.html">Retour à l'accueil NaoGroup</a>
</div>
<script>
/* Servie depuis n'importe quelle profondeur d'adresse : on retrouve la racine du site
   (/NaoGroup/ sur github.io, / sur un nom de domaine propre). */
(function () {
  var seg = location.pathname.split('/');
  var base = /\.github\.io$/.test(location.hostname) ? '/' + seg[1] + '/' : '/';
  document.getElementById('accueil').href = base + 'NaoGroup.html';
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../naogroup-cloud.js" data-outil="naodaily"></script>
<!-- Accès de test (temporaire, à retirer une fois Supabase branché) -->
<script src="../naogroup-local-auth.js" data-outil="naodaily"></script>
<title>NaoDaily — Le quotidien, simplement organisé</title>
<meta name="description" content="NaoDaily, l'organisateur du quotidien de NaoGroup : mes listes, menus & courses, cadeaux & occasions, réunis dans une seule page « Aujourd'hui ».">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234F37C9'/><stop offset='.5' stop-color='%236F7FEF'/><stop offset='1' stop-color='%23C7B1F7'/></linearGradient></defs><rect width='40' height='40' rx='13' fill='url(%23g)'/><g fill='%23fff' opacity='.6'><circle cx='9.8' cy='9.5' r='1.7'/><circle cx='14.2' cy='9.5' r='1.7'/><circle cx='18.6' cy='9.5' r='1.7'/></g><circle cx='27.5' cy='9.5' r='4.6' fill='none' stroke='%23fff' stroke-width='2.2' opacity='.35'/><path d='M27.5 4.9A4.6 4.6 0 1 1 22.9 9.5' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/><path d='M12 31.5V19L28 31.5V19' fill='none' stroke='%23fff' stroke-width='4.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script>try { var r = document.documentElement; r.dataset.theme = localStorage.getItem('naodaily.theme') || 'dark'; if (localStorage.getItem('naodaily.calme') === '1') r.classList.add('calme'); if (localStorage.getItem('naodaily.grand') === '1') r.classList.add('grand'); } catch (e) {}</script>
<link rel="stylesheet" href="naodaily.css">
</head>
<body>

<!-- Le décor : halos, ciel étoilé, et de petites listes qui se cochent toutes seules. -->
<div class="halos" aria-hidden="true"><i></i><i></i><i></i></div>
<svg class="motifs" id="motifs" aria-hidden="true"></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- NaoGroup -->
  <linearGradient id="ggr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F55D0"/><stop offset="1" stop-color="#C39BF3"/></linearGradient>
  <symbol id="l-gr" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="13" fill="url(#ggr)"/>
    <path d="M12 27V11L28 25V9.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff" opacity=".6"><circle cx="10.5" cy="31.5" r="1.9"/><circle cx="16.3" cy="33.2" r="1.9"/><circle cx="22.4" cy="33.2" r="1.9"/><circle cx="28.2" cy="31.5" r="1.9"/></g>
  </symbol>
  <!-- NaoDaily : au-dessus du N, trois points bien rangés — les trois espaces du quotidien —
       et un cercle de planning aux trois quarts parcouru : la journée qui avance, tranquillement. -->
  <linearGradient id="gda" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F37C9"/><stop offset=".5" stop-color="#6F7FEF"/><stop offset="1" stop-color="#C7B1F7"/></linearGradient>
  <radialGradient id="gda-lueur"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <symbol id="l-da" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="13" fill="url(#gda)"/>
    <circle cx="27.5" cy="9.5" r="7" fill="url(#gda-lueur)" opacity=".5"/>
    <g fill="#fff" opacity=".55"><circle cx="9.8" cy="9.5" r="1.7"/><circle cx="14.2" cy="9.5" r="1.7"/><circle cx="18.6" cy="9.5" r="1.7"/></g>
    <circle cx="27.5" cy="9.5" r="4.6" fill="none" stroke="#fff" stroke-width="2.2" opacity=".35"/>
    <path d="M27.5 4.9A4.6 4.6 0 1 1 22.9 9.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12 31.5V19L28 31.5V19" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</defs></svg>

<!-- l'entrée dans l'outil : la journée se coche, et le logo se construit à chaque coche -->
<div class="intro" id="intro" role="presentation" title="Toucher pour entrer">
  <div class="intro-fond"></div>
  <span class="univers" aria-hidden="true">📝</span><span class="univers" aria-hidden="true">🛒</span><span class="univers" aria-hidden="true">🎁</span>
  <div class="scene">
    <div class="intro-onde"></div>
    <svg class="intro-jeton" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="13" fill="url(#gda)"/>
      <circle class="lueur" cx="27.5" cy="9.5" r="7" fill="url(#gda-lueur)"/>
      <g fill="#fff"><circle class="pt" cx="9.8" cy="9.5" r="1.7"/><circle class="pt" cx="14.2" cy="9.5" r="1.7"/><circle class="pt" cx="18.6" cy="9.5" r="1.7"/></g>
      <circle cx="27.5" cy="9.5" r="4.6" fill="none" stroke="#fff" stroke-width="2.2" opacity=".35"/>
      <path class="anneau" pathLength="100" d="M27.5 4.9A4.6 4.6 0 1 1 27.5 14.1A4.6 4.6 0 1 1 27.5 4.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path class="n" pathLength="100" d="M12 31.5V19L28 31.5V19" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="intro-carte">
      <div class="tete"><b>Ma journée</b><small id="introDate"></small></div>
      <div class="tache"><span class="case"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="lib">📝 Mes listes<i class="barre-l"></i></span></div>
      <div class="tache"><span class="case"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="lib">🍽️ Menus &amp; courses<i class="barre-l"></i></span></div>
      <div class="tache"><span class="case"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="lib">🎁 Cadeaux &amp; occasions<i class="barre-l"></i></span></div>
    </div>
    <div class="phrase" aria-label="Le quotidien, simplement organisé."></div>
    <div class="passer">Toucher pour entrer</div>
  </div>
</div>

<div class="page">
  <header class="bar">
    <a class="mark" href="../NaoGroup.html" title="Revenir à NaoGroup" aria-label="NaoDaily — revenir à NaoGroup">
      <svg viewBox="0 0 40 40" role="img" aria-label="NaoDaily"><use href="#l-da"/></svg>
      <div><h1 class="nom-outil">Nao<span>Daily</span></h1><div class="sub">Le quotidien, simplement organisé</div></div>
    </a>
    <div class="outils-haut">
      <a class="pastille" href="../NaoGroup.html" title="Revenir à NaoGroup"><svg viewBox="0 0 40 40"><use href="#l-gr"/></svg> NaoGroup</a>
      <button class="pastille icone" type="button" data-act="sauvegarder" title="Sauvegarder mon quotidien dans un fichier">💾</button>
      <button class="pastille icone" type="button" data-act="recharger" title="Recharger une sauvegarde ou ouvrir un partage reçu">📂</button>
      <button class="pastille icone" type="button" data-act="reinitialiser" title="Réinitialiser l'outil (repartir de zéro)" aria-label="Réinitialiser l'outil">♻️</button>
      <button class="pastille icone" type="button" data-act="grand" id="btnGrand" title="Agrandir le texte">A+</button>
      <button class="pastille icone" type="button" data-act="calme" id="btnCalme" title="Mettre les animations en pause">🕊️</button>
      <button class="theme" type="button" data-act="theme" id="btnTheme" aria-label="Basculer thème clair / sombre" title="Thème clair / sombre"><span class="pouce"></span><span class="lune">☾</span><span class="soleil">☀</span></button>
    </div>
  </header>

  <nav class="onglets" id="onglets" aria-label="Espaces de NaoDaily"></nav>

  <main id="contenu" tabindex="-1"></main>

  <footer class="pied">
    <a href="../NaoGroup.html" title="Revenir à NaoGroup" aria-label="Revenir à NaoGroup" style="display:flex"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#l-da"/></svg></a>
    <div>Un outil de la maison <a href="../NaoGroup.html">NaoGroup</a> · sans compte, sans abonnement : votre quotidien reste sur cet ordinateur.</div>
  </footer>
</div>

<div class="voile" id="modale" role="dialog" aria-modal="true" aria-labelledby="modaleTitre"><div class="fen" id="modaleFen"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="impression" aria-hidden="true"></div>
<input type="file" id="fichierSauvegarde" accept="application/json,.json,.naodaily" hidden>
<input type="file" id="fichierPhoto" accept="image/*" hidden>

<script src="nd-core.js"></script>
<script src="nd-vues.js"></script>
<script src="nd-nutrition.js"></script>
<script src="nd-recettes.js"></script>
<script src="nd-app.js"></script>
</body>
</html>

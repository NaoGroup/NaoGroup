<head>
<meta charset="utf-8">

<title>NaoAgenda — La bonne date, au bon moment.</title>
<meta name="description" content="NaoAgenda — agenda personnel et professionnel de NaoGroup : rendez-vous, tâches, anniversaires, échéances.">

<script>try { document.documentElement.dataset.theme = localStorage.getItem('naoagenda.theme') || 'dark'; } catch (e) {}</script>
<style>
/* ============================================================
   NaoAgenda — charte NaoGroup
   Thème sombre (par défaut) : fond étoilé violet profond, jamais de noir.
   Thème clair : le lilas pâle de NaoBudget.
   Mêmes cartes translucides et lueurs lavande dans les deux.
   ============================================================ */
:root{
  --sans:Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --PX:50px;

  --g1:#8E7BD4; --g2:#C39BF3;
  --fond:radial-gradient(1250px 900px at 50% 16%, #6A59BC 0%, #3B2E7E 42%, #161129 100%);
  --fond-uni:#171230;
  --grille:rgba(255,255,255,.13);
  --halo-1:#B9A8F0; --halo-2:#60ccc1; --halo-3:#ed7483; --ho1:.34; --ho2:.16; --ho3:.15;
  --etoile:#FFFFFF; --ciel-o:1; --motif:#DCD2FB; --motif-o:.22; --toile:rgba(255,255,255,.62);
  --titre:#FFFFFF; --ink:#F3EFFB; --ink-2:rgba(243,239,251,.74); --ink-3:rgba(243,239,251,.5);
  --verre:rgba(255,255,255,.07); --verre-2:rgba(255,255,255,.12);
  --bord:rgba(255,255,255,.16); --bord-2:rgba(255,255,255,.3);
  --lilas:#C9B7F5;
  --creux:rgba(0,0,0,.22); --trait:rgba(255,255,255,.09); --trait-2:rgba(255,255,255,.06);
  --case:rgba(255,255,255,.035); --case-we:rgba(255,255,255,.02); --case-h:rgba(255,255,255,.08);
  --surface:rgba(30,23,60,.88); --champ:rgba(0,0,0,.25); --option:#2A2249;
  --fenetre:linear-gradient(160deg, rgba(64,50,128,.97), rgba(34,26,70,.98));
  --voile:rgba(16,11,36,.55);
  --or:#F3C969; --or-txt:#F3C969; --ambre:#E7BC6B; --ambre-txt:#E7BC6B; --retard:#F0919F; --vac:#4FC0B4;
  --ombre:0 26px 60px -30px rgba(0,0,0,.85);
  --lueur:0 0 0 1px rgba(201,183,245,.55), 0 0 28px -6px rgba(201,183,245,.7);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --g1:#8E7BD4; --g2:#C39BF3;
  --fond:radial-gradient(1400px 900px at 50% -8%, #E9E3F6 0%, #E1DAF2 44%, #ECE7F5 100%);
  --fond-uni:#ECE7F5;
  --grille:rgba(90,70,170,.12);
  --halo-1:#C9B7F5; --halo-2:#8FD8D2; --halo-3:#F3AEC0; --ho1:.2; --ho2:.1; --ho3:.1;
  --etoile:#8A72D8; --ciel-o:.4; --motif:#5E46B8; --motif-o:.11; --toile:rgba(80,62,150,.4);
  --titre:#1B1628; --ink:#241F33; --ink-2:#4C4563; --ink-3:#6C6585;
  --verre:rgba(251,250,254,.86); --verre-2:#FDFCFF;
  --bord:#CFC4E6; --bord-2:#B5A6DC;
  --lilas:#5B42B8;
  --creux:rgba(90,70,170,.09); --trait:rgba(90,70,170,.2); --trait-2:rgba(90,70,170,.12);
  --case:#FAF8FD; --case-we:#F1EDF8; --case-h:#FFFFFF;
  --surface:#FBFAFE; --champ:#FFFFFF; --option:#FFFFFF;
  --fenetre:linear-gradient(160deg, #FDFCFF, #F1ECFA);
  --voile:rgba(40,30,80,.35);
  --or:#E0AE3A; --or-txt:#8A5E0E; --ambre:#E0AE55; --ambre-txt:#8C5A0C; --retard:#B03A54; --vac:#137F75;
  --ombre:0 1px 2px rgba(36,31,51,.06), 0 12px 30px -18px rgba(60,45,120,.4);
  --lueur:0 0 0 1.5px #7C64D0, 0 0 18px -8px rgba(90,70,170,.5);
  color-scheme:light;
}
/* En clair, le fond pastel est adouci : moins lumineux, moins saturé,
   pour ne pas éblouir. */
:root[data-theme="light"] .fond{filter:brightness(.97) saturate(.8)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--ink);font-family:var(--sans);font-style:italic;font-size:14.5px;line-height:1.55;
  background:var(--fond-uni);overflow-x:hidden;transition:background-color .3s}
input,select,button,textarea{font-family:var(--ui);font-style:normal;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--titre)}

/* ---------- Le fond étoilé ---------- */
.fond{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--fond)}
.fond::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, var(--grille) 1px, transparent 1.7px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 26%, #000 0 30%, transparent 74%);
  mask-image:radial-gradient(circle at 50% 26%, #000 0 30%, transparent 74%)}
.fond>i{position:absolute;border-radius:50%;filter:blur(70px);animation:flotte 16s ease-in-out infinite alternate}
.fond>i:nth-child(1){width:480px;height:480px;background:var(--halo-1);left:4%;top:4%;opacity:var(--ho1)}
.fond>i:nth-child(2){width:420px;height:420px;background:var(--halo-2);right:5%;bottom:4%;opacity:var(--ho2);animation-duration:19s}
.fond>i:nth-child(3){width:360px;height:360px;background:var(--halo-3);right:26%;top:-9%;opacity:var(--ho3);animation-duration:23s}
.ciel{position:absolute;inset:0;opacity:var(--ciel-o)}
.ciel b{position:absolute;border-radius:50%;background:var(--etoile);animation:scintille ease-in-out infinite}
.ciel b.gros{box-shadow:0 0 6px 1px color-mix(in srgb, var(--etoile) 80%, transparent)}
/* Les petits motifs de l'agenda — calendrier, horloge, cloche, coche,
   étoile, gâteau — qui dérivent lentement, très en retrait. */
.motifs{position:absolute;inset:0;overflow:hidden}
.motifs svg,.motifs .emo{position:absolute;color:var(--motif);opacity:0;animation:derive linear infinite;will-change:transform;line-height:1}
.motifs .emo{filter:saturate(.85)}
@keyframes flotte{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,-34px) scale(1.18)}}
@keyframes scintille{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1)}}
@keyframes derive{
  0%{opacity:0;transform:translate3d(0,40px,0) rotate(var(--r0)) scale(.9)}
  12%{opacity:var(--o)}
  88%{opacity:var(--o)}
  100%{opacity:0;transform:translate3d(var(--dx),-130px,0) rotate(var(--r1)) scale(1.05)}}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes coche{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes miroite{0%{background-position:-160% 0}100%{background-position:260% 0}}

/* ---------- L'entrée : l'éphéméride s'effeuille jusqu'à aujourd'hui ----------
   Même principe que NaoDoc : un voile plein écran, une petite scène, et on
   entre. Un clic n'importe où passe l'animation ; elle ne joue pas du tout
   si le système demande de réduire les mouvements. */
.intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--fond);background-color:var(--fond-uni);
  cursor:pointer;animation:introSort .8s 3.5s cubic-bezier(.6,0,.3,1) forwards}
.intro::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, var(--grille) 1px, transparent 1.7px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 66%);mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 66%)}
@keyframes introSort{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.intro .scene{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;perspective:1600px}
/* la lueur qui respire derrière l'éphéméride */
.intro .halo{position:absolute;left:50%;top:92px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(185,165,245,.55), rgba(185,165,245,0) 68%);filter:blur(18px);
  animation:haloEntre 1.2s cubic-bezier(.2,.8,.2,1) both, haloRespire 3.2s 1.2s ease-in-out infinite alternate}
@keyframes haloEntre{from{opacity:0;transform:scale(.4)}to{opacity:.75;transform:none}}
@keyframes haloRespire{to{opacity:.4;transform:scale(1.12)}}
/* le jeton se pose au-dessus du bloc, puis respire */
.intro .jeton{position:relative;width:62px;height:62px;border-radius:21px;box-shadow:0 18px 36px -14px rgba(20,10,60,.85), 0 0 34px -8px rgba(185,165,245,.7);
  animation:jetonTombe .85s cubic-bezier(.2,1.3,.4,1) both, jetonFlotte 3s .9s ease-in-out infinite alternate}
@keyframes jetonTombe{from{opacity:0;transform:translateY(-46px) rotate(-22deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes jetonFlotte{to{transform:translateY(-6px)}}
.ephe{position:relative;width:216px;height:244px;transform-style:preserve-3d;
  animation:epheArrive .8s .12s cubic-bezier(.2,.9,.25,1.05) both, epheFlotte 4.5s 1s ease-in-out infinite alternate}
@keyframes epheArrive{from{opacity:0;transform:translateY(40px) rotateX(26deg) scale(.86)}to{opacity:1;transform:rotateX(8deg)}}
@keyframes epheFlotte{from{transform:rotateX(8deg) translateY(0)}to{transform:rotateX(5deg) translateY(-7px)}}
.ephe .socle{position:absolute;inset:0;border-radius:20px;background:linear-gradient(165deg, #fff 0%, #F1EAFE 100%);
  box-shadow:0 36px 64px -28px rgba(20,10,60,.95), inset 0 0 0 1px rgba(114,87,207,.14)}
.ephe .ombre-sol{position:absolute;left:8%;right:8%;bottom:-26px;height:30px;border-radius:50%;background:rgba(20,10,50,.5);filter:blur(16px);
  animation:ombreEntre .8s .12s ease both}
@keyframes ombreEntre{from{opacity:0;transform:scaleX(.5)}}
.ephe .bande{position:absolute;left:0;right:0;top:0;height:54px;border-radius:20px 20px 0 0;overflow:hidden;
  background:linear-gradient(135deg,#6A4ED0,#C7A6F6);display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.95)}
.ephe .bande::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);
  background-size:220% 100%;background-repeat:no-repeat;animation:miroite 2.4s 1.6s ease-in-out 2}
.ephe .bande .annee{font-weight:600;letter-spacing:.14em;opacity:.75}
.ephe .anneau{position:absolute;top:-10px;width:9px;height:24px;border-radius:5px;background:linear-gradient(180deg,#F8F5FF,#B9A5F5);
  box-shadow:0 3px 6px rgba(0,0,0,.45);animation:anneau .55s .35s cubic-bezier(.2,1.7,.5,1) both}
.ephe .anneau.g{left:54px}.ephe .anneau.d{right:54px;animation-delay:.45s}
@keyframes anneau{from{opacity:0;transform:translateY(16px) scaleY(.4)}}
.ephe .feuille{position:absolute;left:0;right:0;top:54px;bottom:0;border-radius:0 0 20px 20px;background:linear-gradient(165deg,#fff,#F6F1FE);
  transform-origin:top center;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:inset 0 14px 18px -16px rgba(60,40,140,.5), 0 10px 20px -16px rgba(20,10,60,.6)}
.ephe .feuille b{font-family:var(--ui);font-size:70px;font-weight:800;line-height:1;color:#3A2C78;letter-spacing:-.045em}
.ephe .feuille i{font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8A7CB8}
/* les trois feuilles de la veille s'arrachent une à une */
.ephe .arrachee{animation:arrache .55s cubic-bezier(.45,0,.3,1) forwards}
.ephe .f3{animation-delay:.9s}.ephe .f2{animation-delay:1.18s}.ephe .f1{animation-delay:1.46s}
@keyframes arrache{
  18%{transform:rotateX(-14deg) rotateZ(1.5deg)}
  100%{transform:rotateX(-118deg) rotateZ(-4deg) translateY(26px);opacity:0}}
/* la feuille d'aujourd'hui : elle reste, et c'est elle qu'on célèbre */
.ephe .aujourdhui{overflow:hidden}
.ephe .aujourdhui b{background:linear-gradient(135deg,#6A4ED0,#B48CF2);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:posePop .55s 1.85s cubic-bezier(.2,1.6,.4,1) both}
@keyframes posePop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.ephe .aujourdhui i{animation:monte .5s 2s ease both}
.ephe .aujourdhui .jour{font-family:var(--sans);font-style:italic;font-size:15px;color:#6A5A9E;margin-top:5px;animation:monte .5s 2.15s ease both}
.ephe .aujourdhui .lustre{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);background-size:260% 100%;background-repeat:no-repeat;
  animation:miroite 1.4s 2.1s ease-in-out}
/* les petits événements qui se posent dans la journée */
.ephe .pastilles{position:absolute;left:0;right:0;bottom:15px;display:flex;justify-content:center;gap:6px;z-index:3}
.ephe .pastilles i{width:24px;height:6px;border-radius:999px;background:var(--c);opacity:0;box-shadow:0 2px 8px -2px var(--c);
  animation:pastilleEntre .5s cubic-bezier(.2,1.6,.45,1) forwards;animation-delay:calc(2.25s + var(--i) * .09s)}
@keyframes pastilleEntre{from{opacity:0;transform:translateX(var(--vol)) scaleX(.15)}to{opacity:.95;transform:none}}
.ephe .etincelle{position:absolute;right:-18px;top:36px;font-size:24px;color:var(--or);opacity:0;text-shadow:0 0 16px rgba(243,201,105,.8);
  animation:etincelleEntre .65s 2.5s cubic-bezier(.2,1.7,.45,1) forwards, scintille 2.2s 3.15s ease-in-out infinite}
@keyframes etincelleEntre{from{opacity:0;transform:scale(.2) rotate(-80deg)}to{opacity:1;transform:none}}
.intro .titre{font-family:var(--sans);font-style:italic;font-size:31px;color:var(--titre);letter-spacing:-.02em;
  animation:monte .7s 2.35s ease both}
.intro .titre span{color:var(--lilas)}
.intro .phrase{margin-top:-16px;font-family:var(--sans);font-style:italic;font-size:18px;color:var(--ink-2);text-align:center;max-width:90vw;
  animation:monte .8s 2.6s ease both}
.intro .phrase span{color:var(--lilas)}
.intro .passer{position:absolute;bottom:-62px;font-family:var(--ui);font-size:11px;color:var(--ink-3);letter-spacing:.08em;
  animation:monte .6s 1.6s ease both, respirePasser 2.4s 2.2s ease-in-out infinite}
@keyframes respirePasser{0%,100%{opacity:.5}50%{opacity:1}}
body.entree .shell{animation:emerge .9s 3.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes emerge{from{opacity:0;transform:translateY(22px) scale(.985)}}
@media (max-width:560px){.ephe{width:172px;height:196px}.ephe .feuille b{font-size:56px}.ephe .anneau.g{left:42px}.ephe .anneau.d{right:42px}
  .intro .jeton{width:52px;height:52px;border-radius:17px}.intro .halo{width:300px;height:300px;margin:-150px 0 0 -150px}
  .intro .titre{font-size:25px}.intro .phrase{font-size:16px}}

/* ---------- En-tête et navigation ---------- */
.shell{max-width:1640px;margin:0 auto;padding:20px 24px 50px}
.entete{display:flex;align-items:center;gap:18px;flex-wrap:wrap;animation:monte .6s ease both}
.retour{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--ink-2);
  display:grid;place-items:center;font-size:19px;text-decoration:none;transition:.2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.retour:hover{background:var(--verre-2);border-color:var(--bord-2);color:var(--titre);transform:translateX(-3px)}
.marque{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.marque svg{width:54px;height:54px;border-radius:18px;flex:none;box-shadow:0 14px 30px -14px rgba(40,20,90,.8), 0 0 30px -8px rgba(185,165,245,.55)}
.marque h1{font-size:28px;letter-spacing:-.02em;line-height:1.1}
.marque h1 span{color:var(--lilas)}
.slogan{font-size:14.5px;color:var(--ink-2)}
.pages{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--creux);border:1px solid var(--bord);margin-left:12px}
.pages button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;transition:.2s}
.pages button:hover{color:var(--titre)}
.pages button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636;box-shadow:0 8px 20px -10px rgba(142,123,212,.9)}
.pages .pastille-n{font-size:10.5px;font-weight:800;min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;
  background:rgba(240,127,149,.9);color:#fff}
.spacer{flex:1}
.outils-mini{display:flex;gap:8px;align-items:center}
.rond{width:40px;height:40px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);display:grid;place-items:center;
  font-size:16px;transition:.2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.rond:hover{background:var(--verre-2);border-color:var(--bord-2);transform:translateY(-1px)}
.theme{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--bord);background:var(--creux);padding:0;transition:.3s}
.theme .pouce{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 12px -4px rgba(114,87,207,.9);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
:root[data-theme="light"] .theme .pouce{transform:translateX(28px);background:linear-gradient(135deg,#F3C969,#F3AEC0)}

.barre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 16px;animation:monte .6s .06s ease both}
.salut{font-size:17px;color:var(--ink-2);margin-right:auto}
.salut b{color:var(--titre);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:650;
  border:1px solid var(--bord);background:var(--verre);color:var(--ink);transition:.2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:var(--verre-2);border-color:var(--bord-2);transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.plein{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636;border-color:transparent;box-shadow:0 10px 26px -12px rgba(142,123,212,.9)}
.btn.plein:hover{box-shadow:0 12px 30px -10px rgba(142,123,212,1)}
.btn .plus{font-size:17px;line-height:1;font-weight:500}
.btn.petit{padding:7px 13px;font-size:12.5px}
.btn.danger{color:var(--retard);border-color:color-mix(in srgb, var(--retard) 40%, transparent)}
.btn.danger.plein{background:linear-gradient(135deg,#E7738B,#F3AEC0);color:#3A0F1C}

.bandeau-fete{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;margin:16px 0 0;
  padding:12px 18px;border-radius:18px;border:1px solid color-mix(in srgb, var(--or) 50%, transparent);color:var(--titre);font-family:var(--sans);font-style:italic;font-size:15px;text-align:left;
  background:linear-gradient(100deg, color-mix(in srgb, var(--or) 18%, transparent), rgba(201,183,245,.2) 50%, rgba(243,174,192,.18));animation:monte .6s ease both}
.bandeau-fete::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.3) 50%, transparent 70%);background-size:60% 100%;background-repeat:no-repeat;
  animation:miroite 3.8s ease-in-out infinite}
.bandeau-fete .em{font-size:22px}
.bandeau-fete small{margin-left:auto;font-family:var(--ui);font-style:normal;font-size:12px;color:var(--ink-2)}
.bandeau-fete .scint{color:var(--or-txt);animation:scintille 1.8s ease-in-out infinite}

/* ---------- Cartes ---------- */
.carte{background:var(--verre);border:1px solid var(--bord);border-radius:24px;padding:18px 20px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--ombre);animation:monte .5s ease both}
.tableau{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.tableau .carte:nth-child(2){animation-delay:.05s}.tableau .carte:nth-child(3){animation-delay:.1s}.tableau .carte:nth-child(4){animation-delay:.15s}
.carte-t{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.carte-t h2{font-size:19px;letter-spacing:-.01em}
.carte-t .em{font-size:19px}
.carte-t .compte{margin-left:auto;font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-2);
  background:var(--creux);border:1px solid var(--bord);padding:2px 9px;border-radius:999px}
.sous{font-size:13px;color:var(--ink-3);margin:-8px 0 10px}
.vide{font-size:14px;color:var(--ink-3);padding:6px 0 2px}

/* ---------- Calendrier ---------- */
.cal-barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-titre{font-size:26px;letter-spacing:-.02em;min-width:230px}
.cal-titre span{color:var(--lilas)}
.fleche{width:36px;height:36px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);font-size:18px;display:grid;place-items:center;transition:.2s}
.fleche:hover{background:var(--verre-2)}
.segment{display:inline-flex;background:var(--creux);border:1px solid var(--bord);border-radius:999px;padding:3px;margin-left:auto}
.segment button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink-2);transition:.2s}
.segment button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636}
.jsem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:7px}
.jsem div{font-family:var(--ui);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.mois{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cell{position:relative;min-height:max(122px, calc((100vh - 360px) / var(--sem, 6)));border-radius:14px;padding:6px 6px 5px;background:var(--case);border:1px solid var(--trait);
  cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;gap:3px;min-width:0;animation:pop .3s ease both}
.cell:hover{background:var(--case-h);border-color:var(--bord-2)}
/* Les jours des mois voisins : nettement en retrait, pour que le mois
   affiché se détache d'un coup d'œil. */
/* le filtre plutôt que l'opacité : l'animation d'entrée des cases anime
   l'opacité, elle écraserait le réglage */
.cell.autre{filter:opacity(.5) saturate(.6);background:none;border-style:dashed;
  border-color:color-mix(in srgb, var(--trait) 65%, transparent)}
.cell.autre .num{color:var(--ink-3);font-weight:600}
.cell.autre:hover{filter:opacity(.9) saturate(.9);background:var(--trait-2)}
.mois-voisin{display:block;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:-2px}
.cell.autre .num{height:auto;border-radius:9px;line-height:1.1;padding:1px 0}
/* Masqués : il ne reste que le numéro, et des points pour dire qu'il s'y passe quelque chose */
.cell.muet{filter:opacity(.33) saturate(.4);cursor:default;background:none;border-color:transparent}
.cell.muet .cell-add,.cell.muet .badge-charge{display:none}
.cell.muet:hover{filter:opacity(.6) saturate(.6);background:none}
.muet-points{display:flex;gap:3px;flex-wrap:wrap;padding:2px 4px}
.muet-points i{width:5px;height:5px;border-radius:50%;opacity:.75}
.cell.we{background:var(--case-we)}
.cell.auj{border-color:transparent;box-shadow:var(--lueur);background:color-mix(in srgb, #C9B7F5 12%, var(--case))}
.cell.charge{background:linear-gradient(180deg, rgba(231,188,107,.2), rgba(231,188,107,.03) 75%);border-color:rgba(231,188,107,.5)}
/* Les vacances scolaires, en visuel : un fil turquoise qui court au-dessus des
   jours de la période — il enjambe les écarts entre les cases et reprend à la
   ligne suivante. */
/* Pas de case repeinte : seul le fil parle. Il est franc, il brille un peu,
   et deux petites équerres marquent le premier et le dernier jour. */
.vac-marque{position:absolute;inset:0;pointer-events:none;z-index:0}
.vac-marque::before{content:'';position:absolute;left:-9px;right:-9px;top:-6px;height:6px;background:var(--vac);
  box-shadow:0 0 14px -2px var(--vac), 0 0 0 1px color-mix(in srgb, var(--vac) 35%, transparent)}
.vac-marque.deb::before{left:-1px;border-radius:4px 0 0 4px}
.vac-marque.fin::before{right:-1px;border-radius:0 4px 4px 0}
.vac-marque.deb.fin::before{border-radius:4px}
.vac-marque.vdeb::after,.vac-marque.vfin::after{content:'';position:absolute;top:-6px;width:4px;height:17px;background:var(--vac);
  box-shadow:0 0 12px -3px var(--vac)}
.vac-marque.vdeb::after{left:-1px;border-radius:4px 0 2px 2px}
.vac-marque.vfin::after{right:-1px;border-radius:0 4px 2px 2px}
.cell.vac > *:not(.vac-marque){position:relative;z-index:1}
.cell.cible,.tl-ad.cible{box-shadow:inset 0 0 0 2px var(--lilas), 0 0 22px -6px var(--lilas);background:color-mix(in srgb, #C9B7F5 22%, var(--case))}
.cell-h{display:flex;align-items:center;gap:5px;min-height:24px}
.num{font-family:var(--ui);font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink-2);width:25px;height:25px;border-radius:50%;display:grid;place-items:center}
.auj .num{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636}
.badge-charge{font-family:var(--ui);font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:#2B1F0A;background:var(--ambre);padding:1px 6px;border-radius:999px;white-space:nowrap}
.cell-add{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--bord);background:var(--creux);font-size:14px;line-height:1;
  display:grid;place-items:center;opacity:0;transition:.2s;padding:0}
.cell:hover .cell-add{opacity:1}
.cell-add:hover{background:#B9A5F5;color:#1E1735}
.chip{display:flex;align-items:center;gap:5px;min-width:0;font-family:var(--ui);font-style:normal;font-size:12px;line-height:1.3;
  padding:2px 6px 2px 5px;border-radius:7px;background:color-mix(in srgb, var(--c) 22%, transparent);border:0;border-left:3px solid var(--c);
  color:var(--titre);cursor:pointer;transition:background .15s;text-align:left;width:100%;user-select:none;-webkit-user-select:none}
.chip[data-act=ev]{cursor:grab;touch-action:none}
.chip:hover{background:color-mix(in srgb, var(--c) 36%, transparent)}
.chip .h{color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.fait .t{text-decoration:line-through;opacity:.55}
.chip.fait{opacity:.7}
.chip.anniv{--c:var(--or)}
.chip.brille{background:linear-gradient(100deg, color-mix(in srgb, var(--or) 22%, transparent), color-mix(in srgb, var(--or) 50%, transparent), color-mix(in srgb, var(--or) 22%, transparent));
  background-size:200% 100%;animation:miroite 3s linear infinite}
.chip .tache-ic{flex:none;width:9px;height:9px;border-radius:50%;border:1.6px solid var(--c)}
.chip.fait .tache-ic{background:var(--c)}
.encore{font-family:var(--ui);font-style:normal;font-size:11px;color:var(--ink-2);background:none;border:0;text-align:left;padding:1px 4px}
.encore:hover{color:var(--titre)}

/* La barre d'outils du calendrier : les réglages qu'on cherche, bien en vue */
.cal-outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.btn-outil{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-style:normal;font-size:13px;font-weight:650;color:var(--ink);
  border:1px solid color-mix(in srgb, var(--g2) 45%, var(--bord));border-radius:999px;padding:8px 15px 8px 9px;transition:.2s;
  background:linear-gradient(120deg, color-mix(in srgb, var(--g1) 18%, transparent), color-mix(in srgb, var(--g2) 10%, transparent))}
.btn-outil b{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-size:14px;
  background:color-mix(in srgb, var(--g2) 28%, transparent)}
.btn-outil:hover{border-color:var(--g2);transform:translateY(-1px);box-shadow:0 8px 20px -12px var(--g1)}
.rappel-outil{font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink-2);
  background:var(--creux);border:1px solid var(--bord);border-radius:999px;padding:5px 11px}
@media (max-width:620px){.btn-outil{flex:1 1 auto;justify-content:center;font-size:12px;padding:7px 11px 7px 7px}}
.cal-pied{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;align-items:center}
.cal-pied .filtre{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--bord);background:var(--creux);
  padding:5px 11px 5px 9px;border-radius:999px;color:var(--ink);transition:.2s}
.cal-pied .filtre i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px -1px var(--c)}
.cal-pied .filtre.off{opacity:.38;text-decoration:line-through}
.cal-pied .aide{font-size:12.5px;color:var(--ink-3);flex-basis:100%;margin-top:2px}
.cal-pied .vider{margin-left:auto;display:flex;gap:7px}

/* Semaine / jour */
.tl{border-radius:16px;overflow:hidden;border:1px solid var(--trait);background:var(--creux)}
.tl-g{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.tl-top{border-bottom:1px solid var(--trait)}
.tl-jour{border:0;background:transparent;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2);border-left:1px solid var(--trait-2)}
.tl-jour span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tl-jour b{font-size:20px;color:var(--titre);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.tl-jour.auj b{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636;box-shadow:0 0 20px -4px rgba(142,123,212,.9)}
.tl-jour.charge{background:linear-gradient(180deg, rgba(231,188,107,.2), transparent)}
.tl-jour:hover{background:var(--trait-2)}
.tl-lbl{font-family:var(--ui);font-style:normal;font-size:10px;color:var(--ink-3);padding:8px 4px;text-align:right}
.tl-ad{border-left:1px solid var(--trait-2);padding:5px 4px;display:flex;flex-direction:column;gap:3px;min-height:36px;min-width:0;transition:.15s}
.tl-adrow{border-bottom:1px solid var(--trait)}
.tl-scroll{max-height:max(560px, calc(100vh - 330px));overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bord-2) transparent}
.tl-body{position:relative}
.tl-heures{position:relative}
.tl-heures div{position:absolute;right:8px;transform:translateY(-7px);font-family:var(--ui);font-style:normal;font-size:10.5px;color:var(--ink-3)}
.tl-col{position:relative;border-left:1px solid var(--trait-2);
  background:repeating-linear-gradient(to bottom, var(--trait) 0 1px, transparent 1px var(--PX));cursor:copy}
.tl-col.auj{background-color:color-mix(in srgb, #C9B7F5 7%, transparent)}
.tl-col.charge{background-color:rgba(231,188,107,.07)}
.bloc{position:absolute;border-radius:9px;padding:4px calc(7px + var(--st,0px)) 4px 7px;overflow:hidden;cursor:grab;font-family:var(--ui);font-style:normal;font-size:12px;line-height:1.3;
  background:color-mix(in srgb, var(--c) 30%, var(--surface));border:1px solid color-mix(in srgb, var(--c) 60%, transparent);border-left:3px solid var(--c);
  color:var(--titre);transition:filter .15s;text-align:left;user-select:none;-webkit-user-select:none;touch-action:none}
.bloc:hover{filter:brightness(1.08);z-index:3}
.bloc b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bloc span{color:var(--ink-2);font-size:10.5px}
/* Un quart d'heure : titre et horaire tiennent sur une seule ligne */
.bloc.court{display:flex;align-items:baseline;gap:6px;padding-top:2px;padding-bottom:2px;line-height:1.25}
.bloc.court b{min-width:0;flex:1 1 auto}            /* le titre d'abord */
.bloc.court span{flex:0 2 auto;min-width:0;font-size:9.5px;white-space:nowrap;overflow:hidden}
/* sur un écran étroit, les colonnes sont minces : le titre passe avant le sticker */
@media (max-width:860px){.bloc.court .sticker{display:none}.bloc.court{padding-right:7px}}
.bloc.fait{opacity:.5}
.bloc.fait b{text-decoration:line-through}
.poignee{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.poignee::after{content:'';position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:var(--c);opacity:0;transition:.15s}
.bloc:hover .poignee::after{opacity:.9}
.maintenant{position:absolute;left:0;right:0;height:2px;background:var(--lilas);box-shadow:0 0 10px var(--lilas);z-index:4;pointer-events:none}
.maintenant::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--lilas)}
.alerte-charge{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;margin-bottom:12px;font-size:14px;color:var(--ink);
  background:rgba(231,188,107,.14);border:1px solid rgba(231,188,107,.45)}

/* Glisser-déposer */
body.glisse,body.glisse *{cursor:grabbing!important;user-select:none!important}
body.glisse.taille,body.glisse.taille *{cursor:ns-resize!important}
.source{opacity:.35}
.fantome{position:fixed!important;z-index:90;pointer-events:none;opacity:.94;box-shadow:0 18px 40px -12px rgba(20,10,60,.7), 0 0 0 2px var(--lilas)!important;
  transition:left .06s, top .06s;border-radius:9px}
.fantome .poignee{display:none}
.badge-glisse{position:fixed;z-index:91;pointer-events:none;font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap;
  padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636;box-shadow:0 8px 20px -8px rgba(40,20,90,.8)}

/* ---------- Listes des cartes ---------- */
.ligne{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:13px;transition:background .2s;min-width:0}
.ligne:hover{background:var(--trait-2)}
.ligne .heure{font-family:var(--ui);font-style:normal;font-size:12px;font-weight:700;color:var(--ink-2);width:40px;flex:none;font-variant-numeric:tabular-nums}
.ligne .txt{flex:1;min-width:0;cursor:pointer;border:0;background:none;padding:0;text-align:left;font-family:var(--sans);font-style:italic;font-size:14.5px;color:var(--ink)}
.ligne .txt b{display:block;font-weight:600;color:var(--titre);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .txt span{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne.fait .txt b{text-decoration:line-through;color:var(--ink-3)}
.coche{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--c, var(--lilas));background:transparent;display:grid;place-items:center;padding:0;transition:.2s}
.coche:hover{background:color-mix(in srgb, var(--c, #C9B7F5) 25%, transparent)}
.coche::after{content:'';width:9px;height:5px;border-left:2px solid #1C1636;border-bottom:2px solid #1C1636;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.fait .coche{background:var(--c, var(--lilas));animation:coche .35s ease}
.fait .coche::after{opacity:1}
.prio{flex:none;font-family:var(--ui);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.prio.haute{background:rgba(240,127,149,.18);color:#E7738B;border:1px solid rgba(240,127,149,.45)}
.prio.moyenne{background:rgba(201,183,245,.16);color:var(--lilas);border:1px solid rgba(155,130,232,.4)}
.prio.basse{background:var(--trait-2);color:var(--ink-3);border:1px solid var(--bord)}
.prio.retard{background:color-mix(in srgb, var(--retard) 16%, transparent);color:var(--retard);border:1px solid color-mix(in srgb, var(--retard) 45%, transparent)}
.progres{height:6px;border-radius:999px;background:var(--creux);overflow:hidden;margin:0 0 10px}
.progres i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 12px rgba(201,183,245,.7);transition:width .5s ease}
.ajout-rapide{display:flex;gap:8px;margin-top:10px}
.ajout-rapide input{flex:1;min-width:0}

.cal-mini{flex:none;width:42px;border-radius:11px;overflow:hidden;text-align:center;background:var(--creux);border:1px solid color-mix(in srgb, var(--or) 45%, transparent)}
.cal-mini small{display:block;font-family:var(--ui);font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:color-mix(in srgb, var(--or) 28%, transparent);color:var(--or-txt);padding:1px 0}
.cal-mini b{display:block;font-family:var(--ui);font-style:normal;font-size:16px;color:var(--titre);padding:2px 0 3px}
.dans{flex:none;font-family:var(--ui);font-style:normal;font-size:11px;font-weight:700;color:var(--ink-2);text-align:right}
.dans.proche{color:var(--or-txt)}

/* La page des anniversaires : une carte par personne, aux couleurs du mois */
.an-tete{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.an-tete h2{margin:0}
.an-tete .chapo{margin:4px 0 0}
.an-tete .btn{margin-left:auto}
.an-chiffres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.an-chiffres span{font-family:var(--ui);font-style:normal;font-size:11.5px;color:var(--ink-2);
  background:var(--creux);border:1px solid var(--trait);border-radius:999px;padding:5px 11px}
.an-chiffres b{color:var(--titre);font-weight:700}
.an-chiffres .moi{border-color:color-mix(in srgb, var(--or) 45%, transparent);color:var(--or-txt)}
.an-mois{margin-top:18px}
.an-mois h3{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-family:var(--ui);font-style:normal;font-size:12px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb, var(--a1) 55%, var(--titre))}
.an-mois h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, color-mix(in srgb, var(--a1) 45%, transparent), transparent)}
.an-mois h3 i{order:1;font-style:normal;font-size:10.5px;color:var(--ink-3)}
.an-sai{font-size:15px}
.an-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.an-c{position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:16px;cursor:pointer;
  background:linear-gradient(135deg, color-mix(in srgb, var(--a1) 16%, var(--verre)), var(--verre));
  border:1px solid color-mix(in srgb, var(--a1) 30%, var(--trait));transition:transform .16s, box-shadow .16s, border-color .16s;
  animation:pop .3s ease both}
.an-c:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--a1) 60%, transparent);box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}
.an-med{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(140deg, var(--a1), var(--a2));box-shadow:0 0 0 3px color-mix(in srgb, var(--a1) 22%, transparent)}
.an-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.an-txt b{font-family:var(--ui);font-style:normal;font-size:14px;color:var(--titre);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-quand{font-family:var(--ui);font-style:normal;font-size:11px;color:var(--ink-2)}
.an-cadeau{font-family:var(--ui);font-style:normal;font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-dans{flex:none;align-self:flex-start;font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:700;
  color:var(--ink-2);text-align:right;max-width:84px;margin-right:22px}
.an-dans.proche{color:var(--or-txt)}
.an-mod{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:50%;border:1px solid var(--bord);
  background:var(--creux);font-size:12px;line-height:1;cursor:pointer;opacity:.5;transition:opacity .15s, background .15s}
.an-c:hover .an-mod,.an-c:focus-within .an-mod{opacity:1}
.an-mod:hover{background:#B9A5F5;color:#1E1735}
.an-c.moi{border-color:color-mix(in srgb, var(--or) 55%, transparent);
  background:linear-gradient(135deg, color-mix(in srgb, var(--or) 20%, var(--verre)), var(--verre))}
.an-c.moi .an-med{background:linear-gradient(140deg, var(--or), #FFE6A8);box-shadow:0 0 0 3px color-mix(in srgb, var(--or) 28%, transparent)}
.an-c.auj{box-shadow:var(--lueur)}
@media (max-width:620px){.an-grille{grid-template-columns:1fr}.an-tete .btn{margin-left:0}}

.rebours{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  background:linear-gradient(135deg, color-mix(in srgb, var(--g1) 38%, transparent), color-mix(in srgb, var(--g2) 20%, transparent));border:1px solid rgba(155,130,232,.45)}
.rebours::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;right:-50px;top:-70px;background:#C9B7F5;filter:blur(40px);opacity:.35}
.rebours .lbl{font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lilas)}
.rebours h3{font-size:17px;margin:2px 0 8px;position:relative}
.compteur{display:flex;gap:8px;position:relative}
.compteur div{flex:1;text-align:center;background:var(--creux);border-radius:12px;padding:6px 0 4px}
.compteur b{display:block;font-family:var(--ui);font-style:normal;font-size:24px;font-weight:700;color:var(--titre);font-variant-numeric:tabular-nums;line-height:1.1}
.compteur span{font-family:var(--ui);font-style:normal;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.rebours .quand{font-size:12.5px;color:var(--ink-2);margin-top:8px;position:relative}
/* Le compte à rebours de MON anniversaire : doré, et à moi seule */
.rebours.moi{background:linear-gradient(135deg, color-mix(in srgb, var(--or) 30%, transparent), color-mix(in srgb, #F3AEC0 18%, transparent));
  border-color:color-mix(in srgb, var(--or) 55%, transparent)}
.rebours.moi::before{background:var(--or)}
.rebours.moi .lbl{color:var(--or-txt)}
.moi-jour{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:18px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--or) 26%, transparent), rgba(243,174,192,.18));
  border:1px solid color-mix(in srgb, var(--or) 50%, transparent)}
.moi-texte{flex:1;min-width:150px}
.moi-texte b{display:block;font-size:16px;color:var(--titre)}
.moi-texte span{display:block;font-size:13px;color:var(--ink-2)}
.memo{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:13px;cursor:pointer;border:0;background:none;width:100%;text-align:left;
  font-family:var(--sans);font-style:italic;font-size:14px;color:var(--ink)}
.memo:hover{background:var(--trait-2)}
.memo .em{font-size:17px;flex:none;width:24px;text-align:center}
.memo b{font-weight:600;color:var(--titre)}
.memo span{display:block;font-size:12.5px;color:var(--ink-3)}
.memo.ton-retard b{color:var(--retard)}
.memo.ton-charge b{color:var(--ambre-txt)}
.memo.ton-fete b{color:var(--or-txt)}
.jx{flex:none;margin-left:auto;font-family:var(--ui);font-style:normal;font-size:11px;font-weight:800;color:var(--lilas);background:rgba(201,183,245,.16);
  border-radius:999px;padding:2px 8px;align-self:center}

/* ---------- Fenêtres ---------- */
.voile{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--voile);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:pop .2s ease both}
.fenetre{width:min(580px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:26px;padding:22px 24px;
  background:var(--fenetre);border:1px solid var(--bord-2);box-shadow:0 40px 90px -30px rgba(20,10,50,.8), 0 0 60px -30px rgba(201,183,245,.6);
  animation:pop .28s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:thin}
.fenetre.etroite{width:min(440px,100%)}
.fenetre h2{font-size:22px;margin-bottom:4px}
.fenetre .chapo{font-size:14px;color:var(--ink-3);margin:0 0 16px}
.fenetre .chapo b{color:var(--ink)}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:1/-1}
.champ label,.champ .lab{font-family:var(--ui);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--champ);border:1px solid var(--bord);
  border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--lilas);box-shadow:0 0 0 3px rgba(155,130,232,.22)}
select option{background:var(--option);color:var(--ink)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans);font-style:italic}
.choix{display:flex;flex-wrap:wrap;gap:7px}
.choix label{cursor:pointer;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink)}
.choix input{position:absolute;opacity:0;pointer-events:none}
.choix span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--bord);background:var(--creux);transition:.2s}
.choix span i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.choix input:checked+span{background:color-mix(in srgb, var(--c, #C9B7F5) 28%, transparent);border-color:var(--c, var(--lilas));color:var(--titre);box-shadow:0 0 14px -4px var(--c, #C9B7F5)}
.choix input:focus-visible+span{outline:2px solid var(--lilas)}
.case{display:flex;align-items:center;gap:9px;font-family:var(--ui);font-style:normal;font-size:13.5px;color:var(--ink);cursor:pointer}
.case input{width:17px;height:17px;accent-color:#9B82E8}
.pied{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}
.pied .spacer{flex:1}
.seul-rdv,.seul-tache,.seul-travail,.seul-examen{display:contents}
form.rdv .seul-tache,form.rdv .seul-travail,form.rdv .seul-examen{display:none}
form.tache .seul-rdv,form.tache .seul-travail,form.tache .seul-examen{display:none}
form.travail .seul-tache,form.travail .seul-examen{display:none}
form.examen .seul-tache,form.examen .seul-travail{display:none}
.choix.illus{max-height:124px;overflow:auto;scrollbar-width:thin;padding:2px;border-radius:14px;background:var(--creux);border:1px solid var(--bord)}
.choix .em-seul{padding:5px 8px;font-size:16px;line-height:1.1}

/* ---------- La fête : toujours dans la nuit violette, quel que soit le thème ---------- */
.voile.fete{background:radial-gradient(circle at 50% 40%, rgba(90,70,170,.6), rgba(16,11,36,.82))}
#confettis{position:fixed;inset:0;z-index:0;pointer-events:none}
.carte-fete{--titre:#fff;--ink:#F3EFFB;--ink-2:rgba(243,239,251,.76);--ink-3:rgba(243,239,251,.52);--bord:rgba(255,255,255,.18);--bord-2:rgba(255,255,255,.3);
  --verre:rgba(255,255,255,.08);--verre-2:rgba(255,255,255,.14);--creux:rgba(0,0,0,.22);--lilas:#C9B7F5;--or-txt:#F3C969;
  position:relative;z-index:1;width:min(470px,100%);max-height:calc(100vh - 40px);overflow:auto;text-align:center;border-radius:30px;padding:26px 26px 22px;color:var(--ink);
  background:linear-gradient(165deg, rgba(86,66,168,.97), rgba(40,30,82,.98));border:1px solid rgba(243,201,105,.4);
  box-shadow:0 40px 100px -30px rgba(0,0,0,.95), 0 0 80px -20px rgba(243,201,105,.45);animation:ouvre .8s cubic-bezier(.2,.9,.25,1.15) both;scrollbar-width:thin}
@keyframes ouvre{0%{opacity:0;transform:perspective(900px) rotateX(38deg) translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
.carte-fete .etoile{position:absolute;color:#F3C969;animation:scintille ease-in-out infinite;pointer-events:none}
.gateau{width:150px;height:130px;margin:0 auto 4px;display:block;overflow:visible}
.flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flamme .9s ease-in-out infinite alternate}
.flamme:nth-of-type(2){animation-delay:-.3s}.flamme:nth-of-type(3){animation-delay:-.6s}
@keyframes flamme{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.86,1.12) rotate(3deg)}}
.halo-flamme{animation:respire 1.6s ease-in-out infinite alternate}
@keyframes respire{from{opacity:.35}to{opacity:.8}}
.carte-fete .sur{font-family:var(--ui);font-style:normal;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#F3C969}
.carte-fete h2{font-size:25px;margin:6px 0 2px;line-height:1.2}
.carte-fete .age{font-size:15.5px;color:var(--ink-2);margin-bottom:16px}
.bloc-msg{text-align:left;border-radius:18px;padding:14px 16px;background:rgba(0,0,0,.22);border:1px solid var(--bord);margin-bottom:10px}
.bloc-msg .lab{font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#C9B7F5;margin-bottom:6px}
.bloc-msg p{margin:0 0 10px;font-size:15px;line-height:1.55;color:#fff;animation:pop .35s ease both}
.bloc-msg .actions{display:flex;gap:8px;flex-wrap:wrap}
.bloc-cadeau{text-align:left;display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 16px;background:rgba(243,201,105,.1);border:1px solid rgba(243,201,105,.3);margin-bottom:14px}
.bloc-cadeau .em{font-size:24px}
.bloc-cadeau b{color:#fff;font-weight:600}
.bloc-cadeau span{display:block;font-size:13px;color:var(--ink-2)}

/* ---------- LE grand jour : votre anniversaire ---------- */
.voile.grande{background:radial-gradient(circle at 50% 30%, rgba(90,60,180,.5), rgba(10,6,26,.9))}
.feux{position:fixed;inset:0;z-index:0;pointer-events:none}
.grande-fete{position:relative;z-index:1;width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin}
.guirlande-fete{position:fixed;left:0;right:0;top:0;height:54px;pointer-events:none;z-index:2}
.guirlande-fete i{position:absolute;top:0;width:12px;height:19px;border-radius:0 0 50% 50%;background:var(--b);
  left:calc(var(--i) * 6.45% + 1%);transform-origin:50% 0;box-shadow:0 0 14px -3px var(--b);
  animation:fanionTombe .6s cubic-bezier(.2,1.6,.4,1) both, fanionBalance 3.4s ease-in-out infinite alternate;
  animation-delay:calc(var(--i) * .06s), calc(var(--i) * .12s)}
@keyframes fanionTombe{from{opacity:0;translate:0 -24px;scale:.5}}
@keyframes fanionBalance{from{rotate:-8deg}to{rotate:8deg}}
.fete-carte{--titre:#fff;--ink:#F3EFFB;--ink-2:rgba(243,239,251,.78);--ink-3:rgba(243,239,251,.55);--bord:rgba(255,255,255,.2);
  --creux:rgba(0,0,0,.26);--lilas:#F3C969;--surface:rgba(44,30,84,.9);
  position:relative;text-align:center;border-radius:32px;padding:30px 26px 22px;color:var(--ink);
  background:linear-gradient(170deg, rgba(104,70,196,.96), rgba(42,26,92,.98));
  border:2px solid rgba(243,201,105,.55);
  box-shadow:0 44px 110px -30px rgba(0,0,0,.95), 0 0 120px -20px rgba(243,201,105,.6), inset 0 0 60px -30px rgba(255,255,255,.5);
  animation:feteArrive 1s cubic-bezier(.2,1.1,.25,1.05) both}
@keyframes feteArrive{0%{opacity:0;transform:perspective(1000px) rotateX(34deg) scale(.82) translateY(60px)}
  60%{opacity:1}100%{opacity:1;transform:none}}
.fete-carte.voeu{animation:voeuPulse 1.4s ease-out}
@keyframes voeuPulse{0%{box-shadow:0 44px 110px -30px rgba(0,0,0,.95), 0 0 120px -20px rgba(243,201,105,.6)}
  35%{box-shadow:0 44px 110px -30px rgba(0,0,0,.95), 0 0 220px 10px rgba(255,240,180,.95)}
  100%{box-shadow:0 44px 110px -30px rgba(0,0,0,.95), 0 0 120px -20px rgba(243,201,105,.6)}}
.fete-carte .etoile{position:absolute;color:#F8E7B0;animation:scintille ease-in-out infinite;pointer-events:none}
.sur-moi{font-family:var(--ui);font-style:normal;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#F3C969;
  animation:monte .6s .3s ease both}
.fete-carte h2{font-size:30px;line-height:1.15;margin:8px 0 4px;animation:monte .7s .4s ease both;
  text-shadow:0 2px 20px rgba(243,201,105,.5)}
.fete-carte .prenom{background:linear-gradient(100deg,#F3C969,#FFF4D2 45%,#F3AEC0);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:38px;display:inline-block;animation:prenomPulse 2.6s ease-in-out infinite}
@keyframes prenomPulse{0%,100%{scale:1}50%{scale:1.045}}
.age-geant{display:flex;align-items:baseline;justify-content:center;gap:9px;margin:4px 0 2px;animation:monte .7s .55s ease both}
.age-geant b{font-family:var(--ui);font-style:normal;font-size:76px;font-weight:800;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(170deg,#FFF6D8,#F3C969 55%,#E8903E);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(243,201,105,.55));transition:scale .4s}
.age-geant b.arrive{animation:agePop .6s cubic-bezier(.2,1.7,.4,1)}
@keyframes agePop{0%{scale:1}45%{scale:1.22}100%{scale:1}}
.age-geant span{font-family:var(--ui);font-style:normal;font-size:19px;font-weight:700;color:var(--ink-2)}
.age-geant.petit b{font-size:52px}
.grande-fete .gateau{width:190px;height:165px;animation:gateauFlotte 3.6s ease-in-out infinite alternate}
@keyframes gateauFlotte{from{translate:0 0}to{translate:0 -9px}}
@keyframes souffle{to{opacity:0;scale:.3;translate:0 -14px}}
.souhait{margin-top:6px;animation:monte .7s .7s ease both}
@media (max-width:560px){.fete-carte h2{font-size:24px}.fete-carte .prenom{font-size:30px}.age-geant b{font-size:58px}
  .grande-fete .gateau{width:150px;height:130px}}

/* Les arrangements de garde */
.arr-liste{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:220px;overflow:auto;scrollbar-width:thin;padding-right:2px}
.arr-l{display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px;align-items:center}
.arr-l input[type=date]{padding:5px 7px;font-size:12px;width:auto}
.arr-l select,.arr-l input[type=text]{padding:6px 9px;font-size:12.5px}
.ruban.garde.arrange{border-left-style:double;border-left-width:5px}
.ruban.transit{--rc:#E8A05C;color:color-mix(in srgb,#E8A05C 62%, var(--titre));border-left-style:dashed;border-left-width:4px;
  background:linear-gradient(100deg, rgba(232,160,92,.3), rgba(232,160,92,.1));font-style:italic}
/* Les relais : qui récupère, qui dépose */
.relais-liste{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.relais-l{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto auto;gap:6px;align-items:center}
.relais-l select,.relais-l input{padding:6px 9px;font-size:12.5px;width:auto}
.relais-l input[type=text]{width:100%}
.chip.relais{--c:#E8A05C;border-left-style:dashed;border-left-width:4px;font-style:italic}
.bloc.relais{--c:#E8A05C;border-left-style:dashed;border-left-width:4px;
  background:color-mix(in srgb, var(--c) 22%, var(--surface))}
.bloc.relais b{font-weight:650}
@media (max-width:720px){.relais-l{grid-template-columns:1fr 1fr;gap:5px}}
@media (max-width:720px){.arr-l{grid-template-columns:1fr 1fr;gap:5px}}

/* ---------- Toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:380px;display:flex;gap:10px;align-items:center;padding:12px 14px 12px 16px;border-radius:16px;font-size:14px;color:var(--ink);
  background:var(--fenetre);border:1px solid var(--bord-2);box-shadow:0 18px 40px -16px rgba(20,10,50,.8), 0 0 30px -14px rgba(201,183,245,.8);animation:monte .35s ease both}
.toast .em{font-size:18px}
.toast b{color:var(--titre)}
.toast span{display:block;font-size:12.5px;color:var(--ink-2)}
.toast .btn{flex:none;margin-left:6px}
.toast.sort{animation:pop .25s ease reverse both}

/* Les tampons de journée, la bande de travail, les illustrations */
.tampon{align-self:flex-start;font-family:var(--ui);font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--sc);border:1.5px solid var(--sc);border-radius:7px;padding:1px 6px;transform:rotate(-3.5deg);
  background:color-mix(in srgb, var(--sc) 14%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sc) 20%, transparent);white-space:nowrap;max-width:100%;overflow:hidden}
.cell.tamponne{background:linear-gradient(170deg, color-mix(in srgb, var(--sc) 20%, transparent), transparent 70%);border-color:color-mix(in srgb, var(--sc) 45%, transparent)}
.jour-actions{display:flex;gap:8px;margin-bottom:12px}
/* Les rubans : jour férié, vacances scolaires, garde des enfants */
.ruban{display:inline-flex;align-items:center;gap:4px;align-self:stretch;font-family:var(--ui);font-style:normal;font-size:10px;font-weight:700;
  border-radius:4px 7px 7px 4px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--rc)}
.ruban.ferie{--rc:var(--or);color:var(--or-txt);background:linear-gradient(100deg, color-mix(in srgb, var(--or) 26%, transparent), color-mix(in srgb, var(--or) 10%, transparent))}
.ruban.vacances{--rc:#4FC0B4;color:color-mix(in srgb,#4FC0B4 60%, var(--titre));background:linear-gradient(100deg, rgba(79,192,180,.26), rgba(79,192,180,.09))}
.ruban.garde.moi{--rc:#E092F2;color:color-mix(in srgb,#E092F2 58%, var(--titre));background:linear-gradient(100deg, rgba(224,146,242,.28), rgba(224,146,242,.1))}
.ruban.garde.autre{--rc:var(--ink-3);color:var(--ink-3);background:var(--trait-2);opacity:.85}
.tl-rubans{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 3px;align-items:stretch}
.tl-rubans .ruban{font-size:9px;padding:1px 4px}
/* Fériés, vacances et garde : la fenêtre */
.sous-titre{font-size:16px;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--bord);color:var(--titre)}

/* ---------- L'aide : sommaire à gauche, fiche à droite ---------- */
.fenetre.aide{width:min(1000px,100%);height:min(720px, calc(100vh - 40px));padding:0;display:flex;flex-direction:column;overflow:hidden}
.aide-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 14px;border-bottom:1px solid var(--bord)}
.aide-h h2{margin:0;font-size:20px}
.aide-h input[type=search]{width:min(260px,100%);background:var(--champ);border:1px solid var(--bord);border-radius:999px;
  padding:9px 14px;font-size:13px;color:var(--ink);outline:none;transition:.2s;font-family:var(--ui);font-style:normal}
.aide-h input[type=search]:focus{border-color:var(--lilas);box-shadow:0 0 0 3px rgba(155,130,232,.22)}
.aide-corps{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.aide-nav{border-right:1px solid var(--bord);padding:12px;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:3px;background:var(--creux)}
.aide-n{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:13px;border:1px solid transparent;cursor:pointer;
  background:none;color:var(--ink-2);font-family:var(--ui);font-style:normal;font-size:13px;font-weight:600;text-align:left;transition:.15s}
.aide-n b{font-size:15px;font-weight:400;line-height:1}
.aide-n:hover{background:var(--verre);color:var(--ink)}
.aide-n.on{color:var(--titre);border-color:color-mix(in srgb, var(--g1) 50%, transparent);
  background:linear-gradient(120deg, color-mix(in srgb, var(--g1) 34%, transparent), color-mix(in srgb, var(--g2) 14%, transparent))}
.aide-p{padding:20px 26px 28px;overflow:auto;scrollbar-width:thin;outline:none}
.aide-fiche{animation:pop .28s ease both}
.aide-fiche h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:21px;color:var(--titre)}
.aide-em{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(140deg, var(--g1), var(--g2));box-shadow:0 8px 20px -12px var(--g1)}
.aide-chapo{margin:0 0 16px;font-size:14px;color:var(--ink-3)}
.aide-p p{margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--ink)}
.aide-p h4{margin:20px 0 9px;font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--lilas)}
.aide-etapes{counter-reset:ae;list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:9px}
.aide-etapes li{counter-increment:ae;position:relative;padding:9px 13px 9px 44px;border-radius:14px;font-size:13.5px;line-height:1.55;
  color:var(--ink);background:var(--verre);border:1px solid var(--trait)}
.aide-etapes li::before{content:counter(ae);position:absolute;left:11px;top:9px;width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:800;color:#1C1636;
  background:linear-gradient(140deg, var(--g1), var(--g2))}
.aide-liste{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px}
.aide-liste li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.aide-liste li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--lilas);opacity:.8}
.aide-liste b{color:var(--titre)}
.aide-astuce,.aide-ex{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;padding:11px 14px;border-radius:15px;font-size:13.5px;line-height:1.55}
.aide-astuce{background:color-mix(in srgb, var(--or) 14%, transparent);border:1px solid color-mix(in srgb, var(--or) 38%, transparent);color:var(--ink)}
.aide-ex{background:color-mix(in srgb, var(--lilas) 16%, transparent);border:1px solid color-mix(in srgb, var(--lilas) 38%, transparent);color:var(--ink);font-style:italic}
.aide-astuce span,.aide-ex span{font-size:16px;line-height:1.2;font-style:normal}
.aide-p kbd{display:inline-block;padding:1px 7px;border-radius:7px;border:1px solid var(--bord-2);background:var(--creux);
  font-family:var(--ui);font-style:normal;font-size:11.5px;font-weight:700;color:var(--titre)}
@media (max-width:760px){
  .fenetre.aide{height:calc(100vh - 24px)}
  .aide-corps{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .aide-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bord);padding:9px}
  .aide-n{width:auto;white-space:nowrap;flex:none}
  .aide-n b{font-size:14px}
  .aide-p{padding:16px 16px 22px}
}
.vac-liste{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:210px;overflow:auto;scrollbar-width:thin;padding-right:2px}
.vac-l{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.vac-l input[type=text]{padding:6px 9px;font-size:12.5px}
.vac-l input[type=date]{padding:5px 7px;font-size:12px;width:auto}
.aide-jours{font-family:var(--sans);font-style:italic;font-size:12px;color:var(--ink-3);align-self:center}
/* Le tampon : un jour, plusieurs jours précis, ou une période */
form.mode-un .mode-liste,form.mode-un .mode-periode,
form.mode-liste .mode-un,form.mode-liste .mode-periode,
form.mode-periode .mode-un,form.mode-periode .mode-liste{display:none}
.dates-choisies{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center;padding:6px;border-radius:13px;
  background:var(--creux);border:1px solid var(--bord)}
.date-puce{font-family:var(--ui);font-style:normal;font-size:12px;font-weight:650;color:var(--titre);
  background:color-mix(in srgb, var(--lilas) 22%, transparent);border:1px solid color-mix(in srgb, var(--lilas) 45%, transparent);
  border-radius:999px;padding:4px 10px;transition:.2s}
.date-puce:hover{background:color-mix(in srgb, var(--retard) 25%, transparent);border-color:var(--retard)}
@media (max-width:620px){.vac-l{grid-template-columns:1fr auto}}

/* les horaires de travail dans une case du mois */
.cell-taff{display:flex;align-items:center;gap:5px;align-self:stretch;font-family:var(--ui);font-style:normal;font-size:10.5px;font-weight:700;
  color:color-mix(in srgb, var(--sc) 55%, var(--titre));background:linear-gradient(100deg, color-mix(in srgb, var(--sc) 24%, transparent), color-mix(in srgb, var(--sc) 10%, transparent));
  border-left:3px solid color-mix(in srgb, var(--sc) 75%, transparent);border-radius:4px 7px 7px 4px;padding:2px 6px;white-space:nowrap;overflow:hidden}
.cell-taff b{font-size:11px;font-weight:400}
/* Mes horaires, jour par jour */
.jours-h{display:flex;flex-direction:column;gap:7px}
.jour-h{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:14px;
  background:var(--creux);border:1px solid var(--bord);transition:.2s}
.jour-h.on{border-color:color-mix(in srgb, var(--lilas) 50%, transparent);background:color-mix(in srgb, var(--lilas) 10%, transparent)}
.jour-h .jh-nom{font-family:var(--ui);font-style:normal;font-size:13px}
.jour-h .jh-nom b{color:var(--titre);font-weight:650}
.jh-plages{display:flex;flex-direction:column;gap:5px;min-width:0}
.jh-plages .plage{display:flex;align-items:center;gap:5px}
.jh-plages .plage input[type=time]{padding:5px 7px;font-size:12.5px;width:auto;min-width:92px}
.jh-plages .plage span{color:var(--ink-3);font-size:12px}
.jh-repos{font-family:var(--sans);font-style:italic;font-size:13px;color:var(--ink-3)}
.jh-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.jh-actions .btn{padding:5px 9px;font-size:11.5px}
.jour-h .rond.petit{width:26px;height:26px;font-size:11px}
.h-total{margin-top:12px;padding:10px 14px;border-radius:14px;font-family:var(--ui);font-style:normal;font-size:13px;color:var(--ink-2);
  background:color-mix(in srgb, var(--lilas) 12%, transparent);border:1px solid color-mix(in srgb, var(--lilas) 35%, transparent)}
.h-total b{color:var(--titre)}
@media (max-width:620px){.jour-h{grid-template-columns:1fr;gap:6px}.jh-actions{justify-content:flex-start}}
.tl-jour{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 8px;border-left:1px solid var(--trait-2);position:relative}
.tl-date{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2);padding:0}
.tl-date span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tl-date b{font-size:20px;color:var(--titre);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.tl-jour.auj .tl-date b{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1C1636;box-shadow:0 0 20px -4px var(--g1)}
.tl-jour.charge{background:linear-gradient(180deg, rgba(231,188,107,.2), transparent)}
.tl-jour:hover{background:var(--trait-2)}
.tl-tampon{position:absolute;top:5px;right:5px;width:21px;height:21px;border-radius:50%;border:1px solid var(--bord);background:var(--creux);
  font-size:10px;line-height:1;padding:0;display:grid;place-items:center;opacity:0;transition:.2s}
.tl-jour:hover .tl-tampon{opacity:1}
.tl-tampon:hover{background:var(--g2);color:#1C1636}
.tl-col.off{background-image:repeating-linear-gradient(135deg, color-mix(in srgb, var(--sc) 12%, transparent) 0 10px, transparent 10px 20px)}
/* Les plages de travail : vivantes — un dégradé qui respire, une lueur
   qui passe lentement, une étiquette qui se pose, la pause qui mijote. */
.bande-travail{position:absolute;left:2px;right:2px;z-index:0;pointer-events:none;overflow:hidden;border-radius:11px;
  background:linear-gradient(170deg, color-mix(in srgb, var(--sc) 30%, transparent), color-mix(in srgb, var(--sc) 12%, transparent) 60%, color-mix(in srgb, var(--sc) 20%, transparent));
  border:1px solid color-mix(in srgb, var(--sc) 45%, transparent);border-left:4px solid color-mix(in srgb, var(--sc) 85%, transparent);
  box-shadow:inset 0 0 22px -10px color-mix(in srgb, var(--sc) 90%, transparent);
  animation:bandeArrive .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes bandeArrive{from{opacity:0;transform:scaleY(.86);transform-origin:top}}
.bande-travail::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(130deg, color-mix(in srgb, var(--sc) 10%, transparent) 0 11px, transparent 11px 22px);opacity:.5}
.bande-travail .etiq{position:absolute;top:4px;left:6px;max-width:calc(100% - 12px);overflow:hidden;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--ui);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap;
  color:color-mix(in srgb, var(--sc) 55%, var(--titre));background:color-mix(in srgb, var(--surface) 72%, transparent);
  border:1px solid color-mix(in srgb, var(--sc) 35%, transparent);border-radius:999px;padding:2px 8px 2px 3px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:etiqPose .5s .25s cubic-bezier(.2,1.6,.4,1) both}
.bande-travail .etiq b{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10px;
  background:color-mix(in srgb, var(--sc) 30%, transparent);animation:etiqBouge 3.4s ease-in-out infinite}
@keyframes etiqPose{from{opacity:0;transform:translateY(-6px) scale(.85)}}
@keyframes etiqBouge{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.08)}}
.bande-travail .duree-plage{position:absolute;right:7px;bottom:4px;font-family:var(--ui);font-style:normal;font-size:9.5px;font-weight:700;
  color:color-mix(in srgb, var(--sc) 60%, var(--titre));opacity:.75}
.bande-pause{position:absolute;left:2px;right:2px;z-index:0;pointer-events:none;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--ambre) 16%, transparent) 0 8px, transparent 8px 16px);
  border:1px dashed color-mix(in srgb, var(--ambre) 45%, transparent);animation:bandeArrive .5s .1s cubic-bezier(.2,.9,.3,1) both}
.bande-pause .etiq-pause{position:absolute;left:50%;top:50%;translate:-50% -50%;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;
  font-family:var(--ui);font-style:normal;font-size:10px;font-weight:700;color:var(--ambre-txt);
  background:color-mix(in srgb, var(--surface) 80%, transparent);border:1px solid color-mix(in srgb, var(--ambre) 40%, transparent);
  border-radius:999px;padding:3px 10px;animation:pauseFlotte 3.6s ease-in-out infinite alternate}
@keyframes pauseFlotte{from{translate:-50% -56%}to{translate:-50% -44%}}
/* L'illustration : un sticker collé sur le bloc, un peu de travers */
.sticker{position:absolute;right:3px;top:3px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--surface);font-size:15px;line-height:1;transform:rotate(-9deg);pointer-events:none;
  box-shadow:0 0 0 2px rgba(255,255,255,.8), 0 3px 7px rgba(16,8,40,.45)}
.sticker.gros{width:34px;height:34px;font-size:20px;right:5px;top:5px}
/* sur un bloc court ou étroit, le sticker se fait tout petit et reste rond */
.sticker.mini{width:17px;height:17px;font-size:10.5px;right:2px;top:2px;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.75), 0 2px 5px rgba(16,8,40,.4)}
:root[data-theme="light"] .sticker.mini{box-shadow:0 0 0 1.5px #fff, 0 2px 6px rgba(80,60,160,.28)}
:root[data-theme="light"] .sticker{box-shadow:0 0 0 2px #fff, 0 3px 8px rgba(80,60,160,.3)}
.bloc.boulot{border-left-width:5px}
.bloc.sorte-pause{background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 8px, transparent 8px 16px)}
.chip .ic{flex:none;font-size:11px;line-height:1}
/* Les examens : on les repère au premier coup d'œil */
.chip.exam{border-left-width:5px;border-left-style:double;font-weight:700}
.bloc.exam{border-left-width:5px;border-left-style:double;
  background-image:repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, transparent) 0 9px, transparent 9px 18px)}
.exam-l .cal-mini.exam{border-color:color-mix(in srgb, #F0714E 55%, transparent)}
.exam-l .cal-mini.exam small{background:color-mix(in srgb, #F0714E 28%, transparent);color:color-mix(in srgb, #F0714E 60%, var(--titre))}
.chip.suite{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 26%, transparent) 0 9px, color-mix(in srgb, var(--c) 14%, transparent) 9px 18px)}
.chip.suite.debut{border-radius:7px 3px 3px 7px}
.chip.suite.milieu{border-radius:3px;border-left-width:2px}
.chip.suite.fin{border-radius:3px 7px 7px 3px;border-left-width:2px}
.chip.suite .h{opacity:.65;font-size:10px}
.duree-dit{font-family:var(--ui);font-style:normal;font-size:13.5px;font-weight:650;color:var(--lilas);
  background:var(--creux);border:1px solid var(--bord);border-radius:12px;padding:9px 12px}
.ligne .ill{flex:none;font-size:15px;width:20px;text-align:center}

/* ---------- Le décor de la saison, posé sur le calendrier ----------
   Deux couches : l'une épouse exactement la carte et ses coins arrondis
   (tout ce qui y dépasse est coupé net), l'autre tient les objets posés
   sur le bord du haut, comme sur une étagère. */
#p-agenda{position:relative}
.deco{position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:4}
.deco-in{position:absolute;inset:0;border-radius:inherit;overflow:hidden;color:var(--toile)}
.deco .coin{position:absolute;top:0;left:0;width:168px;height:168px;opacity:.6}
.deco .coin.d{left:auto;right:0;transform:scaleX(-1)}
/* la guirlande : un fil qui s'étire, des objets qui restent ronds */
.deco .fil{position:absolute;left:0;right:0;top:0;height:50px;color:var(--toile)}
.deco .fil svg{position:absolute;inset:0;width:100%;height:100%;opacity:.8}
.deco .accroche{position:absolute;transform-origin:50% -10px;translate:-50% 0;
  animation:balance 4.6s var(--d) ease-in-out infinite alternate;filter:drop-shadow(0 4px 5px rgba(16,8,40,.45))}
.deco .accroche::before{content:'';position:absolute;left:50%;bottom:100%;width:1.5px;height:10px;background:currentColor;opacity:.75}
.deco .boule{display:block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 32% 28%, #fff6, transparent 42%), var(--b);
  box-shadow:0 0 12px -2px var(--b), inset 0 -3px 5px rgba(0,0,0,.25)}
.deco .fanion{display:block;width:17px;height:22px;background:var(--b);clip-path:polygon(0 0, 100% 0, 50% 100%);box-shadow:0 0 12px -4px var(--b)}
.deco .coeur{display:block;width:15px;height:15px;background:var(--b);rotate:-45deg;border-radius:0 0 3px 0;box-shadow:0 0 12px -3px var(--b)}
.deco .coeur::before,.deco .coeur::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:var(--b)}
.deco .coeur::before{top:-7.5px;left:0}.deco .coeur::after{top:0;right:-7.5px}
/* ce qui pend est accroché au bord haut de la carte */
.deco .pendue{position:absolute;top:var(--l);font-size:22px;line-height:1;translate:-50% 0;transform-origin:50% calc(-1 * var(--l));
  animation:balance 4.2s var(--d) ease-in-out infinite alternate;filter:drop-shadow(0 4px 4px rgba(16,8,40,.45))}
.deco .pendue i{position:absolute;left:50%;bottom:100%;width:1.5px;height:var(--l);background:var(--toile);opacity:.75}
@keyframes balance{from{rotate:-6deg}to{rotate:6deg}}
/* les objets posés sur la tablette du haut, à l'intérieur de la carte */
.deco .posees{position:absolute;top:0;right:28px;height:60px;display:flex;align-items:flex-end;gap:11px;filter:drop-shadow(0 6px 5px rgba(16,8,40,.5))}
.deco .posee{font-size:30px;line-height:1;rotate:calc(var(--i) * 7deg - 7deg);animation:posePose .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * .12s)}
/* ce qui tombe doucement : feuilles, flocons, pétales, confettis */
.deco .tombe{position:absolute;top:-30px;line-height:1;animation:chute linear infinite;filter:drop-shadow(0 3px 3px rgba(16,8,40,.3))}
@keyframes chute{0%{opacity:0;translate:0 -30px;rotate:0deg}8%{opacity:.85}92%{opacity:.85}100%{opacity:0;translate:var(--dx) 760px;rotate:var(--r1)}}
/* janvier : le ciel de fête, sans guirlande */
.deco .ciel-fete{height:60px}
.deco .etoile-fete{position:absolute;line-height:1;animation:scintille 2.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(243,201,105,.6))}
.deco .obj{display:block;font-size:19px;line-height:1}
/* les œufs de Pâques, peints : rayures et pois, en pastel */
.deco .oeuf{display:block;width:15px;height:20px;background:var(--b);border-radius:50% 50% 48% 48% / 62% 62% 38% 38%;
  box-shadow:inset -3px -3px 7px rgba(0,0,0,.18), inset 3px 3px 6px rgba(255,255,255,.5), 0 0 10px -4px var(--b)}
.deco .oeuf.raye{background-image:repeating-linear-gradient(118deg, var(--b2) 0 2.5px, transparent 2.5px 6px)}
.deco .oeuf.pois{background-image:radial-gradient(circle at 30% 30%, var(--b2) 1.6px, transparent 1.9px),
  radial-gradient(circle at 72% 55%, var(--b2) 1.6px, transparent 1.9px), radial-gradient(circle at 40% 78%, var(--b2) 1.4px, transparent 1.7px)}
/* Changer de mois : la grille glisse dans le sens du voyage, le titre tombe,
   et la nouvelle saison s'annonce d'une lueur qui traverse la carte. */
/* ---------- Changer de mois ----------
   Le navigateur sait désormais photographier l'ancien écran et le nouveau,
   puis les animer ensemble : c'est l'API View Transitions. Le mois qui part
   s'efface sur le côté pendant que le suivant arrive de l'autre, et le nom
   du mois roule verticalement. Tout est fait sur des images figées, donc
   c'est fluide quoi qu'il y ait dans la grille. */
.mois,.tl{view-transition-name:grille-agenda}
.cal-titre{view-transition-name:titre-mois}
::view-transition-old(root),::view-transition-new(root){animation:none}   /* seul ce qui change bouge */
::view-transition-group(grille-agenda),::view-transition-group(titre-mois){animation-duration:.42s}
::view-transition-old(grille-agenda),::view-transition-new(grille-agenda),
::view-transition-old(titre-mois),::view-transition-new(titre-mois){mix-blend-mode:normal}
/* la grille : un axe horizontal, dans le sens du voyage */
html.vt-suiv::view-transition-old(grille-agenda){animation:axeSortGauche .19s cubic-bezier(.4,0,1,1) both}
html.vt-suiv::view-transition-new(grille-agenda){animation:axeEntreDroite .42s .07s cubic-bezier(.05,.7,.1,1) both}
html.vt-prec::view-transition-old(grille-agenda){animation:axeSortDroite .19s cubic-bezier(.4,0,1,1) both}
html.vt-prec::view-transition-new(grille-agenda){animation:axeEntreGauche .42s .07s cubic-bezier(.05,.7,.1,1) both}
@keyframes axeSortGauche{to{opacity:0;transform:translate3d(-26px,0,0) scale(.985)}}
@keyframes axeEntreDroite{from{opacity:0;transform:translate3d(38px,0,0) scale(.99)}}
@keyframes axeSortDroite{to{opacity:0;transform:translate3d(26px,0,0) scale(.985)}}
@keyframes axeEntreGauche{from{opacity:0;transform:translate3d(-38px,0,0) scale(.99)}}
/* le nom du mois : il roule, comme un compteur */
html.vt-suiv::view-transition-old(titre-mois){animation:rouleHaut .2s cubic-bezier(.4,0,1,1) both}
html.vt-suiv::view-transition-new(titre-mois){animation:rouleDepuisBas .4s .08s cubic-bezier(.05,.7,.1,1) both}
html.vt-prec::view-transition-old(titre-mois){animation:rouleBas .2s cubic-bezier(.4,0,1,1) both}

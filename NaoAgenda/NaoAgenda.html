<script>
'use strict';
/* ============================================================
   Outils de dates
   ============================================================ */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const JC3 = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];   // indexés comme getDay()
const pad = n => String(n).padStart(2, '0');
const cle = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const lire = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const minuit = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const plus = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ecart = (a, b) => Math.round((minuit(b) - minuit(a)) / 864e5);
const jdm = (y, m) => new Date(y, m + 1, 0).getDate();
/* La semaine commence le jour que vous voulez : lundi par défaut, mais
   dimanche ou samedi si c'est votre habitude. Tout en découle — la grille
   du mois, la vue semaine, l'ordre de vos horaires. */
const premierJour = () => (S && S.debutSemaine != null) ? S.debutSemaine : 1;
const debSem = d => plus(minuit(d), -((d.getDay() - premierJour() + 7) % 7));
const joursDeSemaine = () => [...Array(7)].map((_, i) => (premierJour() + i) % 7);   // 0 = dimanche
const auj = () => minuit(new Date());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const er = n => n === 1 ? '1er' : String(n);
const dateLongue = d => `${JOURS[d.getDay()]} ${er(d.getDate())} ${MOIS[d.getMonth()]}`;
const dateCourte = d => `${er(d.getDate())} ${MOIS[d.getMonth()]}`;
const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const fmtH = s => s === '00:00' ? 'minuit' : s ? s.replace(':', ' h ').replace(/ h 00$/, ' h') : '';
/* Minuit, en fin de plage, c'est la fin de la journée — pas son début. */
const minFin = v => { const m = hm(v || '00:00'); return m === 0 ? H1 * 60 : m; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const dureeTxt = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + pad(m % 60) : ''}` : `${m} min`;

/* ============================================================
   Catégories, priorités, options
   ============================================================ */
const CATS = {
  perso:     { nom: 'Personnel',     c: '#B9A5F5' },
  travail:   { nom: 'Travail',       c: '#57B8E0' },
  famille:   { nom: 'Famille',       c: '#E8A05C' },
  sante:     { nom: 'Santé',         c: '#4FC0B4' },
  sport:     { nom: 'Sport',         c: '#67C27A' },
  loisirs:   { nom: 'Loisirs',       c: '#E092F2' },
  admin:     { nom: 'Administratif', c: '#8FA2F7' },
  etudes:    { nom: 'Études',        c: '#F0714E' },
  important: { nom: 'Important',     c: '#F07F95' },
};
const OR = 'var(--or)';
const PRIOS = { haute: 'Haute', moyenne: 'Moyenne', basse: 'Basse' };
const RANG = { haute: 0, moyenne: 1, basse: 2 };
const RAPPELS = [['', 'Aucun rappel'], ['0', "À l'heure"], ['15', '15 min avant'], ['60', '1 h avant'], ['1440', 'La veille'], ['10080', 'Une semaine avant']];
const RECS = [['', 'Une seule fois'], ['hebdo', 'Chaque semaine'], ['mensuel', 'Chaque mois'], ['annuel', 'Chaque année']];
/* « chaque semaine », mais aussi « une semaine sur deux » ou « chaque semaine
   avec Driss » : on le dit en toutes lettres en haut de la fiche. */
function txtRec(ev) {
  const base = (RECS.find(r => r[0] === ev.rec)?.[1] || '').toLowerCase();
  if (ev.rec !== 'hebdo') return base;
  if (ev.semGarde) return `chaque semaine ${gardeMot(ev.semGarde)}`;
  return +ev.sem === 2 ? 'une semaine sur deux' : base;

/* ============================================================
   Le pont avec NaoPets
   Les rendez-vous notés dans NaoPets (vétérinaire, vaccin, toilettage…)
   apparaissent ici comme de vrais rendez-vous, marqués 🐾. On peut les
   modifier d'un côté ou de l'autre : titre, date, heures, lieu, notes et
   « terminé » passent dans les deux sens. Les deux outils lisent le même
   stockage du navigateur ; NaoPets reste la source du rendez-vous.
   S.pontNaoPets garde, pour chaque rendez-vous, la dernière version sur
   laquelle les deux outils étaient d'accord : c'est elle qui dit lequel
   des deux a changé depuis.
   ============================================================ */
const CLE_NAOPETS = 'naopet.v1';
const RDV_NAOPETS = { consultation: 'Consultation', vaccin: 'Vaccin', controle: 'Visite de contrôle', sterilisation: 'Stérilisation', toilettage: 'Toilettage', autre: 'Autre soin' };
function lireNaoPets() {
  let t = null;
  try { t = localStorage.getItem(CLE_NAOPETS); } catch (e) { return null; }
  if (!t) return { vide: true, data: { rdv: [], animaux: [] } };
  try { const d = JSON.parse(t); return d && Array.isArray(d.rdv) ? { data: d } : null; } catch (e) { return null; }
}
const nomNaoPets = (np, id) => ((np.animaux || []).find(a => a.id === id) || {}).nom || '';
const prefixeNaoPets = (np, r) => { const n = nomNaoPets(np, r.animal); return n ? n + ' — ' : ''; };
function depuisRdv(np, r) {
  const heure = r.heure || '', duree = Math.max(5, Number(r.duree) || 60);
  return { titre: prefixeNaoPets(np, r) + (r.titre || RDV_NAOPETS[r.type] || 'Rendez-vous'), date: r.date || '', heure,
    heureFin: heure ? hhmm(Math.min(hm(heure) + duree, H1 * 60 - 1)) : '', lieu: r.lieu || '', notes: r.motif || '', fait: !!r.fait };
}
function depuisEv(ev) {
  const heure = ev.heure || '';
  return { titre: ev.titre || '', date: ev.date || '', heure, heureFin: heure ? ev.heureFin || '' : '', lieu: ev.lieu || '', notes: ev.notes || '', fait: !!ev.fait };
}
const signature = o => JSON.stringify([o.titre, o.date, o.heure, o.heureFin, o.lieu, o.notes, o.fait]);
function versRdv(np, r, o) {
  let t = o.titre;
  const p = prefixeNaoPets(np, r);
  if (p && t.startsWith(p)) t = t.slice(p.length);
  r.titre = t === (RDV_NAOPETS[r.type] || '') ? '' : t;
  r.date = o.date; r.heure = o.heure;
  if (o.heure && o.heureFin) r.duree = Math.max(5, minFin(o.heureFin) - hm(o.heure));
  r.lieu = o.lieu; r.motif = o.notes; r.fait = o.fait;
}
function nouveauMiroir(r, o) {
  return { id: 'np-' + r.id, type: 'rdv', ...o, span: 0, cat: 'sante', prio: 'moyenne', rappel: '60', rec: '', jusque: '', prioJour: false,
    compte: false, faits: [], exclus: [], illu: '🐾', source: 'naopet', lien: r.id };
}
/* Met les deux outils d'accord. Renvoie vrai si l'agenda a changé. */
function pontNaoPets() {
  const lu = lireNaoPets(); if (!lu) return false;      // illisible : on ne touche à rien
  const np = lu.data, rdvs = np.rdv || [];
  S.pontNaoPets ??= {};
  const pont = S.pontNaoPets, vus = new Set();
  let agendaChange = false, naoPetsChange = false;
  for (const r of rdvs) {
    if (!r.id || !r.date) continue;
    vus.add(r.id);
    const miroirs = S.events.filter(e => e.source === 'naopet' && e.lien === r.id);
    // une copie de miroir (occurrence déplacée seule…) devient un rendez-vous ordinaire de l'agenda
    for (const m of miroirs.slice(1)) { delete m.source; delete m.lien; agendaChange = true; }
    const ev = miroirs[0], cotePets = depuisRdv(np, r), sPets = signature(cotePets);
    if (!ev) { S.events.push(nouveauMiroir(r, cotePets)); pont[r.id] = sPets; agendaChange = true; continue; }
    const sAgenda = signature(depuisEv(ev)), accord = pont[r.id];
    if (sAgenda === sPets) { pont[r.id] = sPets; continue; }
    if (accord && sAgenda !== accord) {
      // modifié dans l'agenda : la modification part dans NaoPets, puis l'agenda reprend la forme commune
      versRdv(np, r, depuisEv(ev)); naoPetsChange = true;
      const commun = depuisRdv(np, r);
      if (signature(commun) !== signature(depuisEv(ev))) { Object.assign(ev, commun); agendaChange = true; }
      pont[r.id] = signature(commun);
    } else {
      // modifié dans NaoPets (ou première rencontre) : l'agenda suit
      Object.assign(ev, cotePets); pont[r.id] = sPets; agendaChange = true;
    }
  }
  // un rendez-vous retiré de NaoPets quitte aussi l'agenda
  const avant = S.events.length;
  S.events = S.events.filter(e => e.source !== 'naopet' || vus.has(e.lien));
  if (S.events.length !== avant) agendaChange = true;
  for (const id of Object.keys(pont)) if (!vus.has(id)) delete pont[id];
  if (naoPetsChange) { try { localStorage.setItem(CLE_NAOPETS, JSON.stringify(np)); } catch (e) {} }
  return agendaChange;
}
/* Supprimer dans l'agenda un rendez-vous venu de NaoPets le supprime aussi là-bas. */
function supprimerDansNaoPets(lien) {
  const lu = lireNaoPets(); if (!lu || lu.vide) return;
  const np = lu.data, n = (np.rdv || []).length;
  np.rdv = (np.rdv || []).filter(r => r.id !== lien);
  if (np.rdv.length !== n) { try { localStorage.setItem(CLE_NAOPETS, JSON.stringify(np)); } catch (e) {} }
  if (S.pontNaoPets) delete S.pontNaoPets[lien];
}
/* NaoPets modifié dans une autre fenêtre, ou en revenant sur l'agenda : on se remet d'accord. */
function suivreNaoPets() {
  if (!pontNaoPets()) return;
  sansPile = true; enregistrer(); sansPile = false;
  if (!document.querySelector('.voile')) rendreTout();
}
window.addEventListener('storage', e => { if (e.key && e.key.endsWith(CLE_NAOPETS)) suivreNaoPets(); });

/* ============================================================
   Occurrences (récurrences) et contenu des journées
   Une occurrence retirée d'une série (vidée, ou déplacée seule)
   est notée dans ev.exclus.
   ============================================================ */
/* Le numéro de la semaine, compté depuis un lundi lointain : deux dates de la
   même semaine donnent le même numéro, ce qui suffit pour dire « une sur deux ». */
const noSem = d => Math.round(ecart(new Date(2001, 0, 1), debSem(d)) / 7);
function occ(ev, a, b) {
  const base = lire(ev.date), out = [];
  const fin = ev.jusque ? lire(ev.jusque) : null;
  const hi = fin && fin < b ? fin : b;
  if (!ev.rec) { if (base >= a && base <= b) out.push(ev.date); return out; }
  if (ev.rec === 'hebdo') {
    const js = (ev.recJours || []).filter(j => j >= 0 && j <= 6);
    if (js.length) {                       // les jours de la semaine choisis : lundi, mercredi, vendredi…
      for (let d = base > a ? base : a; d <= hi; d = plus(d, 1)) if (js.includes(d.getDay())) out.push(cle(d));
    } else {
      let d = base;
      if (d < a) d = plus(base, Math.ceil(ecart(base, a) / 7) * 7);
      for (; d <= hi; d = plus(d, 7)) out.push(cle(d));
    }
  } else if (ev.rec === 'mensuel') {
    for (let c = new Date(a.getFullYear(), a.getMonth(), 1); c <= hi; c = new Date(c.getFullYear(), c.getMonth() + 1, 1)) {

function fenetre(html, cls = '') {

function demander({ titre, texte, ok = 'Confirmer', danger = false, autre = '' }) {
  return new Promise(res => {

      ${autre ? `<button type="button" class="btn" id="d-autre">${autre}</button>` : ''}
      <button type="button" class="btn plein${danger ? ' danger' : ''}" id="d-oui">${ok}</button></div></div>`);
    const fin = r => { fermer(); res(r); };
    v.querySelector('#d-non').onclick = () => fin(false);
    v.querySelector('#d-autre')?.addEventListener('click', () => fin('autre'));
    v.querySelector('#d-oui').onclick = () => fin(true);

  };
  const majFin = () => {                       // la fin suit le début quand on le déplace
    const F = form.elements;
    if (F.dateFin.value < F.date.value) F.dateFin.value = F.date.value;
    F.dateFin.min = F.date.value;
    if (F.heure.value && (!F.heureFin.value || (F.dateFin.value === F.date.value && minFin(F.heureFin.value) <= hm(F.heure.value))))
      F.heureFin.value = hhmm(Math.min(hm(F.heure.value) + 60, H1 * 60 - 1));
    direDuree();
  };
  direDuree();
  /* On ne corrige jamais la fin pendant qu'elle est en train d'être tapée :
     le temps d'écrire « 16:45 », le champ passe par 16:00, qui semble venir
     avant 16:30 — et un quart d'heure devenait impossible à saisir. On se
     contente de dire la durée, et on ne remet les choses d'aplomb qu'en
     quittant le champ. */
  form.addEventListener('input', e => {
    if (['date', 'heure', 'dateFin'].includes(e.target.name)) majFin();
    else if (e.target.name === 'heureFin') direDuree();
  });
  form.elements.heureFin?.addEventListener('blur', majFin);
  form.addEventListener('change', e => {
    if (e.target.name === 'type') {
      const t = e.target.value;
      form.className = t;
      const pj = form.elements.prioJour; pj.disabled = t === 'tache'; if (pj.disabled) pj.checked = true;
      pj.parentElement.querySelector('small').textContent = pj.disabled ? '(toujours, pour une tâche)' : '';
      if (t !== 'tache' && !form.elements.heure.value) form.elements.heure.value = t === 'travail' ? plagePrincipale(form.elements.date.value)[0] : '09:00';
      if (t === 'travail') {                       // le travail arrive avec les horaires de ce jour-là
        form.querySelector('input[name=cat][value=travail]').checked = true;
        const [d0, f0] = plagePrincipale(form.elements.date.value);
        form.elements.heure.value = d0; form.elements.heureFin.value = f0;
      }
      if (t === 'examen') {                        // un examen : études, compte à rebours, rappel la veille
        form.querySelector('input[name=cat][value=etudes]').checked = true;
        form.elements.compte.checked = true;
        if (!edit) form.elements.rappel.value = '1440';
        const s = EXAMENS[form.elements.sorteEx.value || 'controle'];
        form.elements.heureFin.value = hhmm(Math.min(hm(form.elements.heure.value || '09:00') + s.duree, H1 * 60 - 1));
      }
      majFin();
    }
    if (e.target.name === 'sorteEx') {             // l'épreuve donne sa durée habituelle
      const F = form.elements, s = EXAMENS[e.target.value];
      F.heureFin.value = hhmm(Math.min(hm(F.heure.value || '09:00') + s.duree, H1 * 60 - 1));
      majFin();
    }
    if (e.target.name === 'sorte') {
      const F = form.elements, s = e.target.value;
      const pl = plagesDu(F.date.value).length ? plagesDu(F.date.value) : plagesTypes();
      if (s === 'pause') {                         // la pause, c'est le trou entre deux plages
        F.heure.value = pl.length > 1 ? pl[0][1] : '12:30';
        F.heureFin.value = pl.length > 1 ? pl[1][0] : '13:30';
      } else if (s === 'horaire') { F.heure.value = pl[0][0]; F.heureFin.value = pl[pl.length - 1][1]; }
      else F.heureFin.value = hhmm(Math.min(hm(F.heure.value || '09:00') + SORTES[s].duree, H1 * 60 - 1));
      majFin();
    }
    if (e.target.name === 'rec') {
      v.querySelector('#z-jusque').hidden = !e.target.value;
      v.querySelector('#z-pauses').hidden = !e.target.value;
      v.querySelector('#z-recjours').hidden = e.target.value !== 'hebdo';
      v.querySelector('#z-sem').hidden = e.target.value !== 'hebdo';
    }
    if (e.target.name === 'cat' && e.target.value === 'important' && !edit) form.elements.compte.checked = true;
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const F = form.elements, titre = F.titre.value.trim();
    if (!titre || !F.date.value) { F.titre.focus(); return; }
    const t = F.type.value;
    ev.sorte = t === 'travail' ? F.sorte.value : t === 'examen' ? F.sorteEx.value : '';
    ev.matiere = t === 'examen' ? F.matiere.value.trim() : '';
    ev.coef = t === 'examen' ? F.coef.value.trim() : '';
    if (t === 'examen') ev.cat = 'etudes';
    ev.illu = F.illu.value === 'auto' ? undefined : F.illu.value;
    if (t === 'travail') ev.cat = 'travail';
    // la fin : une date, une heure — plus de durée en minutes
    if (t === 'tache') { ev.span = 0; ev.heureFin = F.heure.value ? hhmm(Math.min(hm(F.heure.value) + 30, H1 * 60 - 1)) : ''; }
    else {
      ev.span = F.dateFin.value && F.dateFin.value > F.date.value ? ecart(lire(F.date.value), lire(F.dateFin.value)) : 0;
      ev.heureFin = F.heureFin.value && (ev.span || !F.heure.value || minFin(F.heureFin.value) > hm(F.heure.value))
        ? F.heureFin.value : hhmm(Math.min(hm(F.heure.value || '09:00') + 60, H1 * 60 - 1));
    }
    delete ev.duree;
    Object.assign(ev, { type: t, titre, date: F.date.value, heure: F.heure.value, lieu: t !== 'tache' ? F.lieu.value.trim() : '',
      prio: F.prio.value || 'moyenne', cat: F.cat.value || 'perso', rappel: F.rappel.value, rec: F.rec.value, jusque: F.rec.value ? F.jusque.value : '',
      recJours: F.rec.value === 'hebdo' ? [1, 2, 3, 4, 5, 6, 0].filter(j => F['rj' + j].checked) : [],
      sem: F.rec.value === 'hebdo' && F.sem.value === '2' ? 2 : 1,
      semGarde: F.rec.value === 'hebdo' && F.sem.value.startsWith('g-') ? F.sem.value.slice(2) : '',
      pauseVacances: !!F.rec.value && F.pauseVacances.checked, pauseFeries: !!F.rec.value && F.pauseFeries.checked,
      pauseConges: !!F.rec.value && F.pauseConges.checked,
      prioJour: t === 'tache' ? false : F.prioJour.checked, compte: F.compte.checked, notes: F.notes.value.trim() });
    if (ev.jusque && ev.jusque < ev.date) ev.jusque = '';
    delete ev.exemple;
    const i = S.events.findIndex(x => x.id === ev.id);
    if (i >= 0) S.events[i] = ev; else S.events.push(ev);
    enregistrer(); fermer(); rendreTout();
    toast(t === 'rdv' ? '📅' : '✅', edit ? 'Modifications enregistrées' : (t === 'rdv' ? 'Rendez-vous ajouté' : 'Tâche ajoutée'), `${esc(titre)} · ${cap(dateLongue(lire(ev.date)))}${ev.heure ? ' à ' + fmtH(ev.heure) : ''}`);
  });
  /* Les dates mises de côté, qu'on peut remettre dans la série d'un clic. */
  const direExclus = () => {
    const z = v.querySelector('#z-exclus'), l = v.querySelector('#l-exclus');

  v.querySelector('#l-exclus')?.addEventListener('click', e => {

    enregistrer(); direExclus(); rendreTout();
    toast('↩️', 'Remis dans la série', `« ${esc(ev.titre)} » revient le ${dateCourte(lire(b.dataset.rendre))}.`, 6000, annulation(avant));
  });
  /* Une seule fois : le dîner du samedi saute quand on va au parc d'attractions,
     et tous les autres samedis restent en place. */
  v.querySelector('#b-sauter')?.addEventListener('click', () => {

      9000, annulation(avant));

  v.querySelector('#b-suppr')?.addEventListener('click', async () => {

    const r = await demander({

        : ev.source === 'naopet' ? `« ${esc(ev.titre)} » vient de <b>NaoPets</b> 🐾 : il sera supprimé ici <b>et dans NaoPets</b>.`
        : `« ${esc(ev.titre)} » sera supprimé.`,

}

/* ============================================================
   Vider le mois / l'année
   Les rendez-vous et tâches de la période sont retirés ; pour une
   série, seules ses occurrences dans la période disparaissent.
   Les anniversaires, qui reviennent chaque année, sont conservés.
   ============================================================ */
function compterPeriode(a, b) { return S.events.reduce((n, ev) => n + occ(ev, a, b).length, 0); }
async function vider(a, b, nom) {
  const n = compterPeriode(a, b);
  if (!n) { toast('🧹', `Rien à vider`, `Aucun rendez-vous ni tâche en ${nom}.`); return; }
  const ok = await demander({ titre: `Vider ${nom} ?`, ok: `Vider ${nom}`, danger: true,
    texte: `<b>${n} rendez-vous et tâche${n > 1 ? 's' : ''}</b> ${n > 1 ? 'seront retirés' : 'sera retiré'} de ${nom}.
      Les répétitions en dehors de cette période sont conservées, ainsi que les anniversaires.<br>Vous pourrez annuler juste après.` });
  if (!ok) return;
  const avant = JSON.stringify(S.events);
  S.events = S.events.filter(ev => {
    const l = occ(ev, a, b); if (!l.length) return true;
    if (!ev.rec) return false;
    if (lire(ev.date) >= a && ev.jusque && lire(ev.jusque) <= b) return false;   // série entièrement dans la période
    ev.exclus = [...new Set([...(ev.exclus || []), ...l])];
    return true;
  });
  enregistrer(); rendreTout();
  toast('🧹', `${cap(nom)} vidé`, `${n} élément${n > 1 ? 's' : ''} retiré${n > 1 ? 's' : ''}.`, 12000, annulation(avant));
}
const annulation = avant => ({ label: 'Annuler', fn: () => { S.events = JSON.parse(avant); enregistrer(); rendreTout(); toast('↩️', 'Annulé', 'Tout est revenu comme avant.', 3000); } });

/* ============================================================
   Glisser-déposer — comme dans Google Agenda
   Mois : d'un jour à l'autre. Semaine / jour : vers une autre heure
   (pas de 15 min) ou un autre jour, vers la ligne « Journée » pour
   retirer l'heure ; le bord du bas d'un bloc change sa durée.
   Pour une série, seule l'occurrence déplacée change.
   ============================================================ */
let D = null, bloquerClic = false;
const snap15 = m => Math.round(m / 15) * 15;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || $('#voile') || V.page !== 'agenda') return;
  const el = e.target.closest('#p-agenda .chip[data-act=ev], #p-agenda .bloc'); if (!el) return;
  const ev = S.events.find(x => x.id === el.dataset.id); if (!ev) return;
  const r = el.getBoundingClientRect();
  D = { el, ev, k: el.dataset.k, part: +el.dataset.part || 0, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height,
    mode: e.target.closest('.poignee') ? 'taille' : 'deplacer', actif: false, bloc: el.classList.contains('bloc'), cible: null };
});
document.addEventListener('pointermove', e => {
  if (!D) return;
  if (!D.actif) { if (Math.hypot(e.clientX - D.x0, e.clientY - D.y0) < 6) return; demarrerGlisse(); }
  e.preventDefault(); suivreGlisse(e);
});
document.addEventListener('pointerup', () => {
  if (!D) return;
  if (D.actif) { bloquerClic = true; setTimeout(() => bloquerClic = false, 120); const d = D; finirGlisse(); deposer(d); }
  else D = null;
});
document.addEventListener('pointercancel', () => { if (D) { const t = D.mode === 'taille' && D.actif; finirGlisse(); if (t) rendreCalendrier(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && D?.actif) { const t = D.mode === 'taille'; finirGlisse(); if (t) rendreCalendrier(); } }, true);
document.addEventListener('click', e => { if (bloquerClic) { e.stopPropagation(); e.preventDefault(); bloquerClic = false; } }, true);

function demarrerGlisse() {
  D.actif = true; document.body.classList.add('glisse');
  D.badge = document.createElement('div'); D.badge.className = 'badge-glisse'; document.body.append(D.badge);
  if (D.mode === 'taille') { document.body.classList.add('taille'); D.col = D.el.parentElement; D.debut = hm(D.ev.heure); D.duree = dureeDe(D.ev); return; }
  D.el.classList.add('source');
  const g = D.el.cloneNode(true); g.classList.remove('source'); g.classList.add('fantome'); g.removeAttribute('data-act');
  Object.assign(g.style, { left: '0px', top: '0px', width: D.w + 'px', height: D.h + 'px', margin: 0 });
  document.body.append(g); D.g = g;
}
function suivreGlisse(e) {
  const sc = $('#p-agenda .tl-scroll');
  if (sc) { const r = sc.getBoundingClientRect(); if (e.clientY < r.top + 36 && e.clientY > r.top - 60) sc.scrollTop -= 12; else if (e.clientY > r.bottom - 36 && e.clientY < r.bottom + 60) sc.scrollTop += 12; }
  const badge = (txt, x, y) => { D.badge.textContent = txt; D.badge.hidden = !txt; Object.assign(D.badge.style, { left: x + 'px', top: y + 'px' }); };
  if (D.mode === 'taille') {
    const r = D.col.getBoundingClientRect();
    const finM = Math.min(snap15(H0 * 60 + (e.clientY - r.top) / PX * 60), H1 * 60);
    D.duree = Math.max(15, finM - D.debut);
    D.el.style.height = Math.max(20, D.duree / 60 * PX - 2) + 'px';
    const s = D.el.querySelector('.bloc > span, span:not(.sticker)'); if (s) s.textContent = `${D.ev.heure} – ${hhmm(D.debut + D.duree)}`;
    badge(`${dureeTxt(D.duree)} · fin ${fmtH(hhmm(D.debut + D.duree))}`, e.clientX + 14, e.clientY + 10);
    return;
  }
  document.querySelectorAll('.cible').forEach(x => x.classList.remove('cible'));
  const t = document.elementFromPoint(e.clientX, e.clientY);

/* ============================================================
   LE grand jour : votre anniversaire à vous
   Un anniversaire dont le lien est « MOI » ne se fête pas comme les
   autres : feux d'artifice, pluie de confettis, guirlandes, âge qui
   défile, bougies à souffler. On n'a 1 an qu'une fois par an.

let animFeux = null;
function feuxArtifice(hote) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const MAX = 420;                       // au-delà, on ne lance plus : la fête reste légère
  const fusees = [], etincelles = [];
  const lancer = () => {
    if (etincelles.length > MAX * .7) return;
    const x = innerWidth * (.12 + Math.random() * .76);
    fusees.push({ x, y: innerHeight + 10, vx: (-.5 + Math.random()) * .8, vy: -(7.5 + Math.random() * 3.5),
      c: COUL[Math.floor(Math.random() * COUL.length)], cible: innerHeight * (.12 + Math.random() * .34) });
  };

    const place = Math.max(0, MAX - etincelles.length);
    const n = Math.min(place, 40 + Math.floor(Math.random() * 24)), base = Math.random() * 6.3;
    for (let i = 0; i < n; i++) {
      const a = base + i / n * 6.3, v = 1.6 + Math.random() * 4.2;
      etincelles.push({ x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: Math.random() < .25 ? '#fff' : f.c, vie: 1, taille: 1.4 + Math.random() * 1.9 });
    }

    // on raisonne en temps réel, pas en images : si l'ordinateur rame, rien ne s'accumule

    const e = t - t0;

    }
    for (let i = etincelles.length - 1; i >= 0; i--) {
      const p = etincelles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .055 * dt;
      p.vx *= Math.pow(.985, dt); p.vy *= Math.pow(.985, dt); p.vie -= .011 * dt;

  const liste = (g.relais || []).filter(r => {
    if (+r.jour !== j) return false;
    if (r.quand === 'toujours') return true;
    // sinon : seulement quand les enfants changent vraiment de maison, et dans le bon sens.
    // Les récupérer n'a de sens que s'ils arrivent chez moi ; les déposer, que s'ils repartent.
    return r.sens === 'depose'
      ? (ici === 'moi' && demain === 'autre') || (veille === 'moi' && ici === 'autre')
      : (ici === 'autre' && demain === 'moi') || (veille === 'autre' && ici === 'moi');
  });
  // aucun relais réglé ce jour-là, mais les enfants changent de maison :
  // le départ (ou le retour) s'inscrit quand même, à l'heure habituelle
  const tr = transitDe(k);
  if (!liste.length && tr)
    liste.push({ jour: j, heure: g.heureChangement || '18:00', sens: tr === 'part' ? 'depose' : 'recupere', lieu: '', auto: true });
  return liste;
}
/* Le jour où les enfants changent de maison, même sans relais réglé :
   « Driss rentre chez sa maman », « Driss revient à la maison ». */
function texteTransit(part) {
  const g = S.garde, enf = (g.enfants || '').trim() || 'les enfants';
  return part ? `${enf} rentre ${g.chezAutre || 'chez l\'autre parent'}` : `${enf} revient ${g.chezMoi || 'à la maison'}`;
}
function transitDe(k) {
  if (!S.garde?.actif) return null;
  const ici = chezQui(k), demain = chezQui(cle(plus(lire(k), 1)));
  if (!ici || !demain || ici === demain) return null;
  return ici === 'moi' ? 'part' : 'revient';
}
function texteRelais(r) {
  const g = S.garde, enf = (g.enfants || '').trim() || 'les enfants';
  if (r.auto) return texteTransit(r.sens === 'depose');     // le simple va-et-vient
  if (r.sens === 'depose') return `${enf} à déposer${r.lieu ? ' ' + r.lieu : (g.chezAutre ? ' ' + g.chezAutre : '')}`;
  return `${enf} à récupérer${r.lieu ? ' ' + r.lieu : (g.chezAutre ? ' ' + g.chezAutre : '')}`;
}

const statutDe = k => (S.jours[k] || {}).statut || '';
/* Le tampon d'une journée : celui qu'on a posé, ou — d'office — le jour
   férié, ou la fête du jour. Une fête se travaille : elle garde ses plages. */
function tamponDe(k) {
  const s = STATUTS[statutDe(k)];
  if (s) return s;
  const ft = feteDe(k), f = ferieDe(k);
  if (f) return { nom: ft && ft.nom !== f ? `${f} · ${ft.nom}` : f, em: ft?.em || '🎌',
    c: ft?.c || 'var(--or)', tampon: ft?.court || 'Férié', auto: true, ferie: true };
  return ft ? { nom: ft.nom, em: ft.em, c: ft.c, tampon: ft.court, auto: true, fete: true, bosse: true } : null;
}

}

    g.arrangements[+c.dataset.a][c.dataset.c] = e.target.value;
  });
  v.querySelector('#g-arr').addEventListener('change', e => {
    const c = e.target.closest('[data-a]'); if (c && c.dataset.c === 'qui') g.arrangements[+c.dataset.a].qui = e.target.value;
  });
  v.querySelector('#g-arr').addEventListener('click', e => {
    const b = e.target.closest('[data-asuppr]'); if (!b) return;
    g.arrangements.splice(+b.dataset.asuppr, 1); redessiner();
  });
  v.querySelector('#g-plus').onclick = () => {
    g.chezMoi = v.querySelector('#g-moi').value.trim(); g.chezAutre = v.querySelector('#g-autre-nom').value.trim();
    g.arrangements.push({ a: cle(auj()), b: cle(plus(auj(), 7)), qui: 'moi', note: '' });
    redessiner();
  };
  v.querySelector('#g-vac')?.addEventListener('click', () => {
    g.chezMoi = v.querySelector('#g-moi').value.trim(); g.chezAutre = v.querySelector('#g-autre-nom').value.trim();
    const T = cle(auj());
    let n = 0;
    for (const [nom, a, b] of (S.vacances.perso?.length ? S.vacances.perso : vacancesZone(S.vacances.zone)))
      if (b >= T && !g.arrangements.some(x => x.a === a && x.b === b)) { g.arrangements.push({ a, b, qui: 'moi', note: nom }); n++; }
    g.arrangements.sort((x, y) => x.a.localeCompare(y.a));
    redessiner();
    toast('🏖️', `${n} période${n > 1 ? 's' : ''} ajoutée${n > 1 ? 's' : ''}`, 'À vous de dire qui a les enfants pour chacune.', 6000);
  });
  v.querySelector('#g-ok').onclick = () => {
    S.garde = { actif: v.querySelector('#g-actif').checked, mode: v.querySelector('input[name=gmode]:checked').value,
      depart: v.querySelector('#g-dep').value, heureChangement: v.querySelector('#g-heure').value || '18:00',
      enfants: v.querySelector('#g-enf').value.trim(),
      chezMoi: v.querySelector('#g-moi').value.trim() || 'à la maison',
      chezAutre: v.querySelector('#g-autre-nom').value.trim() || 'chez l\'autre parent',
      em: v.querySelector('input[name=gem]:checked').value, montrerAutre: v.querySelector('#g-montrer').checked,
      arrangements: g.arrangements.filter(a => a.a && a.b && a.b >= a.a),
      relais: g.relais.filter(r => r.heure).map(r => ({ ...r, jour: +r.jour })) };
    enregistrer(); fermer(); rendreTout();
    toast('👨‍👩‍👧', S.garde.actif ? 'Garde enregistrée' : 'Garde masquée',
      S.garde.actif ? `${texteGarde('moi')} · ${S.garde.mode === 'weekend' ? 'un week-end sur deux' : 'une semaine sur deux'}${S.garde.arrangements.length ? ` · ${S.garde.arrangements.length} arrangement${S.garde.arrangements.length > 1 ? 's' : ''}` : ''}` : '');
  };
}

function ouvrirHoraires() {
  // on travaille sur une copie : rien n'est enregistré tant qu'on n'a pas validé
  let t = JSON.parse(JSON.stringify(S.travail));
  const ORDRE = joursDeSemaine();
  const totalTxt = () => {
    const m = ORDRE.reduce((s, j) => s + plagesValides(t.plages[j]).reduce((x, p) => x + hm(p[1]) - hm(p[0]), 0), 0);
    const n = ORDRE.filter(j => plagesValides(t.plages[j]).length).length;
    return m ? `${dureeTxt(m)} par semaine · ${n} jour${n > 1 ? 's' : ''} travaillé${n > 1 ? 's' : ''}` : 'aucun jour travaillé pour l\'instant';
  };
  const ligneJour = j => {
    const l = t.plages[j] || [], on = plagesValides(l).length > 0;
    return `<div class="jour-h${on ? ' on' : ''}" data-j="${j}">
      <label class="case jh-nom"><input type="checkbox" data-coche="${j}"${on ? ' checked' : ''}> <b>${cap(JOURS[j])}</b></label>
      <div class="jh-plages">
        ${l.length ? l.map((p, i) => `<div class="plage">
            <input type="time" value="${p[0]}" data-p="${j}" data-i="${i}" data-b="0" aria-label="${JOURS[j]} — début de la plage ${i + 1}">
            <span>→</span>
            <input type="time" value="${p[1]}" data-p="${j}" data-i="${i}" data-b="1" aria-label="${JOURS[j]} — fin de la plage ${i + 1}">
            <button type="button" class="rond petit" data-moins="${j}:${i}" title="Retirer cette plage" aria-label="Retirer">✕</button>
          </div>`).join('')
          : '<span class="jh-repos">repos</span>'}
      </div>
      <div class="jh-actions">
        <button type="button" class="btn petit" data-plus="${j}" title="Ajouter une plage (matin, après-midi, soir…)">＋ plage</button>
        ${plagesValides(l).length ? `<button type="button" class="btn petit" data-copier="${j}" title="Donner ces horaires à tous les autres jours travaillés">⧉ copier</button>` : ''}
      </div>
    </div>`;
  };
  const dessiner = () => {
    v.querySelector('#h-jours').innerHTML = ORDRE.map(ligneJour).join('');
    v.querySelector('#h-total').textContent = totalTxt();
  };
  const v = fenetre(`<div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="t-h">
    <form id="f-h" autocomplete="off">
      <h2 id="t-h">🕘 Mon temps de travail</h2>
      <p class="chapo">Chaque jour ses horaires, et autant de plages que nécessaire — « mardi 8 h 45 – 12 h 30 puis 14 h – 18 h ».
        Ce qui sépare deux plages devient la <b>pause</b>. Tout cela se dessine derrière les vues semaine et jour.</p>
      <div class="champ" style="margin-bottom:14px"><label for="h-debsem">Ma semaine commence le</label>
        <select id="h-debsem">${joursDeSemaine().length && [1, 0, 6, 2, 3, 4, 5].map(j =>
          `<option value="${j}"${premierJour() === j ? ' selected' : ''}>${cap(JOURS[j])}</option>`).join('')}</select></div>
      <label class="case" style="margin-bottom:12px"><input type="checkbox" id="h-actif"${t.actif ? ' checked' : ''}> Afficher mes horaires dans l'agenda</label>
      <div class="jours-h" id="h-jours"></div>
      <div class="h-total">⏱️ <b id="h-total">—</b></div>
      <div class="champ large" style="margin-top:14px"><span class="lab">D'habitude je travaille</span>
        <div class="choix">${[['bureau', '🏢 Au bureau'], ['teletravail', '🏠 En télétravail']].map(([id, l]) =>
          `<label><input type="radio" name="lieu" value="${id}"${t.lieu === id ? ' checked' : ''}><span style="--c:${STATUTS[id].c}">${l}</span></label>`).join('')}</div></div>
      <p class="chapo" style="margin:14px 0 0">Un tampon posé sur une journée l'emporte toujours : un jour de congés, de RTT ou de repos n'affiche aucune plage.</p>
      <div class="pied">
        <span class="spacer"></span>
        <button type="button" class="btn" data-act="fermer">Annuler</button>
        <button type="submit" class="btn plein">Enregistrer</button>
      </div>
    </form></div>`);
  dessiner();
  v.querySelector('#h-jours').addEventListener('click', e => {
    const b = e.target.closest('[data-plus],[data-moins],[data-copier]'); if (!b) return;
    if (b.dataset.plus !== undefined) {
      const j = +b.dataset.plus, l = t.plages[j] = t.plages[j] || [];
      const dernier = l[l.length - 1];
      l.push(dernier ? [hhmm(Math.min(hm(dernier[1]) + 90, 22 * 60)), hhmm(Math.min(hm(dernier[1]) + 90 + 240, 23 * 60 + 30))] : ['09:00', '12:30']);
    } else if (b.dataset.moins) {
      const [j, i] = b.dataset.moins.split(':').map(Number);
      t.plages[j].splice(i, 1);
    } else {
      const j = +b.dataset.copier, modele = JSON.stringify(plagesValides(t.plages[j]));
      for (const a of ORDRE) if (a !== j && plagesValides(t.plages[a]).length) t.plages[a] = JSON.parse(modele);
      toast('⧉', 'Horaires recopiés', `Les autres jours travaillés suivent ${JOURS[j]}.`, 4000);
    }
    dessiner();
  });
  v.querySelector('#h-jours').addEventListener('change', e => {
    const c = e.target.closest('[data-coche]'), p = e.target.closest('[data-p]');
    if (c) { const j = +c.dataset.coche; t.plages[j] = c.checked ? JSON.parse(JSON.stringify(plagesTypes())) : []; dessiner(); }
    else if (p) { const j = +p.dataset.p, i = +p.dataset.i, b = +p.dataset.b; t.plages[j][i][b] = p.value; v.querySelector('#h-total').textContent = totalTxt(); }
  });
  v.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    for (const j of ORDRE) t.plages[j] = plagesValides(t.plages[j]);
    const dsAvant = premierJour(), ds = +v.querySelector('#h-debsem').value;
    S.debutSemaine = ds;
    S.travail = { actif: v.querySelector('#h-actif').checked, lieu: e.target.elements.lieu.value, plages: t.plages };
    enregistrer(); fermer(); rendreTout();
    toast('🕘', S.travail.actif ? 'Horaires enregistrés' : 'Horaires masqués',
      [S.travail.actif ? totalTxt() : '', ds !== dsAvant ? `La semaine commence le ${JOURS[ds]}.` : ''].filter(Boolean).join(' · '));
  });
}

function ouvrirAide(sec) {
  const bloc = b => {
    const [t, v] = b;
    if (t === 'p') return `<p>${v}</p>`;
    if (t === 'sous') return `<h4>${v}</h4>`;
    if (t === 'astuce') return `<div class="aide-astuce"><span>💡</span><div>${v}</div></div>`;
    if (t === 'exemple') return `<div class="aide-ex"><span>🧩</span><div>${v}</div></div>`;
    if (t === 'etapes') return `<ol class="aide-etapes">${v.map(x => `<li>${x}</li>`).join('')}</ol>`;
    if (t === 'liste') return `<ul class="aide-liste">${v.map(([a, b2]) => `<li><b>${a}</b> — ${b2}</li>`).join('')}</ul>`;
    return '';
  };
  const fiche = s => `<article class="aide-fiche" data-f="${s.id}">
    <h3><span class="aide-em">${s.em}</span>${s.t}</h3>
    <p class="aide-chapo">${s.chapo}</p>
    ${s.b.map(bloc).join('')}</article>`;
  const v = fenetre(`<div class="fenetre aide" role="dialog" aria-modal="true" aria-labelledby="t-aide">
    <div class="aide-h">
      <div><h2 id="t-aide">❓ Comment ça marche</h2>
        <p class="chapo" style="margin:2px 0 0">Tout l'outil, expliqué pas à pas. Choisissez un sujet dans le sommaire, ou cherchez un mot.</p></div>
      <span class="spacer" style="flex:1"></span>
      <input type="search" id="aide-q" placeholder="Chercher : télétravail, garde, vacances…" aria-label="Chercher dans l'aide">
      <button type="button" class="btn" data-act="fermer">Fermer</button>
    </div>
    <div class="aide-corps">
      <nav class="aide-nav" id="aide-nav" aria-label="Sommaire de l'aide">
        ${AIDE.map(s => `<button type="button" class="aide-n" data-s="${s.id}"><b>${s.em}</b>${s.t}</button>`).join('')}
      </nav>
      <div class="aide-p" id="aide-p" tabindex="0"></div>
    </div>
  </div>`, 'aide');

  const nav = v.querySelector('#aide-nav'), pan = v.querySelector('#aide-p'), q = v.querySelector('#aide-q');
  let courant = AIDE.some(s => s.id === sec) ? sec : AIDE[0].id;
  const montrer = id => {
    courant = id;
    const s = AIDE.find(x => x.id === id);
    pan.innerHTML = fiche(s);
    pan.scrollTop = 0;
    nav.querySelectorAll('.aide-n').forEach(b => b.classList.toggle('on', b.dataset.s === id));
  };
  montrer(courant);
  nav.addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) montrer(b.dataset.s); });
  /* La recherche : on garde les sujets dont le texte contient les mots tapés. */
  const sansAccents = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const texteDe = s => sansAccents([s.t, s.chapo, JSON.stringify(s.b)].join(' ').replace(/<[^>]+>/g, ' '));
  q.addEventListener('input', () => {
    const m = sansAccents(q.value.trim());
    let premier = null;
    for (const s of AIDE) {
      const ok = !m || texteDe(s).includes(m);
      nav.querySelector(`[data-s="${s.id}"]`).hidden = !ok;
      if (ok && !premier) premier = s.id;
    }
    if (m && premier && premier !== courant) montrer(premier);
  });
  setTimeout(() => q.focus(), 60);
}

/* ============================================================
   Réinitialiser l'outil — exactement la fenêtre de NaoPlan
   L'inventaire précis de ce qui va disparaître, le conseil de garder
   une sauvegarde, et le mot EFFACER à taper pour débloquer le bouton
   rouge. Sans retour possible : on ne la déclenche pas par mégarde.
   ============================================================ */
function reinitialiser() {
  const enr = lireEnr(), T = auj();
  const nEv = S.events.filter(e => e.type !== 'tache').length, nTa = S.events.filter(e => e.type === 'tache').length;
  const nEx = S.events.filter(e => e.exemple).length + S.annivs.filter(a => a.exemple).length;
  const ligne = (em, t, d) => `<div class="raz-item"><span class="em">${em}</span><div><b>${t}</b><small>${d}</small></div></div>`;
  const v = fenetre(`<div class="fenetre" role="alertdialog" aria-modal="true" aria-labelledby="t-raz">
    <h2 id="t-raz">♻️ Réinitialiser NaoAgenda</h2>
    <p class="chapo">L'outil redevient <b>vierge</b>, comme pour une nouvelle personne — avec ses exemples du premier lancement.
      Tout ce qui suit est effacé <b>définitivement</b>, sur cet ordinateur : il n'y a pas de retour en arrière.</p>
    <div class="raz-liste">
      ${ligne('📅', 'Les rendez-vous', nEv ? `${nEv} rendez-vous dans l'agenda` : 'aucun rendez-vous')}
      ${ligne('✅', 'Les tâches et les priorités', nTa ? `${nTa} tâche${nTa > 1 ? 's' : ''}, terminées comprises` : 'aucune tâche')}
      ${ligne('🎂', 'Les anniversaires et les dates', S.annivs.length ? `${S.annivs.length} date${S.annivs.length > 1 ? 's' : ''} avec leurs idées cadeaux et budgets` : 'aucune date enregistrée')}
      ${ligne('🗂️', 'Mes enregistrements', enr.length ? `${enr.length} version${enr.length > 1 ? 's' : ''} gardée${enr.length > 1 ? 's' : ''} dans l'outil` : 'la liste est vide')}
      ${ligne('⚙️', 'Les réglages', 'thème, vue (jour/semaine/mois), page en cours et catégories masquées reviennent par défaut')}
      ${nEx ? ligne('🌱', 'Les exemples', `les ${nEx} exemples actuels repartent, puis reviennent à neuf`) : ''}
    </div>
    <div class="raz-conseil"><span class="em">💾</span><div><b>Gardez d'abord une sauvegarde</b>
      <small>Un fichier <code>.json</code> que vous pourrez réimporter plus tard dans 🗂️ Mes enregistrements.</small></div>
      <button class="btn petit" type="button" id="raz-sauver">Exporter l'agenda</button></div>
    <div class="raz-mot"><label for="raz-saisie">Pour confirmer, tapez <b>EFFACER</b></label>
      <input id="raz-saisie" type="text" autocomplete="off" spellcheck="false" placeholder="EFFACER"></div>
    <div class="pied"><span class="spacer"></span>
      <button type="button" class="btn" data-act="fermer">Annuler</button>
      <button type="button" class="btn plein danger" id="raz-go" disabled>♻️ Tout effacer</button>
    </div></div>`);
  const saisie = v.querySelector('#raz-saisie'), go = v.querySelector('#raz-go');
  const verifier = () => { go.disabled = saisie.value.trim().toUpperCase() !== 'EFFACER'; };
  saisie.addEventListener('input', verifier);
  saisie.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) go.click(); });
  setTimeout(() => saisie.focus(), 60);
  v.querySelector('#raz-sauver').onclick = () => telecharger({ nom: 'avant-reinitialisation', date: new Date().toISOString(), ...contenu() });
  go.onclick = () => {
    for (const k of [CLE_STOCK, CLE_ENR, CLE_COURANT, 'naoagenda.vue', 'naoagenda.page', 'naoagenda.theme'])
      { try { localStorage.removeItem(k); } catch (e) {} }
    fermer();
    location.replace(location.href.split('#')[0]);   // on recharge sans #agenda : tout repart de zéro
  };
}
/* ============================================================
   Mes enregistrements — comme le portefeuille de NaoFi
   On enregistre l'agenda sous un nom ; la liste garde chaque version
   dans ce navigateur, et « Remettre » la rend à l'écran quand on en a
   besoin. Un enregistrement s'exporte aussi en fichier .json, pour une
   clé USB ou un autre ordinateur, et un fichier s'importe dans la liste.
   ============================================================ */
const CLE_ENR = 'naoagenda.enregistrements', CLE_COURANT = 'naoagenda.courant';
function lireEnr() { try { const l = JSON.parse(localStorage.getItem(CLE_ENR) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function ecrireEnr(l) {
  try { localStorage.setItem(CLE_ENR, JSON.stringify(l)); return true; }
  catch (e) { toast('⚠️', 'Enregistrement impossible', 'Le navigateur manque de place ou refuse le stockage. Exportez plutôt en fichier .json.', 9000); return false; }
}
const courant = () => { try { return localStorage.getItem(CLE_COURANT); } catch (e) { return null; } };
const marquerCourant = id => { try { id ? localStorage.setItem(CLE_COURANT, id) : localStorage.removeItem(CLE_COURANT); } catch (e) {} };
const contenu = () => ({ events: JSON.parse(JSON.stringify(S.events)), annivs: JSON.parse(JSON.stringify(S.annivs)) });
const resume = r => `${r.events.length} rendez-vous et tâche${r.events.length > 1 ? 's' : ''} · ${r.annivs.length} anniversaire${r.annivs.length > 1 ? 's' : ''}`;
const quandEnr = iso => { const d = new Date(iso); return `${dateCourte(d)} ${d.getFullYear()} à ${fmtH(hhmm(d.getHours() * 60 + d.getMinutes()))}`; };

function ouvrirEnregistrer() {
  const l = lireEnr(), cur = l.find(r => r.id === courant()), T = new Date();
  const v = fenetre(`<div class="fenetre etroite" role="dialog" aria-modal="true" aria-labelledby="t-enr">
    <form id="f-enr" autocomplete="off">
      <h2 id="t-enr">📥 Enregistrer l'agenda</h2>
      <p class="chapo">L'état actuel — <b>${resume(S)}</b> — est gardé dans « Mes enregistrements ». Vous pourrez le remettre quand vous en aurez besoin.</p>
      ${cur ? `<div class="enr-cur">Vous travaillez sur <b>« ${esc(cur.nom)} »</b>, enregistré le ${quandEnr(cur.date)}.</div>` : ''}
      <div class="champ"><label for="n-enr">${cur ? 'Ou enregistrer une nouvelle version sous le nom' : 'Nom de l\'enregistrement'}</label>
        <input type="text" id="n-enr" name="nom" maxlength="80" value="${cur ? '' : `Mon agenda — ${dateCourte(T)} ${T.getFullYear()}`}" placeholder="Ex. : Agenda de la rentrée"></div>
      <div class="pied">
        <button type="button" class="btn petit" data-act="enregistrements">🗂️ Mes enregistrements</button>
        <span class="spacer"></span>
        ${cur ? `<button type="button" class="btn plein" id="b-maj">↻ Mettre à jour « ${esc(cur.nom.length > 24 ? cur.nom.slice(0, 23) + '…' : cur.nom)} »</button>` : ''}
        <button type="submit" class="btn ${cur ? '' : 'plein'}">${cur ? 'Nouvel enregistrement' : 'Enregistrer'}</button>
      </div>
    </form></div>`);
  if (cur) setTimeout(() => v.querySelector('#b-maj').focus(), 60);
  v.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    const champ = v.querySelector('#n-enr'), nom = champ.value.trim();
    if (!nom) { champ.focus(); champ.placeholder = 'Donnez un nom à cet enregistrement'; return; }
    const r = { id: uid(), nom, date: new Date().toISOString(), ...contenu() };
    const liste = [r, ...lireEnr()];
    if (!ecrireEnr(liste)) return;
    marquerCourant(r.id); fermer();
    toast('📥', `« ${esc(nom)} » enregistré`, `${resume(r)} · retrouvez-le dans 🗂️ Mes enregistrements.`);
  });
  v.querySelector('#b-maj')?.addEventListener('click', () => {
    const liste = lireEnr(), i = liste.findIndex(r => r.id === cur.id); if (i < 0) return;
    liste[i] = { ...liste[i], date: new Date().toISOString(), ...contenu() };
    if (!ecrireEnr(liste)) return;
    fermer(); toast('↻', `« ${esc(cur.nom)} » mis à jour`, resume(liste[i]));
  });
}

  const v = fenetre(`<div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="t-lst">

      <button type="button" class="btn petit" id="b-imp">📂 Importer un fichier .json</button>

  v.querySelector('#b-imp').onclick = () => $('#fichier').click();

      if (!ok) { ouvrirEnregistrements(); return; }
      const avant = JSON.stringify({ events: S.events, annivs: S.annivs }), avantCourant = courant();
      S.events = JSON.parse(JSON.stringify(r.events)); S.annivs = JSON.parse(JSON.stringify(r.annivs)); S.vus = {};
      enregistrer(); marquerCourant(r.id); rendreTout();
      toast('↩', `« ${esc(r.nom)} » remis`, resume(r), 12000, { label: 'Annuler', fn: () => {

    } else if (b.dataset.e === 'renommer') {
      const div = b.closest('.enr'), txt = div.querySelector('.enr-txt');
      txt.innerHTML = `<form class="ajout-rapide" style="margin:0"><input type="text" maxlength="80" value="${esc(r.nom)}" aria-label="Nouveau nom"><button class="btn petit plein" type="submit">OK</button></form>`;
      const inp = txt.querySelector('input'); inp.focus(); inp.select();
      txt.querySelector('form').onsubmit = ev => {
        ev.preventDefault(); const nom = inp.value.trim(); if (!nom) return;
        const liste = lireEnr(), x = liste.find(y => y.id === id); if (x) { x.nom = nom; ecrireEnr(liste); }
        ouvrirEnregistrements(id);
      };
    } else if (b.dataset.e === 'exporter') {
      telecharger(r);
    } else if (b.dataset.e === 'supprimer') {
      const ok = await demander({ titre: `Supprimer « ${esc(r.nom)} » ?`, texte: 'Cet enregistrement disparaîtra de la liste. L\'agenda affiché ne change pas.', ok: 'Supprimer', danger: true });
      if (ok) {
        const liste = lireEnr(), i = liste.findIndex(x => x.id === id), [parti] = liste.splice(i, 1); ecrireEnr(liste);
        if (courant() === id) marquerCourant(null);
        toast('🗑️', `« ${esc(r.nom)} » supprimé`, '', 8000, { label: 'Annuler', fn: () => { const l2 = lireEnr(); l2.splice(i, 0, parti); ecrireEnr(l2); } });
      }
      ouvrirEnregistrements();
    }
  });

function telecharger(r) {

let sensNav = 0;                       // dans quel sens on voyage : la grille glisse par là
function bouger(sens) {
  const c = V.curseur, moisAvant = c.getMonth();
  const avancer = () => {
    V.curseur = V.vue === 'mois' ? new Date(c.getFullYear(), c.getMonth() + sens, 1) : plus(c, sens * (V.vue === 'semaine' ? 7 : 1));
    rendreCalendrier();
  };
  const apres = () => {
    const el = $('#p-agenda');
    if (V.curseur.getMonth() !== moisAvant && (S.palette || 'saisons') === 'saisons') {
      el.classList.add('saison-neuve');                     // la nouvelle saison s'annonce
      setTimeout(() => el.classList.remove('saison-neuve'), 1200);
    }
  };
  const doux = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  // le navigateur anime lui-même l'ancien et le nouveau mois, côte à côte
  if (doux && document.startViewTransition) {
    const h = document.documentElement;
    h.classList.add(sens > 0 ? 'vt-suiv' : 'vt-prec');
    const t = document.startViewTransition(avancer);
    t.ready.catch(() => {});             // une transition interrompue par la suivante : ce n'est pas une erreur
    t.finished.catch(() => {}).finally(() => h.classList.remove('vt-suiv', 'vt-prec'));
    t.updateCallbackDone.then(apres).catch(() => {});
    return;
  }
  sensNav = doux ? sens : 0;            // sinon, l'ancienne animation suffit
  avancer();
  sensNav = 0;
  apres();
}
function changerVue(v) { V.vue = v; try { localStorage.setItem('naoagenda.vue', v); } catch (e) {} rendreCalendrier(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, k = el.dataset.k;
  switch (a) {
    case 'page': allerPage(el.dataset.p); break;
    case 'theme': appliquerTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); appliquerPalette(); if ($('#t-th')) ouvrirThemes(); break;
    case 'prec': bouger(-1); break;
    case 'suiv': bouger(1); break;
    case 'ajd': V.curseur = auj(); rendreCalendrier(); break;
    case 'vue': if (V.vue === 'mois' && el.dataset.v !== 'mois' && V.curseur.getMonth() === auj().getMonth()) V.curseur = auj(); changerVue(el.dataset.v); break;
    case 'jour': V.curseur = lire(k); if (V.page !== 'agenda') allerPage('agenda'); changerVue('jour'); break;
    case 'creneau': {
      if (e.target !== el) return;
      const m = Math.floor((H0 * 60 + e.offsetY / PX * 60) / 30) * 30;
      ouvrirEv('rdv', { date: k, heure: hhmm(Math.min(m, 23 * 60 + 30)) }); break;
    }
    case 'add-rdv': e.stopPropagation(); ouvrirEv('rdv', { date: k }); break;
    case 'add-tache': ouvrirEv('tache', { date: k }); break;
    case 'statut': e.stopPropagation(); ouvrirStatut(k); break;
    case 'horaires': ouvrirHoraires(); break;
    case 'voisins': {
      S.moisVoisins = S.moisVoisins === 'masque' ? 'estompe' : 'masque';
      enregistrer(); rendreCalendrier();
      toast(S.moisVoisins === 'masque' ? '🌙' : '👁️', S.moisVoisins === 'masque' ? 'Mois voisins estompés' : 'Mois voisins visibles',
        S.moisVoisins === 'masque' ? 'Il ne reste que leur numéro et un point par élément.' : 'Leurs journées réapparaissent.', 4000);
      break;
    }
    case 'famille': ouvrirCalendrierFamille(); break;
    case 'garde': ouvrirGarde(); break;
    case 'add-anniv': ouvrirFormAnniv(); break;
    case 'ev': { const ev = S.events.find(x => x.id === id); if (ev) ouvrirEv(ev.type, { ev, k }); break; }
    case 'an': { const an = S.annivs.find(x => x.id === id); if (an) ouvrirCarte(an); break; }
    case 'an-edit': { e.stopPropagation(); const an = S.annivs.find(x => x.id === id); if (an) ouvrirFormAnniv(an); break; }
    case 'basculer': {
      const ev = S.events.find(x => x.id === id); if (!ev) break;
      const fait = basculer(ev, k); rendreTout();
      if (fait) { const r = prioritesDuJour(); toast('✨', 'Terminé', esc(ev.titre) + (r.length && r.every(o => estFait(o.ev, o.k)) ? ' — toutes vos priorités sont faites !' : ''), 3500); }
      break;
    }
    case 'filtre': { const c = el.dataset.c, i = S.masques.indexOf(c); i < 0 ? S.masques.push(c) : S.masques.splice(i, 1); enregistrer(); rendreCalendrier(); break; }
    case 'vider-mois': { const c = V.curseur; vider(new Date(c.getFullYear(), c.getMonth(), 1), new Date(c.getFullYear(), c.getMonth() + 1, 0), `${MOIS[c.getMonth()]} ${c.getFullYear()}`); break; }
    case 'vider-annee': { const y = V.curseur.getFullYear(); vider(new Date(y, 0, 1), new Date(y, 11, 31), `l'année ${y}`); break; }
    case 'fermer': fermer(); break;
    case 'enregistrer': ouvrirEnregistrer(); break;
    case 'enregistrements': ouvrirEnregistrements(); break;
    case 'importer': $('#fichier').click(); break;
    case 'themes': ouvrirThemes(); break;
    case 'annuler': annulerDerniere(); break;
    case 'aide': ouvrirAide(el.dataset.s); break;
    case 'notifs': demanderNotifs(); break;
    case 'raz': reinitialiser(); break;
    case 'exemples': effacerExemples(); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); ouvrirEnregistrer(); return; }
  if ((e.ctrlKey || e.metaKey) && !(e.target?.closest?.('input, textarea, select'))) {
    if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); annulerDerniere(); return; }
    if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); refaireDerniere(); return; }
  }
  if (e.key === 'F1' || (e.key === '?' && !e.target.matches('input, textarea, select'))) { e.preventDefault(); ouvrirAide(); return; }
  if (e.key === 'Escape' && $('#voile')) { fermer(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cell, .rebours, .bloc')) { e.preventDefault(); e.target.click(); return; }
  if ($('#voile') || V.page !== 'agenda' || e.target.matches('input, textarea, select')) return;
  if (e.key === 'ArrowLeft') bouger(-1);
  if (e.key === 'ArrowRight') bouger(1);
});

    halos: ['#7FA8F5','#5ED0C4','#C79BF3'], fondS: 'radial-gradient(1250px 900px at 50% 16%, #4A5FB8 0%, #2B3072 42%, #111428 100%)',
    fondC: 'radial-gradient(1400px 900px at 50% -8%, #EAF0FE 0%, #E4E9FB 44%, #F3F6FD 100%)' },
  menthe:   { nom: 'Menthe', em: '🌿', sous: 'vert d\'eau', g1: '#45B79B', g2: '#A8E8CE', lilas: '#7FD8BC',
    halos: ['#8FE0C8','#B9A8F0','#F3D08A'], fondS: 'radial-gradient(1250px 900px at 50% 16%, #4E8FA8 0%, #2F4A7A 42%, #12192B 100%)',
    fondC: 'radial-gradient(1400px 900px at 50% -8%, #E8FAF3 0%, #E6F1F8 44%, #F1FBF7 100%)' },
  aurore:   { nom: 'Aurore', em: '🌅', sous: 'rose et pêche', g1: '#E07A8E', g2: '#F8C9A8', lilas: '#F0A0A8',
    halos: ['#F3AEC0','#C9B7F5','#F7D28A'], fondS: 'radial-gradient(1250px 900px at 50% 16%, #8E5A9E 0%, #4C2E70 42%, #1C1230 100%)',
    fondC: 'radial-gradient(1400px 900px at 50% -8%, #FEEFEF 0%, #F7E8FA 44%, #FEF5F2 100%)' },
};
function themeDuMois(m) { return SAISONS[((m % 12) + 12) % 12]; }
/* Le décor de la saison, posé sur le calendrier : une toile d'araignée
   dans les coins en octobre, une guirlande à Noël, des fanions l'été —
   et des petits objets posés sur le bord du haut, comme sur un meuble,
   avec deux ou trois breloques qui pendent et se balancent. */
/* Le fil d'une guirlande : une vraie courbe, échantillonnée au même
   endroit pour le trait et pour ce qui y est accroché — ainsi les boules
   restent rondes quelle que soit la largeur de l'écran, et tout tombe
   exactement sur le fil. */
const H_FIL = 50;                                            // hauteur de la bande, en pixels
const COURBE = t => 10 + 46 * Math.sin(Math.PI * t);         // en centièmes de cette hauteur
const yFil = t => COURBE(t) / 100 * H_FIL;
function fil(n, accroche) {
  const pts = [...Array(49)].map((_, i) => { const t = i / 48; return `${(t * 1000).toFixed(1)} ${COURBE(t).toFixed(1)}`; });
  const objets = [...Array(n)].map((_, i) => { const t = (i + .5) / n;
    return `<span class="accroche" style="left:${(t * 100).toFixed(2)}%;top:${(yFil(t) + 10).toFixed(1)}px;--d:${(i * .23).toFixed(2)}s">${accroche(i)}</span>`; }).join('');
  return `<div class="fil"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M${pts.join(' L')}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${objets}</div>`;
}
/* Une toile d'araignée tendue dans un coin : elle part exactement de
   l'angle, bien droite, et le coin arrondi de la carte la découpe net. */
const toileCoin = `<svg class="coin" viewBox="0 0 170 170" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round">
    <g stroke-width="1.6" opacity=".95">${[0, 15, 30, 45, 60, 75, 90].map(a => {
      const r = 176, x = (r * Math.cos(a * Math.PI / 180)).toFixed(1), y = (r * Math.sin(a * Math.PI / 180)).toFixed(1);
      return `<path d="M0 0L${x} ${y}"/>`; }).join('')}</g>
    <g stroke-width="1.2" opacity=".85">${[30, 56, 84, 114, 146].map(r => {
      const p = [0, 15, 30, 45, 60, 75, 90].map(a => `${(r * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(r * Math.sin(a * Math.PI / 180)).toFixed(1)}`);
      return `<path d="M${p.join(' Q' + (r * .78).toFixed(1) + ' ' + (r * .78).toFixed(1) + ' ')}"/>`; }).join('')}</g></g></svg>`;
/* Le givre : des cristaux fins qui gagnent le coin. */
const givreCoin = `<svg class="coin" viewBox="0 0 170 170" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.4" opacity=".9">
    ${[12, 30, 48, 66, 78].map((a, i) => { const r = 60 + i * 22, rad = a * Math.PI / 180;
      const x = (r * Math.cos(rad)).toFixed(1), y = (r * Math.sin(rad)).toFixed(1);
      const bras = [.35, .55, .75].map(f => { const bx = (r * f * Math.cos(rad)).toFixed(1), by = (r * f * Math.sin(rad)).toFixed(1);
        const d = r * .16; return `<path d="M${bx} ${by}l${(d * Math.cos(rad - 1)).toFixed(1)} ${(d * Math.sin(rad - 1)).toFixed(1)}M${bx} ${by}l${(d * Math.cos(rad + 1)).toFixed(1)} ${(d * Math.sin(rad + 1)).toFixed(1)}"/>`; }).join('');
      return `<path d="M0 0L${x} ${y}"/>${bras}`; }).join('')}</g></svg>`;
const COINS = { toile: toileCoin, givre: givreCoin };
const BANDEAUX = {
  guirlande: d => fil(15, i => `<i class="boule" style="--b:${['#D8453A', '#4FAE72', '#F3D07A'][i % 3]}"></i>`),
  fil:       d => fil(Math.max(13, (d.items || []).length * 2), i => {
    const it = d.items[i % d.items.length];
    return it.startsWith('<') ? it : `<span class="obj">${it}</span>`;   // un objet dessiné, ou un emoji
  }),
  fanions:   d => fil(16, i => (d.items && i % 2)
    ? `<span class="obj">${d.items[(i >> 1) % d.items.length]}</span>`
    : `<i class="fanion" style="--b:${['#F3C969', '#5ED0C4', '#F3AEC0', '#B9A5F5'][i % 4]}"></i>`),
  /* Janvier : pas de guirlande — un ciel de fête, étoiles et confettis. */
  etoiles:   d => `<div class="fil ciel-fete">${[...Array(22)].map((_, i) => {
      const x = (2 + Math.random() * 96).toFixed(1), y = (4 + Math.random() * 42).toFixed(0), s = (9 + Math.random() * 13).toFixed(0);
      return `<span class="etoile-fete" style="left:${x}%;top:${y}px;font-size:${s}px;animation-delay:${(Math.random() * 3).toFixed(1)}s">${['⭐','✨','🎉','🎊','✦'][i % 5]}</span>`;
    }).join('')}</div>`,
};
function rendreDeco() {
  const t = paletteActive(), d = t.deco;
  if (!d || matchMedia('(prefers-reduced-motion: reduce)').matches) return '';
  const bandeau = BANDEAUX[d.bandeau] ? BANDEAUX[d.bandeau](d) : '';
  const coin = COINS[d.coins] ? COINS[d.coins] + COINS[d.coins].replace('class="coin"', 'class="coin d"') : '';
  // les objets posés tiennent sur la tablette du haut, à l'intérieur de la carte
  const posees = (d.posees || []).map((em, i) => `<span class="posee" style="--i:${i}">${em}</span>`).join('');
  // ce qui pend est accroché au bord haut de la carte, et pend à l'intérieur
  const pendues = (d.pendues || []).map((em, i) =>
    `<span class="pendue" style="left:${[9, 91, 24][i % 3]}%;--l:${34 + i * 18}px;--d:${(i * .8).toFixed(1)}s"><i></i>${em}</span>`).join('');
  // et il en tombe doucement, tout le long de la carte
  const pluie = (d.pluie || []).length ? [...Array(10)].map((_, i) => {
      const em = d.pluie[i % d.pluie.length], t2 = 13 + Math.random() * 12;
      return `<span class="tombe" style="left:${(2 + Math.random() * 95).toFixed(1)}%;font-size:${(13 + Math.random() * 12).toFixed(0)}px;
        animation-duration:${t2.toFixed(1)}s;animation-delay:-${(Math.random() * t2).toFixed(1)}s;--dx:${(-40 + Math.random() * 80).toFixed(0)}px;
        --r1:${(-180 + Math.random() * 360).toFixed(0)}deg">${em}</span>`; }).join('') : '';
  const paillettes = t.paillettes
    ? [...Array(22)].map(() => `<i class="paillette" style="left:${(3 + Math.random() * 94).toFixed(1)}%;top:${(4 + Math.random() * 180).toFixed(0)}px;
        animation-delay:${(Math.random() * 3).toFixed(1)}s;font-size:${(7 + Math.random() * 9).toFixed(0)}px"></i>`).join('')
    : '';
  return `<div class="deco" aria-hidden="true"><div class="deco-in">
      ${coin}${bandeau}${pendues}${pluie}${paillettes}<div class="posees">${posees}</div>
    </div></div>`;
}
function paletteActive() {
  if (S.palette && S.palette !== 'saisons' && PALETTES[S.palette]) return PALETTES[S.palette];
  return themeDuMois(V.curseur.getMonth());
}
/* On pose les couleurs du thème sur <html> : tout le reste suit, puisque
   l'outil entier est écrit en variables. */
function appliquerPalette() {
  const t = paletteActive(), clair = document.documentElement.dataset.theme === 'light', r = document.documentElement.style;
  const pose = (k, v) => v ? r.setProperty(k, v) : r.removeProperty(k);
  pose('--g1', t.g1); pose('--g2', t.g2);
  // en clair, l'accent sert aussi d'encre : on le fonce pour qu'il se lise sur le blanc
  pose('--lilas', t.lilas && clair ? `color-mix(in oklab, ${t.lilas} 55%, #1E1636)` : t.lilas);
  pose('--fond', clair ? t.fondC : t.fondS);
  if (t.halos) { pose('--halo-1', t.halos[0]); pose('--halo-2', t.halos[1]); pose('--halo-3', t.halos[2]); }
  else { pose('--halo-1'); pose('--halo-2'); pose('--halo-3'); }
  motifs(t.motifs);
}
/* Les motifs du fond : les six dessins de l'agenda, plus les symboles de
   la saison quand il y en a. */
let motifsPoses = '';
function motifs(emojis) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const signature = (emojis || []).join('');
  if (signature === motifsPoses && $('#motifs').children.length) return;   // rien de neuf : on ne rejoue pas
  motifsPoses = signature;
  const n = innerWidth < 760 ? 12 : 24;
  // Deux fois sur trois dans les marges, là où le fond reste nu ; le reste
  // passe derrière les cartes, adouci par leur verre dépoli.
  const bandeX = () => Math.random() < .66 ? (Math.random() < .5 ? 1 + Math.random() * 12 : 85 + Math.random() * 12) : 14 + Math.random() * 72;
  let h = '';
  for (let i = 0; i < n; i++) {
    const t = 34 + Math.random() * 42, s = 22 + Math.random() * 30;
    const r0 = (-14 + Math.random() * 28).toFixed(1), r1 = (+r0 + (-16 + Math.random() * 32)).toFixed(1);
    const style = `left:${bandeX().toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;
      --o:calc(var(--motif-o) * ${(.55 + Math.random() * .45).toFixed(2)});--dx:${(-50 + Math.random() * 100).toFixed(0)}px;--r0:${r0}deg;--r1:${r1}deg;
      animation-duration:${t.toFixed(1)}s;animation-delay:-${(Math.random() * t).toFixed(1)}s`;
    // une fois sur deux un symbole de la saison, sinon un dessin de l'agenda
    h += emojis && i % 2
      ? `<span class="emo" style="${style};font-size:${(s * .9).toFixed(0)}px">${emojis[(i >> 1) % emojis.length]}</span>`
      : `<svg viewBox="0 0 24 24" width="${s.toFixed(0)}" height="${s.toFixed(0)}" fill="none" stroke="currentColor" stroke-width="1.3"
          stroke-linecap="round" stroke-linejoin="round" style="${style}">${MOTIFS[i % MOTIFS.length]}</svg>`;
  }
  $('#motifs').innerHTML = h;
}

/* ============================================================
   Ciel étoilé et démarrage
   ============================================================ */
(function ciel() {
  let h = '';
  for (let i = 0; i < 120; i++) {
    const gros = Math.random() < .12, s = gros ? 2.4 + Math.random() : .8 + Math.random() * 1.3;
    h += `<b class="${gros ? 'gros' : ''}" style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 100).toFixed(2)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;
      animation-duration:${(2.5 + Math.random() * 5).toFixed(1)}s;animation-delay:-${(Math.random() * 6).toFixed(1)}s"></b>`;
  }
  $('#ciel').innerHTML = h;
})();

/* ============================================================
   L'entrée dans l'outil
   L'éphéméride s'effeuille : trois feuilles des jours passés s'arrachent,
   et la date d'aujourd'hui reste. Les dates affichées sont les vraies, les
   pastilles reprennent les couleurs des catégories. Un clic passe
   l'animation ; elle ne joue pas si le système veut moins de mouvement.
   ============================================================ */
function entree(apres) {
  const intro = $('#intro');
  let parti = false;
  const fini = () => {                       // une seule fois, quelle que soit la porte de sortie
    if (parti) return;
    parti = true;
    intro?.remove(); document.body.classList.remove('entree');
    const sh = document.querySelector('.shell');          // filet : la page reste visible même si une animation coince
    if (sh) setTimeout(() => { sh.style.animation = ''; }, 700);
    apres();
  };
  if (!intro) return fini();
  const T = auj();
  for (const b of intro.querySelectorAll('[data-j]')) b.textContent = plus(T, -b.dataset.j).getDate();
  for (const i of intro.querySelectorAll('[data-m]')) i.textContent = MOIS_C[plus(T, -i.dataset.m).getMonth()];
  $('#intro-mois').textContent = MOIS[T.getMonth()];
  $('#intro-annee').textContent = T.getFullYear();
  $('#intro-jour').textContent = JOURS[T.getDay()];
  // Les pastilles : les catégories des éléments du jour, sinon quatre couleurs de la maison.
  const duJour = (elements(T, T, true)[cle(T)] || []).slice(0, 5).map(couleur);
  const coul = duJour.length ? duJour : [CATS.travail.c, CATS.famille.c, CATS.sante.c, CATS.loisirs.c];
  $('#intro-pastilles').innerHTML = coul.map((c, i) =>
    `<i style="--c:${c};--i:${i};--vol:${i % 2 ? 34 : -34}px"></i>`).join('');

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return fini();
  document.body.classList.add('entree');
  intro.addEventListener('click', () => {
    intro.style.animation = 'introSort .42s ease forwards';
    const sh = document.querySelector('.shell'); sh.style.animation = 'emerge .55s ease both';
    setTimeout(fini, 430);
  }, { once: true });
  intro.addEventListener('animationend', e => { if (e.animationName === 'introSort') fini(); });
  setTimeout(fini, 4800);   // filet de sécurité si une animation ne se termine pas
}

charger();
try { if (pontNaoPets()) { sansPile = true; enregistrer(); sansPile = false; } } catch (e) {}
appliquerTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
rendreCloche();
rendreTout();
allerPage(V.page);
entree(fetesDuJour);
setTimeout(verifierRappels, 1500);
setInterval(tic, 1000);
let jourCourant = cle(auj());
setInterval(() => {
  verifierRappels();
  if (D) return;
  if (cle(auj()) !== jourCourant) { jourCourant = cle(auj()); rendreTout(); fetesDuJour(); }
  else if (!$('#voile') && document.activeElement?.id !== 'i-prio') { rendreEntete(); rendreJournee(); }
}, 30000);
</script>

<style>
/* ============================================================
   NaoCV — le générateur de CV de la maison NaoGroup.
   Même charte que les autres outils, aux couleurs de « Notre histoire » :
   fond violet profond, halos turquoise et lilas vif, trame de points,
   cartes de verre, le N du jeton, dégradé turquoise → violet → lilas rosé.
   ============================================================ */
:root{
  --serif:Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --fond:radial-gradient(1300px 900px at 50% 28%, #7A5AE0 0%, #43309E 42%, #1A1240 100%);
  --fond-uni:#1A1240;
  --ink:#F3EFFB;
  --ink-2:rgba(243,239,251,.78);
  --ink-3:rgba(243,239,251,.54);
  --verre:rgba(255,255,255,.07);
  --verre-2:rgba(255,255,255,.12);
  --champ:rgba(0,0,0,.2);
  --bord:rgba(255,255,255,.16);
  --bord-2:rgba(255,255,255,.32);
  --lilas:#C9B7F5;
  --accent:#C4A8FF;
  --accent-2:#E99BFF;
  --turquoise:#19F0D8; --violet:#A77BFF; --lilas-rose:#E99BFF;
  --or:#F4C67E;
  --ok:#8FE3B8;
  --alerte:#F6C177;
  --erreur:#FF9DAF;
  --texte-bouton:#1A1240;
  --degrade:linear-gradient(120deg,#19F0D8,#A77BFF 52%,#E99BFF);
  --degrade-vif:linear-gradient(100deg,#19F0D8,#A77BFF 26%,#C9B7F5 48%,#E99BFF 66%,#A77BFF 84%,#6FFFEF);
  --lueur:rgba(138,92,255,.9);
  --lueur-jeton:rgba(167,123,255,.6);
  --ombre:0 26px 60px -30px rgba(0,0,0,.85);
  --motif:#fff;
  --halo-1:#B9A8F0; --halo-2:#19F0D8; --halo-3:#C46BFF; --halo-4:#6FFFEF; --halo-5:#8A3FFF;
  --halo-o1:.45; --halo-o2:.34; --halo-o3:.3; --halo-o4:.18; --halo-o5:.4;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fond:radial-gradient(1200px 860px at 50% 22%, #FFFFFF 0%, #F1ECFF 44%, #DFF6F8 100%);
  --fond-uni:#F1ECFF;
  --ink:#2E2358;
  --ink-2:rgba(46,35,88,.78);
  --ink-3:rgba(46,35,88,.55);
  --verre:rgba(255,255,255,.6);
  --verre-2:rgba(255,255,255,.88);
  --champ:rgba(255,255,255,.8);
  --bord:rgba(96,74,170,.18);
  --bord-2:rgba(96,74,170,.36);
  --lilas:#6A4FC9;
  --accent:#6A3FD8;
  --accent-2:#B65AD8;
  --turquoise:#0FA898; --violet:#7B4FE6; --lilas-rose:#C255D8;
  --or:#A8741A;
  --ok:#23915F;
  --alerte:#B8741A;
  --erreur:#C9415F;
  --texte-bouton:#fff;
  --degrade:linear-gradient(120deg,#12A99B,#7B4FE6 52%,#B65AD8);
  --degrade-vif:linear-gradient(100deg,#0FA898,#7B4FE6 26%,#9A6BE8 48%,#C255D8 66%,#7B4FE6 84%,#12B8A6);
  --lueur:rgba(111,63,216,.6);
  --lueur-jeton:rgba(123,79,230,.4);
  --ombre:0 24px 50px -30px rgba(70,50,140,.45);
  --motif:#6A4FC9;
  --halo-1:#D9CCFB; --halo-2:#A8F0E8; --halo-3:#EBC6FA; --halo-4:#C6F7F1; --halo-5:#CDB8FF;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.55;
  background:var(--fond);background-color:var(--fond-uni);background-attachment:fixed;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle, color-mix(in srgb, var(--motif) 20%, transparent) 1px, transparent 1.7px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 34%, #000 0 28%, transparent 72%);
  mask-image:radial-gradient(circle at 50% 34%, #000 0 28%, transparent 72%);
  animation:grille 1.8s ease both}
body.fige{overflow:hidden}
@keyframes grille{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:color-mix(in srgb, var(--accent) 45%, transparent)}
[hidden]{display:none!important}
.muted{color:var(--ink-2)}
.petit{font-size:13px}
code{font-family:var(--mono);font-size:.85em}

/* ---------- le décor ---------- */
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.halos{position:absolute;inset:0;overflow:hidden}
.halos i{position:absolute;border-radius:50%;filter:blur(64px);animation:flotte 16s ease-in-out infinite alternate}
.halos i:nth-child(1){width:460px;height:460px;background:var(--halo-1);left:6%;top:8%;opacity:var(--halo-o1)}
.halos i:nth-child(2){width:400px;height:400px;background:var(--halo-2);right:6%;bottom:6%;opacity:var(--halo-o2);animation-duration:19s}
.halos i:nth-child(3){width:340px;height:340px;background:var(--halo-3);right:30%;top:-10%;opacity:var(--halo-o3);animation-duration:23s}
.halos i:nth-child(4){width:280px;height:280px;background:var(--halo-4);right:12%;top:18%;opacity:var(--halo-o4);animation-duration:25s}
.halos i:nth-child(5){width:380px;height:380px;background:var(--halo-5);left:-4%;bottom:4%;opacity:var(--halo-o5);animation-duration:29s}
@keyframes flotte{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,-34px) scale(1.18)}}
.motifs{position:absolute;inset:0;width:100%;height:100%}
.motifs .m{transform-box:fill-box;transform-origin:center;animation:derive linear infinite alternate}
.motifs .m *{fill:none;stroke:var(--motif);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.motifs .eclat{fill:var(--motif);animation:scintille ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes derive{0%{transform:translate(0,0) rotate(-6deg)}100%{transform:translate(26px,-34px) rotate(7deg)}}
@keyframes scintille{0%,100%{opacity:.08;transform:scale(.6)}50%{opacity:.6;transform:scale(1.1)}}
.envol{position:absolute;left:-60px;width:34px;animation:traverse var(--duree,11s) linear forwards}
.envol.retour{left:auto;right:-60px;animation-name:traverse-retour}
.envol-y{animation:vague 3.2s ease-in-out infinite alternate}
.envol svg{width:34px;height:34px;fill:color-mix(in srgb, var(--motif) 10%, transparent);stroke:var(--motif);stroke-width:1.4;stroke-linejoin:round;opacity:.5;transform:rotate(-12deg)}
.envol.retour svg{transform:rotate(12deg) scaleX(-1)}
.envol::after{content:'';position:absolute;right:100%;top:50%;width:90px;border-top:2px dotted color-mix(in srgb, var(--motif) 30%, transparent)}
.envol.retour::after{right:auto;left:100%}
@keyframes traverse{to{transform:translateX(calc(100vw + 140px))}}
@keyframes traverse-retour{to{transform:translateX(calc(-100vw - 140px))}}
@keyframes vague{from{transform:translateY(-18px)}to{transform:translateY(22px)}}
:root.calme .motifs .m,:root.calme .motifs .eclat,:root.calme .halos i{animation-play-state:paused}
:root.calme .envol{display:none}
:root.calme #btnCalme{background:var(--verre-2);border-color:var(--bord-2)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}.envol{display:none}}

/* ---------- l'entrée : un CV s'écrit, prend des couleurs, se fait remarquer ---------- */
.intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--fond);background-color:var(--fond-uni);
  cursor:pointer;animation:introSort .75s 3.1s cubic-bezier(.6,0,.3,1) forwards}
.intro::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, color-mix(in srgb, var(--motif) 22%, transparent) 1px, transparent 1.7px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 66%);mask-image:radial-gradient(circle at 50% 45%, #000 0 26%, transparent 66%)}
@keyframes introSort{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.intro .scene{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px;perspective:1600px}
.cv-intro{position:relative;width:224px;height:312px;animation:cvArrive .75s cubic-bezier(.2,.8,.2,1) both, cvPose 1s 2.1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cvArrive{from{opacity:0;transform:rotateX(28deg) rotateZ(-6deg) translateY(50px) scale(.84)}}
@keyframes cvPose{50%{transform:scale(1.045)}to{transform:none}}
.cv-intro .ombre-sol{position:absolute;left:-12%;right:-12%;bottom:-30px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(18px)}
.cv-feuille{position:absolute;inset:0;display:flex;border-radius:6px;background:#fff;overflow:hidden;
  box-shadow:0 34px 70px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.14)}
.cv-feuille .l{display:block;height:6px;border-radius:3px;transform-origin:left center;animation:ecrit .45s cubic-bezier(.3,.7,.3,1) both}
@keyframes ecrit{from{transform:scaleX(0);opacity:.2}}
/* La colonne : elle passe par trois couleurs d'entreprise avant de revenir au violet de NaoCV. */
.cv-cote{width:34%;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#7A4FF0;
  transform-origin:top;animation:cote .5s .55s cubic-bezier(.3,.7,.3,1) both, marques 1.3s 1.35s ease-in-out both}
@keyframes cote{from{transform:scaleY(0)}}
@keyframes marques{0%{background:#7A4FF0}22%{background:#E30613}46%{background:#00965E}70%{background:#0082C3}100%{background:#7A4FF0}}
.cv-photo{display:block;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid rgba(255,255,255,.35);margin-bottom:6px;
  animation:pop .45s .95s cubic-bezier(.3,1.6,.5,1) both}
.cv-cote .l{background:rgba(255,255,255,.7);width:80%}
.cv-cote .l2{width:58%;opacity:.8}.cv-cote .c1{margin-top:10px;width:70%}.cv-cote .c2{width:84%}.cv-cote .c3{width:62%}
.cv-cote .l1{animation-delay:1.05s}.cv-cote .l2{animation-delay:1.12s}.cv-cote .c1{animation-delay:1.3s}.cv-cote .c2{animation-delay:1.37s}.cv-cote .c3{animation-delay:1.44s}
.pastilles{display:flex;gap:5px;margin-top:10px}
.pastilles i{width:18px;height:9px;border-radius:5px;background:rgba(255,255,255,.35);animation:pop .35s both}
.pastilles i:nth-child(1){animation-delay:1.55s}.pastilles i:nth-child(2){animation-delay:1.62s}.pastilles i:nth-child(3){animation-delay:1.69s}
.cv-corps{flex:1;padding:22px 14px 14px;display:flex;flex-direction:column;gap:7px}
.cv-nom{font-family:var(--serif);font-style:italic;font-weight:700;font-size:22px;color:#1d2230;line-height:1;animation:monte .5s .8s ease both}
.cv-nom span{color:#7A4FF0}
.cv-corps .t{width:62%;height:5px;background:#C9B7F5;animation-delay:.95s}
.cv-corps .h{width:44%;height:5px;background:linear-gradient(90deg,#17C9C0,#7A4FF0);margin-top:9px}
.cv-corps .x{background:#E3E5EE}
.cv-corps .x1{width:92%}.cv-corps .x2{width:84%}.cv-corps .x3{width:70%}.cv-corps .x4{width:88%}.cv-corps .x5{width:76%}.cv-corps .x6{width:82%}
.cv-corps .h1{animation-delay:1.1s}.cv-corps .x1{animation-delay:1.2s}.cv-corps .x2{animation-delay:1.27s}.cv-corps .x3{animation-delay:1.34s}
.cv-corps .h2{animation-delay:1.45s}.cv-corps .x4{animation-delay:1.55s}.cv-corps .x5{animation-delay:1.62s}
.cv-corps .h3{animation-delay:1.73s}.cv-corps .x6{animation-delay:1.83s}
.cv-tampon{position:absolute;right:12px;bottom:18px;font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#2F8F63;border:2px solid #2F8F63;border-radius:6px;padding:4px 8px;background:rgba(255,255,255,.9);
  animation:tampon .45s 2.25s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tampon{from{opacity:0;transform:scale(2.2) rotate(-18deg)}to{opacity:1;transform:rotate(-8deg)}}
/* L'éclat : le moment où l'on est remarqué. */
.cv-eclat{position:absolute;top:-22px;right:-22px;width:46px;height:46px;background:#fff;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  filter:drop-shadow(0 0 14px rgba(255,255,255,.95));animation:eclat 1.1s 2.2s cubic-bezier(.3,1.4,.5,1) both}
@keyframes eclat{0%{opacity:0;transform:scale(0) rotate(-90deg)}60%{opacity:1;transform:scale(1.25) rotate(20deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.cv-intro::after{content:'';position:absolute;top:-40px;right:-40px;width:82px;height:82px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
  opacity:0;animation:onde .9s 2.35s ease-out both}
@keyframes onde{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}
.intro .phrase{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);text-align:center;max-width:90vw;animation:monte .8s 1.9s ease both}
.intro .phrase span{font-weight:700}
@media (max-width:560px){.cv-intro{width:170px;height:238px}.cv-nom{font-size:17px}.cv-photo{width:30px;height:30px}.intro .phrase{font-size:17px}}
body.entree .page{animation:emerge .9s 3s cubic-bezier(.2,.8,.2,1) both}
@keyframes emerge{from{opacity:0;transform:translateY(22px) scale(.985)}}

.page{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:18px 22px 60px}
@keyframes monte{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- barre du haut ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:8px 0;animation:monte .7s ease both;flex-wrap:wrap}
.bar .mark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.bar .mark svg{width:44px;height:44px;border-radius:13px;box-shadow:0 8px 22px -8px rgba(0,0,0,.6),0 0 24px -6px var(--lueur-jeton);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.bar .mark:hover svg{transform:rotate(-6deg) scale(1.06)}
.bar h1{margin:0;font-size:23px;letter-spacing:-.01em;font-weight:700;line-height:1.1;font-style:italic}
.nom-outil span,.hero-titre b,.slogan,.intro .phrase span{color:transparent;background:var(--degrade-vif);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:chatoie 9s ease-in-out infinite alternate}
@keyframes chatoie{from{background-position:0% 50%}to{background-position:100% 50%}}
.bar .sub{font-family:var(--ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.bar .outils-haut{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pastille{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:12.5px;color:var(--ink-2);text-decoration:none;
  padding:8px 13px;border-radius:999px;border:1px solid var(--bord);background:var(--verre);cursor:pointer;transition:.2s;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
.pastille:hover{border-color:var(--bord-2);color:var(--ink);transform:translateY(-1px)}
.pastille svg{width:18px;height:18px;border-radius:6px}
.pastille.icone{padding:8px 10px;font-size:14px}
.pastille.creer{background:var(--degrade);color:var(--texte-bouton);border-color:transparent;font-weight:700}
.pastille.choix select{border:0;background:transparent;font-family:var(--ui);font-size:12.5px;color:var(--ink);max-width:240px;cursor:pointer;outline:none}
.pastille.choix select option{background:var(--fond-uni);color:var(--ink)}
.theme{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--bord);background:var(--verre);cursor:pointer;padding:0;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.theme .pouce{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--degrade);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
:root[data-theme="light"] .theme .pouce{transform:translateX(28px)}
.theme .lune,.theme .soleil{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;line-height:1;pointer-events:none}
.theme .lune{left:10px;color:#fff}
.theme .soleil{right:10px;color:var(--or)}
:root[data-theme="light"] .theme .lune{color:var(--ink-3)}
:root[data-theme="light"] .theme .soleil{color:#fff}

/* ---------- onglets ---------- */
.onglets{display:flex;flex-wrap:wrap;gap:6px;padding:12px 2px 14px;margin:6px 0 8px;animation:monte .7s .05s ease both}
@media (max-width:760px){.onglets{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px -22px 8px;padding:12px 22px 14px}}
.onglets button{flex:none;position:relative;display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-2);
  padding:9px 14px;border-radius:999px;border:1px solid var(--bord);background:var(--verre);cursor:pointer;transition:.2s;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.onglets button:hover{color:var(--ink);border-color:var(--bord-2)}
.onglets button.actif{background:var(--degrade);color:var(--texte-bouton);border-color:transparent;box-shadow:0 10px 24px -12px var(--lueur)}
.bulle-n{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E0663E;color:#fff;font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center}

#contenu{animation:monte .6s .08s ease both;outline:none}

/* ---------- cartes, boutons, champs ---------- */
.carte{background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:22px;box-shadow:var(--ombre);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h2,h3,h4{font-style:italic;letter-spacing:-.01em}
.carte h3{margin:0 0 12px;font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--ui);font-size:13.5px;font-weight:650;color:var(--ink);
  padding:10px 16px;border-radius:13px;border:1px solid var(--bord-2);background:var(--verre-2);cursor:pointer;transition:.2s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn.primaire{background:var(--degrade);color:var(--texte-bouton);border-color:transparent;box-shadow:0 12px 26px -14px var(--lueur)}
.btn.primaire:hover{filter:brightness(1.06)}
.btn.fantome{background:transparent}
.btn.petit{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.grand{padding:14px 24px;font-size:15.5px;border-radius:15px}
.btn.danger{background:#C24B63;border-color:transparent;color:#fff}
.danger-t{color:var(--erreur)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}

.sugg-b{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:12px;padding:4px 10px;border-radius:999px;border:1px dashed var(--bord-2);background:transparent;color:var(--ink-2);cursor:pointer;transition:.2s}
.sugg-b:hover{border-style:solid;border-color:var(--accent);color:var(--ink)}
.lignes-ed{display:flex;flex-direction:column;gap:4px}
.ligne-ed{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.ligne-ed.l3{grid-template-columns:1.4fr 1fr .6fr auto}
.ligne-ed .icone{margin-bottom:17px}
@media (max-width:620px){.ligne-ed,.ligne-ed.l3{grid-template-columns:1fr 1fr}.ligne-ed .icone{grid-column:1/-1;margin:0 0 10px}}
.projet-ed{padding:14px;border-radius:16px;background:var(--champ);border:1px solid var(--bord);margin-bottom:10px}
.modeles{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:10px}
.modele{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 10px;border-radius:15px;border:1.5px solid var(--bord);background:var(--champ);cursor:pointer;transition:.2s;font-family:var(--ui);text-align:center}
.modele:hover{border-color:var(--bord-2);transform:translateY(-2px)}
.modele.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.modele b{font-size:13px}
.modele small{font-size:12px;color:var(--ink-3);line-height:1.3}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.nuance{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;border:0;background:none;cursor:pointer;font-family:var(--ui);font-size:12px;color:var(--ink-3);padding:0}
.nuance i{width:36px;height:36px;border-radius:50%;background:var(--n);border:2px solid rgba(255,255,255,.6);box-shadow:0 6px 14px -6px rgba(0,0,0,.6);transition:.2s}
.nuance.on i{box-shadow:0 0 0 3px var(--fond-uni),0 0 0 5px var(--accent)}
.nuance:hover i{transform:scale(1.1)}
.nuance.perso input{width:36px;height:36px;border-radius:50%;padding:0;border:2px dashed var(--bord-2);overflow:hidden}
.marque-bloc{margin-top:14px;padding:16px;border-radius:18px;border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent)}
.marque-tete{display:flex;flex-direction:column;margin-bottom:10px}
.marque-tete small{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
.marque-active{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:13.5px;margin-bottom:10px}
.marque-active span{flex:1}
.marque-bloc .puces-ajout{margin:10px 0 12px;flex-wrap:wrap}
.marque-bloc>small{font-family:var(--ui);font-size:12px;display:block}
.marque-exp{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:15px;background:var(--champ);border:1px solid var(--bord);margin:0 0 12px}
.me-apercu{display:flex;align-items:center;gap:12px;font-family:var(--ui);font-size:13px}
.me-apercu small{display:block;color:var(--ink-3);font-size:12px}
.me-apercu .mono{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;flex:none;transition:background .3s}
.me-outils{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.me-outils input[type=color]{width:52px;height:36px}
.reform{display:flex;flex-direction:column;gap:12px;margin:4px 0 16px;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);background:color-mix(in srgb, var(--accent) 7%, transparent);animation:monte .4s ease both}
.reform-o{font-style:italic;color:var(--ink-2);font-size:14.5px;margin-bottom:6px}
.avis{font-family:var(--ui);font-size:12px;padding:5px 9px;border-radius:9px;margin-bottom:4px}
.avis.alerte{background:color-mix(in srgb, var(--alerte) 15%, transparent);color:var(--ink)}
.avis.info{color:var(--ink-3)}
.variantes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
@media (max-width:760px){.variantes{grid-template-columns:1fr}}
.variante{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px;border-radius:12px;border:1px solid var(--bord);background:var(--champ);cursor:pointer;transition:.2s;font-family:var(--ui);font-size:13px}
.variante:hover{border-color:var(--accent);transform:translateY(-1px)}
.variante small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--accent)}
.variante em{font-size:12px;color:var(--ink-3)}
.pret-badge{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:var(--champ);border:1px solid var(--bord);margin-bottom:14px}
.pret-badge.ok{border-color:color-mix(in srgb, var(--ok) 55%, transparent);background:color-mix(in srgb, var(--ok) 9%, transparent)}
.pret-badge p{margin:3px 0 0;font-family:var(--ui);font-size:13px}
.anneau{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--ui);position:relative;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--champ) 0)}
.anneau::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--fond-uni)}
.anneau b,.anneau small{position:relative}
.anneau.grand{width:110px;height:110px;flex-direction:column;gap:0}
.anneau.grand::before{inset:10px}
.anneau.grand b{font-size:32px;font-family:var(--serif);font-style:italic;line-height:1}
.anneau.grand small{font-size:12px;color:var(--ink-3)}
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--champ);border:1px solid var(--bord);font-family:var(--ui);font-size:13.5px}
.checklist li>div{flex:1;min-width:0}
.checklist small{display:block;color:var(--ink-3);font-size:12px}
.checklist .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.checklist .ok .ic{background:color-mix(in srgb, var(--ok) 25%, transparent);color:var(--ok)}
.checklist .alerte .ic{background:color-mix(in srgb, var(--alerte) 25%, transparent);color:var(--alerte)}
.checklist .erreur .ic{background:color-mix(in srgb, var(--erreur) 25%, transparent);color:var(--erreur)}
.checklist .info .ic{background:var(--verre-2);color:var(--ink-2)}
.checklist .erreur{border-color:color-mix(in srgb, var(--erreur) 45%, transparent)}
.fautes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ui);font-size:13px}
.fautes li{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;background:var(--champ)}
.fautes small{color:var(--ink-3)}
@media (max-width:620px){.fautes li{grid-template-columns:1fr}}
.exports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.export{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:13px 14px;border-radius:15px;border:1px solid var(--bord);background:var(--champ);cursor:pointer;transition:.2s;font-family:var(--ui)}
.export span{grid-row:1/3;font-size:24px}
.export b{font-size:14px}
.export small{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.export:hover{border-color:var(--accent);transform:translateY(-2px)}
@media (max-width:520px){.exports{grid-template-columns:1fr}}

/* ---------- versions ---------- */
.versions{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.version{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px}
.version.principal{border-color:color-mix(in srgb, var(--accent) 60%, transparent)}
.version-v{border:0;padding:0;background:none;cursor:pointer;border-radius:6px;transition:transform .25s}
.version-v:hover{transform:translateY(-3px) rotate(-1deg)}
.version-txt{display:flex;flex-direction:column;gap:2px;font-family:var(--ui);min-width:0}
.version-nom{font-family:var(--serif);font-style:italic;font-size:17px;display:flex;gap:6px;align-items:baseline}
.version-nom .etoile{color:var(--or)}
.version-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.vignette{position:relative;overflow:hidden;border-radius:5px;background:#fff;box-shadow:0 12px 26px -14px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.06);flex:none;pointer-events:none}
.vignette-in{transform-origin:0 0;width:210mm}

/* ---------- adapter à une offre ---------- */
.offre-grille{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.offre-grille>.carte:first-child{position:sticky;top:14px}
.resultats{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1000px){.offre-grille{grid-template-columns:1fr}.offre-grille>.carte:first-child{position:static}}
.score-carte{display:flex;gap:18px;align-items:center}
.score-carte p{margin:4px 0}
.legende{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.kw{display:inline-flex;align-items:center;gap:5px;font-family:var(--ui);font-size:12.5px;padding:4px 6px 4px 10px;border-radius:999px;margin:0 4px 6px 0;border:1px solid var(--bord)}
.kw.present{background:color-mix(in srgb, var(--ok) 14%, transparent);border-color:color-mix(in srgb, var(--ok) 45%, transparent);color:var(--ink);padding-right:10px}
.kw.absent{background:var(--champ);color:var(--ink-2);border-style:dashed}
.kw button{width:22px;height:22px;border-radius:50%;border:0;background:var(--degrade);color:var(--texte-bouton);font-weight:900;cursor:pointer;padding:0;line-height:1}
.kw.mini{font-size:12px;padding:1px 7px;margin:0 0 0 4px}
.kw-groupe{margin-top:10px}
.kw-groupe h4{margin:0 0 6px;font-size:14px}
.axes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.axes li{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:var(--champ);border-left:3px solid var(--accent);font-family:var(--ui);font-size:13.5px}
.axes li span{color:var(--ink-2)}
.propo{padding:10px 0;border-top:1px solid var(--bord)}
.propo:first-of-type{border-top:0}
.propo small{font-family:var(--ui);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.propo p{margin:4px 0 0}
.propo textarea{margin-top:6px}
.missions-tri{margin:6px 0 0;padding-left:20px;font-family:var(--ui);font-size:13.5px;color:var(--ink-2)}
.missions-tri li{margin:3px 0}
.missions-tri li.fort{color:var(--ink);font-weight:600}
.creer-version{background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), var(--verre))}

/* ---------- lettres ---------- */
.lettre-grille{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.lettre-droite{position:sticky;top:14px;min-width:0}
@media (max-width:1000px){.lettre-grille{grid-template-columns:1fr}.lettre-droite{position:static}}
.choix-ligne{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-family:var(--ui)}
.choix-ligne>span{font-size:12px;font-weight:650;color:var(--ink-2);width:64px}
.choix-b{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--bord);background:var(--champ);color:var(--ink-2);cursor:pointer;transition:.2s}
.choix-b:hover{border-color:var(--bord-2);color:var(--ink)}
.choix-b.on{background:var(--degrade);color:var(--texte-bouton);border-color:transparent}
.choix-b b{font-weight:800;opacity:.75}
.plier{margin:0 0 12px;border-radius:14px;border:1px solid var(--bord);padding:10px 14px;background:var(--champ)}
.plier summary{cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:650;color:var(--ink-2)}
.plier[open] summary{margin-bottom:10px}
.paragraphes{display:flex;flex-direction:column;gap:10px}
.par-ed{border-radius:14px;border:1px solid var(--bord);padding:10px;background:var(--champ)}
.par-tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.par-tete small{font-family:var(--ui);font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.par-tete span{display:flex;gap:4px}
.par-ed textarea{background:transparent;border-color:transparent;padding:6px}
.par-ed textarea:focus{background:var(--champ)}

/* ---------- candidatures ---------- */
.bandeau-rappel{font-family:var(--ui);font-size:14px;padding:12px 16px;border-radius:15px;background:color-mix(in srgb, var(--alerte) 16%, transparent);border:1px solid color-mix(in srgb, var(--alerte) 45%, transparent);margin-bottom:14px;animation:monte .5s ease both}
.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tableau-cand{padding:6px;overflow-x:auto}
.cands{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:13px}
.cands th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:10px;font-weight:700;white-space:nowrap}
.cands td{padding:10px;border-top:1px solid var(--bord);vertical-align:middle}
.cands td b{display:block;font-family:var(--serif);font-style:italic;font-size:14.5px}
.cands td small{color:var(--ink-3)}
.cands td.act{white-space:nowrap;text-align:right}
.cands tr:hover td{background:var(--verre)}
.statut-sel{width:auto;min-width:170px;padding:6px 10px;font-size:12.5px;font-weight:650;border-color:color-mix(in srgb, var(--s) 60%, transparent);background:color-mix(in srgb, var(--s) 16%, var(--champ))}
@media (max-width:860px){
  .cands thead{display:none}
  .cands,.cands tbody,.cands tr,.cands td{display:block;width:100%}
  .cands tr{padding:10px;border-top:1px solid var(--bord)}
  .cands td{border:0;padding:3px 4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .cands td::before{content:attr(data-l);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);flex:none}
  .cands td.act::before{content:''}
  .cands td b{text-align:right}
}

/* ---------- calendrier ---------- */
.cal-grille{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cal-grille{grid-template-columns:1fr}}
.cal-tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-tete h3{margin:0;flex:1;text-align:center;text-transform:capitalize}
.legende-cal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.semaine,.mois{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.semaine span{font-family:var(--ui);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:center;padding:4px 0;font-weight:700}
.jour{min-height:92px;border-radius:12px;background:var(--champ);border:1px solid var(--bord);padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.jour.hors{background:transparent;border-style:dashed;opacity:.4}
.jour .n{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--ink-3)}
.jour.auj{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.jour.auj .n{color:var(--accent)}
.ev{display:block;width:100%;text-align:left;font-family:var(--ui);font-size:12px;font-weight:650;padding:3px 6px;border-radius:7px;border:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.legende-cal .ev{width:auto;cursor:default}
.ev-entretien{background:color-mix(in srgb, #A77BFF 38%, transparent)}
.ev-relance{background:color-mix(in srgb, #D98E2B 38%, transparent)}
.ev-envoi{background:color-mix(in srgb, #5B7BD5 26%, transparent)}
@media (max-width:620px){.jour{min-height:58px}.jour .ev{font-size:0;padding:4px;height:8px}}
.agenda{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.agenda li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--champ);border-left:3px solid #A77BFF;font-family:var(--ui);font-size:13px}
.agenda li.ev-relance{border-left-color:#D98E2B;background:var(--champ)}
.agenda li.ev-entretien{background:var(--champ)}
.agenda li>div:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}
.agenda small{color:var(--ink-3)}
.date-bloc{width:46px;text-align:center;flex:none;display:flex;flex-direction:column;line-height:1.1}
.date-bloc b{font-family:var(--serif);font-style:italic;font-size:22px}
.date-bloc small{text-transform:uppercase;font-size:11px;font-weight:700}

/* ---------- prêt à envoyer ---------- */
.prets{display:flex;flex-direction:column;gap:12px}
.pret{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px}
.pret-em{width:96px;height:96px;border-radius:18px;background:var(--verre-2);display:grid;place-items:center;font-size:36px}
.pret-txt{display:flex;flex-direction:column;gap:2px;font-family:var(--ui);min-width:0}
.pret-txt>b{font-family:var(--serif);font-style:italic;font-size:17px}
.nom-f{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:8px;background:var(--champ);color:var(--accent);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mini-pb{margin:4px 0;padding-left:18px;font-size:12px;color:var(--ink-2)}
.mini-pb .erreur{color:var(--erreur)}
.pret-act{display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.pret{grid-template-columns:auto 1fr}.pret-act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
.astuces{margin-top:18px}

/* ---------- fenêtres et messages ---------- */
.voile{position:fixed;inset:0;z-index:50;background:rgba(14,8,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .25s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.voile.ouvert{opacity:1;pointer-events:auto}
.fen{width:100%;max-width:560px;background:var(--fond-uni);background-image:var(--fond);border:1px solid var(--bord-2);border-radius:24px;padding:24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);transform:translateY(16px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.voile.ouvert .fen{transform:none}
.fen.large{max-width:860px}
.fen.petite{max-width:440px}
.fen h3{margin:0 0 12px;font-size:22px}
.fen p{font-family:var(--ui);font-size:14px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px, calc(100% - 32px))}
.toast{font-family:var(--ui);font-size:13.5px;padding:11px 16px;border-radius:14px;background:var(--fond-uni);border:1px solid var(--bord-2);box-shadow:var(--ombre);animation:monte .35s ease both;transition:opacity .4s,transform .4s}
.toast.alerte{border-color:var(--alerte)}
.toast.part{opacity:0;transform:translateY(10px)}
.pied{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:40px;font-family:var(--ui);font-size:12.5px;color:var(--ink-3);text-align:center}
.pied svg{width:26px;height:26px;border-radius:8px;flex:none}

/* ============================================================
   LA FEUILLE — le CV lui-même, en vraie taille A4.
   ============================================================ */
.feuille{--c1:#1F3A68;--c1-brut:#1F3A68;--c2:#1F3A68;--c1-pale:#D5DBE6;--c1-voile:#EEF1F6;--c1-sombre:#132440;--police:Calibri,Arial,sans-serif;
  position:relative;width:210mm;min-height:297mm;background:#fff;color:#1d2230;font-family:var(--police);font-size:10pt;line-height:1.42;
  font-style:normal;text-align:left;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.feuille *{box-sizing:border-box}
.feuille p{margin:0}
.feuille h2{font-size:10.5pt;letter-spacing:.09em;text-transform:uppercase;color:var(--c1);margin:0 0 3mm;font-weight:700;font-style:normal;break-after:avoid}
.feuille h3{font-style:normal}
.feuille ul{margin:1.2mm 0 0;padding-left:4.6mm}
.feuille li{margin:.55mm 0}
.feuille li::marker{color:var(--c1)}
.feuille .s{margin-bottom:5.5mm}
.feuille .nom{font-size:24pt;line-height:1.08;letter-spacing:-.005em;font-weight:400;color:#141824}
.feuille .nom b{font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.feuille .titre{font-size:12.5pt;color:var(--c1);font-weight:650;margin-top:1.6mm;letter-spacing:.01em}
.feuille .contacts{list-style:none;padding:0;margin:3.2mm 0 0;display:flex;flex-wrap:wrap;gap:1.2mm 5mm;font-size:9pt;color:#3c4254}
.feuille .contacts li{display:flex;align-items:center;gap:1.5mm;margin:0;overflow-wrap:anywhere}
.feuille .ico{width:3.7mm;height:3.7mm;fill:none;stroke:var(--c1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.feuille .photo{width:30mm;height:30mm;border-radius:50%;object-fit:cover;flex:none;display:block}
.feuille .gris{color:#6a7084;font-weight:400}
.xp,.fo{margin-bottom:4mm;break-inside:avoid}
.xp:last-child,.fo:last-child{margin-bottom:0}
.xp-tete{display:flex;gap:3mm;align-items:flex-start}
.xp-titres{flex:1;min-width:0}
.xp-poste{font-weight:700;font-size:10.6pt;color:#141824}
.xp-ent{font-size:9.3pt;color:#4a5064;margin-top:.2mm}
.xp-ent b{color:var(--marque, var(--c1));font-weight:700}
.xp-date{font-size:8.8pt;color:#5a6075;white-space:nowrap;padding-top:.5mm;font-weight:600}
.feuille .mono{width:8.6mm;height:8.6mm;border-radius:2mm;display:grid;place-items:center;font-size:8pt;font-weight:800;letter-spacing:.02em;flex:none;color:#fff;background:var(--c1);overflow:hidden}
.feuille .mono.logo{background:#fff;border:.3mm solid #e3e5ec;padding:.7mm}
.feuille .mono img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.xp ul{padding-left:4.4mm}
.xp-plus{font-size:8.8pt;color:#4a5064;margin-top:1.1mm}
.xp-plus span{font-weight:800;color:var(--marque, var(--c1));text-transform:uppercase;font-size:7.3pt;letter-spacing:.07em;margin-right:1.5mm}
.fo-det{margin:.8mm 0 0!important;font-size:9pt;color:#4a5064}
.puces{display:flex;flex-wrap:wrap;gap:1.5mm}
.puce{font-size:8.6pt;padding:.7mm 2.4mm;border-radius:1.2mm;background:var(--c1-voile);color:#232838;border:.25mm solid var(--c1-pale)}
.groupe{margin-bottom:2.8mm}
.groupe:last-child{margin-bottom:0}
.groupe h3{font-size:7.8pt;text-transform:uppercase;letter-spacing:.09em;color:#6a7084;margin:0 0 1.4mm;font-weight:700}
.feuille .lignes{list-style:none;padding:0;margin:0}
.feuille .lignes li{display:flex;justify-content:space-between;gap:3mm;padding:.9mm 0;border-bottom:.2mm dotted #d4d7e0;margin:0}
.feuille .lignes li:last-child{border-bottom:0}
.feuille .lignes li span{color:#5a6075;text-align:right}
.feuille .infos li{justify-content:flex-start;align-items:center;gap:1.8mm}
.pj{margin-bottom:2.8mm;break-inside:avoid}
.pj p{margin:.6mm 0 0}
.s-forts ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.s-forts li{background:var(--c1-voile);border-left:.9mm solid var(--c1);padding:2mm 3mm;margin:0;border-radius:0 1.5mm 1.5mm 0}
.fond-cote{display:none}

/* Une colonne : Classique, Élégant, Minimaliste */
.f-une{padding:15mm 17mm 13mm}
.f-une .entete{display:flex;gap:6mm;align-items:center;padding-bottom:5mm;margin-bottom:6mm;border-bottom:.55mm solid var(--c1)}
.f-une .entete-txt{flex:1;min-width:0}
.m-classique h2{border-bottom:.3mm solid var(--c1-pale);padding-bottom:1.2mm}
.m-classique .xp.marque{border-left:.8mm solid var(--marque);padding-left:3mm}
.m-classique .entete{border-bottom-width:.9mm;border-image:linear-gradient(90deg,var(--c1) 0 72%,var(--c2) 72%) 1}
.m-elegant .entete{flex-direction:column;text-align:center;border-bottom:0;padding-bottom:0}
.m-elegant .entete::after{content:'';display:block;width:100%;height:1.5mm;border-top:.25mm solid var(--c1);border-bottom:.25mm solid var(--c1);margin-top:5mm}
.m-elegant .contacts{justify-content:center}
.m-elegant .nom{font-size:25pt;letter-spacing:.07em}
.m-elegant .nom b{font-weight:600}
.m-elegant .titre{font-style:italic;font-weight:400;letter-spacing:.04em}
.m-elegant h2{position:relative;text-align:center;font-variant:small-caps;text-transform:none;letter-spacing:.14em;font-size:12.5pt;font-weight:600}
.m-elegant h2::before{content:'';position:absolute;left:0;right:0;top:55%;border-top:.2mm solid var(--c1-pale)}
.m-elegant h2 span{position:relative;background:#fff;padding:0 4mm}
.m-elegant .puce{background:none;border:0;padding:0 1mm;font-style:italic}
.m-elegant .puces{justify-content:center;gap:1mm 3mm}
.m-elegant .s-profil p{text-align:center;font-style:italic;padding:0 8mm}
.m-minimaliste{padding:20mm 21mm 16mm}
.m-minimaliste .entete{border-bottom:0;margin-bottom:10mm;padding-bottom:0}
.m-minimaliste .nom{font-size:23pt;font-weight:300}
.m-minimaliste .nom b{text-transform:none;font-weight:700}
.m-minimaliste .titre{color:#1d2230;font-weight:400}
.m-minimaliste .titre::before{content:'';display:inline-block;width:2.2mm;height:2.2mm;border-radius:50%;background:var(--c1);margin-right:2.5mm;vertical-align:.35mm}
.m-minimaliste .ico{stroke:#1d2230}
.m-minimaliste .s{display:grid;grid-template-columns:33mm minmax(0,1fr);column-gap:5mm;margin-bottom:7mm}
.m-minimaliste .s>h2{grid-column:1;grid-row:1/span 40;color:#1d2230;font-size:8.3pt;letter-spacing:.2em;font-weight:700;margin:0;padding-top:.8mm}
.m-minimaliste .s>*:not(h2){grid-column:2}
.m-minimaliste .puce{background:none;border:0;padding:0}
.m-minimaliste .puce:not(:last-child)::after{content:' ·';color:var(--c1)}

/* Colonne latérale : Moderne, Étudiant, Reconversion (à gauche), Professionnel (à droite) */
.f-gauche .colonnes,.f-droite .colonnes{position:relative;display:flex;min-height:297mm}
.f-droite .colonnes{flex-direction:row-reverse}
.fond-cote{position:absolute;top:0;bottom:0;left:0;width:68mm;background:var(--c1)}
.f-gauche .fond-cote,.f-droite .fond-cote{display:block}
.f-droite .fond-cote{left:auto;right:0}
.cote{position:relative;width:68mm;flex:none;padding:14mm 7mm 12mm 8mm;color:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.principal{position:relative;flex:1;padding:14mm 12mm 12mm 10mm;min-width:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cote .photo{margin:0 auto 6mm;width:36mm;height:36mm;border:1.2mm solid rgba(255,255,255,.35)}
.cote-nom{margin-bottom:8mm}
.cote .nom{color:#fff;font-size:19pt}
.cote .titre{color:rgba(255,255,255,.86)}
.cote h2{color:#fff;border-bottom:.3mm solid rgba(255,255,255,.35);padding-bottom:1.2mm;font-size:9.5pt}
.cote .contacts{flex-direction:column;color:#fff;margin:0}
.cote .ico{stroke:#fff}
.cote .puce{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24);color:#fff}
.cote .groupe h3{color:rgba(255,255,255,.72)}
.cote .lignes li{border-bottom-color:rgba(255,255,255,.22)}
.cote .lignes li span{color:rgba(255,255,255,.78)}
.cote .gris{color:rgba(255,255,255,.72)}
.m-moderne .principal h2::after{content:'';display:block;width:12mm;height:.9mm;background:var(--c2);margin-top:1.3mm;border-radius:1mm}
.m-moderne .principal h2{margin-bottom:3.5mm}
.m-moderne .xp.marque{padding-left:3mm;border-left:.7mm solid var(--marque)}
.m-reconversion .fond-cote{background:var(--c1-sombre)}
.m-reconversion .principal .s-comp{background:var(--c1-voile);padding:4mm;border-radius:2mm;border-left:1.1mm solid var(--c1)}
.m-reconversion .principal h2{border-bottom:.3mm solid var(--c1-pale);padding-bottom:1.1mm}
/* Colonne claire : Étudiant et Professionnel */
.clair .fond-cote,.m-professionnel .fond-cote{background:var(--c1-voile)}
.clair .fond-cote{border-right:.8mm solid var(--c1)}
.m-professionnel .fond-cote{border-left:.3mm solid var(--c1-pale)}
.clair .cote,.m-professionnel .cote{color:#1d2230}
.clair .cote .nom,.m-professionnel .cote .nom{color:#141824}
.clair .cote .titre,.m-professionnel .cote .titre{color:var(--c1)}
.clair .cote h2,.m-professionnel .cote h2{color:var(--c1);border-bottom-color:var(--c1-pale)}
.clair .cote .contacts,.m-professionnel .cote .contacts{color:#3c4254}
.clair .cote .ico,.m-professionnel .cote .ico{stroke:var(--c1)}
.clair .cote .puce,.m-professionnel .cote .puce{background:#fff;border-color:var(--c1-pale);color:#232838}
.clair .cote .groupe h3,.m-professionnel .cote .groupe h3{color:#6a7084}
.clair .cote .lignes li,.m-professionnel .cote .lignes li{border-bottom-color:#d4d7e0}
.clair .cote .lignes li span,.m-professionnel .cote .lignes li span{color:#5a6075}
.clair .cote .gris,.m-professionnel .cote .gris{color:#6a7084}
.clair .cote .photo,.m-professionnel .cote .photo{border-color:#fff;box-shadow:0 0 0 .4mm var(--c1-pale)}
.m-etudiant .principal h2{display:flex;align-items:center;gap:2.5mm}
.m-etudiant .principal h2::before{content:'';width:2.6mm;height:2.6mm;border-radius:.8mm;background:var(--c2);transform:rotate(45deg)}
.m-professionnel .cote{padding-top:17mm}
.m-professionnel::before{content:'';position:absolute;top:0;left:0;right:0;height:3mm;background:linear-gradient(90deg,var(--c1) 0 68%,var(--c2) 68%);z-index:2}
.m-professionnel .principal{padding:15mm 10mm 12mm 13mm}
.m-professionnel .entete{border-bottom:.45mm solid var(--c1);padding-bottom:4.5mm;margin-bottom:6mm}
.m-professionnel .nom{font-size:25pt}
.m-professionnel .principal h2{border-left:1.1mm solid var(--c1);padding-left:2.4mm;line-height:1.1}
.m-professionnel .xp.marque{border-left:.7mm solid var(--marque);padding-left:3mm}

/* Bandeau : Créatif, Alternance, Cadre */
.f-bandeau .bandeau{position:relative;display:flex;align-items:center;gap:6mm;padding:13mm 16mm 10mm;background:var(--c1);color:#fff;overflow:hidden}
.bandeau-txt{position:relative;flex:1;min-width:0;z-index:1}
.bandeau .nom{color:#fff}
.bandeau .titre{color:rgba(255,255,255,.9)}
.bandeau .contacts{color:#fff}
.bandeau .ico{stroke:#fff}
.bandeau .photo{position:relative;z-index:1;border:1.2mm solid rgba(255,255,255,.4)}
.f-bandeau .corps{padding:8mm 16mm 12mm;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dispo-bandeau{display:flex;align-items:center;gap:2mm;padding:2.6mm 16mm;background:var(--c1-voile);color:var(--c1);font-weight:700;font-size:9.6pt;border-bottom:.4mm solid var(--c1-pale)}
.m-creatif .bandeau{padding-bottom:16mm;clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}
.m-creatif .bandeau::after{content:'';position:absolute;right:-14mm;top:-16mm;width:56mm;height:56mm;border-radius:50%;background:var(--c2);opacity:.45}
.m-creatif .bandeau::before{content:'';position:absolute;right:30mm;bottom:6mm;width:18mm;height:18mm;border-radius:50%;border:.8mm solid rgba(255,255,255,.3)}
.m-creatif .corps{padding-top:4mm}
.m-creatif h2 span{display:inline-block;background:var(--c1);color:#fff;padding:.9mm 3mm;border-radius:1.6mm}
.m-creatif .s-exp .xp{position:relative;padding-left:6mm;margin-left:1.4mm;border-left:.5mm solid var(--c1-pale);padding-bottom:1mm;margin-bottom:3mm}
.m-creatif .s-exp .xp::before{content:'';position:absolute;left:-1.6mm;top:1.2mm;width:2.7mm;height:2.7mm;border-radius:50%;background:var(--marque, var(--c1));box-shadow:0 0 0 .8mm #fff}
.m-creatif .puce{border-radius:4mm;background:#fff;border-color:var(--c1)}
.m-alternance .bandeau{border-bottom:1.4mm solid var(--c2)}
.m-alternance h2{display:flex;align-items:center;gap:2.5mm}
.m-alternance h2::after{content:'';flex:1;border-top:.3mm solid var(--c1-pale)}
.m-alternance .xp.marque{border-left:.7mm solid var(--marque);padding-left:3mm}
.sombre .bandeau{background:linear-gradient(135deg,#1b2030,#2b3144);border-bottom:1.6mm solid var(--c1-brut)}
.sombre .bandeau .titre{color:var(--c1-pale)}
.sombre .bandeau .ico{stroke:var(--c1-pale)}
.m-cadre .nom{font-size:25pt;letter-spacing:.01em}
.m-cadre h2{border-left:1.2mm solid var(--c1);padding-left:2.5mm;line-height:1.15}
.m-cadre .xp.marque{border-left:.7mm solid var(--marque);padding-left:3mm}

/* Le CV ATS : une colonne, texte simple, aucune fantaisie. */
.feuille.ats{padding:16mm 18mm 14mm;font-family:var(--police);color:#000;font-size:10.5pt;line-height:1.38}
.ats h1{font-size:18pt;margin:0 0 1mm;font-weight:700;font-style:normal;letter-spacing:0}
.ats .ats-titre{font-size:12pt;font-weight:700;margin:0 0 2mm}
.ats p{margin:0 0 1.1mm}
.ats h2{font-size:11.5pt;text-transform:uppercase;letter-spacing:.02em;color:#000;border-bottom:.3mm solid #000;padding-bottom:.8mm;margin:5.5mm 0 2.5mm}
.ats h3{font-size:10.5pt;margin:2.6mm 0 .4mm;font-weight:700}
.ats .ats-date{font-style:italic;color:#222}
.ats ul{padding-left:5mm;margin:1mm 0}
.ats li::marker{color:#000}
.ats-bloc{break-inside:avoid}

/* La lettre de motivation */
.feuille.lettre{padding:20mm 22mm 18mm;font-size:10.8pt;line-height:1.56}
.l-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;margin-bottom:9mm;padding-bottom:5mm;border-bottom:.55mm solid var(--c1)}
.l-exp .nom{font-size:17pt}
.l-exp .titre{font-size:10.5pt}
.l-coord{font-size:9.5pt;color:#444;margin-top:2mm;line-height:1.45}
.l-dest{text-align:right;font-size:10pt;line-height:1.45}
.l-date{text-align:right;margin:0 0 7mm!important}
.l-objet{margin:0 0 7mm!important}
.l-appel{margin:0 0 4mm!important}
.l-par{text-align:justify;margin:0 0 3.8mm!important;hyphens:auto}
.l-signe{text-align:right;margin-top:10mm!important;font-weight:700}
.lettre.courte{padding:24mm 24mm}
.trou{background:#FFF0B3;color:#6b4e00;padding:0 .6mm;border-radius:.6mm}

/* ---------- impression : seule la feuille sort ---------- */
#impression{display:none}
@media print{
  @page{size:A4;margin:0}
  html.imprime,html.imprime body{background:#fff!important}
  html.imprime body::before{display:none}
  html.imprime body>*:not(#impression){display:none!important}
  html.imprime #impression{display:block}
  html.imprime .feuille{min-height:0;overflow:visible;box-shadow:none;margin:0}
  html.imprime .colonnes{min-height:297mm}
  html.imprime .fond-cote{position:fixed;top:0;bottom:0;height:100vh}
  html.imprime .f-une,html.imprime .ats,html.imprime .lettre{padding-top:14mm;padding-bottom:14mm}
  html.imprime .m-professionnel::before{position:fixed}
  .feuille .xp,.feuille .fo,.feuille .pj,.feuille .ats-bloc{break-inside:avoid}
}

/* ---------- « Comment ça marche » : sommaire à gauche, fiche à droite ---------- */
.pastille.aide-b{width:35px;height:35px;padding:0;justify-content:center;font-size:15px}
.fen.aide{max-width:1000px;height:min(740px,88vh);padding:0;display:flex;flex-direction:column;overflow:hidden}
.aide-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 14px;border-bottom:1px solid var(--bord)}
.fen .aide-h h3{margin:0;font-size:21px}
.fen .aide-sous{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.aide-espace{flex:1}
.aide-h input[type=search]{width:min(260px,100%);background:var(--champ);border:1px solid var(--bord);border-radius:999px;
  padding:8px 14px;font-family:var(--ui);font-size:13.5px;color:var(--ink);outline:none}
.aide-corps{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr)}
.aide-nav{border-right:1px solid var(--bord);padding:12px;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:3px;background:var(--champ)}
.aide-n{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:13px;border:1px solid transparent;
  background:none;color:var(--ink-2);font-family:var(--ui);font-size:13px;text-align:left;cursor:pointer;transition:background .2s,color .2s}
.aide-n b{font-size:15px;font-weight:400;line-height:1;flex:none}
.aide-n:hover{background:var(--verre-2);color:var(--ink)}
.aide-n.on{color:var(--ink);font-weight:650;border-color:color-mix(in srgb, var(--accent) 50%, transparent);background:color-mix(in srgb, var(--accent) 18%, transparent)}
.aide-n:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.aide-rien{margin:8px 4px;font-family:var(--ui);font-size:12.5px;color:var(--ink-3)}
.aide-p{padding:20px 26px 28px;overflow:auto;scrollbar-width:thin;outline:none}
.aide-fiche{animation:aideArrive .28s ease both}
@keyframes aideArrive{from{opacity:0;transform:translateY(8px)}}
.fen .aide-fiche h3{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:22px}
.aide-em{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;font-style:normal;background:var(--degrade);box-shadow:0 8px 20px -12px var(--lueur)}
.fen .aide-chapo{margin:0 0 16px;font-size:14px;color:var(--ink-3)}
.aide-p p{margin:0 0 12px;font-family:var(--ui);font-size:14px;line-height:1.6;color:var(--ink)}
.aide-p h4{margin:20px 0 9px;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.aide-etapes{counter-reset:ae;list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:9px}
.aide-etapes li{counter-increment:ae;position:relative;padding:9px 13px 9px 44px;border-radius:14px;font-family:var(--ui);font-size:13.5px;line-height:1.55;
  color:var(--ink);background:var(--champ);border:1px solid var(--bord)}
.aide-etapes li::before{content:counter(ae);position:absolute;left:11px;top:9px;width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--texte-bouton);background:var(--degrade)}
.aide-liste{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:7px}
.aide-liste li{position:relative;padding-left:16px;font-family:var(--ui);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.aide-liste li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.85}
.aide-liste b{color:var(--ink)}
.aide-astuce,.aide-ex{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;padding:11px 14px;border-radius:15px;font-family:var(--ui);font-size:13.5px;line-height:1.55;color:var(--ink)}
.aide-astuce{background:color-mix(in srgb, var(--or) 14%, transparent);border:1px solid color-mix(in srgb, var(--or) 38%, transparent)}
.aide-ex{background:color-mix(in srgb, var(--accent) 14%, transparent);border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);font-style:italic}
.aide-astuce span,.aide-ex span{font-size:16px;line-height:1.2;font-style:normal}
.aide-p kbd{display:inline-block;padding:1px 7px;border-radius:7px;border:1px solid var(--bord-2);border-bottom-width:2px;background:var(--verre-2);font-family:var(--mono);font-size:12px;color:var(--ink)}
@media (max-width:760px){
  .voile:has(.fen.aide){padding:12px}
  .fen.aide{height:calc(100vh - 24px);border-radius:20px}
  .aide-h{padding:14px 14px 12px}
  .aide-h>div{flex:1 1 0;min-width:0}
  .aide-h input[type=search]{width:100%;order:2}
  .aide-espace{display:none}
  .aide-corps{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

<script>
/* ============================================================
   NaoCV — le socle : état, enregistrement, dates, fenêtres,
   fichiers (écriture DOCX, lecture DOCX) et petits outils.
   ============================================================ */
'use strict';
const NC = window.NC = {};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'");
const maj1 = s => { s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; };
const min1 = s => { s = String(s || '').trim(); if (!s) return s; if (/^[A-ZÀ-Ý]{2,}/.test(s)) return s; return s.charAt(0).toLowerCase() + s.slice(1); };
function lire(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : v; } catch (e) { return def; } }
function ecrire(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

/* ---------- Dates ---------- */
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS_C = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const aujourdhui = () => iso(new Date());
const moisCourant = () => aujourdhui().slice(0, 7);
function fmtMois(m, court) {
  if (!m) return '';
  const [a, mm] = String(m).split('-');
  if (!mm) return a;
  return (court ? MOIS_C : MOIS)[+mm - 1] + ' ' + a;
}
function fmtDate(d, long) {
  if (!d) return '';
  const [a, m, j] = d.split('-');
  return +j + ' ' + (long ? MOIS : MOIS_C)[+m - 1] + ' ' + a;
}
function plusJours(d, n) { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return iso(x); }
function ecartJours(a, b) { return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
/* Une période d'expérience ou de formation : « mars 2022 – aujourd'hui ». */
function periode(o, court) {
  const d = fmtMois(o.debut, court), f = o.enCours ? "aujourd'hui" : fmtMois(o.fin, court);
  if (d && f) return d === f ? d : d + ' – ' + f;
  return d || f || '';
}
/* Durée en mois d'une période (fin en cours = ce mois-ci). */
function moisEntre(debut, fin) {
  if (!debut) return 0;
  const [a1, m1] = debut.split('-').map(Number), [a2, m2] = (fin || moisCourant()).split('-').map(Number);
  return Math.max(0, (a2 - a1) * 12 + ((m2 || 12) - (m1 || 1)) + 1);
}
const cleTri = o => (o.enCours ? '9999-99' : (o.fin || o.debut || '0000'));

/* ---------- L'état ---------- */
const CLE = 'naocv.donnees';
function cvVide(nom) {
  return {
    id: uid(), nom: nom || 'Mon CV principal', cree: aujourdhui(), maj: aujourdhui(),
    cible: { poste: '', entreprise: '', offre: '' },
    perso: { prenom: '', nom: '', ville: '', tel: '', email: '', linkedin: '', portfolio: '', permis: '', mobilite: '', dispo: '', photo: '' },
    titre: '', accroche: '',
    experiences: [], formations: [], compTech: [], compRel: [], logiciels: [], langues: [], certifications: [], projets: [], interets: [],
    style: { modele: 'moderne', couleur: '#1F3A68', couleur2: '', marque: '', police: 'Calibri', atsPolice: 'Arial', photo: false, couleursEntreprises: true, ats: false }
  };
}
function etatVide() { const cv = cvVide(); return { version: 1, cvs: [cv], principal: cv.id, lettres: [], candidatures: [], vus: {} }; }
NC.cvVide = cvVide;

function reparer(e) {
  if (!e || !Array.isArray(e.cvs)) e = etatVide();
  if (!e.cvs.length) e.cvs.push(cvVide());
  const modele = cvVide();
  e.cvs = e.cvs.map(cv => {
    const r = Object.assign(clone(modele), cv);
    ['perso', 'style', 'cible'].forEach(k => { r[k] = Object.assign(clone(modele[k]), cv[k] || {}); });
    ['experiences', 'formations', 'compTech', 'compRel', 'logiciels', 'langues', 'certifications', 'projets', 'interets'].forEach(k => { if (!Array.isArray(r[k])) r[k] = []; });
    r.experiences.forEach(x => { if (!x.id) x.id = uid(); if (!Array.isArray(x.missions)) x.missions = []; });
    r.formations.forEach(x => { if (!x.id) x.id = uid(); });
    return r;
  });
  if (!e.cvs.some(c => c.id === e.principal)) e.principal = e.cvs[0].id;
  ['lettres', 'candidatures'].forEach(k => { if (!Array.isArray(e[k])) e[k] = []; });
  if (!e.vus) e.vus = {};
  return e;
}
function charger() {
  let e = null;
  try { const t = lire(CLE, ''); e = t ? JSON.parse(t) : null; } catch (x) { e = null; }
  NC.ETAT = reparer(e);
}
let minuteurSauve = 0;
function sauver(tout_de_suite) {
  clearTimeout(minuteurSauve);
  const f = () => { if (!ecrire(CLE, JSON.stringify(NC.ETAT))) toast('⚠️ Espace plein : la sauvegarde a échoué. Retirez une photo ou un logo trop lourd, ou faites 💾.', 'alerte'); };
  if (tout_de_suite) f(); else minuteurSauve = setTimeout(f, 250);
}
window.addEventListener('beforeunload', () => sauver(true));

const cvParId = id => NC.ETAT.cvs.find(c => c.id === id) || null;
const cvPrincipal = () => cvParId(NC.ETAT.principal) || NC.ETAT.cvs[0];
const lettreParId = id => NC.ETAT.lettres.find(l => l.id === id) || null;
const nomComplet = cv => [cv.perso.prenom, cv.perso.nom].filter(Boolean).join(' ');

/* ---------- Petits messages et fenêtres ---------- */
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('part'), 3400);
  setTimeout(() => t.remove(), 3900);
}
function ouvrirModale(html, taille) {
  const v = $('#modale'), f = $('#modaleFen');
  f.className = 'fen' + (taille ? ' ' + taille : '');
  f.innerHTML = html;
  v.classList.add('ouvert');
  document.body.classList.add('fige');
  const p = f.querySelector('[autofocus],input:not([type=hidden]):not([type=file]),textarea,select');
  if (p) setTimeout(() => p.focus(), 60);
}
function fermerModale() { $('#modale').classList.remove('ouvert'); document.body.classList.remove('fige'); NC.surFermeture && NC.surFermeture(); NC.surFermeture = null; }
function confirmer(message, action, libelle) {
  NC._confirme = action;
  ouvrirModale(`<h3 id="modaleTitre">Confirmer</h3><p class="muted">${message}</p>
    <div class="actions"><button class="btn" data-act="fermer">Annuler</button><button class="btn danger" data-act="confirme">${libelle || 'Supprimer'}</button></div>`, 'petite');
}

/* ---------- Fichiers ---------- */
function telecharger(blob, nom) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* « CV_Camille_Martin_Assistante-commerciale » : sans accents ni espaces. */
function morceauFichier(s, liaison) {
  return norm(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(liaison || '');
}
function nomFichier(prefixe, cv, suite) {
  const parts = [prefixe, morceauFichier(cv.perso.prenom, '-'), morceauFichier(cv.perso.nom, '-')];
  const s = morceauFichier(suite || '', '-');
  if (s) parts.push(s.charAt(0) + s.slice(1).toLowerCase().replace(/-([a-z])/g, (m, c) => '-' + c));
  return parts.filter(Boolean).join('_') || prefixe;
}

/* Réduit une image (photo, logo) pour qu'elle tienne dans l'enregistrement. */
function reduireImage(fichier, cote, format) {
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onerror = ko;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = ko;
      img.onload = () => {
        const k = Math.min(1, cote / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d');
        if (format === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height);
        ok({ url: c.toDataURL(format || 'image/png', .86), canvas: c });
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

/* ---------- ZIP : écrire (DOCX) et lire (import DOCX) ---------- */
const TABLE_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TABLE_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function creerZip(fichiers, type) {
  const enc = new TextEncoder(), parts = [], central = [];
  let pos = 0;
  const d = new Date();
  const heure = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const jour = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  fichiers.forEach(f => {
    const nom = enc.encode(f.nom), data = typeof f.contenu === 'string' ? enc.encode(f.contenu) : f.contenu, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, heure, true); h.setUint16(12, jour, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nom.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), nom, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, heure, true); c.setUint16(14, jour, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nom.length, true); c.setUint32(42, pos, true);
    central.push(new Uint8Array(c.buffer), nom);
    pos += 30 + nom.length + data.length;
  });
  const tailleC = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, fichiers.length, true); e.setUint16(10, fichiers.length, true);
  e.setUint32(12, tailleC, true); e.setUint32(16, pos, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: type || 'application/zip' });
}
async function lireDansZip(buf, cible) {
  const v = new DataView(buf), dec = new TextDecoder();
  let fin = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { fin = i; break; }

  const n = v.getUint16(fin + 10, true);
  let p = v.getUint32(fin + 16, true);
  for (let k = 0; k < n; k++) {
    const meth = v.getUint16(p + 10, true), taille = v.getUint32(p + 20, true);
    const ln = v.getUint16(p + 28, true), lx = v.getUint16(p + 30, true), lc = v.getUint16(p + 32, true), off = v.getUint32(p + 42, true);
    const nom = dec.decode(new Uint8Array(buf, p + 46, ln));
    if (nom === cible) {
      const l1 = v.getUint16(off + 26, true), l2 = v.getUint16(off + 28, true);
      const data = new Uint8Array(buf, off + 30 + l1 + l2, taille);
      if (meth === 0) return dec.decode(data);
      if (meth === 8 && 'DecompressionStream' in window) {
        const flux = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return await new Response(flux).text();
      }
      throw new Error('Ce navigateur ne sait pas ouvrir ce .docx : copiez-collez plutôt le texte.');
    }
    p += 46 + ln + lx + lc;
  }
  throw new Error('Aucun texte trouvé dans ce document.');
}

/* ---------- Couleurs ---------- */
function hexRvb(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rvbHex = (r, v, b) => '#' + [r, v, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('').toUpperCase();
function luminance(h) { const c = hexRvb(h).map(x => { x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
const contraste = (a, b) => { const l1 = luminance(a), l2 = luminance(b); return (Math.max(l1, l2) + .05) / (Math.min(l1, l2) + .05); };
/* Une couleur de marque trop claire (jaune, orange vif) est assombrie pour rester lisible sur blanc. */
function lisible(h, fond) {
  fond = fond || '#FFFFFF';
  let [r, v, b] = hexRvb(h), x = rvbHex(r, v, b), n = 0;
  while (contraste(x, fond) < 4.5 && n < 40) { r *= .92; v *= .92; b *= .92; x = rvbHex(r, v, b); n++; }
  return x;

NC.rendreCV = function (cv, ats) {
